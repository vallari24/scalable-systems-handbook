<svg width="1180" height="820" viewBox="0 0 1180 820" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ar-g" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aff8a"/></marker>
    <marker id="ar-p" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ff8bd2"/></marker>
    <marker id="ar-b" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#93c5fd"/></marker>
    <marker id="ar-y" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ffff99"/></marker>
    <marker id="ar-r" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ff8a8a"/></marker>
  </defs>

  <rect x="0" y="0" width="1180" height="820" fill="#111317"/>

  <!-- Title -->
  <text x="590" y="42" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="bold" fill="#ffff99">Recent Searches &#8212; the complete architecture</text>
  <text x="590" y="68" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#9aa6b2">write-through hot cache &#183; preload on app-open &#183; durable log &#183; cold-storage archive</text>

  <!-- ============ USER (left) ============ -->
  <g stroke="#cbd5e1" stroke-width="2.5" fill="none">
    <circle cx="70" cy="250" r="14"/>
    <line x1="70" y1="264" x2="70" y2="304"/>
    <line x1="70" y1="278" x2="48" y2="296"/>
    <line x1="70" y1="278" x2="92" y2="296"/>
    <line x1="70" y1="304" x2="50" y2="332"/>
    <line x1="70" y1="304" x2="90" y2="332"/>
  </g>
  <text x="70" y="356" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffffff">User(s)</text>

  <!-- ============ SEARCH SERVICE (center) ============ -->
  <rect x="320" y="210" width="170" height="90" rx="11" fill="#16191e" stroke="#7c8694" stroke-width="2.5"/>
  <text x="405" y="248" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Search</text>
  <text x="405" y="270" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#9aa6b2">service</text>

  <!-- User -> Search: read (green double-head) -->
  <line x1="100" y1="240" x2="316" y2="232" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#ar-g)" marker-start="url(#ar-g)"/>
  <text x="200" y="222" text-anchor="middle" font-family="monospace" font-size="13" fill="#8aff8a">GET /search/recent</text>
  <!-- User -> Search: write (pink) -->
  <line x1="100" y1="288" x2="316" y2="280" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#ar-p)"/>
  <text x="200" y="306" text-anchor="middle" font-family="monospace" font-size="13" fill="#ff8bd2">POST /search</text>

  <!-- ES + Cache cylinders below Search -->
  <path d="M339 420 a36 9 0 0 0 72 0 v40 a36 9 0 0 1 -72 0 z" fill="#16191e" stroke="#7c8694" stroke-width="2.5"/>
  <ellipse cx="375" cy="420" rx="36" ry="9" fill="#1b1f25" stroke="#7c8694" stroke-width="2.5"/>
  <text x="375" y="426" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">ES</text>
  <text x="375" y="488" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9aa6b2">Elasticsearch</text>
  <text x="375" y="502" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9aa6b2">search documents</text>
  <line x1="385" y1="300" x2="380" y2="411" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#ar-g)"/>

  <path d="M444 420 a36 9 0 0 0 72 0 v40 a36 9 0 0 1 -72 0 z" fill="#16191e" stroke="#b79bff" stroke-width="2.5"/>
  <ellipse cx="480" cy="420" rx="36" ry="9" fill="#1b1f25" stroke="#b79bff" stroke-width="2.5"/>
  <text x="480" y="426" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Cache</text>
  <text x="480" y="488" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9aa6b2">Redis &#183; precomputed</text>
  <text x="480" y="502" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9aa6b2">search RESULTS</text>
  <line x1="455" y1="300" x2="478" y2="411" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#ar-g)" marker-start="url(#ar-g)"/>

  <!-- ============ REDIS CLUSTER (top center/right) ============ -->
  <path d="M654 110 a46 11 0 0 0 92 0 v56 a46 11 0 0 1 -92 0 z" fill="#16191e" stroke="#b79bff" stroke-width="2.5"/>
  <ellipse cx="700" cy="110" rx="46" ry="11" fill="#1b1f25" stroke="#b79bff" stroke-width="2.5"/>
  <text x="700" y="138" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Redis</text>
  <text x="700" y="156" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Cluster</text>
  <text x="757" y="106" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ff8a8a">$</text>
  <!-- value box -->
  <text x="700" y="200" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffff99">u1 &#8594; [ q1, q2, ... q10 ]</text>
  <text x="700" y="220" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#9aa6b2">recent-10 per user &#183; BOUNDED</text>

  <!-- Search -> Redis Cluster: write-through (pink) -->
  <line x1="490" y1="230" x2="650" y2="160" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#ar-p)"/>
  <text x="540" y="178" font-family="sans-serif" font-size="12" fill="#ff8bd2">write-through</text>
  <!-- Search <-> Redis Cluster: read recent (green/yellow double) -->
  <line x1="492" y1="248" x2="652" y2="186" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#ar-g)" marker-start="url(#ar-g)"/>
  <text x="555" y="240" font-family="sans-serif" font-size="12" fill="#8aff8a">read recent</text>

  <!-- ============ MONGODB cluster (right) ============ -->
  <g>
    <path d="M984 150 a40 10 0 0 0 80 0 v50 a40 10 0 0 1 -80 0 z" fill="#16191e" stroke="#7c8694" stroke-width="2.5"/>
    <ellipse cx="1024" cy="150" rx="40" ry="10" fill="#1b1f25" stroke="#7c8694" stroke-width="2.5"/>
    <path d="M1004 175 a40 10 0 0 0 80 0 v50 a40 10 0 0 1 -80 0 z" fill="#16191e" stroke="#7c8694" stroke-width="2.5"/>
    <ellipse cx="1044" cy="175" rx="40" ry="10" fill="#1b1f25" stroke="#7c8694" stroke-width="2.5"/>
    <path d="M964 200 a40 10 0 0 0 80 0 v50 a40 10 0 0 1 -80 0 z" fill="#16191e" stroke="#7c8694" stroke-width="2.5"/>
    <ellipse cx="1004" cy="200" rx="40" ry="10" fill="#1b1f25" stroke="#7c8694" stroke-width="2.5"/>
    <text x="1004" y="232" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">MongoDB</text>
  </g>
  <text x="1075" y="146" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ff8a8a">$</text>
  <text x="1004" y="278" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#9aa6b2">Sharded NoSQL</text>
  <text x="1004" y="294" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffff99">all queries (unbounded)</text>

  <!-- Search -> MongoDB: persist every query (pink) -->
  <line x1="490" y1="270" x2="958" y2="216" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#ar-p)"/>
  <text x="720" y="250" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ff8bd2">persist every query</text>

  <!-- ============ EVENTS TAP / QUEUE / CACHE WARMER (lower-left) ============ -->
  <!-- events tap on user path -->
  <circle cx="70" cy="430" r="5" fill="#ffff99"/>
  <line x1="70" y1="340" x2="70" y2="425" stroke="#ffff99" stroke-width="2.5" stroke-dasharray="5 4"/>
  <line x1="70" y1="435" x2="150" y2="498" stroke="#ffff99" stroke-width="2.5" marker-end="url(#ar-y)"/>
  <text x="78" y="468" font-family="sans-serif" font-size="12" fill="#ffff99">ON-LOGIN / APP_OPEN</text>

  <!-- queue pill -->
  <rect x="158" y="500" width="180" height="40" rx="20" fill="#16191e" stroke="#93c5fd" stroke-width="2.5"/>
  <line x1="200" y1="500" x2="200" y2="540" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="234" y1="500" x2="234" y2="540" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="268" y1="500" x2="268" y2="540" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="302" y1="500" x2="302" y2="540" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="248" y="558" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#93c5fd">event queue</text>

  <!-- cache warmer (stacked) -->
  <rect x="406" y="492" width="158" height="56" rx="11" fill="#16191e" stroke="#ffff99" stroke-width="2.5"/>
  <rect x="412" y="500" width="158" height="56" rx="11" fill="#16191e" stroke="#ffff99" stroke-width="2.5"/>
  <text x="491" y="532" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Cache Warmer</text>
  <line x1="338" y1="522" x2="404" y2="522" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#ar-b)"/>

  <!-- MongoDB -> Cache Warmer (read older queries) -->
  <path d="M978 252 C 760 420, 640 540, 576 530" fill="none" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#ar-b)"/>
  <text x="760" y="470" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#93c5fd">read user's queries</text>

  <!-- Cache Warmer -> Redis Cluster (preload, pink, up) -->
  <path d="M530 490 C 560 380, 640 250, 690 178" fill="none" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#ar-p)"/>
  <text x="600" y="360" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ff8bd2">preload Redis</text>

  <!-- preload caption -->
  <rect x="350" y="590" width="430" height="56" rx="8" fill="#16191e" stroke="#3a4049" stroke-width="1.5"/>
  <text x="565" y="612" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#cbd5e1">preload: 50% tap the bar within 5s &#8212; warm Redis on app-open</text>
  <text x="565" y="632" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#cbd5e1">so /recent is instant</text>

  <!-- ============ ETL -> SPARK -> S3 (bottom right) ============ -->
  <line x1="1004" y1="250" x2="1004" y2="630" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#ar-b)"/>
  <text x="1014" y="430" font-family="sans-serif" font-size="12" fill="#93c5fd">ETL Jobs</text>
  <text x="1014" y="446" font-family="sans-serif" font-size="12" fill="#93c5fd">data older than 6 months</text>

  <!-- Spark boxes -->
  <rect x="862" y="638" width="60" height="40" rx="8" fill="#16191e" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="892" y="663" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">Spark</text>
  <rect x="942" y="638" width="60" height="40" rx="8" fill="#16191e" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="972" y="663" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">Spark</text>
  <rect x="1022" y="638" width="60" height="40" rx="8" fill="#16191e" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="1052" y="663" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">Spark</text>

  <!-- S3 cloud -->
  <line x1="972" y1="678" x2="972" y2="708" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#ar-b)"/>
  <path d="M900 740 a26 26 0 0 1 14 -50 a34 34 0 0 1 66 -8 a24 24 0 0 1 22 30 a22 22 0 0 1 -10 36 z" fill="#16191e" stroke="#7c8694" stroke-width="2.5"/>
  <text x="958" y="724" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffff99">S3 [cold storage]</text>
  <text x="958" y="772" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">archive cold data &#8594; save RAM/compute</text>

  <!-- ============ LEGEND (bottom-left) ============ -->
  <rect x="36" y="640" width="270" height="150" rx="10" fill="#16191e" stroke="#3a4049" stroke-width="1.5"/>
  <text x="52" y="666" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffff99">LEGEND</text>
  <line x1="56" y1="686" x2="86" y2="686" stroke="#ff8bd2" stroke-width="3" marker-end="url(#ar-p)"/>
  <text x="96" y="690" font-family="sans-serif" font-size="13" fill="#cbd5e1">write path</text>
  <line x1="56" y1="710" x2="86" y2="710" stroke="#8aff8a" stroke-width="3" marker-end="url(#ar-g)"/>
  <text x="96" y="714" font-family="sans-serif" font-size="13" fill="#cbd5e1">read path</text>
  <line x1="56" y1="734" x2="86" y2="734" stroke="#ffff99" stroke-width="3" marker-end="url(#ar-y)"/>
  <text x="96" y="738" font-family="sans-serif" font-size="13" fill="#cbd5e1">event / storage</text>
  <line x1="56" y1="758" x2="86" y2="758" stroke="#93c5fd" stroke-width="3" marker-end="url(#ar-b)"/>
  <text x="96" y="762" font-family="sans-serif" font-size="13" fill="#cbd5e1">async / ETL</text>
  <text x="60" y="784" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ff8a8a">$</text>
  <text x="96" y="784" font-family="sans-serif" font-size="13" fill="#cbd5e1">cost marker</text>
</svg>
