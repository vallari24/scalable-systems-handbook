<svg width="1180" height="600" viewBox="0 0 1180 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8aff8a"/>
    </marker>
    <marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#ff8a8a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="600" fill="#0b0f14"/>
  <line x1="590" y1="30" x2="590" y2="540" stroke="#2a323d" stroke-width="1.5" stroke-dasharray="3 5"/>

  <!-- ============================ LEFT: single-shard ============================ -->
  <text x="305" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#8aff8a">Common case · single-shard transaction</text>
  <text x="305" y="70" text-anchor="middle" font-size="15" fill="#9fb0c0">request scoped to one workspace → one shard</text>

  <!-- app -->
  <rect x="230" y="92" width="150" height="44" rx="9" fill="#161b22" stroke="#3a4656" stroke-width="1.5"/>
  <text x="305" y="120" text-anchor="middle" font-size="16" fill="#e6edf3">App / API</text>

  <!-- arrow app -> shard B -->
  <line x1="305" y1="136" x2="305" y2="191" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="318" y="168" font-size="13" fill="#8aff8a">workspace W → shard B</text>

  <!-- shards row (A dim, B live, C dim) -->
  <!-- Shard A (dim) -->
  <ellipse cx="112" cy="264" rx="60" ry="9" fill="#11161c" stroke="#2a323d" stroke-width="1.5"/>
  <path d="M52,200 v64 a60,9 0 0 0 120,0 v-64 z" fill="#11161c" stroke="#2a323d" stroke-width="1.5"/>
  <ellipse cx="112" cy="200" rx="60" ry="9" fill="#161b22" stroke="#2a323d" stroke-width="1.5"/>
  <text x="112" y="232" text-anchor="middle" font-size="14" fill="#5f6b78">Shard A</text>
  <text x="112" y="286" text-anchor="middle" font-size="11" fill="#4a5560">untouched</text>

  <!-- Shard B (live, green) -->
  <ellipse cx="306" cy="264" rx="60" ry="9" fill="#13241a" stroke="#8aff8a" stroke-width="2"/>
  <path d="M246,200 v64 a60,9 0 0 0 120,0 v-64 z" fill="#13241a" stroke="#8aff8a" stroke-width="2"/>
  <ellipse cx="306" cy="200" rx="60" ry="9" fill="#18301f" stroke="#8aff8a" stroke-width="2"/>
  <text x="306" y="232" text-anchor="middle" font-size="15" font-weight="600" fill="#c7f9cc">Shard B</text>

  <!-- Shard C (dim) -->
  <ellipse cx="500" cy="264" rx="60" ry="9" fill="#11161c" stroke="#2a323d" stroke-width="1.5"/>
  <path d="M440,200 v64 a60,9 0 0 0 120,0 v-64 z" fill="#11161c" stroke="#2a323d" stroke-width="1.5"/>
  <ellipse cx="500" cy="200" rx="60" ry="9" fill="#161b22" stroke="#2a323d" stroke-width="1.5"/>
  <text x="500" y="232" text-anchor="middle" font-size="14" fill="#5f6b78">Shard C</text>
  <text x="500" y="286" text-anchor="middle" font-size="11" fill="#4a5560">untouched</text>

  <!-- arrow shard B -> txn box -->
  <line x1="306" y1="282" x2="306" y2="320" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#g)"/>

  <!-- transaction box -->
  <rect x="120" y="320" width="372" height="132" rx="10" fill="#8aff8a" fill-opacity="0.08" stroke="#8aff8a" stroke-width="1.8"/>
  <text x="140" y="346" font-size="14" font-family="monospace" fill="#cbd5e1">BEGIN</text>
  <text x="158" y="368" font-size="14" font-family="monospace" fill="#e6edf3">UPDATE task  SET project = P</text>
  <text x="158" y="390" font-size="14" font-family="monospace" fill="#e6edf3">UPDATE task  SET owner   = U</text>
  <text x="158" y="412" font-size="14" font-family="monospace" fill="#e6edf3">CHECK  member role permits it</text>
  <text x="140" y="434" font-size="14" font-family="monospace" fill="#cbd5e1">COMMIT</text>
  <text x="300" y="434" font-size="12.5" fill="#8aff8a">all rows in one box · joins + FKs work</text>

  <!-- badge -->
  <rect x="120" y="476" width="372" height="40" rx="20" fill="#13241a" stroke="#8aff8a" stroke-width="1.6"/>
  <text x="306" y="501" text-anchor="middle" font-size="15" font-weight="600" fill="#8aff8a">✓  ordinary single-node ACID — unchanged</text>

  <!-- ============================ RIGHT: cross-shard ============================ -->
  <text x="875" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#ff8a8a">Rare case · cross-shard query</text>
  <text x="875" y="70" text-anchor="middle" font-size="15" fill="#9fb0c0">“tasks assigned to user X, across every workspace”</text>

  <!-- app -->
  <rect x="800" y="92" width="150" height="44" rx="9" fill="#161b22" stroke="#3a4656" stroke-width="1.5"/>
  <text x="875" y="120" text-anchor="middle" font-size="16" fill="#e6edf3">App / API</text>

  <!-- scatter arrows app -> all shards -->
  <line x1="855" y1="136" x2="690" y2="191" stroke="#ff8a8a" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <line x1="875" y1="136" x2="875" y2="152" stroke="#ff8a8a" stroke-width="2.2" stroke-dasharray="6 4"/>
  <line x1="875" y1="172" x2="875" y2="191" stroke="#ff8a8a" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <line x1="895" y1="136" x2="1060" y2="191" stroke="#ff8a8a" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <text x="875" y="167" text-anchor="middle" font-size="13" fill="#ff8a8a">scatter → ask EVERY shard</text>

  <!-- three shards, all touched -->
  <ellipse cx="682" cy="264" rx="60" ry="9" fill="#241416" stroke="#ff8a8a" stroke-width="1.7"/>
  <path d="M622,200 v64 a60,9 0 0 0 120,0 v-64 z" fill="#241416" stroke="#ff8a8a" stroke-width="1.7"/>
  <ellipse cx="682" cy="200" rx="60" ry="9" fill="#2e1a1c" stroke="#ff8a8a" stroke-width="1.7"/>
  <text x="682" y="232" text-anchor="middle" font-size="14" fill="#f3d2d4">Shard A</text>

  <ellipse cx="876" cy="264" rx="60" ry="9" fill="#241416" stroke="#ff8a8a" stroke-width="1.7"/>
  <path d="M816,200 v64 a60,9 0 0 0 120,0 v-64 z" fill="#241416" stroke="#ff8a8a" stroke-width="1.7"/>
  <ellipse cx="876" cy="200" rx="60" ry="9" fill="#2e1a1c" stroke="#ff8a8a" stroke-width="1.7"/>
  <text x="876" y="232" text-anchor="middle" font-size="14" fill="#f3d2d4">Shard B</text>

  <ellipse cx="1070" cy="264" rx="60" ry="9" fill="#241416" stroke="#ff8a8a" stroke-width="1.7"/>
  <path d="M1010,200 v64 a60,9 0 0 0 120,0 v-64 z" fill="#241416" stroke="#ff8a8a" stroke-width="1.7"/>
  <ellipse cx="1070" cy="200" rx="60" ry="9" fill="#2e1a1c" stroke="#ff8a8a" stroke-width="1.7"/>
  <text x="1070" y="232" text-anchor="middle" font-size="14" fill="#f3d2d4">Shard C</text>

  <!-- gather arrows shards -> join box -->
  <line x1="682" y1="282" x2="820" y2="332" stroke="#ff8a8a" stroke-width="2" marker-end="url(#r)"/>
  <line x1="876" y1="282" x2="876" y2="300" stroke="#ff8a8a" stroke-width="2"/>
  <line x1="876" y1="320" x2="876" y2="332" stroke="#ff8a8a" stroke-width="2" marker-end="url(#r)"/>
  <line x1="1070" y1="282" x2="930" y2="332" stroke="#ff8a8a" stroke-width="2" marker-end="url(#r)"/>
  <text x="876" y="315" text-anchor="middle" font-size="13" fill="#ff8a8a">gather partial rows</text>

  <!-- app-side join box -->
  <rect x="690" y="338" width="372" height="114" rx="10" fill="#ff8a8a" fill-opacity="0.08" stroke="#ff8a8a" stroke-width="1.8"/>
  <text x="876" y="372" text-anchor="middle" font-size="16" font-weight="600" fill="#e6edf3">App-side join</text>
  <text x="876" y="400" text-anchor="middle" font-size="14" fill="#d8dee9">the app collects each shard's rows and</text>
  <text x="876" y="422" text-anchor="middle" font-size="14" fill="#d8dee9">stitches + joins them itself — no DB join</text>

  <!-- badge -->
  <rect x="690" y="476" width="372" height="40" rx="20" fill="#241416" stroke="#ff8a8a" stroke-width="1.6"/>
  <text x="876" y="501" text-anchor="middle" font-size="15" font-weight="600" fill="#ff8a8a">✗  no single transaction across shards</text>

  <!-- footer -->
  <text x="590" y="566" text-anchor="middle" font-size="15" fill="#9fb0c0">Shard by the entity that scopes nearly every request, so the left path is the rule and the right path stays the exception.</text>
</svg>
