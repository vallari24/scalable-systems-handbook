<svg width="1080" height="720" viewBox="0 0 1080 720" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ar-g" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aff8a"/></marker>
    <marker id="ar-p" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ff8bd2"/></marker>
    <marker id="ar-r" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ff8a8a"/></marker>
  </defs>

  <rect x="0" y="0" width="1080" height="720" fill="#111317"/>

  <!-- Title -->
  <text x="540" y="38" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffff99">A simple cache did NOT work here &#8212; the data invalidates faster than it is reused</text>
  <text x="540" y="64" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#9aa6b2">the failure pattern, and the inversion that fixes it</text>

  <!-- ===================== LEFT PANEL (RED) ===================== -->
  <rect x="24" y="84" width="510" height="552" rx="10" fill="#1a1210" stroke="#ff8a8a" stroke-width="2"/>
  <text x="279" y="112" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#ff8a8a">Naive read-through cache (cache-aside)</text>

  <!-- User -->
  <rect x="52" y="140" width="92" height="46" rx="8" fill="#16191e" stroke="#93c5fd" stroke-width="2"/>
  <text x="98" y="168" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffffff">User</text>

  <!-- Redis cache cylinder -->
  <path d="M250 150 a48 11 0 0 0 96 0 v58 a48 11 0 0 1 -96 0 z" fill="#16191e" stroke="#b79bff" stroke-width="2.5"/>
  <ellipse cx="298" cy="150" rx="48" ry="11" fill="#1b1f25" stroke="#b79bff" stroke-width="2.5"/>
  <text x="298" y="186" text-anchor="middle" font-family="monospace" font-size="13" fill="#b79bff">Redis</text>
  <text x="298" y="202" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9aa6b2">cache</text>

  <!-- STALE stamp on Redis -->
  <g transform="rotate(-12 298 138)">
    <rect x="252" y="124" width="92" height="26" rx="5" fill="none" stroke="#ff8a8a" stroke-width="2.5"/>
    <text x="298" y="142" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ff8a8a">&#10007; STALE</text>
  </g>

  <!-- DB cylinder (persistent) -->
  <path d="M412 150 a48 11 0 0 0 96 0 v58 a48 11 0 0 1 -96 0 z" fill="#16191e" stroke="#7c8694" stroke-width="2.5"/>
  <ellipse cx="460" cy="150" rx="48" ry="11" fill="#1b1f25" stroke="#7c8694" stroke-width="2.5"/>
  <text x="460" y="186" text-anchor="middle" font-family="monospace" font-size="12" fill="#ffff99">DB</text>
  <text x="460" y="202" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9aa6b2">persistent</text>

  <!-- read /recent : User -> Redis -->
  <line x1="146" y1="158" x2="247" y2="158" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#ar-g)"/>
  <text x="196" y="151" text-anchor="middle" font-family="monospace" font-size="11" fill="#8aff8a">read /recent</text>

  <!-- MISS : Redis -> DB -->
  <line x1="348" y1="158" x2="409" y2="158" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#ar-r)"/>
  <text x="378" y="151" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ff8a8a">MISS</text>

  <!-- populate cache : DB -> Redis (curved back) -->
  <path d="M412 196 C 380 232, 318 232, 300 214" fill="none" stroke="#93c5fd" stroke-width="2.2" stroke-dasharray="5,4" marker-end="url(#ar-g)"/>
  <text x="356" y="245" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#93c5fd">populate cache</text>

  <!-- new search write straight to DB (bypass cache) -->
  <path d="M120 186 C 120 320, 460 290, 460 218" fill="none" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#ar-p)"/>
  <text x="250" y="312" text-anchor="middle" font-family="monospace" font-size="11" fill="#ff8bd2">new search &#8594; WRITE straight to DB (bypasses cache)</text>

  <!-- Numbered steps -->
  <g font-family="sans-serif" font-size="12.5" fill="#cbd5e1">
    <circle cx="62" cy="352" r="11" fill="#16191e" stroke="#ff8a8a" stroke-width="1.8"/>
    <text x="62" y="356" text-anchor="middle" font-size="12" font-weight="bold" fill="#ff8a8a">1</text>
    <text x="82" y="356" font-family="sans-serif" font-size="12.5" fill="#cbd5e1">read /recent &#8594; cache MISS &#8594; load from DB &#8594; populate cache</text>

    <circle cx="62" cy="386" r="11" fill="#16191e" stroke="#ff8a8a" stroke-width="1.8"/>
    <text x="62" y="390" text-anchor="middle" font-size="12" font-weight="bold" fill="#ff8a8a">2</text>
    <text x="82" y="390" font-family="sans-serif" font-size="12.5" fill="#cbd5e1">user searches <tspan font-family="monospace" fill="#ffff99">"x"</tspan> &#8594; writes to DB directly</text>

    <circle cx="62" cy="420" r="11" fill="#16191e" stroke="#ff8a8a" stroke-width="1.8"/>
    <text x="62" y="424" text-anchor="middle" font-size="12" font-weight="bold" fill="#ff8a8a">3</text>
    <text x="82" y="424" font-family="sans-serif" font-size="12.5" fill="#cbd5e1">cache is now <tspan fill="#ff8a8a" font-weight="bold">STALE</tspan> the instant step 2 happens</text>
  </g>

  <!-- Red caption -->
  <rect x="44" y="448" width="470" height="172" rx="8" fill="#160d0c" stroke="#ff8a8a" stroke-width="1.4"/>
  <text x="60" y="478" font-family="sans-serif" font-size="13" fill="#ff8a8a" font-weight="bold">Why it fails:</text>
  <g font-family="sans-serif" font-size="13" fill="#cbd5e1">
    <text x="60" y="502">high-intent users search constantly, so the list is</text>
    <text x="60" y="524">invalidated almost every time it is read &#8594;</text>
    <text x="60" y="546"><tspan fill="#ff8a8a" font-weight="bold">reuse &#8776; 0</tspan> &#8594; cache <tspan fill="#ff8a8a" font-weight="bold">THRASH</tspan>: near-zero hit rate,</text>
    <text x="60" y="568">the cache barely helps.</text>
  </g>

  <!-- ===================== RIGHT PANEL (GREEN) ===================== -->
  <rect x="546" y="84" width="510" height="552" rx="10" fill="#101a12" stroke="#8aff8a" stroke-width="2"/>
  <text x="801" y="112" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#8aff8a">Fix &#183; write-through (cache-first)</text>

  <!-- Search service -->
  <rect x="568" y="142" width="118" height="48" rx="8" fill="#16191e" stroke="#93c5fd" stroke-width="2"/>
  <text x="627" y="166" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ffffff">Search</text>
  <text x="627" y="182" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ffffff">service</text>

  <!-- Redis cylinder -->
  <path d="M772 152 a48 11 0 0 0 96 0 v58 a48 11 0 0 1 -96 0 z" fill="#16191e" stroke="#b79bff" stroke-width="2.5"/>
  <ellipse cx="820" cy="152" rx="48" ry="11" fill="#1b1f25" stroke="#b79bff" stroke-width="2.5"/>
  <text x="820" y="190" text-anchor="middle" font-family="monospace" font-size="13" fill="#b79bff">Redis</text>

  <!-- DB cylinder -->
  <path d="M952 152 a48 11 0 0 0 96 0 v58 a48 11 0 0 1 -96 0 z" fill="#16191e" stroke="#7c8694" stroke-width="2.5"/>
  <ellipse cx="1000" cy="152" rx="48" ry="11" fill="#1b1f25" stroke="#7c8694" stroke-width="2.5"/>
  <text x="1000" y="188" text-anchor="middle" font-family="monospace" font-size="12" fill="#ffff99">DB</text>
  <text x="1000" y="204" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9aa6b2">persistent</text>

  <!-- write #1 to Redis FIRST -->
  <line x1="686" y1="162" x2="769" y2="162" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#ar-p)"/>
  <text x="727" y="153" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ff8bd2">1. write FIRST</text>

  <!-- then write to DB -->
  <line x1="868" y1="162" x2="949" y2="162" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#ar-p)"/>
  <text x="908" y="153" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ff8bd2">2. then DB</text>
  <text x="908" y="227" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#9aa6b2">(sync / async)</text>

  <!-- ops box -->
  <rect x="640" y="246" width="200" height="52" rx="6" fill="#0c140d" stroke="#ff8bd2" stroke-width="1.4"/>
  <text x="740" y="266" text-anchor="middle" font-family="monospace" font-size="12.5" fill="#ff8bd2">LPUSH uid q</text>
  <text x="740" y="286" text-anchor="middle" font-family="monospace" font-size="12.5" fill="#ff8bd2">LTRIM uid 0 9</text>

  <!-- read /recent served from Redis -->
  <path d="M627 190 C 627 332, 820 332, 820 222" fill="none" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#ar-g)"/>
  <text x="724" y="350" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#8aff8a">read /recent &#8594; served STRAIGHT from Redis &#8212; always fresh</text>

  <!-- Bounded list value -->
  <rect x="582" y="372" width="438" height="62" rx="8" fill="#0c140d" stroke="#b79bff" stroke-width="1.6"/>
  <text x="600" y="398" font-family="monospace" font-size="13" fill="#ffff99">uid &#8594;</text>
  <text x="652" y="398" font-family="monospace" font-size="13" fill="#cbd5e1">[ q1, q2, q3, ... q10 ]</text>
  <text x="600" y="420" font-family="sans-serif" font-size="11.5" fill="#b79bff" font-weight="bold">BOUNDED to 10</text>

  <!-- Green caption -->
  <rect x="566" y="450" width="470" height="170" rx="8" fill="#0c160d" stroke="#8aff8a" stroke-width="1.4"/>
  <text x="582" y="480" font-family="sans-serif" font-size="13" fill="#8aff8a" font-weight="bold">Why it works:</text>
  <g font-family="sans-serif" font-size="13" fill="#cbd5e1">
    <text x="582" y="504">the same action that would stale the cache now</text>
    <text x="582" y="526"><tspan fill="#8aff8a" font-weight="bold">UPDATES</tspan> it &#8594; never stale.</text>
    <text x="582" y="552">Reads are <tspan fill="#8aff8a" font-weight="bold">O(1) from RAM</tspan>, no DB hit.</text>
  </g>

  <!-- ===================== BOTTOM RULE BAR ===================== -->
  <rect x="24" y="648" width="1032" height="56" rx="10" fill="#161a13" stroke="#ffff99" stroke-width="2"/>
  <text x="44" y="672" font-family="sans-serif" font-size="13.5" fill="#ffff99" font-weight="bold">RULE:</text>
  <text x="92" y="672" font-family="sans-serif" font-size="13.5" fill="#cbd5e1">a cache pays off only when reuse-interval &#8811; change-interval. When writes invalidate before the next read,</text>
  <text x="92" y="692" font-family="sans-serif" font-size="13.5" fill="#cbd5e1">don't cache-then-invalidate &#8212; write <tspan fill="#ff8bd2" font-weight="bold">THROUGH</tspan> the cache so writes keep it warm.</text>
</svg>
