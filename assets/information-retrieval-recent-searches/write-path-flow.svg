<svg width="1080" height="600" viewBox="0 0 1080 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="wp-p" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ff8bd2"/></marker>
    <marker id="wp-g" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aff8a"/></marker>
    <marker id="wp-b" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#93c5fd"/></marker>
    <marker id="wp-bs" markerWidth="11" markerHeight="11" refX="2" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9,0 L0,4.5 L9,9 Z" fill="#93c5fd"/></marker>
  </defs>

  <rect x="0" y="0" width="1080" height="600" fill="#111317"/>

  <text x="540" y="42" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="27" font-weight="bold">The write path &#8212; what /search does</text>
  <text x="540" y="70" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="15.5">one action runs the search AND keeps the recent list warm (write-through)</text>

  <!-- ===== USER ===== -->
  <circle cx="60" cy="278" r="13" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>
  <line x1="60" y1="291" x2="60" y2="326" stroke="#cbd5e1" stroke-width="2.5"/>
  <line x1="38" y1="306" x2="82" y2="306" stroke="#cbd5e1" stroke-width="2.5"/>
  <line x1="60" y1="326" x2="45" y2="350" stroke="#cbd5e1" stroke-width="2.5"/>
  <line x1="60" y1="326" x2="75" y2="350" stroke="#cbd5e1" stroke-width="2.5"/>
  <text x="60" y="376" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="15">User</text>

  <!-- ===== SEARCH API (stacked) ===== -->
  <rect x="312" y="228" width="158" height="104" rx="11" fill="#14171c" stroke="#3a414b" stroke-width="2"/>
  <rect x="306" y="234" width="158" height="104" rx="11" fill="#161a20" stroke="#4a525d" stroke-width="2"/>
  <rect x="300" y="240" width="158" height="104" rx="11" fill="#1a1f26" stroke="#8a95a3" stroke-width="2.5"/>
  <text x="379" y="298" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">Search API</text>

  <!-- arrow 1: user -> API -->
  <line x1="86" y1="278" x2="298" y2="278" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#wp-p)"/>
  <circle cx="104" cy="262" r="11" fill="#ff8bd2"/>
  <text x="104" y="267" text-anchor="middle" fill="#111317" font-family="sans-serif" font-size="13" font-weight="bold">1</text>
  <text x="122" y="267" fill="#ff8bd2" font-family="monospace" font-size="15">/search "sachin"</text>

  <!-- arrow 5: API -> user -->
  <line x1="298" y1="312" x2="86" y2="312" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#wp-g)"/>
  <circle cx="104" cy="330" r="11" fill="#8aff8a"/>
  <text x="104" y="335" text-anchor="middle" fill="#111317" font-family="sans-serif" font-size="13" font-weight="bold">5</text>
  <text x="122" y="335" fill="#8aff8a" font-family="sans-serif" font-size="15">return results</text>

  <!-- ===== ELASTICSEARCH (below) ===== -->
  <path d="M339 445 a40 9 0 0 0 80 0 v44 a40 9 0 0 1 -80 0 z" fill="#16191e" stroke="#7c8694" stroke-width="2.5"/>
  <ellipse cx="379" cy="445" rx="40" ry="9" fill="#1b1f25" stroke="#7c8694" stroke-width="2.5"/>
  <text x="379" y="515" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="14">Elasticsearch</text>
  <text x="379" y="471" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">search docs</text>
  <!-- arrow 2: API <-> ES -->
  <line x1="379" y1="346" x2="379" y2="433" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#wp-b)" marker-start="url(#wp-bs)"/>
  <circle cx="379" cy="392" r="11" fill="#93c5fd"/>
  <text x="379" y="397" text-anchor="middle" fill="#111317" font-family="sans-serif" font-size="13" font-weight="bold">2</text>
  <text x="400" y="396" fill="#cbd5e1" font-family="sans-serif" font-size="14">get matching documents (relevance)</text>

  <!-- ===== REDIS (top-right) ===== -->
  <path d="M774 116 a46 11 0 0 0 92 0 v52 a46 11 0 0 1 -92 0 z" fill="#16191e" stroke="#b79bff" stroke-width="2.5"/>
  <ellipse cx="820" cy="116" rx="46" ry="11" fill="#1b1f25" stroke="#b79bff" stroke-width="2.5"/>
  <text x="820" y="148" text-anchor="middle" fill="#e6dcff" font-family="sans-serif" font-size="15" font-weight="bold">Redis</text>
  <text x="820" y="201" text-anchor="middle" fill="#9aa6b2" font-family="monospace" font-size="13">recent:u1 &#8594; [ &#8230; max 10 ]</text>
  <!-- arrow 3: API -> Redis -->
  <line x1="462" y1="258" x2="772" y2="150" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#wp-p)"/>
  <circle cx="558" cy="222" r="11" fill="#ff8bd2"/>
  <text x="558" y="227" text-anchor="middle" fill="#111317" font-family="sans-serif" font-size="13" font-weight="bold">3</text>
  <text x="578" y="210" fill="#ffff99" font-family="sans-serif" font-size="14.5" font-weight="bold">cache-first write</text>
  <text x="578" y="230" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">LPUSH + LTRIM (bounded 10)</text>

  <!-- ===== MONGODB (right) ===== -->
  <path d="M848 300 a38 9 0 0 0 76 0 v44 a38 9 0 0 1 -76 0 z" fill="#16191e" stroke="#7c8694" stroke-width="2.5"/>
  <ellipse cx="886" cy="300" rx="38" ry="9" fill="#1b1f25" stroke="#7c8694" stroke-width="2.5"/>
  <path d="M888 318 a38 9 0 0 0 76 0 v44 a38 9 0 0 1 -76 0 z" fill="#16191e" stroke="#7c8694" stroke-width="2.5"/>
  <ellipse cx="926" cy="318" rx="38" ry="9" fill="#1b1f25" stroke="#7c8694" stroke-width="2.5"/>
  <text x="906" y="392" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="14">MongoDB &#183; sharded NoSQL</text>
  <text x="906" y="412" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">durable log &#183; all queries</text>
  <!-- arrow 4: API -> Mongo -->
  <line x1="462" y1="320" x2="846" y2="332" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#wp-p)"/>
  <circle cx="566" cy="322" r="11" fill="#ff8bd2"/>
  <text x="566" y="327" text-anchor="middle" fill="#111317" font-family="sans-serif" font-size="13" font-weight="bold">4</text>
  <text x="586" y="327" fill="#cbd5e1" font-family="monospace" font-size="14">persist {u1,"sachin",ts}</text>

  <!-- ===== KEY INSIGHT STRIP ===== -->
  <rect x="60" y="536" width="960" height="50" rx="12" fill="#101a12" stroke="#8aff8a" stroke-width="1.8"/>
  <text x="540" y="567" text-anchor="middle" fill="#e8ffe8" font-family="sans-serif" font-size="16.5"><tspan fill="#8aff8a" font-weight="bold">&#9733; key:</tspan>  the write that would <tspan fill="#ff8a8a" font-weight="bold">STALE</tspan> the cache now <tspan fill="#8aff8a" font-weight="bold">REFRESHES</tspan> it  &#8594;  never stale</text>
</svg>
