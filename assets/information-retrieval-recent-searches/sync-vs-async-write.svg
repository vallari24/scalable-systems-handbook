<svg width="1080" height="640" viewBox="0 0 1080 640" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ar-g" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aff8a"/></marker>
    <marker id="ar-p" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ff8bd2"/></marker>
    <marker id="ar-b" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#93c5fd"/></marker>
    <marker id="ar-r" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ff8a8a"/></marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1080" height="640" fill="#111317"/>

  <!-- title + subtitle -->
  <text x="540" y="38" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffff99">Persisting the query: should API &#8594; DB be synchronous or asynchronous?</text>
  <text x="540" y="64" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#9aa6b2">search is one of the most-hit APIs &#8212; pick the write mode deliberately</text>

  <!-- ============ TOP ROW: shared search path ============ -->

  <!-- User stick figure -->
  <g stroke="#cbd5e1" stroke-width="2.5" fill="none" stroke-linecap="round">
    <circle cx="55" cy="150" r="13" fill="#16191e"/>
    <line x1="55" y1="163" x2="55" y2="198"/>
    <line x1="35" y1="178" x2="75" y2="178"/>
    <line x1="55" y1="198" x2="40" y2="222"/>
    <line x1="55" y1="198" x2="70" y2="222"/>
  </g>
  <text x="55" y="244" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#cbd5e1">User</text>

  <!-- /search arrow (pink) -->
  <line x1="92" y1="178" x2="196" y2="178" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#ar-p)"/>
  <text x="144" y="168" text-anchor="middle" font-family="monospace" font-size="14" fill="#ff8bd2">/search</text>

  <!-- Search API: stacked 3-layer box (horizontal scaling) -->
  <rect x="218" y="142" width="170" height="62" rx="11" fill="#16191e" stroke="#7c8694" stroke-width="2.5"/>
  <rect x="210" y="134" width="170" height="62" rx="11" fill="#16191e" stroke="#7c8694" stroke-width="2.5"/>
  <rect x="202" y="126" width="170" height="62" rx="11" fill="#16191e" stroke="#7c8694" stroke-width="2.5"/>
  <text x="287" y="153" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Search API</text>
  <text x="287" y="173" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9aa6b2">horizontally scaled</text>

  <!-- Elasticsearch cylinder (below Search API) -->
  <line x1="287" y1="190" x2="287" y2="262" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#ar-g)" marker-start="url(#ar-g)"/>
  <g>
    <path d="M249 270 a38 9 0 0 0 76 0 v44 a38 9 0 0 1 -76 0 z" fill="#16191e" stroke="#7c8694" stroke-width="2.5"/>
    <ellipse cx="287" cy="270" rx="38" ry="9" fill="#1b1f25" stroke="#7c8694" stroke-width="2.5"/>
  </g>
  <text x="287" y="296" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#8aff8a">Elasticsearch</text>
  <text x="287" y="342" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9aa6b2">actual search documents</text>
  <text x="287" y="357" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9aa6b2">(relevance)</text>

  <!-- ============ Partitioned NoSQL cluster (far right) ============ -->
  <g>
    <!-- 4 cylinders -->
    <path d="M905 130 a36 8 0 0 0 72 0 v40 a36 8 0 0 1 -72 0 z" fill="#16191e" stroke="#7c8694" stroke-width="2.5"/>
    <ellipse cx="941" cy="130" rx="36" ry="8" fill="#1b1f25" stroke="#7c8694" stroke-width="2.5"/>
    <path d="M985 130 a36 8 0 0 0 72 0 v40 a36 8 0 0 1 -72 0 z" fill="#16191e" stroke="#7c8694" stroke-width="2.5"/>
    <ellipse cx="1021" cy="130" rx="36" ry="8" fill="#1b1f25" stroke="#7c8694" stroke-width="2.5"/>
    <path d="M905 192 a36 8 0 0 0 72 0 v40 a36 8 0 0 1 -72 0 z" fill="#16191e" stroke="#7c8694" stroke-width="2.5"/>
    <ellipse cx="941" cy="192" rx="36" ry="8" fill="#1b1f25" stroke="#7c8694" stroke-width="2.5"/>
    <path d="M985 192 a36 8 0 0 0 72 0 v40 a36 8 0 0 1 -72 0 z" fill="#16191e" stroke="#7c8694" stroke-width="2.5"/>
    <ellipse cx="1021" cy="192" rx="36" ry="8" fill="#1b1f25" stroke="#7c8694" stroke-width="2.5"/>
  </g>
  <text x="981" y="258" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffff99">Sharded NoSQL</text>
  <text x="981" y="276" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9aa6b2">MongoDB / Cassandra</text>
  <text x="981" y="291" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9aa6b2">all queries, unbounded</text>

  <!-- ============ MIDDLE: two lanes API -> DB ============ -->

  <!-- LANE 1: SYNC (pink) -->
  <text x="430" y="172" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ff8bd2">SYNC</text>
  <line x1="382" y1="186" x2="895" y2="186" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#ar-p)"/>
  <g font-family="sans-serif" font-size="13">
    <text x="470" y="370" fill="#ffffff" font-weight="bold">write straight to DB, then respond</text>
    <text x="470" y="392" fill="#8aff8a">+ delay(query &#8594; persisted) &#8776; 0</text>
    <text x="470" y="412" fill="#8aff8a">+ simplest</text>
    <text x="470" y="432" fill="#ff8a8a">&#8722; DB must absorb the write load on the hottest API</text>
  </g>
  <rect x="450" y="350" width="6" height="92" rx="3" fill="#ff8bd2"/>

  <!-- LANE 2: ASYNC (blue) -->
  <text x="430" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#93c5fd">ASYNC</text>
  <!-- API -> queue -->
  <line x1="382" y1="108" x2="586" y2="108" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#ar-b)"/>
  <!-- queue pill -->
  <rect x="592" y="86" width="170" height="44" rx="13" fill="#1b1f25" stroke="#93c5fd" stroke-width="2.5"/>
  <line x1="624" y1="94" x2="624" y2="122" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="642" y1="94" x2="642" y2="122" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="660" y1="94" x2="660" y2="122" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="700" y="112" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#93c5fd">Kafka / SQS</text>
  <!-- queue -> DB -->
  <line x1="766" y1="108" x2="900" y2="120" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#ar-b)"/>
  <g font-family="sans-serif" font-size="13">
    <text x="780" y="370" fill="#8aff8a">+ absorbs spikes, decouples</text>
    <text x="780" y="392" fill="#8aff8a">+ great for fan-out / extensibility</text>
    <text x="780" y="412" fill="#ff8a8a">&#8722; extra hop + record visible later (lag)</text>
  </g>
  <rect x="760" y="350" width="6" height="72" rx="3" fill="#93c5fd"/>

  <!-- ============ BOTTOM: decision badge ============ -->
  <rect x="40" y="478" width="1000" height="132" rx="14" fill="#16191e" stroke="#ffff99" stroke-width="2.5"/>
  <text x="64" y="510" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffff99">DECISION</text>

  <text x="68" y="540" font-family="sans-serif" font-size="14" fill="#8aff8a" font-weight="bold">&#10003;</text>
  <text x="90" y="540" font-family="sans-serif" font-size="14" fill="#ffffff">The DB is a sharded NoSQL store built FOR high write throughput &#8594; <tspan fill="#ff8bd2" font-weight="bold">start SYNC</tspan> (add shards if writes slow).</text>
  <text x="68" y="564" font-family="sans-serif" font-size="14" fill="#cbd5e1">Introduce the queue only when measured write latency actually degrades.</text>
  <text x="68" y="588" font-family="sans-serif" font-size="14" fill="#cbd5e1">Don't pre-build async you don't need.</text>
</svg>
