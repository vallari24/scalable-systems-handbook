<svg width="1230" height="820" viewBox="0 0 1230 820" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#9fb0c0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1230" height="820" fill="#0b0f14"/>

  <!-- title -->
  <text x="615" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#e6edf3">Pick the store from the access pattern</text>
  <text x="615" y="78" text-anchor="middle" font-size="16" fill="#9fb0c0">Walk top to bottom. Take the first “yes.”</text>

  <!-- start box -->
  <rect x="315" y="98" width="600" height="56" rx="10" fill="#161b22" stroke="#3a4656" stroke-width="1.5"/>
  <text x="615" y="132" text-anchor="middle" font-size="18" fill="#e6edf3">Write down the access pattern:  reads · writes · keys · volume · consistency</text>
  <line x1="615" y1="154" x2="615" y2="180" stroke="#9fb0c0" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ============ Q1 ============ -->
  <rect x="60" y="180" width="540" height="92" rx="10" fill="#161b22" stroke="#3a4656" stroke-width="1.5"/>
  <text x="84" y="216" font-size="21" font-weight="600" fill="#e6edf3">1 · Correctness spans multiple rows?</text>
  <text x="84" y="246" font-size="15" fill="#9fb0c0">multi-row transaction · constraints · joins must hold at commit</text>
  <!-- yes arrow -->
  <line x1="600" y1="226" x2="700" y2="226" stroke="#9fb0c0" stroke-width="2" marker-end="url(#ah)"/>
  <text x="650" y="216" text-anchor="middle" font-size="14" fill="#cbd5e1">yes</text>
  <!-- outcome -->
  <rect x="700" y="180" width="470" height="92" rx="10" fill="#ffff99" fill-opacity="0.10" stroke="#ffff99" stroke-width="1.8"/>
  <text x="724" y="214" font-size="21" font-weight="700" fill="#ffff99">RELATIONAL (SQL)</text>
  <text x="724" y="242" font-size="15" fill="#d8dee9">Postgres · MySQL — shard by the request-</text>
  <text x="724" y="262" font-size="15" fill="#d8dee9">scoping entity if one node is too small</text>
  <!-- no down -->
  <line x1="330" y1="272" x2="330" y2="300" stroke="#9fb0c0" stroke-width="2" marker-end="url(#ah)"/>
  <text x="348" y="291" font-size="14" fill="#cbd5e1">no</text>

  <!-- ============ Q2 ============ -->
  <rect x="60" y="300" width="540" height="92" rx="10" fill="#161b22" stroke="#3a4656" stroke-width="1.5"/>
  <text x="84" y="336" font-size="21" font-weight="600" fill="#e6edf3">2 · Every request starts from a known key?</text>
  <text x="84" y="366" font-size="15" fill="#9fb0c0">get / put / del · the value is fetched &amp; replaced whole</text>
  <line x1="600" y1="346" x2="700" y2="346" stroke="#9fb0c0" stroke-width="2" marker-end="url(#ah)"/>
  <text x="650" y="336" text-anchor="middle" font-size="14" fill="#cbd5e1">yes</text>
  <rect x="700" y="300" width="470" height="92" rx="10" fill="#8aff8a" fill-opacity="0.10" stroke="#8aff8a" stroke-width="1.8"/>
  <text x="724" y="334" font-size="21" font-weight="700" fill="#8aff8a">KEY-VALUE</text>
  <text x="724" y="362" font-size="15" fill="#d8dee9">DynamoDB · Redis — hash(key) routes to one</text>
  <text x="724" y="382" font-size="15" fill="#d8dee9">partition; Redis structures for ranking / counters</text>
  <line x1="330" y1="392" x2="330" y2="420" stroke="#9fb0c0" stroke-width="2" marker-end="url(#ah)"/>
  <text x="348" y="411" font-size="14" fill="#cbd5e1">no</text>

  <!-- ============ Q3 ============ -->
  <rect x="60" y="420" width="540" height="92" rx="10" fill="#161b22" stroke="#3a4656" stroke-width="1.5"/>
  <text x="84" y="456" font-size="21" font-weight="600" fill="#e6edf3">3 · Fields inside the record drive queries?</text>
  <text x="84" y="486" font-size="15" fill="#9fb0c0">filter · search · partial-update by field; records differ in shape</text>
  <line x1="600" y1="466" x2="700" y2="466" stroke="#9fb0c0" stroke-width="2" marker-end="url(#ah)"/>
  <text x="650" y="456" text-anchor="middle" font-size="14" fill="#cbd5e1">yes</text>
  <rect x="700" y="420" width="470" height="92" rx="10" fill="#93c5fd" fill-opacity="0.12" stroke="#93c5fd" stroke-width="1.8"/>
  <text x="724" y="454" font-size="21" font-weight="700" fill="#93c5fd">DOCUMENT</text>
  <text x="724" y="482" font-size="15" fill="#d8dee9">MongoDB — flexible schema +</text>
  <text x="724" y="502" font-size="15" fill="#d8dee9">secondary indexes on fields</text>
  <line x1="330" y1="512" x2="330" y2="540" stroke="#9fb0c0" stroke-width="2" marker-end="url(#ah)"/>
  <text x="348" y="531" font-size="14" fill="#cbd5e1">no</text>

  <!-- ============ Q4 ============ -->
  <rect x="60" y="540" width="540" height="92" rx="10" fill="#161b22" stroke="#3a4656" stroke-width="1.5"/>
  <text x="84" y="576" font-size="21" font-weight="600" fill="#e6edf3">4 · Write-heavy, time-ordered, staleness OK?</text>
  <text x="84" y="606" font-size="15" fill="#9fb0c0">firehose of appends; read the recent-N by time</text>
  <line x1="600" y1="586" x2="700" y2="586" stroke="#9fb0c0" stroke-width="2" marker-end="url(#ah)"/>
  <text x="650" y="576" text-anchor="middle" font-size="14" fill="#cbd5e1">yes</text>
  <rect x="700" y="540" width="470" height="92" rx="10" fill="#ff8bd2" fill-opacity="0.12" stroke="#ff8bd2" stroke-width="1.8"/>
  <text x="724" y="574" font-size="21" font-weight="700" fill="#ff8bd2">WIDE-COLUMN</text>
  <text x="724" y="602" font-size="15" fill="#d8dee9">Cassandra · ScyllaDB —</text>
  <text x="724" y="622" font-size="15" fill="#d8dee9">key = (entity, time-bucket)</text>
  <line x1="330" y1="632" x2="330" y2="662" stroke="#9fb0c0" stroke-width="2" marker-end="url(#ah)"/>
  <text x="348" y="651" font-size="14" fill="#cbd5e1">no</text>

  <!-- fallthrough -->
  <rect x="60" y="662" width="1110" height="62" rx="10" fill="#161b22" stroke="#3a4656" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="615" y="690" text-anchor="middle" font-size="17" font-weight="600" fill="#e6edf3">Still ambiguous?</text>
  <text x="615" y="712" text-anchor="middle" font-size="15" fill="#9fb0c0">Default to relational for query flexibility, then peel off the one painful access pattern into a specialized store later.</text>

  <!-- footer note -->
  <text x="615" y="762" text-anchor="middle" font-size="14" fill="#6b7886">The questions are ordered by how decisive they are — the first “yes” wins, even if a later one is also true.</text>
</svg>
