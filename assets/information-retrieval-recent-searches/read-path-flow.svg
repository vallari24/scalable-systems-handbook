<svg width="1080" height="770" viewBox="0 0 1080 770" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ar-g" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aff8a"/></marker>
    <marker id="ar-r" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ff8a8a"/></marker>
    <marker id="ar-b" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#93c5fd"/></marker>
  </defs>

  <rect x="0" y="0" width="1080" height="770" fill="#111317"/>

  <!-- Title -->
  <text x="540" y="34" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#ffff99">The read path &#8212; how <tspan font-family="monospace" fill="#8aff8a">/search/recent</tspan> got fast</text>
  <text x="540" y="59" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#9aa6b2">same endpoint, three versions: naive scan &#8594; write-through cache &#8594; preloaded</text>

  <!-- ============================ STAGE 1 (RED) ============================ -->
  <rect x="24" y="72" width="1032" height="170" rx="10" fill="#1a1210" stroke="#ff8a8a" stroke-width="2"/>
  <rect x="24" y="72" width="6" height="170" rx="3" fill="#ff8a8a"/>
  <text x="44" y="98" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ff8a8a">v0 &#183; NAIVE &#8212; every tap hits the DB</text>

  <!-- User -->
  <g stroke="#cbd5e1" stroke-width="2" fill="none">
    <circle cx="110" cy="140" r="9"/>
    <line x1="110" y1="149" x2="110" y2="172"/>
    <line x1="110" y1="154" x2="98" y2="166"/>
    <line x1="110" y1="154" x2="122" y2="166"/>
    <line x1="110" y1="172" x2="100" y2="186"/>
    <line x1="110" y1="172" x2="120" y2="186"/>
  </g>
  <text x="110" y="206" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cbd5e1">User</text>

  <!-- Search API -->
  <rect x="236" y="132" width="118" height="54" rx="11" fill="#16191e" stroke="#7c8694" stroke-width="2.5"/>
  <text x="295" y="156" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ffffff">Search API</text>
  <text x="295" y="174" text-anchor="middle" font-family="monospace" font-size="10" fill="#9aa6b2">/search/recent</text>

  <!-- NoSQL cylinder -->
  <path d="M516 132 a44 10 0 0 0 88 0 v52 a44 10 0 0 1 -88 0 z" fill="#16191e" stroke="#7c8694" stroke-width="2.5"/>
  <ellipse cx="560" cy="132" rx="44" ry="10" fill="#1b1f25" stroke="#7c8694" stroke-width="2.5"/>
  <text x="560" y="162" text-anchor="middle" font-family="monospace" font-size="12" fill="#ffff99">Sharded</text>
  <text x="560" y="178" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9aa6b2">NoSQL</text>

  <!-- User -> API -->
  <line x1="130" y1="158" x2="233" y2="158" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#ar-g)"/>
  <text x="178" y="148" text-anchor="middle" font-family="monospace" font-size="10" fill="#8aff8a">/search/recent</text>

  <!-- API -> NoSQL -->
  <line x1="354" y1="152" x2="513" y2="152" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#ar-r)"/>
  <text x="433" y="142" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ff8a8a">scan + filter + sort</text>

  <!-- return curve NoSQL -> User -->
  <path d="M560 188 C 470 226, 215 226, 124 192" fill="none" stroke="#ff8a8a" stroke-width="2.2" marker-end="url(#ar-r)"/>
  <text x="340" y="234" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9aa6b2">return to user (the user's scattered records)</text>

  <!-- Red verdict tag -->
  <rect x="792" y="118" width="248" height="86" rx="8" fill="#160d0c" stroke="#ff8a8a" stroke-width="1.6"/>
  <text x="810" y="146" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ff8a8a">&#10007; slow + hot</text>
  <text x="810" y="170" font-family="sans-serif" font-size="12" fill="#cbd5e1">runs on EVERY tap</text>
  <text x="810" y="190" font-family="sans-serif" font-size="12" fill="#cbd5e1">(50% within 5s)</text>

  <!-- ============================ STAGE 2 (AMBER) ============================ -->
  <rect x="24" y="254" width="1032" height="210" rx="10" fill="#1a1710" stroke="#ffff99" stroke-width="2"/>
  <rect x="24" y="254" width="6" height="210" rx="3" fill="#ffff99"/>
  <text x="44" y="280" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffff99">v1 &#183; WRITE-THROUGH CACHE &#8212; check Redis first</text>

  <!-- User -->
  <g stroke="#cbd5e1" stroke-width="2" fill="none">
    <circle cx="105" cy="348" r="9"/>
    <line x1="105" y1="357" x2="105" y2="380"/>
    <line x1="105" y1="362" x2="93" y2="374"/>
    <line x1="105" y1="362" x2="117" y2="374"/>
    <line x1="105" y1="380" x2="95" y2="394"/>
    <line x1="105" y1="380" x2="115" y2="394"/>
  </g>
  <text x="105" y="410" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cbd5e1">User</text>

  <!-- Search API -->
  <rect x="205" y="340" width="108" height="50" rx="11" fill="#16191e" stroke="#7c8694" stroke-width="2.5"/>
  <text x="259" y="370" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ffffff">Search API</text>

  <!-- Redis cylinder -->
  <path d="M413 340 a42 10 0 0 0 84 0 v50 a42 10 0 0 1 -84 0 z" fill="#16191e" stroke="#b79bff" stroke-width="2.5"/>
  <ellipse cx="455" cy="340" rx="42" ry="10" fill="#1b1f25" stroke="#b79bff" stroke-width="2.5"/>
  <text x="455" y="366" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#b79bff">Redis</text>
  <text x="455" y="383" text-anchor="middle" font-family="monospace" font-size="10" fill="#9aa6b2">GET recent:u1</text>

  <!-- NoSQL cylinder -->
  <path d="M678 392 a42 10 0 0 0 84 0 v48 a42 10 0 0 1 -84 0 z" fill="#16191e" stroke="#7c8694" stroke-width="2.5"/>
  <ellipse cx="720" cy="392" rx="42" ry="10" fill="#1b1f25" stroke="#7c8694" stroke-width="2.5"/>
  <text x="720" y="422" text-anchor="middle" font-family="monospace" font-size="11" fill="#ffff99">NoSQL</text>
  <text x="720" y="458" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#9aa6b2">scattered records</text>

  <!-- User -> API -->
  <line x1="125" y1="365" x2="202" y2="365" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#ar-g)"/>
  <text x="160" y="356" text-anchor="middle" font-family="monospace" font-size="10" fill="#8aff8a">/search/recent</text>

  <!-- API -> Redis -->
  <line x1="313" y1="365" x2="411" y2="365" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#ar-b)"/>

  <!-- HIT branch + pill -->
  <line x1="488" y1="334" x2="556" y2="318" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#ar-g)"/>
  <rect x="560" y="300" width="288" height="34" rx="8" fill="#0c160d" stroke="#8aff8a" stroke-width="1.6"/>
  <text x="704" y="322" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#daffda">&#10003; HIT &#8594; return 10 &#8212; O(1), in RAM, fresh</text>

  <!-- MISS branch (red dashed) -->
  <line x1="492" y1="388" x2="683" y2="394" stroke="#ff8a8a" stroke-width="2.2" stroke-dasharray="5,4" marker-end="url(#ar-r)"/>
  <text x="560" y="380" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ff8a8a">MISS</text>

  <!-- populate back to Redis (blue dashed) -->
  <path d="M680 426 C 580 472, 470 472, 427 392" fill="none" stroke="#93c5fd" stroke-width="2.2" stroke-dasharray="5,4" marker-end="url(#ar-b)"/>
  <text x="555" y="462" text-anchor="middle" font-family="monospace" font-size="10" fill="#93c5fd">populate recent:u1 &#8594; return</text>

  <!-- Amber verdict tag -->
  <rect x="858" y="346" width="188" height="72" rx="8" fill="#161207" stroke="#ffff99" stroke-width="1.6"/>
  <text x="874" y="370" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffff99">fast on a HIT, but</text>
  <text x="874" y="390" font-family="sans-serif" font-size="12" fill="#cbd5e1">a cold key still</text>
  <text x="874" y="408" font-family="sans-serif" font-size="12" fill="#cbd5e1">falls to the DB</text>

  <!-- ============================ STAGE 3 (GREEN) ============================ -->
  <rect x="24" y="476" width="1032" height="224" rx="10" fill="#101a12" stroke="#8aff8a" stroke-width="2"/>
  <rect x="24" y="476" width="6" height="224" rx="3" fill="#8aff8a"/>
  <text x="44" y="502" font-family="sans-serif" font-size="15" font-weight="bold" fill="#8aff8a">v2 &#183; PRELOADED &#8212; warm the cache before the tap</text>

  <!-- divider -->
  <line x1="556" y1="514" x2="556" y2="688" stroke="#274029" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="288" y="530" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#93c5fd">(a) BEFORE the tap &#8212; fires on app-open</text>
  <text x="812" y="530" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#8aff8a">(b) THE TAP &#8212; pure in-memory read</text>

  <!-- (a) APP_OPEN box -->
  <text x="74" y="556" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#9aa6b2">user opens app</text>
  <rect x="34" y="566" width="80" height="42" rx="8" fill="#16191e" stroke="#93c5fd" stroke-width="2"/>
  <text x="74" y="592" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#ffffff">APP_OPEN</text>

  <!-- queue pill -->
  <rect x="130" y="566" width="86" height="42" rx="21" fill="#0d1320" stroke="#93c5fd" stroke-width="2"/>
  <line x1="160" y1="568" x2="160" y2="606" stroke="#93c5fd" stroke-width="1.4"/>
  <line x1="176" y1="568" x2="176" y2="606" stroke="#93c5fd" stroke-width="1.4"/>
  <line x1="192" y1="568" x2="192" y2="606" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="173" y="556" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#9aa6b2">queue</text>

  <!-- Cache Warmer -->
  <rect x="232" y="564" width="96" height="46" rx="10" fill="#16191e" stroke="#7c8694" stroke-width="2.5"/>
  <text x="280" y="583" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">Cache</text>
  <text x="280" y="599" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">Warmer</text>

  <!-- NoSQL (a) -->
  <path d="M358 566 a30 8 0 0 0 60 0 v40 a30 8 0 0 1 -60 0 z" fill="#16191e" stroke="#7c8694" stroke-width="2.2"/>
  <ellipse cx="388" cy="566" rx="30" ry="8" fill="#1b1f25" stroke="#7c8694" stroke-width="2.2"/>
  <text x="388" y="592" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffff99">NoSQL</text>

  <!-- Redis (a) -->
  <path d="M456 566 a30 8 0 0 0 60 0 v40 a30 8 0 0 1 -60 0 z" fill="#16191e" stroke="#b79bff" stroke-width="2.2"/>
  <ellipse cx="486" cy="566" rx="30" ry="8" fill="#1b1f25" stroke="#b79bff" stroke-width="2.2"/>
  <text x="486" y="592" text-anchor="middle" font-family="monospace" font-size="10" fill="#b79bff">Redis</text>

  <!-- (a) arrows -->
  <line x1="114" y1="587" x2="127" y2="587" stroke="#93c5fd" stroke-width="2.4" marker-end="url(#ar-b)"/>
  <line x1="216" y1="587" x2="229" y2="587" stroke="#93c5fd" stroke-width="2.4" marker-end="url(#ar-b)"/>
  <line x1="328" y1="587" x2="355" y2="587" stroke="#93c5fd" stroke-width="2.4" marker-end="url(#ar-b)"/>
  <line x1="418" y1="587" x2="453" y2="587" stroke="#8aff8a" stroke-width="2.4" marker-end="url(#ar-g)"/>
  <text x="386" y="634" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#9aa6b2">scan once</text>
  <text x="486" y="634" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8aff8a">populate</text>
  <text x="280" y="664" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#cbd5e1">one expensive scan, done ahead of time</text>

  <!-- (b) THE TAP : User -->
  <g stroke="#cbd5e1" stroke-width="2" fill="none">
    <circle cx="620" cy="572" r="8"/>
    <line x1="620" y1="580" x2="620" y2="602"/>
    <line x1="620" y1="585" x2="610" y2="596"/>
    <line x1="620" y1="585" x2="630" y2="596"/>
    <line x1="620" y1="602" x2="611" y2="615"/>
    <line x1="620" y1="602" x2="629" y2="615"/>
  </g>
  <text x="620" y="632" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#cbd5e1">User</text>

  <!-- (b) Search API -->
  <rect x="694" y="566" width="104" height="44" rx="11" fill="#16191e" stroke="#7c8694" stroke-width="2.5"/>
  <text x="746" y="592" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ffffff">Search API</text>

  <!-- (b) Redis -->
  <path d="M870 566 a40 9 0 0 0 80 0 v44 a40 9 0 0 1 -80 0 z" fill="#16191e" stroke="#b79bff" stroke-width="2.5"/>
  <ellipse cx="910" cy="566" rx="40" ry="9" fill="#1b1f25" stroke="#b79bff" stroke-width="2.5"/>
  <text x="910" y="592" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#b79bff">Redis</text>
  <text x="910" y="628" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#9aa6b2">GET recent:u1</text>

  <!-- (b) arrows -->
  <line x1="640" y1="588" x2="691" y2="588" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#ar-g)"/>
  <text x="666" y="556" text-anchor="middle" font-family="monospace" font-size="9" fill="#8aff8a">/search/recent</text>
  <line x1="798" y1="588" x2="868" y2="588" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#ar-g)"/>

  <!-- (b) green takeaway pill -->
  <rect x="700" y="648" width="332" height="28" rx="6" fill="#0c160d" stroke="#8aff8a" stroke-width="1.4"/>
  <text x="866" y="667" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#daffda">&#10003; no DB on the tap &#8212; the warmer already filled it</text>

  <!-- ============================ BOTTOM TAKEAWAY ============================ -->
  <rect x="24" y="712" width="1032" height="46" rx="10" fill="#161a13" stroke="#ffff99" stroke-width="2"/>
  <text x="44" y="740" font-family="sans-serif" font-size="13.5" fill="#ffff99" font-weight="bold">TAKEAWAY:</text>
  <text x="140" y="740" font-family="sans-serif" font-size="13" fill="#cbd5e1">move the unavoidable DB scan OFF the tap (critical path) ONTO app-open (a predictable earlier signal).</text>
</svg>
