<svg width="1180" height="620" viewBox="0 0 1180 620" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1180" height="620" fill="#0d1117"/>
  <text x="40" y="52" fill="#e6edf3" font-size="34" font-weight="700">Sliding window counter: two numbers, one weighted guess</text>
  <text x="40" y="84" fill="#9aa7b4" font-size="18">Keep just the previous and current fixed-window counts. Weight the previous one by how much it still overlaps.</text>

  <!-- timeline windows -->
  <line x1="80" y1="280" x2="1140" y2="280" stroke="#3b4654" stroke-width="2"/>

  <!-- previous window -->
  <rect x="120" y="200" width="430" height="80" fill="#1b222c" stroke="#ffd27f" stroke-width="2"/>
  <text x="335" y="180" fill="#ffd27f" font-size="16" text-anchor="middle">previous window  &#8212;  count = 8</text>

  <!-- current window -->
  <rect x="550" y="200" width="430" height="80" fill="#1b222c" stroke="#8aff8a" stroke-width="2"/>
  <text x="765" y="180" fill="#8aff8a" font-size="16" text-anchor="middle">current window  &#8212;  count = 3</text>

  <!-- now marker, 25% into current -->
  <line x1="657" y1="160" x2="657" y2="310" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="657" y="330" fill="#93c5fd" font-size="15" text-anchor="middle">now: 25% into current window</text>

  <!-- the sliding window of width T, looking back -->
  <rect x="227" y="195" width="430" height="90" fill="none" stroke="#ff8bd2" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="320" y="375" fill="#ff8bd2" font-size="15" text-anchor="middle">the true window of width T (looks back from now)</text>
  <text x="320" y="396" fill="#9aa7b4" font-size="14" text-anchor="middle">covers the last 75% of the previous window</text>

  <!-- formula -->
  <rect x="120" y="430" width="940" height="90" rx="12" fill="#161b22" stroke="#93c5fd" stroke-width="2"/>
  <text x="590" y="468" fill="#e6edf3" font-size="20" font-weight="700" text-anchor="middle">estimate = prev_count &#215; overlap_fraction + current_count</text>
  <text x="590" y="503" fill="#ffd27f" font-size="20" text-anchor="middle">= 8 &#215; 0.75 + 3 = <tspan fill="#8aff8a" font-weight="700">9</tspan>   &#8594;   9 &lt; 10  &#8594;  <tspan fill="#8aff8a" font-weight="700">allow</tspan></text>

  <text x="120" y="565" fill="#9aa7b4" font-size="16">Two counters per key instead of N timestamps. The cost is approximation: it assumes the previous window&#8217;s traffic was evenly spread.</text>
  <text x="120" y="592" fill="#9aa7b4" font-size="16">Cloudflare reported this stays within ~0.003% of exact on real traffic &#8212; cheap enough to run on every edge request.</text>
</svg>
