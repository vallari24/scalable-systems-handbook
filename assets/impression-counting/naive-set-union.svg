<svg width="1000" height="680" viewBox="0 0 1000 680" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="m-w" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ff8bd2"/></marker>
    <marker id="m-g" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aff8a"/></marker>
    <marker id="m-n" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#cbd5e1"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="680" fill="#111317"/>

  <text x="500" y="42" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="28" font-weight="bold">The naive set-union approach, and the 3 costs that kill it</text>
  <text x="500" y="70" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="16">store raw ids per minute, union them at query time &#8212; correct, but it cannot scale</text>

  <!-- divider -->
  <line x1="512" y1="92" x2="512" y2="558" stroke="#3a3f47" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- ============ LEFT: naive design ============ -->
  <text x="256" y="118" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="17" font-weight="bold">The naive design (correct)</text>

  <!-- per-minute sets cylinder -->
  <g>
    <!-- cylinder body -->
    <path d="M64,168 v176 a162,18 0 0 0 324,0 v-176" fill="#20200f" stroke="#ffff99" stroke-width="2"/>
    <ellipse cx="226" cy="168" rx="162" ry="18" fill="#20200f" stroke="#ffff99" stroke-width="2"/>
  </g>
  <text x="226" y="158" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="13" font-weight="bold">per-minute sets</text>
  <text x="88" y="206" fill="#9aa6b2" font-family="monospace" font-size="12.5">20220401_1200</text>
  <text x="240" y="206" fill="#cbd5e1" font-family="monospace" font-size="12.5">= {a,b,c,d,e,f}</text>
  <text x="88" y="246" fill="#9aa6b2" font-family="monospace" font-size="12.5">20220401_1300</text>
  <text x="240" y="246" fill="#cbd5e1" font-family="monospace" font-size="12.5">= {a,c,z,w,x}</text>
  <text x="88" y="286" fill="#9aa6b2" font-family="monospace" font-size="12.5">20220401_1400</text>
  <text x="240" y="286" fill="#cbd5e1" font-family="monospace" font-size="12.5">= {c,d,f,l,z}</text>

  <!-- arrow: cylinder -> query server -->
  <line x1="226" y1="362" x2="226" y2="400" stroke="#ff8bd2" stroke-width="2" marker-end="url(#m-w)"/>
  <text x="226" y="384" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="11.5">pull ALL raw ids over the network</text>

  <!-- query server -->
  <rect x="64" y="408" width="324" height="98" rx="10" fill="#16191e" stroke="#cbd5e1" stroke-width="2"/>
  <text x="226" y="432" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="14" font-weight="bold">Query server</text>
  <text x="226" y="460" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="12">set-union = {a,b,c,d,e,f,l,w,x,z}</text>
  <text x="226" y="486" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13" font-weight="bold">distinct count = 10</text>

  <!-- arrow: query server -> customer -->
  <line x1="394" y1="457" x2="436" y2="457" stroke="#8aff8a" stroke-width="2" marker-end="url(#m-g)"/>

  <!-- customer stick figure -->
  <g transform="translate(462,432)"><circle cx="0" cy="0" r="7" fill="#cbd5e1"/><line x1="0" y1="7" x2="0" y2="30" stroke="#cbd5e1" stroke-width="2"/><line x1="0" y1="14" x2="-11" y2="24" stroke="#cbd5e1" stroke-width="2"/><line x1="0" y1="14" x2="11" y2="24" stroke="#cbd5e1" stroke-width="2"/><line x1="0" y1="30" x2="-9" y2="46" stroke="#cbd5e1" stroke-width="2"/><line x1="0" y1="30" x2="9" y2="46" stroke="#cbd5e1" stroke-width="2"/></g>
  <text x="462" y="498" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">customer /</text>
  <text x="462" y="514" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">dashboard</text>

  <!-- ============ RIGHT: why it melts ============ -->
  <text x="756" y="118" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="17" font-weight="bold">Why it melts at scale</text>

  <!-- cost 1 -->
  <rect x="556" y="138" width="404" height="118" rx="10" fill="#2a1414" stroke="#ff8a8a" stroke-width="2"/>
  <text x="574" y="164" fill="#ff8a8a" font-family="sans-serif" font-size="14" font-weight="bold">1 &#183; Huge network I/O</text>
  <text x="574" y="192" fill="#cbd5e1" font-family="sans-serif" font-size="13">union needs every raw id shipped from the DB;</text>
  <text x="574" y="214" fill="#cbd5e1" font-family="sans-serif" font-size="13">millions of ids cross the wire per query, just to</text>
  <text x="574" y="236" fill="#cbd5e1" font-family="sans-serif" font-size="13">produce a single distinct-count number.</text>

  <!-- cost 2 -->
  <rect x="556" y="270" width="404" height="148" rx="10" fill="#2a1414" stroke="#ff8a8a" stroke-width="2"/>
  <text x="574" y="296" fill="#ff8a8a" font-family="sans-serif" font-size="14" font-weight="bold">2 &#183; Memory blowup</text>
  <text x="574" y="324" fill="#cbd5e1" font-family="monospace" font-size="12.5">1M ids &#215; 4B = 4MB per minute</text>
  <text x="574" y="348" fill="#cbd5e1" font-family="monospace" font-size="12.5">last hour = 60 &#215; 4MB = 240MB for ONE ad</text>
  <text x="574" y="380" fill="#cbd5e1" font-family="monospace" font-size="12.5">5000 ads &#215; 240MB &#8776; </text>
  <text x="775" y="380" fill="#ff8a8a" font-family="monospace" font-size="15" font-weight="bold">1200 GB</text>
  <text x="574" y="404" fill="#9aa6b2" font-family="sans-serif" font-size="12">held in RAM just to evaluate the windows</text>

  <!-- cost 3 -->
  <rect x="556" y="432" width="404" height="110" rx="10" fill="#2a1414" stroke="#ff8a8a" stroke-width="2"/>
  <text x="574" y="458" fill="#ff8a8a" font-family="sans-serif" font-size="14" font-weight="bold">3 &#183; Slow query evaluation</text>
  <text x="574" y="486" fill="#cbd5e1" font-family="sans-serif" font-size="13">building &amp; unioning million-element sets burns</text>
  <text x="574" y="508" fill="#cbd5e1" font-family="sans-serif" font-size="13">CPU on every request &#8212; but the dashboard</text>
  <text x="574" y="530" fill="#cbd5e1" font-family="sans-serif" font-size="13">needs the answer NOW, not seconds later.</text>

  <!-- ============ BOTTOM banner ============ -->
  <rect x="40" y="578" width="920" height="82" rx="12" fill="#2a1414" stroke="#ff8a8a" stroke-width="2.5"/>
  <text x="500" y="606" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="14.5" font-weight="bold">The costs are all about identities &#8212; we ship, store, and hash millions of user ids just to output a single number.</text>
  <text x="500" y="636" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="14">Granularity is critical: too coarse = wrong windows, too fine = bucket explosion.</text>
</svg>
