<svg width="1000" height="640" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="m-n" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9aa6b2"/></marker>
    <marker id="m-y" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ffff99"/></marker>
    <marker id="m-g" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aff8a"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="640" fill="#111317"/>

  <text x="500" y="42" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="28" font-weight="bold">Count distinct in a window = cardinality of a set union</text>
  <text x="500" y="70" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="16">store one viewer-set per minute; any range answer is &#8220;union the minutes, then count&#8221;</text>

  <!-- ===== WINDOW 1 GROUP ===== -->
  <rect x="44" y="96" width="912" height="150" rx="12" fill="#16191e" stroke="#3a3f47" stroke-width="1.5"/>
  <text x="70" y="124" fill="#9aa6b2" font-family="sans-serif" font-size="13" font-weight="bold">window 1 &#183; raw view events (timestamp &#8594; user)</text>

  <!-- event list 1 -->
  <g font-family="monospace" font-size="14.5">
    <text x="80" y="152" fill="#cbd5e1">10:00</text><line x1="142" y1="148" x2="172" y2="148" stroke="#9aa6b2" stroke-width="2" marker-end="url(#m-n)"/><text x="184" y="152" fill="#cbd5e1">A</text>
    <text x="80" y="176" fill="#cbd5e1">10:00</text><line x1="142" y1="172" x2="172" y2="172" stroke="#9aa6b2" stroke-width="2" marker-end="url(#m-n)"/><text x="184" y="176" fill="#cbd5e1">B</text>
    <text x="80" y="200" fill="#cbd5e1">10:01</text><line x1="142" y1="196" x2="172" y2="196" stroke="#9aa6b2" stroke-width="2" marker-end="url(#m-n)"/><text x="184" y="200" fill="#cbd5e1">C</text>
    <text x="80" y="224" fill="#cbd5e1">10:01</text><line x1="142" y1="220" x2="172" y2="220" stroke="#9aa6b2" stroke-width="2" marker-end="url(#m-n)"/><text x="184" y="224" fill="#9aa6b2">B</text>
    <text x="246" y="176" fill="#cbd5e1">10:02</text><line x1="308" y1="172" x2="338" y2="172" stroke="#9aa6b2" stroke-width="2" marker-end="url(#m-n)"/><text x="350" y="176" fill="#9aa6b2">B</text>
    <text x="246" y="200" fill="#cbd5e1">10:02</text><line x1="308" y1="196" x2="338" y2="196" stroke="#9aa6b2" stroke-width="2" marker-end="url(#m-n)"/><text x="350" y="200" fill="#9aa6b2">A</text>
  </g>

  <!-- arrow into result box 1 -->
  <line x1="408" y1="171" x2="470" y2="171" stroke="#ffff99" stroke-width="2.5" marker-end="url(#m-y)"/>

  <!-- result box 1 -->
  <rect x="478" y="122" width="450" height="98" rx="10" fill="#20200f" stroke="#ffff99" stroke-width="2"/>
  <text x="703" y="158" text-anchor="middle" fill="#ffff99" font-family="monospace" font-size="17" font-weight="bold">unique in 10:00&#8211;10:02 = { A, B, C }</text>
  <text x="703" y="190" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13">(B viewed 3&#215;, counted once)</text>

  <!-- ===== WINDOW 2 GROUP ===== -->
  <rect x="44" y="262" width="912" height="150" rx="12" fill="#16191e" stroke="#3a3f47" stroke-width="1.5"/>
  <text x="70" y="290" fill="#9aa6b2" font-family="sans-serif" font-size="13" font-weight="bold">window 2 &#183; raw view events (timestamp &#8594; user)</text>

  <!-- event list 2 -->
  <g font-family="monospace" font-size="14.5">
    <text x="80" y="318" fill="#cbd5e1">10:03</text><line x1="142" y1="314" x2="172" y2="314" stroke="#9aa6b2" stroke-width="2" marker-end="url(#m-n)"/><text x="184" y="318" fill="#cbd5e1">A</text>
    <text x="80" y="342" fill="#cbd5e1">10:03</text><line x1="142" y1="338" x2="172" y2="338" stroke="#9aa6b2" stroke-width="2" marker-end="url(#m-n)"/><text x="184" y="342" fill="#9aa6b2">B</text>
    <text x="80" y="366" fill="#cbd5e1">10:04</text><line x1="142" y1="362" x2="172" y2="362" stroke="#9aa6b2" stroke-width="2" marker-end="url(#m-n)"/><text x="184" y="366" fill="#cbd5e1">D</text>
    <text x="246" y="318" fill="#cbd5e1">10:05</text><line x1="308" y1="314" x2="338" y2="314" stroke="#9aa6b2" stroke-width="2" marker-end="url(#m-n)"/><text x="350" y="318" fill="#9aa6b2">B</text>
    <text x="246" y="342" fill="#cbd5e1">10:05</text><line x1="308" y1="338" x2="338" y2="338" stroke="#9aa6b2" stroke-width="2" marker-end="url(#m-n)"/><text x="350" y="342" fill="#9aa6b2">D</text>
    <text x="246" y="366" fill="#cbd5e1">10:05</text><line x1="308" y1="362" x2="338" y2="362" stroke="#9aa6b2" stroke-width="2" marker-end="url(#m-n)"/><text x="350" y="366" fill="#cbd5e1">E</text>
  </g>

  <!-- arrow into result box 2 -->
  <line x1="408" y1="340" x2="470" y2="340" stroke="#ffff99" stroke-width="2.5" marker-end="url(#m-y)"/>

  <!-- result box 2 -->
  <rect x="478" y="304" width="450" height="68" rx="10" fill="#20200f" stroke="#ffff99" stroke-width="2"/>
  <text x="703" y="346" text-anchor="middle" fill="#ffff99" font-family="monospace" font-size="17" font-weight="bold">unique in 10:03&#8211;10:05 = { A, B, D, E }</text>

  <!-- ===== UNION ROW ===== -->
  <rect x="44" y="428" width="912" height="74" rx="12" fill="#101826" stroke="#93c5fd" stroke-width="2"/>
  <text x="70" y="448" fill="#93c5fd" font-family="sans-serif" font-size="12.5" font-weight="bold">union of the two windows</text>
  <text x="350" y="480" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="18">{A,B,C} &#8746; {A,B,D,E} = {A,B,C,D,E}</text>
  <line x1="648" y1="473" x2="710" y2="473" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#m-g)"/>
  <text x="833" y="481" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="20" font-weight="bold">cardinality = 5</text>

  <!-- ===== BOTTOM BANNER ===== -->
  <rect x="44" y="522" width="912" height="92" rx="12" fill="#1a1410" stroke="#ffd27f" stroke-width="2.5"/>
  <text x="500" y="556" text-anchor="middle" fill="#ffd27f" font-family="sans-serif" font-size="15.5" font-weight="bold">Any window = cardinality of the UNION of the per-minute viewer-sets.</text>
  <text x="500" y="586" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="14">Keep one set per minute, and every range query is just: union the minutes in range, then count.</text>
</svg>
