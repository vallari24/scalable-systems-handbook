<svg width="1040" height="780" viewBox="0 0 1040 780" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="m-g" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aff8a"/></marker>
    <marker id="m-p" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ff8bd2"/></marker>
    <marker id="m-b" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#93c5fd"/></marker>
    <marker id="m-y" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ffff99"/></marker>
  </defs>
  <rect x="0" y="0" width="1040" height="780" fill="#111317"/>

  <text x="520" y="42" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="28" font-weight="bold">Read and Write Paths, Kept Separate</text>
  <text x="520" y="70" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="16">two independent fleets that share only one thing &#8212; Redis</text>

  <!-- horizontal divider between write and read halves -->
  <line x1="44" y1="318" x2="996" y2="318" stroke="#3a3f47" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- ============ WRITE PATH (top) ============ -->
  <text x="60" y="116" fill="#8aff8a" font-family="sans-serif" font-size="18" font-weight="bold">WRITE PATH</text>
  <text x="60" y="138" fill="#9aa6b2" font-family="sans-serif" font-size="13">ingest &#8212; events flow in continuously</text>

  <!-- Kafka tube -->
  <rect x="80" y="180" width="250" height="40" rx="20" fill="#101826" stroke="#93c5fd" stroke-width="2.5"/>
  <line x1="100" y1="190" x2="312" y2="190" stroke="#ffff99" stroke-width="1" opacity="0.5"/>
  <line x1="100" y1="200" x2="312" y2="200" stroke="#ffff99" stroke-width="1" opacity="0.5"/>
  <line x1="100" y1="210" x2="312" y2="210" stroke="#ffff99" stroke-width="1" opacity="0.5"/>
  <circle cx="100" cy="200" r="10" fill="#101826" stroke="#93c5fd" stroke-width="2.5"/>
  <circle cx="310" cy="200" r="10" fill="#101826" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="205" y="248" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="13" font-weight="bold">Kafka (impression events)</text>
  <text x="205" y="266" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11.5">partitioned by post_id</text>

  <!-- arrow Kafka -> consumers -->
  <line x1="330" y1="200" x2="402" y2="200" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#m-p)"/>
  <text x="366" y="190" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11">consume</text>

  <!-- Counting consumers fleet (pink stacked) -->
  <rect x="418" y="166" width="150" height="68" rx="10" fill="#241019" stroke="#ff8bd2" stroke-width="2"/>
  <rect x="412" y="172" width="150" height="68" rx="10" fill="#1a1410" stroke="#ff8bd2" stroke-width="2.5"/>
  <text x="487" y="200" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="14" font-weight="bold">Counting</text>
  <text x="487" y="219" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="14" font-weight="bold">consumers</text>

  <!-- arrow consumers -> Redis, PFADD -->
  <line x1="562" y1="206" x2="662" y2="206" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#m-p)"/>
  <text x="612" y="196" text-anchor="middle" fill="#ff8bd2" font-family="monospace" font-size="14" font-weight="bold">PFADD</text>
  <text x="612" y="228" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11">one HLL per post, per minute</text>

  <!-- Redis cylinder (shared) -->
  <path d="M712,168 L712,256 A46,13 0 0 0 804,256 L804,168" fill="#20200f" stroke="#ffff99" stroke-width="2.5"/>
  <ellipse cx="758" cy="168" rx="46" ry="13" fill="#20200f" stroke="#ffff99" stroke-width="2.5"/>
  <text x="758" y="206" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="16" font-weight="bold">Redis</text>
  <text x="758" y="226" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">per-minute HLLs</text>
  <text x="758" y="290" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">the one shared store</text>

  <!-- ============ READ PATH (bottom) ============ -->
  <text x="60" y="360" fill="#8aff8a" font-family="sans-serif" font-size="18" font-weight="bold">READ PATH</text>
  <text x="60" y="382" fill="#9aa6b2" font-family="sans-serif" font-size="13">serve &#8212; answer a query on demand</text>

  <!-- Customers (three stick figures) -->
  <g stroke="#8aff8a" stroke-width="2.5" fill="none">
    <g transform="translate(76,420)"><circle cx="0" cy="0" r="12"/><line x1="0" y1="12" x2="0" y2="42"/><line x1="0" y1="21" x2="-14" y2="34"/><line x1="0" y1="21" x2="14" y2="34"/><line x1="0" y1="42" x2="-13" y2="64"/><line x1="0" y1="42" x2="13" y2="64"/></g>
    <g transform="translate(76,505)"><circle cx="0" cy="0" r="12"/><line x1="0" y1="12" x2="0" y2="42"/><line x1="0" y1="21" x2="-14" y2="34"/><line x1="0" y1="21" x2="14" y2="34"/><line x1="0" y1="42" x2="-13" y2="64"/><line x1="0" y1="42" x2="13" y2="64"/></g>
    <g transform="translate(76,590)"><circle cx="0" cy="0" r="12"/><line x1="0" y1="12" x2="0" y2="42"/><line x1="0" y1="21" x2="-14" y2="34"/><line x1="0" y1="21" x2="14" y2="34"/><line x1="0" y1="42" x2="-13" y2="64"/><line x1="0" y1="42" x2="13" y2="64"/></g>
  </g>
  <text x="76" y="684" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13" font-weight="bold">Customers</text>
  <text x="76" y="702" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11">"how many saw this?"</text>

  <!-- arrows customers -> analytics engine -->
  <line x1="110" y1="446" x2="208" y2="500" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#m-g)"/>
  <line x1="110" y1="531" x2="208" y2="520" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#m-g)"/>
  <line x1="110" y1="616" x2="208" y2="540" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#m-g)"/>
  <text x="158" y="470" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11">query</text>

  <!-- Analytics engine fleet (blue stacked) -->
  <rect x="224" y="478" width="160" height="84" rx="10" fill="#0d1320" stroke="#93c5fd" stroke-width="2"/>
  <rect x="218" y="486" width="160" height="84" rx="10" fill="#101826" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="298" y="520" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="14" font-weight="bold">Analytics</text>
  <text x="298" y="540" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="14" font-weight="bold">engine</text>
  <text x="298" y="558" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11">read fleet</text>

  <!-- arrow from Redis down/over to analytics engine -->
  <path d="M740,302 C640,392 480,420 398,500" fill="none" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#m-g)"/>
  <text x="828" y="396" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="12.5" font-weight="bold">reads the SAME Redis</text>
  <text x="828" y="416" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11">fetches the in-window per-minute HLLs</text>

  <!-- explanation text beside analytics engine (open space, right) -->
  <rect x="430" y="470" width="566" height="118" rx="10" fill="#16191e" stroke="#3a3f47" stroke-width="1.5"/>
  <text x="450" y="498" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">For the requested window the analytics engine fetches the in-window</text>
  <text x="450" y="518" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">per-minute HLLs from Redis, runs <tspan fill="#ffd27f" font-family="monospace" font-weight="bold">PFMERGE</tspan> to union them,</text>
  <text x="450" y="538" fill="#cbd5e1" font-family="sans-serif" font-size="13.5"><tspan fill="#8aff8a" font-family="monospace" font-weight="bold">PFCOUNT</tspan> to get the cardinality, and returns one number.</text>
  <text x="450" y="566" fill="#9aa6b2" font-family="sans-serif" font-size="12"><tspan fill="#ffd27f" font-family="monospace" font-weight="bold">PFMERGE</tspan> = union of sketches &#183; <tspan fill="#8aff8a" font-family="monospace" font-weight="bold">PFCOUNT</tspan> = estimate the unique count</text>

  <!-- separation note -->
  <text x="298" y="606" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">write fleet and read fleet are different machines &#8212;</text>
  <text x="298" y="624" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">a query spike can't stall ingest, and vice-versa</text>

  <!-- bottom banner: looming scale question (yellow) -->
  <rect x="44" y="714" width="952" height="56" rx="12" fill="#20200f" stroke="#ffff99" stroke-width="2.5"/>
  <text x="520" y="738" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="14.5" font-weight="bold">Does it work at scale? Millions of videos, millions of users, billions of events &#8212;</text>
  <text x="520" y="759" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">keeping every minute's HLL for every post in Redis forever is very costly&#8230;</text>
</svg>
