<svg width="1000" height="780" viewBox="0 0 1000 780" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="m-g" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aff8a"/></marker>
    <marker id="m-p" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ff8bd2"/></marker>
    <marker id="m-o" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ffd27f"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="780" fill="#111317"/>

  <text x="500" y="42" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="28" font-weight="bold">HyperLogLog: count distinct without remembering anyone</text>
  <text x="500" y="70" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="16">hash every id, watch the leading zeros &#8212; rarity tells you how many distinct things you&#8217;ve seen</text>

  <!-- ============ TOP REGION: the leading-zeros game ============ -->
  <text x="44" y="116" fill="#ff8bd2" font-family="sans-serif" font-size="17" font-weight="bold">The leading-zeros game</text>

  <!-- column of hashed bit-strings -->
  <text x="60" y="146" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">hash(id) &#8594; bits</text>
  <text x="430" y="146" text-anchor="end" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">how often</text>

  <text x="60" y="180" fill="#cbd5e1" font-family="monospace" font-size="16"><tspan fill="#9aa6b2">0</tspan> 1101001110&#8230;</text>
  <text x="430" y="180" text-anchor="end" fill="#cbd5e1" font-family="monospace" font-size="14">&#8776; 1 in 2</text>

  <text x="60" y="210" fill="#cbd5e1" font-family="monospace" font-size="16"><tspan fill="#9aa6b2">00</tspan> 110100111&#8230;</text>
  <text x="430" y="210" text-anchor="end" fill="#cbd5e1" font-family="monospace" font-size="14">&#8776; 1 in 4</text>

  <text x="60" y="240" fill="#cbd5e1" font-family="monospace" font-size="16"><tspan fill="#9aa6b2">000</tspan> 11010011&#8230;</text>
  <text x="430" y="240" text-anchor="end" fill="#cbd5e1" font-family="monospace" font-size="14">&#8776; 1 in 8</text>

  <!-- highlighted rare one -->
  <rect x="46" y="256" width="404" height="40" rx="6" fill="#1a1410" stroke="#ff8bd2" stroke-width="2"/>
  <text x="60" y="282" fill="#cbd5e1" font-family="monospace" font-size="16"><tspan fill="#ff8bd2" font-weight="bold">000001</tspan> 0110&#8230;</text>
  <text x="436" y="282" text-anchor="end" fill="#ff8bd2" font-family="monospace" font-size="14" font-weight="bold">&#8776; 1 in 64</text>

  <!-- boxed rule (yellow) on the right -->
  <rect x="500" y="128" width="456" height="116" rx="10" fill="#20200f" stroke="#ffff99" stroke-width="2"/>
  <text x="524" y="156" fill="#ffff99" font-family="sans-serif" font-size="14.5" font-weight="bold">The rule</text>
  <text x="524" y="184" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">longest leading-zero run seen  &#8776;  log&#8322;(distinct count)</text>
  <text x="524" y="216" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">a run of 6 zeros</text>
  <text x="640" y="216" fill="#ffff99" font-family="monospace" font-size="14" font-weight="bold">&#8658; &#8776; 2&#8310; = 64 distinct</text>

  <!-- note under it -->
  <text x="500" y="270" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">HLL splits hashes into many buckets and averages the per-bucket maxima</text>
  <text x="500" y="289" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">&#8658; smooths out the luck of a single rare hash &#8658; &#8776; 0.81% standard error.</text>

  <!-- divider -->
  <line x1="44" y1="316" x2="956" y2="316" stroke="#3a3f47" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- ============ MIDDLE REGION: the payoff ============ -->
  <text x="44" y="352" fill="#8aff8a" font-family="sans-serif" font-size="17" font-weight="bold">The payoff</text>

  <!-- red box: exact set -->
  <rect x="66" y="378" width="220" height="74" rx="10" fill="#2a1414" stroke="#ff8a8a" stroke-width="2.5"/>
  <text x="176" y="410" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="20" font-weight="bold">4 MB</text>
  <text x="176" y="434" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">exact set (every id)</text>

  <!-- big arrow -->
  <line x1="296" y1="415" x2="708" y2="415" stroke="#8aff8a" stroke-width="3" marker-end="url(#m-g)"/>
  <text x="500" y="402" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="14.5" font-weight="bold">&#8776; 0.15% of the space</text>
  <text x="500" y="440" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13.5">and FIXED size, no matter how many ids</text>

  <!-- green box: HLL -->
  <rect x="714" y="378" width="220" height="74" rx="10" fill="#0f1c12" stroke="#8aff8a" stroke-width="2.5"/>
  <text x="824" y="410" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="20" font-weight="bold">&#8776; 12 KB</text>
  <text x="824" y="434" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">HLL (just the maxima)</text>

  <!-- divider -->
  <line x1="44" y1="492" x2="956" y2="492" stroke="#3a3f47" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- ============ BOTTOM REGION: operations ============ -->
  <text x="44" y="528" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold">Operations (Redis, out of the box)</text>

  <!-- PFADD (pink) -->
  <rect x="66" y="546" width="868" height="48" rx="8" fill="#1a1410" stroke="#ff8bd2" stroke-width="2"/>
  <text x="86" y="576" fill="#ff8bd2" font-family="monospace" font-size="15" font-weight="bold">PFADD</text>
  <text x="240" y="576" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">add an element to the HLL</text>
  <text x="918" y="576" text-anchor="end" fill="#9aa6b2" font-family="monospace" font-size="14">O(1)</text>

  <!-- PFCOUNT (green) -->
  <rect x="66" y="602" width="868" height="48" rx="8" fill="#0f1c12" stroke="#8aff8a" stroke-width="2"/>
  <text x="86" y="632" fill="#8aff8a" font-family="monospace" font-size="15" font-weight="bold">PFCOUNT</text>
  <text x="240" y="632" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">estimated cardinality (distinct count)</text>
  <text x="918" y="632" text-anchor="end" fill="#9aa6b2" font-family="monospace" font-size="14">O(1)</text>

  <!-- PFMERGE (orange) -->
  <rect x="66" y="658" width="868" height="48" rx="8" fill="#16191e" stroke="#ffd27f" stroke-width="2"/>
  <text x="86" y="688" fill="#ffd27f" font-family="monospace" font-size="15" font-weight="bold">PFMERGE</text>
  <text x="240" y="688" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">union N HLLs into one (lossless merge)</text>
  <text x="918" y="688" text-anchor="end" fill="#9aa6b2" font-family="monospace" font-size="14">O(N)</text>

  <!-- caveat box (red) -->
  <rect x="66" y="718" width="868" height="50" rx="10" fill="#2a1414" stroke="#ff8a8a" stroke-width="2.5"/>
  <text x="500" y="740" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="14" font-weight="bold">You CANNOT delete from an HLL &#8212; lossy &amp; append-only, like a Bloom filter.</text>
  <text x="500" y="760" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">Need exact counts or the ids themselves? Fall back to a real set.</text>
</svg>
