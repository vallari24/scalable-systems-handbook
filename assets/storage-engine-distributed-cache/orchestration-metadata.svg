<svg width="1200" height="700" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="om-w" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ffffff"/>
    </marker>
    <marker id="om-p" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ff8bd2"/>
    </marker>
    <marker id="om-g" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8aff8a"/>
    </marker>
    <marker id="om-b" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#93c5fd"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="700" fill="#111317"/>

  <text x="600" y="44" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="30" font-weight="bold">Operating the Cluster: Who Tracks the Nodes?</text>
  <text x="600" y="74" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">the proxy routes; a control plane keeps the ring honest as nodes come and go</text>

  <!-- ===== data plane (white) ===== -->
  <!-- client -->
  <circle cx="110" cy="180" r="15" fill="none" stroke="#ffffff" stroke-width="2"/>
  <line x1="110" y1="195" x2="110" y2="228" stroke="#ffffff" stroke-width="2"/>
  <line x1="92" y1="208" x2="128" y2="208" stroke="#ffffff" stroke-width="2"/>
  <line x1="110" y1="228" x2="96" y2="252" stroke="#ffffff" stroke-width="2"/>
  <line x1="110" y1="228" x2="124" y2="252" stroke="#ffffff" stroke-width="2"/>
  <text x="110" y="278" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">client</text>

  <!-- proxy -->
  <rect x="240" y="160" width="160" height="74" rx="10" fill="#1a1320" stroke="#ff8bd2" stroke-width="2.5"/>
  <text x="320" y="194" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="18" font-weight="bold">Proxy</text>
  <text x="320" y="216" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">holds the ring in memory</text>
  <line x1="132" y1="200" x2="236" y2="195" stroke="#ffffff" stroke-width="2.5" marker-end="url(#om-w)"/>

  <!-- caches -->
  <g font-family="sans-serif" font-size="16" font-weight="bold">
    <rect x="600" y="150" width="160" height="54" rx="9" fill="#16191e" stroke="#ffff99" stroke-width="2"/><text x="680" y="183" text-anchor="middle" fill="#ffff99">Cache 1</text>
    <rect x="600" y="290" width="160" height="54" rx="9" fill="#16191e" stroke="#ffff99" stroke-width="2"/><text x="680" y="323" text-anchor="middle" fill="#ffff99">Cache 2</text>
    <rect x="600" y="430" width="160" height="54" rx="9" fill="#16191e" stroke="#ffff99" stroke-width="2"/><text x="680" y="463" text-anchor="middle" fill="#ffff99">Cache 3</text>
  </g>
  <!-- proxy -> caches (route) -->
  <line x1="402" y1="188" x2="596" y2="177" stroke="#ffffff" stroke-width="2" marker-end="url(#om-w)"/>
  <line x1="402" y1="200" x2="596" y2="315" stroke="#ffffff" stroke-width="2" marker-end="url(#om-w)"/>
  <line x1="402" y1="212" x2="596" y2="452" stroke="#ffffff" stroke-width="2" marker-end="url(#om-w)"/>
  <text x="495" y="150" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">route by key</text>

  <!-- ===== Prometheus (green metrics) ===== -->
  <rect x="980" y="270" width="170" height="74" rx="10" fill="#16191e" stroke="#8aff8a" stroke-width="2"/>
  <text x="1065" y="304" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="18" font-weight="bold">Prometheus</text>
  <text x="1065" y="326" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">scrapes metrics</text>
  <line x1="762" y1="172" x2="978" y2="288" stroke="#8aff8a" stroke-width="1.8" marker-end="url(#om-g)"/>
  <line x1="762" y1="312" x2="978" y2="305" stroke="#8aff8a" stroke-width="1.8" marker-end="url(#om-g)"/>
  <line x1="762" y1="462" x2="978" y2="322" stroke="#8aff8a" stroke-width="1.8" marker-end="url(#om-g)"/>

  <!-- ===== Orchestrator (pink heartbeat) ===== -->
  <rect x="40" y="430" width="190" height="74" rx="10" fill="#16191e" stroke="#ff8bd2" stroke-width="2"/>
  <text x="135" y="464" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="17" font-weight="bold">Orchestrator</text>
  <text x="135" y="486" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11">uptime + failovers</text>
  <!-- heartbeat to caches -->
  <line x1="232" y1="452" x2="596" y2="180" stroke="#ff8bd2" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#om-p)"/>
  <line x1="232" y1="462" x2="596" y2="318" stroke="#ff8bd2" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#om-p)"/>
  <line x1="232" y1="478" x2="596" y2="456" stroke="#ff8bd2" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#om-p)"/>
  <text x="300" y="420" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="13" font-weight="bold">heartbeat</text>

  <!-- ===== MetaDB (blue) ===== -->
  <g stroke="#93c5fd" stroke-width="2.5" fill="#10243a">
    <ellipse cx="320" cy="470" rx="44" ry="14"/>
    <path d="M276,470 L276,520" fill="none"/>
    <path d="M364,470 L364,520" fill="none"/>
    <path d="M276,520 A44,14 0 0 0 364,520" fill="none"/>
  </g>
  <rect x="276" y="470" width="88" height="50" fill="#10243a" stroke="none"/>
  <g stroke="#93c5fd" stroke-width="2.5" fill="none">
    <ellipse cx="320" cy="470" rx="44" ry="14"/>
    <path d="M276,470 L276,520"/><path d="M364,470 L364,520"/>
    <path d="M276,520 A44,14 0 0 0 364,520"/>
  </g>
  <text x="320" y="548" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="15" font-weight="bold">Meta DB</text>
  <text x="320" y="568" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">source of truth: the cluster map</text>

  <!-- orchestrator -> metadb (writes map) -->
  <line x1="232" y1="492" x2="272" y2="500" stroke="#93c5fd" stroke-width="2" marker-end="url(#om-b)"/>
  <!-- metadb -> proxy (sync up) -->
  <line x1="320" y1="456" x2="320" y2="238" stroke="#93c5fd" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#om-b)"/>
  <text x="334" y="300" text-anchor="start" fill="#93c5fd" font-family="sans-serif" font-size="13" font-weight="bold">sync ring</text>

  <!-- ===== bottom callouts ===== -->
  <rect x="40" y="596" width="555" height="86" rx="10" fill="#1d1216" stroke="#ff8a8a" stroke-width="2"/>
  <text x="60" y="624" fill="#ff8a8a" font-family="sans-serif" font-size="16" font-weight="bold">Dynamic scaling's core problem: data ownership</text>
  <text x="60" y="650" fill="#cbd5e1" font-family="sans-serif" font-size="14">which node owns which key &#8212; and deciding it <tspan font-weight="bold">efficiently</tspan></text>
  <text x="60" y="672" fill="#9aa6b2" font-family="sans-serif" font-size="13">as nodes join and leave. That's exactly what consistent hashing solves.</text>

  <rect x="615" y="596" width="545" height="86" rx="10" fill="#0f2417" stroke="#8aff8a" stroke-width="2"/>
  <text x="635" y="624" fill="#8aff8a" font-family="sans-serif" font-size="16" font-weight="bold">Skip the hop: connect straight to the owner</text>
  <text x="635" y="650" fill="#cbd5e1" font-family="sans-serif" font-size="14">the proxy/LB can hand the client the owner node's IP, so it opens a</text>
  <text x="635" y="672" fill="#cbd5e1" font-family="sans-serif" font-size="14"><tspan fill="#8aff8a" font-weight="bold">persistent connection</tspan> directly to that server &#8212; minimal latency.</text>
</svg>
