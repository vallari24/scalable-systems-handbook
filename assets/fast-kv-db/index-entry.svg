<svg width="1180" height="660" viewBox="0 0 1180 660" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ie-w" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ffffff"/>
    </marker>
    <marker id="ie-g" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8aff8a"/>
    </marker>
    <marker id="ie-m" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9aa6b2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="660" fill="#111317"/>

  <text x="590" y="46" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="29" font-weight="bold">The Richer Index Entry: Pointing Across Many Files</text>
  <text x="590" y="78" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">across many files an offset isn't enough &#8212; each entry names the <tspan fill="#8aff8a" font-weight="bold">file</tspan>, the <tspan fill="#8aff8a" font-weight="bold">position</tspan>, and the <tspan fill="#8aff8a" font-weight="bold">length</tspan></text>

  <!-- ===================== LEFT: in-memory index ===================== -->
  <rect x="48" y="116" width="470" height="252" rx="12" fill="#13161b" stroke="#7c8694" stroke-width="2"/>
  <text x="72" y="150" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">in-memory index</text>
  <text x="72" y="172" fill="#9aa6b2" font-family="sans-serif" font-size="13">key &#8594; [ File ID | VSZ | VPOS | TS ]</text>

  <!-- key k1 -->
  <rect x="72" y="196" width="64" height="52" rx="9" fill="#16191e" stroke="#ffffff" stroke-width="2.5"/>
  <text x="104" y="228" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="18" font-weight="bold">k1</text>

  <!-- entry for k1 : byte-strip -->
  <g>
    <rect x="184" y="196" width="80" height="52" fill="#0f2417" stroke="#8aff8a" stroke-width="2.5"/>
    <text x="224" y="222" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="13" font-weight="bold">File ID</text>
    <text x="224" y="239" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="13" font-weight="bold">7</text>

    <rect x="264" y="196" width="62" height="52" fill="#0f2417" stroke="#8aff8a" stroke-width="2.5"/>
    <text x="295" y="222" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="13" font-weight="bold">VSZ</text>
    <text x="295" y="239" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="13" font-weight="bold">128</text>

    <rect x="326" y="196" width="78" height="52" fill="#0f2417" stroke="#8aff8a" stroke-width="2.5"/>
    <text x="365" y="222" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="13" font-weight="bold">VPOS</text>
    <text x="365" y="239" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="13" font-weight="bold">4096</text>

    <rect x="404" y="196" width="86" height="52" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
    <text x="447" y="222" text-anchor="middle" fill="#ffff99" font-family="monospace" font-size="13" font-weight="bold">TS</text>
    <text x="447" y="239" text-anchor="middle" fill="#ffff99" font-family="monospace" font-size="13" font-weight="bold">t=910</text>
  </g>
  <line x1="136" y1="222" x2="180" y2="222" stroke="#ffffff" stroke-width="2.5" marker-end="url(#ie-w)"/>

  <!-- key k2 -->
  <rect x="72" y="288" width="64" height="52" rx="9" fill="#16191e" stroke="#ffffff" stroke-width="2.5"/>
  <text x="104" y="320" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="18" font-weight="bold">k2</text>

  <!-- entry for k2 : byte-strip -->
  <g>
    <rect x="184" y="288" width="80" height="52" fill="#0f2417" stroke="#8aff8a" stroke-width="2.5"/>
    <text x="224" y="314" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="13" font-weight="bold">File ID</text>
    <text x="224" y="331" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="13" font-weight="bold">3</text>

    <rect x="264" y="288" width="62" height="52" fill="#0f2417" stroke="#8aff8a" stroke-width="2.5"/>
    <text x="295" y="314" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="13" font-weight="bold">VSZ</text>
    <text x="295" y="331" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="13" font-weight="bold">64</text>

    <rect x="326" y="288" width="78" height="52" fill="#0f2417" stroke="#8aff8a" stroke-width="2.5"/>
    <text x="365" y="314" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="13" font-weight="bold">VPOS</text>
    <text x="365" y="331" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="13" font-weight="bold">512</text>

    <rect x="404" y="288" width="86" height="52" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
    <text x="447" y="314" text-anchor="middle" fill="#ffff99" font-family="monospace" font-size="13" font-weight="bold">TS</text>
    <text x="447" y="331" text-anchor="middle" fill="#ffff99" font-family="monospace" font-size="13" font-weight="bold">t=947</text>
  </g>
  <line x1="136" y1="314" x2="180" y2="314" stroke="#ffffff" stroke-width="2.5" marker-end="url(#ie-w)"/>

  <!-- ===================== RIGHT: data files on disk ===================== -->
  <rect x="724" y="116" width="408" height="252" rx="12" fill="#13161b" stroke="#7c8694" stroke-width="2"/>
  <text x="748" y="150" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">data files on disk</text>
  <text x="748" y="172" fill="#9aa6b2" font-family="sans-serif" font-size="13">a set of files; one is the active (open) file</text>

  <!-- file 3 (target of k2) -->
  <rect x="752" y="196" width="84" height="148" rx="9" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
  <text x="794" y="224" text-anchor="middle" fill="#ffff99" font-family="monospace" font-size="15" font-weight="bold">file 3</text>
  <rect x="766" y="240" width="56" height="22" rx="4" fill="#1a1a10" stroke="#ffff99" stroke-width="1.6"/>
  <text x="794" y="256" text-anchor="middle" fill="#ffff99" font-family="monospace" font-size="11">@512</text>

  <!-- file 4 -->
  <rect x="846" y="196" width="84" height="148" rx="9" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
  <text x="888" y="224" text-anchor="middle" fill="#ffff99" font-family="monospace" font-size="15" font-weight="bold">file 4</text>

  <!-- file 5 -->
  <rect x="940" y="196" width="84" height="148" rx="9" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
  <text x="982" y="224" text-anchor="middle" fill="#ffff99" font-family="monospace" font-size="15" font-weight="bold">file 5</text>

  <!-- file 7 ACTIVE (target of k1) -->
  <rect x="1034" y="196" width="84" height="148" rx="9" fill="#15281b" stroke="#8aff8a" stroke-width="3"/>
  <text x="1076" y="224" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="15" font-weight="bold">file 7</text>
  <rect x="1048" y="240" width="56" height="22" rx="4" fill="#0f2417" stroke="#8aff8a" stroke-width="1.6"/>
  <text x="1076" y="256" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="11">@4096</text>
  <text x="1076" y="334" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="11" font-weight="bold">active</text>

  <!-- arrows from entries to their files -->
  <!-- k1's entry (File ID 7) -> file 7 -->
  <path d="M 490 214 C 660 232, 900 300, 1062 280" fill="none" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#ie-g)"/>
  <text x="660" y="222" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13" font-weight="bold">k1 &#8594; file 7</text>

  <!-- k2's entry (File ID 3) -> file 3 -->
  <path d="M 490 326 C 600 362, 690 382, 788 350" fill="none" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#ie-g)"/>
  <text x="612" y="392" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13" font-weight="bold">k2 &#8594; file 3</text>

  <!-- ===================== CALL-OUTS for the four fields ===================== -->
  <rect x="48" y="396" width="540" height="172" rx="12" fill="#16191e" stroke="#8aff8a" stroke-width="2"/>
  <text x="72" y="430" fill="#8aff8a" font-family="sans-serif" font-size="18" font-weight="bold">The four fields of a location record</text>

  <g font-family="sans-serif" font-size="14.5">
    <text x="72" y="464"><tspan fill="#8aff8a" font-family="monospace" font-weight="bold">File ID</tspan><tspan fill="#cbd5e1"> &#8212; which file holds the latest record for this key</tspan></text>
    <text x="72" y="494"><tspan fill="#8aff8a" font-family="monospace" font-weight="bold">VPOS</tspan><tspan fill="#cbd5e1">    &#8212; byte offset of the value within that file</tspan></text>
    <text x="72" y="524"><tspan fill="#8aff8a" font-family="monospace" font-weight="bold">VSZ</tspan><tspan fill="#cbd5e1">     &#8212; value size: exactly how many bytes to read</tspan></text>
    <text x="72" y="554"><tspan fill="#ffff99" font-family="monospace" font-weight="bold">TS</tspan><tspan fill="#cbd5e1">      &#8212; timestamp, the tiebreaker for the newest record</tspan></text>
  </g>

  <!-- ===================== GET(k) note ===================== -->
  <rect x="612" y="396" width="520" height="172" rx="12" fill="#0f2417" stroke="#8aff8a" stroke-width="2"/>
  <text x="636" y="430" fill="#8aff8a" font-family="sans-serif" font-size="18" font-weight="bold">GET(k) is unchanged in spirit</text>
  <g font-family="sans-serif" font-size="14.5" fill="#cbd5e1">
    <text x="636" y="464"><tspan fill="#8aff8a" font-weight="bold">1.</tspan> look up k &#8594; <tspan fill="#8aff8a" font-family="monospace">[ File ID, VPOS, VSZ, TS ]</tspan></text>
    <text x="636" y="494"><tspan fill="#8aff8a" font-weight="bold">2.</tspan> open that file, seek to <tspan fill="#8aff8a" font-family="monospace">VPOS</tspan></text>
    <text x="636" y="524"><tspan fill="#8aff8a" font-weight="bold">3.</tspan> read <tspan fill="#8aff8a" font-family="monospace">VSZ</tspan> bytes &#8594; return the value</text>
  </g>
  <text x="636" y="554" fill="#9aa6b2" font-family="sans-serif" font-size="13.5">still one lookup + one seek-and-read, now addressed by (file, position).</text>

  <!-- ===================== BOTTOM takeaway ===================== -->
  <rect x="48" y="588" width="1084" height="52" rx="12" fill="#1d1d12" stroke="#ffff99" stroke-width="2"/>
  <text x="590" y="620" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="15"><tspan fill="#ffff99" font-weight="bold">Takeaway:&#160;</tspan>the index grew a few bytes per key &#8212; and bought the ability to read any key out of any file in the set.</text>
</svg>
