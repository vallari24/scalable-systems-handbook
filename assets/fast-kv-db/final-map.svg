<svg width="1180" height="820" viewBox="0 0 1180 820" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="km-w" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ffffff"/>
    </marker>
    <marker id="km-g" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8aff8a"/>
    </marker>
    <marker id="km-p" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ff8bd2"/>
    </marker>
    <marker id="km-b" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#93c5fd"/>
    </marker>
    <marker id="km-y" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ffff99"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="820" fill="#111317"/>

  <text x="590" y="46" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="29" font-weight="bold">The Complete Picture: A Log-Structured Key-Value Engine (Bitcask)</text>
  <text x="590" y="78" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">write path, read path, storage layer, and background compaction in one map</text>

  <!-- ============ API ENTRY POINT ============ -->
  <rect x="56" y="300" width="150" height="120" rx="11" fill="#16191e" stroke="#ffffff" stroke-width="2.5"/>
  <text x="131" y="332" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="bold">API</text>
  <text x="131" y="362" text-anchor="middle" fill="#ff8bd2" font-family="monospace" font-size="15" font-weight="bold">PUT</text>
  <text x="131" y="386" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="15" font-weight="bold">GET</text>
  <text x="131" y="410" text-anchor="middle" fill="#ff8bd2" font-family="monospace" font-size="15" font-weight="bold">DEL</text>

  <!-- ============ IN-MEMORY HASH INDEX (center) ============ -->
  <rect x="430" y="232" width="320" height="186" rx="12" fill="#0f2417" stroke="#8aff8a" stroke-width="3"/>
  <text x="458" y="266" fill="#8aff8a" font-family="sans-serif" font-size="18" font-weight="bold">In-Memory Hash Index</text>
  <rect x="664" y="250" width="66" height="24" rx="6" fill="#15281b" stroke="#8aff8a" stroke-width="1.6"/>
  <text x="697" y="267" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="12.5" font-weight="bold">in RAM</text>
  <rect x="456" y="284" width="268" height="44" rx="8" fill="#15281b" stroke="#8aff8a" stroke-width="2"/>
  <text x="590" y="312" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="13.5">key &#8594; [ FileID, VPOS, VSZ, TS ]</text>
  <text x="590" y="356" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="14">single source of truth for where each</text>
  <text x="590" y="376" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="14">key's latest value lives</text>
  <text x="590" y="402" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="14" font-weight="bold">O(1) reads &#183; must update atomically</text>

  <!-- ============ STORAGE LAYER (disk) ============ -->
  <rect x="826" y="150" width="300" height="370" rx="18" fill="#1a1a10" stroke="#ffff99" stroke-width="2.5"/>
  <text x="976" y="182" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="19" font-weight="bold">Storage Layer (disk)</text>

  <!-- active file -->
  <rect x="852" y="200" width="248" height="78" rx="9" fill="#1d1d12" stroke="#ffff99" stroke-width="2.8"/>
  <text x="976" y="228" text-anchor="middle" fill="#ffff99" font-family="monospace" font-size="16" font-weight="bold">ACTIVE file</text>
  <text x="976" y="250" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">all appends land here</text>
  <text x="976" y="270" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">rotated off once it passes t bytes</text>

  <!-- immutable files stack -->
  <rect x="872" y="330" width="224" height="58" rx="9" fill="#13161b" stroke="#5b6470" stroke-width="2"/>
  <rect x="862" y="342" width="224" height="58" rx="9" fill="#13161b" stroke="#7c8694" stroke-width="2"/>
  <rect x="852" y="354" width="224" height="58" rx="9" fill="#10243a" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="964" y="382" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="15" font-weight="bold">IMMUTABLE files</text>
  <text x="964" y="402" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">read-only &#183; many</text>

  <text x="976" y="456" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="13.5" font-weight="bold">append-only log &#183; durable</text>
  <text x="976" y="480" text-anchor="middle" fill="#9aa6b2" font-family="monospace" font-size="12.5">record: [ CRC | TS | KSZ | VSZ | K | V ]</text>

  <!-- ============ WRITE PATH (pink) ============ -->
  <!-- API -> active file (append) -->
  <path d="M206,338 C400,170 720,150 848,222" fill="none" stroke="#ff8bd2" stroke-width="3" marker-end="url(#km-p)"/>
  <text x="500" y="158" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="14" font-weight="bold">1. append CRC-framed record to ACTIVE file</text>

  <!-- API -> index (update) -->
  <line x1="206" y1="360" x2="426" y2="348" stroke="#ff8bd2" stroke-width="3" marker-end="url(#km-p)"/>
  <text x="312" y="320" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="14" font-weight="bold">2. update index</text>
  <text x="312" y="338" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="13">to new location</text>

  <!-- ============ READ PATH (green) ============ -->
  <!-- API -> index (lookup) -->
  <line x1="206" y1="376" x2="426" y2="388" stroke="#8aff8a" stroke-width="3" marker-end="url(#km-g)"/>
  <text x="316" y="408" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="14" font-weight="bold">GET(k): O(1) lookup</text>

  <!-- index -> storage (seek+read) -->
  <line x1="752" y1="332" x2="848" y2="306" stroke="#8aff8a" stroke-width="3" marker-end="url(#km-g)"/>
  <text x="976" y="306" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="12.5" font-weight="bold">&#8592; seek-and-read: active or immutable</text>

  <!-- ============ COMPACTION (blue, background) ============ -->
  <rect x="430" y="560" width="320" height="150" rx="12" fill="#10243a" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="456" y="594" fill="#93c5fd" font-family="sans-serif" font-size="19" font-weight="bold">Compaction</text>
  <rect x="640" y="574" width="92" height="26" rx="6" fill="#13161b" stroke="#93c5fd" stroke-width="1.6"/>
  <text x="686" y="592" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="13" font-weight="bold">background</text>
  <text x="590" y="624" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="14">merges immutable files, skipping</text>
  <text x="590" y="646" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="14">stale + tombstoned records</text>
  <text x="590" y="676" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="13.5">writes compact merged files back to disk</text>
  <text x="590" y="696" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">keeps disk usage bounded</text>

  <!-- immutable files -> compaction (read for merge, blue dashed) -->
  <path d="M852,400 C792,470 758,516 730,560" fill="none" stroke="#93c5fd" stroke-width="2.8" stroke-dasharray="6 5" marker-end="url(#km-b)"/>
  <text x="676" y="538" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="13" font-weight="bold">read immutable files</text>

  <!-- compaction -> index (atomic repoint, yellow accent) -->
  <line x1="590" y1="560" x2="590" y2="422" stroke="#ffff99" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#km-y)"/>
  <text x="378" y="492" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="14" font-weight="bold">ATOMICALLY repoint</text>
  <text x="378" y="510" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="13">index to new offsets</text>

  <!-- ============ LEGEND ============ -->
  <rect x="56" y="724" width="1068" height="64" rx="10" fill="#16191e" stroke="#5b6470" stroke-width="1.8"/>
  <text x="78" y="752" fill="#cbd5e1" font-family="sans-serif" font-size="14" font-weight="bold">LEGEND</text>
  <g font-family="sans-serif" font-size="14" font-weight="bold">
    <line x1="80" y1="772" x2="116" y2="772" stroke="#8aff8a" stroke-width="3" marker-end="url(#km-g)"/>
    <text x="124" y="777" fill="#cbd5e1">read path</text>
    <line x1="250" y1="772" x2="286" y2="772" stroke="#ff8bd2" stroke-width="3" marker-end="url(#km-p)"/>
    <text x="294" y="777" fill="#cbd5e1">write path</text>
    <line x1="430" y1="772" x2="466" y2="772" stroke="#ffff99" stroke-width="3" marker-end="url(#km-y)"/>
    <text x="474" y="777" fill="#cbd5e1">durable storage &amp; atomic index swap</text>
    <line x1="828" y1="772" x2="864" y2="772" stroke="#93c5fd" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#km-b)"/>
    <text x="872" y="777" fill="#cbd5e1">background maintenance</text>
  </g>

  <!-- footer -->
  <text x="1124" y="78" text-anchor="end" fill="#9aa6b2" font-family="sans-serif" font-size="14" font-style="italic">This is Bitcask.</text>
</svg>
