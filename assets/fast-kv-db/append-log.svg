<svg width="1200" height="720" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="al-g" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8aff8a"/>
    </marker>
    <marker id="al-p" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#ff8bd2"/>
    </marker>
    <marker id="al-r" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#ff8a8a"/>
    </marker>
    <marker id="al-y" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#ffff99"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="#111317"/>

  <text x="600" y="46" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="29" font-weight="bold">The Simplest Design: One Append-Only File</text>
  <text x="600" y="78" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17"><tspan fill="#ff8bd2" font-weight="bold">PUT</tspan> appends, <tspan fill="#ff8bd2" font-weight="bold">UPDATE</tspan> appends again (newest wins), <tspan fill="#ff8bd2" font-weight="bold">DELETE</tspan> appends a tombstone &#8212; all one cheap append.</text>

  <!-- LEFT: operations issued in order -->
  <text x="60" y="124" fill="#ff8bd2" font-family="sans-serif" font-size="19" font-weight="bold">Operations (in order)</text>
  <rect x="60" y="140" width="262" height="378" rx="10" fill="#2a1420" stroke="#ff8bd2" stroke-width="2"/>
  <g font-family="monospace" font-size="15" fill="#cbd5e1">
    <text x="80" y="178">put  k1 v1</text>
    <text x="80" y="226">put  k2 v2</text>
    <text x="80" y="274">put  k3 v3</text>
    <text x="80" y="322" fill="#ff8bd2">put  k1 v1'  <tspan fill="#9aa6b2" font-size="12">(update)</tspan></text>
    <text x="80" y="370">put  k4 v4</text>
    <text x="80" y="418" fill="#ff8bd2">put  k2 v2'  <tspan fill="#9aa6b2" font-size="12">(update)</tspan></text>
    <text x="80" y="466" fill="#ff8bd2">del  k3</text>
  </g>
  <text x="191" y="502" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13">client issues these, top to bottom</text>

  <!-- arrow from operations to file -->
  <line x1="324" y1="328" x2="468" y2="328" stroke="#8aff8a" stroke-width="3" marker-end="url(#al-g)"/>
  <text x="396" y="316" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13" font-weight="bold">each op &#8594;</text>
  <text x="396" y="346" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13" font-weight="bold">one append</text>

  <!-- CENTER: append-only file -->
  <text x="478" y="124" fill="#ffff99" font-family="sans-serif" font-size="19" font-weight="bold">APPEND-ONLY FILE</text>
  <text x="478" y="146" fill="#9aa6b2" font-family="sans-serif" font-size="13">durable on disk &#183; grows top &#8594; bottom, never edited in place</text>
  <rect x="478" y="158" width="300" height="404" rx="10" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>

  <!-- records, append order -->
  <g font-family="monospace" font-size="15">
    <!-- (k1, v1) stale -->
    <rect x="492" y="174" width="272" height="30" rx="5" fill="#2a1414" stroke="#ff8a8a" stroke-width="1.5"/>
    <text x="506" y="195" fill="#ff8a8a">(k1, v1)</text>
    <text x="690" y="195" fill="#ff8a8a" font-family="sans-serif" font-size="11">STALE</text>

    <text x="506" y="241" fill="#cbd5e1">(k2, v2)</text>
    <text x="506" y="287" fill="#cbd5e1">(k3, v3)</text>

    <!-- (k1, v1') winner -->
    <rect x="492" y="306" width="272" height="30" rx="5" fill="#1a1a10" stroke="#ffff99" stroke-width="2"/>
    <text x="506" y="327" fill="#ffff99" font-weight="bold">(k1, v1')</text>
    <text x="678" y="327" fill="#ffff99" font-family="sans-serif" font-size="11">NEWEST k1</text>

    <text x="506" y="379" fill="#cbd5e1">(k4, v4)</text>

    <!-- (k2, v2') winner -->
    <rect x="492" y="398" width="272" height="30" rx="5" fill="#1a1a10" stroke="#ffff99" stroke-width="2"/>
    <text x="506" y="419" fill="#ffff99" font-weight="bold">(k2, v2')</text>
    <text x="678" y="419" fill="#ffff99" font-family="sans-serif" font-size="11">NEWEST k2</text>

    <!-- tombstone -->
    <rect x="492" y="446" width="272" height="30" rx="5" fill="#2a1414" stroke="#ff8a8a" stroke-width="1.5"/>
    <text x="506" y="467" fill="#ff8a8a">(k3, -1)</text>
    <text x="650" y="467" fill="#ff8a8a" font-family="sans-serif" font-size="11">TOMBSTONE</text>
  </g>

  <!-- writes append here arrow -->
  <line x1="628" y1="540" x2="628" y2="480" stroke="#ffff99" stroke-width="3" marker-end="url(#al-y)"/>
  <text x="628" y="558" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="13" font-weight="bold">writes append here (end of file)</text>

  <!-- ANNOTATION 1: UPDATE -->
  <rect x="806" y="158" width="334" height="120" rx="10" fill="#2a1420" stroke="#ff8bd2" stroke-width="2"/>
  <text x="822" y="184" fill="#ff8bd2" font-family="sans-serif" font-size="16" font-weight="bold">1 &#183; UPDATE is just another append</text>
  <text x="822" y="208" fill="#cbd5e1" font-family="sans-serif" font-size="14">k1 appears <tspan fill="#ffff99" font-weight="bold">twice</tspan>; the newest record wins, so</text>
  <text x="822" y="230" fill="#cbd5e1" font-family="sans-serif" font-size="14"><tspan fill="#ffff99" font-weight="bold">v1'</tspan> overrides <tspan fill="#ff8a8a" font-weight="bold">v1</tspan>. The old (k1, v1) is now</text>
  <text x="822" y="252" fill="#cbd5e1" font-family="sans-serif" font-size="14">a <tspan fill="#ff8a8a" font-weight="bold">STALE entry</tspan> still sitting in the file.</text>
  <!-- connectors to k1 rows -->
  <line x1="806" y1="226" x2="766" y2="189" stroke="#ff8bd2" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="806" y1="232" x2="766" y2="321" stroke="#ff8bd2" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- ANNOTATION 2: DELETE -->
  <rect x="806" y="294" width="334" height="120" rx="10" fill="#2a1420" stroke="#ff8bd2" stroke-width="2"/>
  <text x="822" y="320" fill="#ff8bd2" font-family="sans-serif" font-size="16" font-weight="bold">2 &#183; DELETE is also an append</text>
  <text x="822" y="344" fill="#cbd5e1" font-family="sans-serif" font-size="14">DEL(k3) is written as <tspan fill="#ff8a8a" font-weight="bold">PUT(k3, tombstone)</tspan>,</text>
  <text x="822" y="366" fill="#cbd5e1" font-family="sans-serif" font-size="14">a special marker (<tspan font-family="monospace" fill="#ff8a8a" font-weight="bold">-1</tspan>) meaning "k3 is gone".</text>
  <text x="822" y="388" fill="#cbd5e1" font-family="sans-serif" font-size="14">We never erase &#8212; we append a gravestone.</text>
  <line x1="806" y1="372" x2="766" y2="461" stroke="#ff8bd2" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- ANNOTATION 3: same fast append -->
  <rect x="806" y="430" width="334" height="100" rx="10" fill="#0f2417" stroke="#8aff8a" stroke-width="2"/>
  <text x="822" y="456" fill="#8aff8a" font-family="sans-serif" font-size="16" font-weight="bold">3 &#183; All three are the SAME write</text>
  <text x="822" y="480" fill="#cbd5e1" font-family="sans-serif" font-size="14">PUT, UPDATE, and DELETE are one</text>
  <text x="822" y="502" fill="#cbd5e1" font-family="sans-serif" font-size="14"><tspan fill="#8aff8a" font-weight="bold">lightning-fast sequential append</tspan> &#8212; no</text>
  <text x="822" y="524" fill="#cbd5e1" font-family="sans-serif" font-size="14">seeks, no rewrites, just bytes at the end.</text>

  <!-- bottom takeaway -->
  <rect x="60" y="588" width="1080" height="104" rx="12" fill="#2a1414" stroke="#ff8a8a" stroke-width="2"/>
  <text x="84" y="624" fill="#ff8a8a" font-family="sans-serif" font-size="18" font-weight="bold">The price we accept</text>
  <text x="84" y="654" fill="#cbd5e1" font-family="sans-serif" font-size="15">Writes are dirt cheap, but the file fills with <tspan fill="#ff8a8a" font-weight="bold">stale</tspan> and <tspan fill="#ff8a8a" font-weight="bold">tombstoned</tspan> records that waste space and slow reads.</text>
  <text x="84" y="678" fill="#cbd5e1" font-family="sans-serif" font-size="15"><tspan fill="#ffff99" font-weight="bold">Compaction</tspan> (covered later) reclaims that space by dropping the dead records and keeping only the newest value per key.</text>
</svg>
