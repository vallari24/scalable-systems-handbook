<svg width="1180" height="660" viewBox="0 0 1180 660" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="md-w" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ffffff"/>
    </marker>
    <marker id="md-g" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8aff8a"/>
    </marker>
    <marker id="md-r" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ff8a8a"/>
    </marker>
    <marker id="md-y" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ffff99"/>
    </marker>
    <marker id="md-b" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#93c5fd"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="660" fill="#111317"/>

  <text x="590" y="46" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="29" font-weight="bold">Inside a Magnetic Disk: Where the 10 Milliseconds Go</text>
  <text x="590" y="78" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">touching one sector takes three steps &#8212; and only the <tspan fill="#8aff8a" font-weight="bold">last</tspan> one actually moves data</text>

  <!-- ===================== LEFT: the platter ===================== -->
  <!-- platter body -->
  <circle cx="340" cy="350" r="230" fill="#16191e" stroke="#9aa6b2" stroke-width="2.5"/>

  <!-- concentric tracks -->
  <circle cx="340" cy="350" r="225" fill="none" stroke="#3a4250" stroke-width="1.4"/>
  <circle cx="340" cy="350" r="185" fill="none" stroke="#3a4250" stroke-width="1.4"/>
  <circle cx="340" cy="350" r="95"  fill="none" stroke="#3a4250" stroke-width="1.4"/>
  <circle cx="340" cy="350" r="55"  fill="none" stroke="#3a4250" stroke-width="1.4"/>
  <!-- highlighted track -->
  <circle cx="340" cy="350" r="140" fill="none" stroke="#8aff8a" stroke-width="4"/>

  <!-- radial sector dividers -->
  <g stroke="#3a4250" stroke-width="1.2">
    <line x1="366"   y1="350"   x2="570" y2="350"/>
    <line x1="362.5" y1="363"   x2="539" y2="465"/>
    <line x1="353"   y1="372.5" x2="455" y2="549"/>
    <line x1="340"   y1="376"   x2="340" y2="580"/>
    <line x1="327"   y1="372.5" x2="225" y2="549"/>
    <line x1="317.5" y1="363"   x2="141" y2="465"/>
    <line x1="314"   y1="350"   x2="110" y2="350"/>
    <line x1="317.5" y1="337"   x2="141" y2="235"/>
    <line x1="327"   y1="327.5" x2="225" y2="151"/>
    <line x1="340"   y1="324"   x2="340" y2="120"/>
    <line x1="353"   y1="327.5" x2="455" y2="151"/>
    <line x1="362.5" y1="337"   x2="539" y2="235"/>
  </g>

  <!-- spindle hub -->
  <circle cx="340" cy="350" r="24" fill="#5b6470" stroke="#9aa6b2" stroke-width="2"/>
  <circle cx="340" cy="350" r="6"  fill="#9aa6b2"/>

  <!-- data: one sector worth of records (pink dots) -->
  <g fill="#ff8bd2">
    <circle cx="467" cy="409" r="3.6"/>
    <circle cx="454" cy="421" r="3.6"/>
    <circle cx="455" cy="446" r="3.6"/>
    <circle cx="429" cy="445" r="3.6"/>
    <circle cx="470" cy="425" r="3.6"/>
    <circle cx="438" cy="427" r="3.6"/>
    <circle cx="445" cy="455" r="3.6"/>
    <circle cx="453" cy="410" r="3.6"/>
    <circle cx="444" cy="444" r="3.6"/>
    <circle cx="453" cy="429" r="3.6"/>
  </g>
  <line x1="560" y1="468" x2="470" y2="438" stroke="#ff8bd2" stroke-width="1.6"/>
  <text x="566" y="464" fill="#ff8bd2" font-family="sans-serif" font-size="14" font-weight="bold">one sector</text>
  <text x="566" y="483" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">a block of bytes</text>

  <!-- read/write head + arm -->
  <line x1="118" y1="150" x2="225" y2="430" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
  <circle cx="118" cy="150" r="7" fill="#9aa6b2" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="214" y="419" width="22" height="22" rx="4" fill="#ff8bd2" stroke="#ffffff" stroke-width="2" transform="rotate(20 225 430)"/>
  <text x="92" y="130" fill="#ff8bd2" font-family="sans-serif" font-size="14" font-weight="bold">read / write head</text>
  <text x="92" y="148" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">rides on a moving arm</text>

  <!-- seek double-arrow near the head -->
  <line x1="200" y1="497" x2="262" y2="455" stroke="#ff8a8a" stroke-width="2.6" marker-start="url(#md-r)" marker-end="url(#md-r)"/>
  <text x="196" y="520" fill="#ff8a8a" font-family="sans-serif" font-size="13.5" font-weight="bold">seek: swing to a track</text>

  <!-- track label -->
  <line x1="150" y1="178" x2="241" y2="251" stroke="#8aff8a" stroke-width="1.6"/>
  <text x="96" y="174" fill="#8aff8a" font-family="sans-serif" font-size="14" font-weight="bold">a track</text>

  <!-- spin arrow below platter -->
  <path d="M250 612 A 95 95 0 0 0 430 612" fill="none" stroke="#93c5fd" stroke-width="2.6" marker-end="url(#md-b)"/>
  <text x="340" y="636" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="13.5" font-weight="bold">platter spins</text>

  <!-- ===================== RIGHT: the three steps ===================== -->
  <text x="660" y="138" fill="#cbd5e1" font-family="sans-serif" font-size="18" font-weight="bold">Reading or writing one sector</text>

  <!-- step 1: seek (slow) -->
  <rect x="660" y="156" width="468" height="96" rx="11" fill="#2a1414" stroke="#ff8a8a" stroke-width="2.5"/>
  <text x="684" y="186" fill="#ff8a8a" font-family="sans-serif" font-size="16" font-weight="bold">1. SEEK <tspan fill="#9aa6b2" font-size="13" font-weight="normal">&#183; ~10 ms &#183; mechanical</tspan></text>
  <text x="684" y="212" fill="#cbd5e1" font-family="sans-serif" font-size="14">The arm physically swings the head to the target track.</text>
  <text x="684" y="234" fill="#cbd5e1" font-family="sans-serif" font-size="14">This moving part is the <tspan fill="#ff8a8a" font-weight="bold">slow</tspan> step &#8212; the whole 10 ms.</text>

  <!-- step 2: rotational latency -->
  <rect x="660" y="266" width="468" height="78" rx="11" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
  <text x="684" y="296" fill="#ffff99" font-family="sans-serif" font-size="16" font-weight="bold">2. ROTATIONAL LATENCY</text>
  <text x="684" y="322" fill="#cbd5e1" font-family="sans-serif" font-size="14">Wait for the spin to bring the target sector under the head.</text>

  <!-- step 3: transfer (fast) -->
  <rect x="660" y="358" width="468" height="78" rx="11" fill="#0f2417" stroke="#8aff8a" stroke-width="2.5"/>
  <text x="684" y="388" fill="#8aff8a" font-family="sans-serif" font-size="16" font-weight="bold">3. TRANSFER <tspan fill="#9aa6b2" font-size="13" font-weight="normal">&#183; fast</tspan></text>
  <text x="684" y="414" fill="#cbd5e1" font-family="sans-serif" font-size="14">Bytes stream under the head as the platter turns. Cheap.</text>

  <!-- the punchline callout -->
  <rect x="660" y="456" width="468" height="158" rx="12" fill="#16191e" stroke="#5b6470" stroke-width="2"/>
  <text x="684" y="486" fill="#cbd5e1" font-family="sans-serif" font-size="15" font-weight="bold">So the cost is in <tspan fill="#ff8a8a">reaching</tspan> the data, not moving it.</text>
  <text x="684" y="516" fill="#8aff8a" font-family="sans-serif" font-size="14" font-weight="bold">Sequential write</text>
  <text x="684" y="538" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">next record is the next sector on the same track &#8212; already</text>
  <text x="684" y="557" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">rolling under the head. No new seek &#8594; full speed.</text>
  <text x="684" y="584" fill="#ff8a8a" font-family="sans-serif" font-size="14" font-weight="bold">Random write</text>
  <text x="684" y="606" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">next record is a far track &#8212; pay the seek (step 1) every time.</text>
</svg>
