<svg width="1200" height="700" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="im-g" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8aff8a"/>
    </marker>
    <marker id="im-y" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#ffff99"/>
    </marker>
    <marker id="im-w" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cbd5e1"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="700" fill="#111317"/>

  <text x="600" y="46" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="29" font-weight="bold">Fast GET: The In-Memory Hash Index</text>
  <text x="600" y="78" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">keep values on cheap disk, keep a tiny <tspan fill="#8aff8a" font-weight="bold">key-to-offset</tspan> map in RAM, and every read is a pointed <tspan fill="#8aff8a" font-weight="bold">O(1)</tspan> query</text>

  <!-- CENTER-LEFT: in-memory hash table -->
  <text x="120" y="120" fill="#8aff8a" font-family="sans-serif" font-size="19" font-weight="bold">Hash table</text>
  <text x="120" y="142" fill="#8aff8a" font-family="sans-serif" font-size="14" font-weight="bold">&#183; in RAM</text>
  <rect x="120" y="158" width="300" height="232" rx="11" fill="#0f2417" stroke="#8aff8a" stroke-width="2.5"/>
  <text x="270" y="190" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13">key &#8594; byte offset of LATEST record</text>

  <!-- hash entries -->
  <rect x="144" y="210" width="252" height="44" rx="8" fill="#15281b" stroke="#8aff8a" stroke-width="2"/>
  <text x="166" y="238" fill="#8aff8a" font-family="monospace" font-size="17" font-weight="bold">k1 &#8594; o1</text>
  <rect x="144" y="264" width="252" height="44" rx="8" fill="#15281b" stroke="#8aff8a" stroke-width="2"/>
  <text x="166" y="292" fill="#8aff8a" font-family="monospace" font-size="17" font-weight="bold">k2 &#8594; o2</text>
  <rect x="144" y="318" width="252" height="44" rx="8" fill="#15281b" stroke="#8aff8a" stroke-width="2"/>
  <text x="166" y="346" fill="#8aff8a" font-family="monospace" font-size="17" font-weight="bold">k3 &#8594; o3</text>

  <!-- RIGHT: data file on disk -->
  <text x="700" y="120" fill="#ffff99" font-family="sans-serif" font-size="19" font-weight="bold">Data file</text>
  <text x="700" y="142" fill="#9aa6b2" font-family="sans-serif" font-size="13">on disk &#183; records appended in write order</text>
  <rect x="700" y="158" width="430" height="380" rx="11" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>

  <!-- records: offsets shown on left, key on right -->
  <!-- o = offset markers; LATEST occurrences of each key get a highlighted edge -->
  <!-- record 1: k1 -->
  <rect x="724" y="180" width="382" height="40" rx="6" fill="#16191e" stroke="#5b6470" stroke-width="2"/>
  <text x="744" y="205" fill="#9aa6b2" font-family="monospace" font-size="14">offset</text>
  <text x="812" y="205" fill="#cbd5e1" font-family="monospace" font-size="15">k1 : "v..."</text>
  <text x="1090" y="205" text-anchor="end" fill="#9aa6b2" font-family="monospace" font-size="13">old</text>
  <!-- record 2: k2 (latest k2) -->
  <rect x="724" y="226" width="382" height="40" rx="6" fill="#1d1d12" stroke="#8aff8a" stroke-width="2.5"/>
  <text x="744" y="251" fill="#8aff8a" font-family="monospace" font-size="14" font-weight="bold">o2</text>
  <text x="812" y="251" fill="#8aff8a" font-family="monospace" font-size="15" font-weight="bold">k2 : "v..."</text>
  <text x="1090" y="251" text-anchor="end" fill="#8aff8a" font-family="monospace" font-size="13" font-weight="bold">latest k2</text>
  <!-- record 3: k1 update -->
  <rect x="724" y="272" width="382" height="40" rx="6" fill="#16191e" stroke="#5b6470" stroke-width="2"/>
  <text x="744" y="297" fill="#9aa6b2" font-family="monospace" font-size="14">offset</text>
  <text x="812" y="297" fill="#cbd5e1" font-family="monospace" font-size="15">k1 : "v..." (update)</text>
  <text x="1090" y="297" text-anchor="end" fill="#9aa6b2" font-family="monospace" font-size="13">old</text>
  <!-- record 4: k3 -->
  <rect x="724" y="318" width="382" height="40" rx="6" fill="#16191e" stroke="#5b6470" stroke-width="2"/>
  <text x="744" y="343" fill="#9aa6b2" font-family="monospace" font-size="14">offset</text>
  <text x="812" y="343" fill="#cbd5e1" font-family="monospace" font-size="15">k3 : "v..."</text>
  <text x="1090" y="343" text-anchor="end" fill="#9aa6b2" font-family="monospace" font-size="13">old</text>
  <!-- record 5: k1 update (latest k1) -->
  <rect x="724" y="364" width="382" height="40" rx="6" fill="#1d1d12" stroke="#8aff8a" stroke-width="2.5"/>
  <text x="744" y="389" fill="#8aff8a" font-family="monospace" font-size="14" font-weight="bold">o1</text>
  <text x="812" y="389" fill="#8aff8a" font-family="monospace" font-size="15" font-weight="bold">k1 : "v..." (update)</text>
  <text x="1090" y="389" text-anchor="end" fill="#8aff8a" font-family="monospace" font-size="13" font-weight="bold">latest k1</text>
  <!-- record 6: k3 update (latest k3) -->
  <rect x="724" y="410" width="382" height="40" rx="6" fill="#1d1d12" stroke="#8aff8a" stroke-width="2.5"/>
  <text x="744" y="435" fill="#8aff8a" font-family="monospace" font-size="14" font-weight="bold">o3</text>
  <text x="812" y="435" fill="#8aff8a" font-family="monospace" font-size="15" font-weight="bold">k3 : "v..." (update)</text>
  <text x="1090" y="435" text-anchor="end" fill="#8aff8a" font-family="monospace" font-size="13" font-weight="bold">latest k3</text>

  <text x="915" y="478" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13">append-only &#183; newest record wins</text>
  <text x="915" y="512" text-anchor="middle" fill="#ffff99" font-family="monospace" font-size="14" font-weight="bold">&#8595; grows downward as writes arrive &#8595;</text>

  <!-- arrows: each hash entry -> latest record of that key -->
  <!-- k1 -> o1 (record 5) -->
  <path d="M396 232 C 560 232, 560 384, 718 384" fill="none" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#im-g)"/>
  <!-- k2 -> o2 (record 2) -->
  <path d="M396 286 C 540 286, 560 246, 718 246" fill="none" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#im-g)"/>
  <!-- k3 -> o3 (record 6) -->
  <path d="M396 340 C 600 340, 600 430, 718 430" fill="none" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#im-g)"/>

  <!-- GET path: 3 numbered steps -->
  <rect x="120" y="412" width="300" height="190" rx="12" fill="#16191e" stroke="#8aff8a" stroke-width="2"/>
  <text x="144" y="446" fill="#8aff8a" font-family="sans-serif" font-size="18" font-weight="bold">GET(k): a pointed query</text>
  <g font-family="sans-serif" font-size="14" fill="#cbd5e1">
    <text x="144" y="478"><tspan fill="#8aff8a" font-weight="bold">1.</tspan> hash-table lookup in RAM</text>
    <text x="164" y="498" fill="#9aa6b2" font-size="13">&#8594; get offset (O(1), instant)</text>
    <text x="144" y="528"><tspan fill="#8aff8a" font-weight="bold">2.</tspan> one disk seek to that offset</text>
    <text x="144" y="558"><tspan fill="#8aff8a" font-weight="bold">3.</tspan> one disk read of the record</text>
  </g>
  <text x="144" y="588" fill="#9aa6b2" font-family="sans-serif" font-size="13">no scan, no matter how big the file</text>

  <!-- PUT / DEL note (pink-ish neutral) -->
  <rect x="440" y="158" width="240" height="100" rx="11" fill="#16191e" stroke="#7c8694" stroke-width="2"/>
  <text x="460" y="186" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">Keeping it current</text>
  <text x="460" y="210" fill="#cbd5e1" font-family="sans-serif" font-size="13"><tspan fill="#ffff99" font-weight="bold">PUT</tspan>: append record, then</text>
  <text x="460" y="228" fill="#cbd5e1" font-family="sans-serif" font-size="13">point the key at its new offset</text>
  <text x="460" y="248" fill="#cbd5e1" font-family="sans-serif" font-size="13"><tspan fill="#ff8a8a" font-weight="bold">DEL</tspan>: remove the key from the map</text>

  <!-- GET note (green) -->
  <rect x="440" y="288" width="240" height="100" rx="11" fill="#0f2417" stroke="#8aff8a" stroke-width="2"/>
  <text x="460" y="314" fill="#8aff8a" font-family="sans-serif" font-size="15" font-weight="bold">So a GET costs</text>
  <text x="460" y="340" fill="#cbd5e1" font-family="sans-serif" font-size="13">one in-memory lookup</text>
  <text x="460" y="360" fill="#cbd5e1" font-family="sans-serif" font-size="13">+ exactly one seek</text>
  <text x="460" y="380" fill="#cbd5e1" font-family="sans-serif" font-size="13">+ exactly one read.</text>

  <!-- BOTTOM takeaway / LIMITATION (red) -->
  <rect x="120" y="618" width="1010" height="62" rx="12" fill="#2a1414" stroke="#ff8a8a" stroke-width="2.5"/>
  <text x="144" y="646" fill="#ff8a8a" font-family="sans-serif" font-size="18" font-weight="bold">The defining limitation: all keys must fit in RAM</text>
  <text x="144" y="670" fill="#cbd5e1" font-family="sans-serif" font-size="14">The index lives in memory. Values stay on disk &#8212; only <tspan fill="#ff8a8a" font-weight="bold">keys + small offsets</tspan> are in RAM. If the keys don't fit, this design breaks.</text>
</svg>
