<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="900" viewBox="0 0 1480 900" role="img" aria-labelledby="title desc">
  <title id="title">Complete load balancer design map</title>
  <desc id="desc">A single readable system map for load balancer design showing DNS resolution, request routing, config propagation, health checks, metrics, and autoscaling.</desc>
  <defs>
    <marker id="arrowWhite" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1.3,1.3 L7,4 L1.3,6.7 Z" fill="#f8fafc"/>
    </marker>
    <marker id="arrowPink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1.3,1.3 L7,4 L1.3,6.7 Z" fill="#ff9fba"/>
    </marker>
    <marker id="arrowYellow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1.3,1.3 L7,4 L1.3,6.7 Z" fill="#fff59d"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1.3,1.3 L7,4 L1.3,6.7 Z" fill="#67d8ff"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1.3,1.3 L7,4 L1.3,6.7 Z" fill="#ffcf9f"/>
    </marker>
    <style>
      .bg { fill: #0d1217; }
      .grid { stroke: #26313f; stroke-width: 1.5; opacity: 0.7; }
      .dns { fill: #241a25; stroke: #ff9fba; stroke-width: 4; rx: 8; }
      .lb { fill: #1a2030; stroke: #a9b4ff; stroke-width: 3; rx: 8; }
      .backend { fill: #13211a; stroke: #6ee7a8; stroke-width: 3; rx: 8; }
      .console { fill: #241a25; stroke: #ff9fba; stroke-width: 4; rx: 8; }
      .orchestrator { fill: #211817; stroke: #ffcf9f; stroke-width: 3; rx: 8; }
      .metrics { fill: #111f28; stroke: #67d8ff; stroke-width: 3; rx: 8; }
      .autoscale { fill: #222315; stroke: #fff59d; stroke-width: 3; rx: 8; }
      .note { fill: #111820; stroke: #64748b; stroke-width: 2; rx: 8; }
      .title { font: 700 36px Arial, sans-serif; fill: #fff59d; }
      .subtitle { font: 500 18px Arial, sans-serif; fill: #dbe4ee; }
      .label { font: 700 21px Arial, sans-serif; fill: #f8fafc; }
      .small { font: 600 16px Arial, sans-serif; fill: #dbe4ee; }
      .tiny { font: 600 14px Arial, sans-serif; fill: #dbe4ee; }
      .pink { fill: #ff9fba; }
      .yellow { fill: #fff59d; }
      .blue { fill: #67d8ff; }
      .green { fill: #6ee7a8; }
      .orange { fill: #ffcf9f; }
      .muted { fill: #b9c5d3; }
      .arrowWhite { stroke: #f8fafc; stroke-width: 3; fill: none; marker-end: url(#arrowWhite); }
      .arrowPink { stroke: #ff9fba; stroke-width: 3; fill: none; marker-end: url(#arrowPink); }
      .arrowYellow { stroke: #fff59d; stroke-width: 3; fill: none; marker-end: url(#arrowYellow); }
      .arrowBlue { stroke: #67d8ff; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
      .arrowOrange { stroke: #ffcf9f; stroke-width: 3; fill: none; marker-end: url(#arrowOrange); }
    </style>
  </defs>

  <rect class="bg" width="1480" height="900"/>
  <g>
    <line class="grid" x1="0" y1="104" x2="1480" y2="104"/>
    <line class="grid" x1="0" y1="164" x2="1480" y2="164"/>
    <line class="grid" x1="0" y1="224" x2="1480" y2="224"/>
    <line class="grid" x1="0" y1="284" x2="1480" y2="284"/>
    <line class="grid" x1="0" y1="344" x2="1480" y2="344"/>
    <line class="grid" x1="0" y1="404" x2="1480" y2="404"/>
    <line class="grid" x1="0" y1="464" x2="1480" y2="464"/>
    <line class="grid" x1="0" y1="524" x2="1480" y2="524"/>
    <line class="grid" x1="0" y1="584" x2="1480" y2="584"/>
    <line class="grid" x1="0" y1="644" x2="1480" y2="644"/>
    <line class="grid" x1="0" y1="704" x2="1480" y2="704"/>
    <line class="grid" x1="0" y1="764" x2="1480" y2="764"/>
    <line class="grid" x1="0" y1="824" x2="1480" y2="824"/>
  </g>

  <text class="title" x="52" y="56">Complete Load Balancer Design</text>
  <text class="subtitle" x="52" y="84">One map: user requests stay on the short path, while config, health, and metrics keep that path correct.</text>
  <text class="small muted" x="292" y="120">private infrastructure</text>

  <rect class="dns" x="56" y="135" width="225" height="84"/>
  <text class="label pink" x="102" y="171">CoreDNS</text>
  <text class="tiny" x="88" y="197">LB IPs: 10.0.0.1 / .2 / .3</text>

  <g transform="translate(98 325)">
    <circle cx="20" cy="16" r="13" fill="none" stroke="#f8fafc" stroke-width="3"/>
    <path d="M20 29 L20 72 M20 44 L2 58 M20 44 L39 58 M20 72 L5 100 M20 72 L38 100" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
  <g transform="translate(98 505)">
    <circle cx="20" cy="16" r="13" fill="none" stroke="#f8fafc" stroke-width="3"/>
    <path d="M20 29 L20 72 M20 44 L2 58 M20 44 L39 58 M20 72 L5 100 M20 72 L38 100" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
  <text class="label" x="48" y="637">End users</text>
  <text class="small pink" x="48" y="470">lb.payments.example.com</text>

  <rect class="lb" x="430" y="360" width="270" height="122"/>
  <rect class="lb" x="444" y="348" width="270" height="122" opacity="0.85"/>
  <rect class="lb" x="458" y="336" width="270" height="122" opacity="0.75"/>
  <text class="label" x="516" y="400">LB servers</text>
  <text class="tiny" x="506" y="427">local config + healthy backends</text>
  <rect x="508" y="440" width="12" height="12" fill="#171d27" stroke="#fff59d" stroke-width="3"/>

  <rect class="backend" x="930" y="315" width="250" height="120"/>
  <rect class="backend" x="915" y="330" width="250" height="120" opacity="0.9"/>
  <rect class="backend" x="900" y="345" width="250" height="120" opacity="0.82"/>
  <text class="label" x="958" y="394">Backend servers</text>
  <text class="tiny" x="968" y="421">20.0.0.x :8080</text>

  <rect class="orchestrator" x="745" y="520" width="245" height="64"/>
  <text class="label orange" x="797" y="559">Orchestrator</text>
  <text class="tiny" x="811" y="579">health + status</text>

  <rect class="autoscale" x="1210" y="520" width="210" height="64"/>
  <text class="label yellow" x="1236" y="555">Autoscaling</text>
  <text class="tiny" x="1240" y="576">capacity actuator</text>

  <rect class="metrics" x="1210" y="660" width="210" height="78"/>
  <text class="label blue" x="1245" y="696">Prometheus</text>
  <text class="tiny" x="1265" y="721">metrics store</text>

  <path d="M365 595 H585" stroke="#fff59d" stroke-width="4" fill="none"/>
  <path d="M365 629 H585" stroke="#fff59d" stroke-width="4" fill="none"/>
  <ellipse cx="365" cy="612" rx="17" ry="17" fill="#171d27" stroke="#fff59d" stroke-width="4"/>
  <ellipse cx="585" cy="612" rx="17" ry="17" fill="#171d27" stroke="#fff59d" stroke-width="4"/>
  <text class="small yellow" x="412" y="619">Redis Pub/Sub</text>

  <path d="M645 610 C645 588, 737 588, 737 610 V664 C737 686, 645 686, 645 664 Z" fill="#171d27" stroke="#e5edf7" stroke-width="3"/>
  <ellipse cx="691" cy="610" rx="46" ry="16" fill="#171d27" stroke="#e5edf7" stroke-width="3"/>
  <text class="label" x="675" y="645">DB</text>
  <text class="tiny" x="651" y="664">config + status</text>

  <rect class="console" x="555" y="770" width="260" height="62"/>
  <text class="label pink" x="598" y="809">LB Console</text>
  <text class="small" x="650" y="858">APIs</text>

  <g transform="translate(1000 765)">
    <circle cx="20" cy="16" r="12" fill="none" stroke="#ff9fba" stroke-width="3"/>
    <path d="M20 28 L20 68 M20 43 L4 56 M20 43 L36 56 M20 68 L8 92 M20 68 L35 92" stroke="#ff9fba" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
  <text class="label pink" x="1060" y="818">Developer</text>

  <text class="small green" x="332" y="320">1. request path</text>
  <path class="arrowPink" d="M160 219 V405"/>
  <text class="tiny pink" x="178" y="302">DNS returns an LB IP</text>
  <path class="arrowWhite" d="M165 420 C260 430, 335 430, 430 425"/>
  <path class="arrowWhite" d="M165 560 C260 520, 340 492, 430 455"/>
  <path class="arrowWhite" d="M728 395 H900"/>
  <text class="tiny green" x="748" y="380">route request</text>

  <text class="small yellow" x="350" y="562">2. config path</text>
  <path class="arrowYellow" d="M475 595 V482"/>
  <path class="arrowYellow" d="M512 595 V482"/>
  <path class="arrowYellow" d="M550 595 V482"/>
  <text class="tiny yellow" x="455" y="520">config update</text>
  <path class="arrowYellow" d="M645 650 H585"/>
  <text class="tiny yellow" x="592" y="640">CDC event</text>
  <path class="arrowPink" d="M685 770 V686"/>
  <text class="tiny pink" x="700" y="730">write config</text>
  <path class="arrowPink" d="M1000 800 H815"/>
  <text class="tiny pink" x="890" y="786">change</text>

  <text class="small orange" x="746" y="506">3. health path</text>
  <path class="arrowOrange" d="M865 520 V470 H900"/>
  <text class="tiny orange" x="878" y="486">health checks</text>
  <path class="arrowOrange" d="M780 584 V628 H737"/>
  <text class="tiny orange" x="785" y="617">status write</text>

  <text class="small blue" x="1210" y="640">4. metrics + scaling</text>
  <path class="arrowBlue" d="M1210 705 H1180 V405 H1150"/>
  <text class="tiny blue" x="1188" y="466">scrape LB + backend</text>
  <text class="tiny blue" x="1188" y="484">/metrics exporters</text>
  <path class="arrowBlue" d="M1210 700 H1035 V584 H990"/>
  <text class="tiny blue" x="1024" y="642">query metrics</text>
  <path class="arrowYellow" d="M990 552 H1210"/>
  <text class="tiny yellow" x="1032" y="540">scale decision</text>
  <path class="arrowYellow" d="M1315 520 V465"/>
  <text class="tiny yellow" x="1327" y="496">add/remove nodes</text>

  <rect class="note" x="50" y="840" width="1320" height="34"/>
  <text class="tiny green" x="72" y="862">white = user request</text>
  <text class="tiny yellow" x="235" y="862">yellow = config/PubSub/CDC/autoscaling</text>
  <text class="tiny pink" x="540" y="862">pink = DNS/admin</text>
  <text class="tiny orange" x="705" y="862">orange = health/orchestrator</text>
  <text class="tiny blue" x="940" y="862">blue = metrics</text>
</svg>
