<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Scaling load balancer servers with DNS</title>
  <desc id="desc">DNS resolves one domain name to multiple load balancer IPs. Each load balancer routes to backend servers, while monitoring removes unhealthy load balancer IPs from DNS.</desc>
  <defs>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1.3,1.3 L7,4 L1.3,6.7 Z" fill="#6ee7a8"/>
    </marker>
    <marker id="arrowPink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1.3,1.3 L7,4 L1.3,6.7 Z" fill="#ff9fba"/>
    </marker>
    <marker id="arrowYellow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1.3,1.3 L7,4 L1.3,6.7 Z" fill="#fff59d"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1.3,1.3 L7,4 L1.3,6.7 Z" fill="#a9b4ff"/>
    </marker>
    <style>
      .bg { fill: #0d1217; }
      .lane { fill: #121821; stroke: #293241; stroke-width: 2; }
      .box { fill: #18202b; stroke: #e5edf7; stroke-width: 3; rx: 8; }
      .dns { fill: #231923; stroke: #ff9fba; stroke-width: 4; rx: 8; }
      .lb { fill: #1a2230; stroke: #a9b4ff; stroke-width: 3; rx: 8; }
      .backend { fill: #14221b; stroke: #6ee7a8; stroke-width: 3; rx: 8; }
      .control { fill: #221f16; stroke: #fff59d; stroke-width: 3; rx: 8; }
      .metrics { fill: #171b2a; stroke: #a9b4ff; stroke-width: 3; rx: 8; }
      .muted { fill: #0f141b; stroke: #64748b; stroke-width: 2; rx: 8; }
      .title { font: 700 36px Arial, sans-serif; fill: #fff59d; }
      .subtitle { font: 500 18px Arial, sans-serif; fill: #dbe4ee; }
      .section { font: 700 22px Arial, sans-serif; fill: #fff59d; }
      .label { font: 700 19px Arial, sans-serif; fill: #f8fafc; }
      .small { font: 500 16px Arial, sans-serif; fill: #dbe4ee; }
      .tiny { font: 600 14px Arial, sans-serif; fill: #dbe4ee; }
      .green { fill: #6ee7a8; }
      .pink { fill: #ff9fba; }
      .yellow { fill: #fff59d; }
      .blue { fill: #a9b4ff; }
      .arrowGreen { stroke: #6ee7a8; stroke-width: 3; fill: none; marker-end: url(#arrowGreen); }
      .arrowPink { stroke: #ff9fba; stroke-width: 3; fill: none; marker-end: url(#arrowPink); }
      .arrowYellow { stroke: #fff59d; stroke-width: 3; fill: none; marker-end: url(#arrowYellow); }
      .arrowBlue { stroke: #a9b4ff; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="800"/>

  <text class="title" x="60" y="58">Scaling the Load Balancer Layer</text>
  <text class="subtitle" x="60" y="88">DNS gives clients one domain while spreading them across many LB servers.</text>

  <rect class="lane" x="44" y="120" width="1192" height="430" rx="14"/>
  <text class="section" x="70" y="154">Request path</text>
  <text class="small" x="70" y="182">DNS balances across LB servers; each LB balances across backend servers.</text>

  <g transform="translate(82 272)">
    <circle cx="24" cy="18" r="14" fill="none" stroke="#f8fafc" stroke-width="3"/>
    <path d="M24 32 L24 76 M24 47 L4 61 M24 47 L44 61 M24 76 L8 106 M24 76 L42 106" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" fill="none"/>
    <text class="label" x="-6" y="138">Client</text>
  </g>

  <rect class="dns" x="245" y="216" width="280" height="140"/>
  <text class="label pink" x="304" y="252">CoreDNS</text>
  <text class="small" x="276" y="282">lb.payments.example.com</text>
  <text class="tiny" x="292" y="312">10.0.0.1, 10.0.0.2</text>
  <text class="tiny" x="340" y="334">10.0.0.3</text>

  <path class="arrowPink" d="M160 300 H245"/>
  <text class="tiny pink" x="172" y="282">resolve name</text>

  <path class="arrowPink" d="M245 342 H162"/>
  <text class="tiny pink" x="170" y="364">return IP</text>

  <rect class="lb" x="640" y="160" width="190" height="70"/>
  <text class="label blue" x="670" y="197">LB server 1</text>
  <text class="tiny" x="682" y="217">10.0.0.1</text>

  <rect class="lb" x="640" y="285" width="190" height="70"/>
  <text class="label blue" x="670" y="322">LB server 2</text>
  <text class="tiny" x="682" y="342">10.0.0.2</text>

  <rect class="lb" x="640" y="410" width="190" height="70"/>
  <text class="label blue" x="670" y="447">LB server 3</text>
  <text class="tiny" x="682" y="467">10.0.0.3</text>

  <path class="arrowBlue" d="M525 286 C575 210, 590 195, 640 195"/>
  <path class="arrowBlue" d="M525 286 H640"/>
  <path class="arrowBlue" d="M525 286 C575 390, 590 445, 640 445"/>
  <text class="tiny blue" x="548" y="266">DNS response selects an LB IP</text>

  <rect class="backend" x="1030" y="197" width="160" height="52" opacity="0.74"/>
  <rect class="backend" x="1010" y="176" width="160" height="52" opacity="0.88"/>
  <rect class="backend" x="990" y="155" width="160" height="52"/>
  <text class="label green" x="1022" y="188">Auth 1</text>

  <rect class="backend" x="1030" y="342" width="160" height="52" opacity="0.74"/>
  <rect class="backend" x="1010" y="321" width="160" height="52" opacity="0.88"/>
  <rect class="backend" x="990" y="300" width="160" height="52"/>
  <text class="label green" x="1022" y="333">Auth 2</text>

  <rect class="backend" x="1030" y="487" width="160" height="52" opacity="0.74"/>
  <rect class="backend" x="1010" y="466" width="160" height="52" opacity="0.88"/>
  <rect class="backend" x="990" y="445" width="160" height="52"/>
  <text class="label green" x="1022" y="478">Auth 3</text>

  <path class="arrowGreen" d="M830 195 H990"/>
  <path class="arrowGreen" d="M830 320 H990"/>
  <path class="arrowGreen" d="M830 445 H990"/>
  <text class="tiny green" x="875" y="143">backend pools</text>

  <rect class="lane" x="44" y="586" width="1192" height="160" rx="14"/>
  <text class="section" x="70" y="620">Control path</text>
  <text class="small" x="70" y="648">Prometheus and the orchestrator remove unhealthy LB IPs from DNS config.</text>

  <rect class="metrics" x="120" y="675" width="210" height="54"/>
  <text class="label blue" x="150" y="710">Prometheus</text>

  <rect class="control" x="455" y="665" width="230" height="74"/>
  <text class="label yellow" x="502" y="697">Orchestrator</text>
  <text class="small" x="493" y="721">detects bad LB</text>

  <rect class="dns" x="820" y="665" width="260" height="74"/>
  <text class="label pink" x="858" y="697">DNS config</text>
  <text class="small" x="858" y="721">remove 10.0.0.2</text>

  <path class="arrowBlue" d="M330 702 H455"/>
  <text class="tiny blue" x="350" y="685">LB metrics</text>
  <path class="arrowYellow" d="M685 702 H820"/>
  <text class="tiny yellow" x="707" y="685">update records</text>

  <rect class="muted" x="80" y="760" width="1080" height="28"/>
  <text class="tiny pink" x="104" y="779">pink = DNS resolution and DNS config</text>
  <text class="tiny blue" x="400" y="779">blue = LB fleet</text>
  <text class="tiny green" x="570" y="779">green = backend routing</text>
  <text class="tiny yellow" x="820" y="779">yellow = orchestrator control</text>
</svg>
