<svg width="1180" height="640" viewBox="0 0 1180 640" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="m-g" markerWidth="12" markerHeight="12" refX="8.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4.5 L0,9 Z" fill="#8aff8a"/></marker>
    <marker id="m-p" markerWidth="12" markerHeight="12" refX="8.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4.5 L0,9 Z" fill="#ff8bd2"/></marker>
    <marker id="m-c" markerWidth="12" markerHeight="12" refX="8.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4.5 L0,9 Z" fill="#cbd5e1"/></marker>
  </defs>
  <rect x="0" y="0" width="1180" height="640" fill="#111317"/>

  <text x="590" y="44" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="29" font-weight="bold">Two Paths, Two Costs: Reads Fly, Writes Are Metered</text>
  <text x="590" y="74" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="16">the whole operational game is to treat them completely differently &#8212; same crowd, two price tags</text>

  <!-- ===================== READ LANE ===================== -->
  <rect x="34" y="100" width="1112" height="176" rx="14" fill="#0e1712" stroke="#2f5a3c" stroke-width="1.8"/>
  <text x="58" y="130" fill="#8aff8a" font-family="sans-serif" font-size="17" font-weight="bold">READ PATH</text>
  <text x="58" y="150" fill="#7fae8c" font-family="sans-serif" font-size="12">cheap &#183; scales out</text>

  <!-- crowd -->
  <rect x="58" y="170" width="132" height="78" rx="10" fill="#16191e" stroke="#8aff8a" stroke-width="2"/>
  <text x="124" y="200" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="bold">The crowd</text>
  <text x="124" y="222" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11.5">~1,000,000</text>
  <text x="124" y="238" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11.5">browsers polling</text>
  <line x1="190" y1="209" x2="234" y2="209" stroke="#8aff8a" stroke-width="2.4" marker-end="url(#m-g)"/>

  <!-- CDN / edge cache -->
  <rect x="238" y="170" width="170" height="78" rx="10" fill="#0f2417" stroke="#8aff8a" stroke-width="2"/>
  <text x="323" y="200" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13.5" font-weight="bold">CDN + edge cache</text>
  <text x="323" y="222" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">static assets,</text>
  <text x="323" y="238" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">throttle page</text>
  <line x1="408" y1="209" x2="452" y2="209" stroke="#8aff8a" stroke-width="2.4" marker-end="url(#m-g)"/>

  <!-- LB cache -->
  <rect x="456" y="170" width="160" height="78" rx="10" fill="#0f2417" stroke="#8aff8a" stroke-width="2"/>
  <text x="536" y="200" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13.5" font-weight="bold">LB cache</text>
  <text x="536" y="222" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">absorbs the</text>
  <text x="536" y="238" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">relentless polling</text>
  <line x1="616" y1="209" x2="660" y2="209" stroke="#8aff8a" stroke-width="2.4" marker-end="url(#m-g)"/>

  <!-- read replicas cylinder -->
  <ellipse cx="730" cy="186" rx="56" ry="13" fill="#0f2417" stroke="#8aff8a" stroke-width="2"/>
  <path d="M674,186 v44 a56,13 0 0 0 112,0 v-44" fill="#0f2417" stroke="#8aff8a" stroke-width="2"/>
  <text x="730" y="214" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="12.5" font-weight="bold">read replicas</text>
  <text x="730" y="246" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11">product page, inventory count</text>

  <!-- read takeaway -->
  <rect x="816" y="158" width="312" height="100" rx="10" fill="#16191e" stroke="#2f5a3c" stroke-width="1.6"/>
  <text x="972" y="184" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13.5" font-weight="bold">Reads never touch the primary.</text>
  <text x="972" y="208" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">Served from cache, CDN, and replicas,</text>
  <text x="972" y="226" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">so a million of them are harmless.</text>
  <text x="972" y="248" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="12.5" font-weight="bold">let them fly</text>

  <!-- ===================== WRITE LANE ===================== -->
  <rect x="34" y="296" width="1112" height="196" rx="14" fill="#170f14" stroke="#5a2f45" stroke-width="1.8"/>
  <text x="58" y="326" fill="#ff8bd2" font-family="sans-serif" font-size="17" font-weight="bold">WRITE PATH</text>
  <text x="58" y="346" fill="#c77fa3" font-family="sans-serif" font-size="12">precious &#183; metered</text>

  <!-- throttle gate -->
  <rect x="58" y="366" width="132" height="78" rx="10" fill="#16202e" stroke="#93c5fd" stroke-width="2.2"/>
  <text x="124" y="396" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="13" font-weight="bold">Throttle</text>
  <text x="124" y="418" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">admit only a</text>
  <text x="124" y="434" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">trickle / second</text>
  <line x1="190" y1="405" x2="234" y2="405" stroke="#ff8bd2" stroke-width="2.2" marker-end="url(#m-p)"/>
  <text x="212" y="396" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="10">trickle</text>

  <!-- API server -->
  <rect x="238" y="366" width="160" height="78" rx="10" fill="#16191e" stroke="#cbd5e1" stroke-width="2"/>
  <text x="318" y="396" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13.5" font-weight="bold">API server</text>
  <text x="318" y="418" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11.5">runs the grab,</text>
  <text x="318" y="434" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11.5">then checkout</text>
  <line x1="398" y1="405" x2="442" y2="405" stroke="#ff8bd2" stroke-width="2.4" marker-end="url(#m-p)"/>

  <!-- primary cylinder -->
  <ellipse cx="520" cy="382" rx="64" ry="14" fill="#20200f" stroke="#ffff99" stroke-width="2.2"/>
  <path d="M456,382 v52 a64,14 0 0 0 128,0 v-52" fill="#20200f" stroke="#ffff99" stroke-width="2.2"/>
  <text x="520" y="410" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="13" font-weight="bold">Primary DB</text>
  <text x="520" y="430" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">grab &#8594; checkout &#8594; pay</text>

  <!-- either/or grab store note -->
  <rect x="612" y="356" width="248" height="116" rx="10" fill="#20200f" stroke="#ffff99" stroke-width="2"/>
  <text x="736" y="380" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="13" font-weight="bold">The grab store: pick ONE</text>
  <text x="736" y="404" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="12" font-weight="bold">SQL units table</text>
  <text x="736" y="420" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11">FOR UPDATE SKIP LOCKED</text>
  <text x="736" y="440" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11.5" font-weight="bold">&#8212; or &#8212;</text>
  <text x="736" y="460" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="12" font-weight="bold">Redis seats &#183; SPOP/SREM</text>

  <!-- write takeaway -->
  <rect x="872" y="356" width="256" height="116" rx="10" fill="#16191e" stroke="#5a2f45" stroke-width="1.6"/>
  <text x="1000" y="382" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="13.5" font-weight="bold">Only admitted buyers write.</text>
  <text x="1000" y="406" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">The primary is the one resource you</text>
  <text x="1000" y="424" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">can&#8217;t conjure mid-spike, so the</text>
  <text x="1000" y="442" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">throttle turns a spike into a stream.</text>
  <text x="1000" y="463" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="12.5" font-weight="bold">protect it</text>

  <!-- connector: crowd -> throttle (the million becomes a trickle) -->
  <path d="M124,248 C124,300 124,300 124,362" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#m-c)"/>
  <text x="250" y="292" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">the throttle is the valve: the waiting million (reads) become a trickle of writers</text>

  <!-- ===================== TAKEAWAY ===================== -->
  <rect x="34" y="514" width="1112" height="104" rx="12" fill="#1c1320" stroke="#ff8bd2" stroke-width="2.4"/>
  <text x="590" y="546" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="16" font-weight="bold">One request stream, split by cost: scale reads out at the edge, meter writes down to what the primary can absorb.</text>
  <text x="590" y="574" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14">Reads are cheap and correctness-safe &#8212; cache them everywhere. Writes are precious and the only path to the primary &#8212; let only a trickle through.</text>
  <text x="590" y="598" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">this single split &#8212; cheap-and-many vs precious-and-few &#8212; is the whole operational strategy in one picture</text>
</svg>
