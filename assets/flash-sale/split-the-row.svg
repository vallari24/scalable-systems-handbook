<svg width="1000" height="760" viewBox="0 0 1000 760" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="m-w" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,5 L0,10 Z" fill="#ff8bd2"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="760" fill="#111317"/>

  <text x="500" y="42" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="28" font-weight="bold">The Unlock: Split the One Row into N Rows</text>
  <text x="500" y="70" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="16">Phase 0 &#8212; stock the shelves: one row per physical unit</text>

  <!-- BEFORE -->
  <text x="250" y="108" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="15" font-weight="bold">BEFORE &#183; one hot row</text>
  <rect x="120" y="122" width="260" height="58" rx="6" fill="#20200f" stroke="#ff8a8a" stroke-width="3"/>
  <line x1="230" y1="122" x2="230" y2="180" stroke="#ff8a8a" stroke-width="1.5"/>
  <text x="175" y="144" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">item_id</text>
  <text x="305" y="144" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">quantity</text>
  <text x="175" y="168" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">720</text>
  <text x="305" y="168" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="13" font-weight="bold">10000</text>
  <text x="250" y="200" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="12">everyone fights over this</text>

  <!-- arrow split -->
  <line x1="450" y1="155" x2="560" y2="155" stroke="#ff8bd2" stroke-width="3.5" marker-end="url(#m-w)"/>
  <text x="505" y="142" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="13" font-weight="bold">split into</text>
  <text x="505" y="176" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="13" font-weight="bold">N rows</text>

  <!-- Phase 0 store owner panel -->
  <rect x="620" y="104" width="340" height="118" rx="10" fill="#16191e" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="790" y="128" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="14" font-weight="bold">Phase 0: prepare the stock</text>
  <g transform="translate(650,150)"><circle cx="0" cy="0" r="7" fill="#cbd5e1"/><line x1="0" y1="7" x2="0" y2="28" stroke="#cbd5e1" stroke-width="2.5"/><line x1="0" y1="14" x2="14" y2="10" stroke="#cbd5e1" stroke-width="2.5"/><line x1="0" y1="28" x2="-8" y2="44" stroke="#cbd5e1" stroke-width="2.5"/><line x1="0" y1="28" x2="8" y2="44" stroke="#cbd5e1" stroke-width="2.5"/></g>
  <g fill="#ffff99"><rect x="690" y="158" width="12" height="12" rx="2"/><rect x="708" y="158" width="12" height="12" rx="2"/><rect x="726" y="158" width="12" height="12" rx="2"/><rect x="744" y="158" width="12" height="12" rx="2"/><rect x="690" y="176" width="12" height="12" rx="2"/><rect x="708" y="176" width="12" height="12" rx="2"/><rect x="726" y="176" width="12" height="12" rx="2"/><rect x="744" y="176" width="12" height="12" rx="2"/></g>
  <text x="855" y="170" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">before the sale opens,</text>
  <text x="855" y="188" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">insert 10,000 unit rows</text>
  <text x="790" y="212" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11.5">each row = one physical phone</text>

  <!-- AFTER: units table -->
  <text x="500" y="256" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="16" font-weight="bold">AFTER &#183; units (one row per unit)</text>

  <g font-family="sans-serif">
    <!-- header -->
    <rect x="180" y="270" width="640" height="34" fill="#20200f" stroke="#ffff99" stroke-width="2"/>
    <text x="230" y="292" text-anchor="middle" fill="#9aa6b2" font-size="12.5">id</text>
    <text x="330" y="292" text-anchor="middle" fill="#9aa6b2" font-size="12.5">item_id</text>
    <text x="470" y="292" text-anchor="middle" fill="#9aa6b2" font-size="12.5">picked_at</text>
    <text x="610" y="292" text-anchor="middle" fill="#9aa6b2" font-size="12.5">picked_by</text>
    <text x="750" y="292" text-anchor="middle" fill="#9aa6b2" font-size="12.5">purchased_by</text>
    <!-- rows -->
    <rect x="180" y="304" width="640" height="30" fill="#16191e" stroke="#3a3f47" stroke-width="1"/>
    <text x="230" y="324" text-anchor="middle" fill="#cbd5e1" font-size="12.5">1</text><text x="330" y="324" text-anchor="middle" fill="#cbd5e1" font-size="12.5">720</text><text x="470" y="324" text-anchor="middle" fill="#8aff8a" font-size="12.5">NULL</text><text x="610" y="324" text-anchor="middle" fill="#8aff8a" font-size="12.5">NULL</text><text x="750" y="324" text-anchor="middle" fill="#8aff8a" font-size="12.5">NULL</text>
    <rect x="180" y="334" width="640" height="30" fill="#16191e" stroke="#3a3f47" stroke-width="1"/>
    <text x="230" y="354" text-anchor="middle" fill="#cbd5e1" font-size="12.5">2</text><text x="330" y="354" text-anchor="middle" fill="#cbd5e1" font-size="12.5">720</text><text x="470" y="354" text-anchor="middle" fill="#8aff8a" font-size="12.5">NULL</text><text x="610" y="354" text-anchor="middle" fill="#8aff8a" font-size="12.5">NULL</text><text x="750" y="354" text-anchor="middle" fill="#8aff8a" font-size="12.5">NULL</text>
    <rect x="180" y="364" width="640" height="30" fill="#16191e" stroke="#3a3f47" stroke-width="1"/>
    <text x="230" y="384" text-anchor="middle" fill="#cbd5e1" font-size="12.5">3</text><text x="330" y="384" text-anchor="middle" fill="#cbd5e1" font-size="12.5">720</text><text x="470" y="384" text-anchor="middle" fill="#8aff8a" font-size="12.5">NULL</text><text x="610" y="384" text-anchor="middle" fill="#8aff8a" font-size="12.5">NULL</text><text x="750" y="384" text-anchor="middle" fill="#8aff8a" font-size="12.5">NULL</text>
    <rect x="180" y="394" width="640" height="26" fill="#16191e" stroke="#3a3f47" stroke-width="1"/>
    <text x="500" y="412" text-anchor="middle" fill="#9aa6b2" font-size="13">&#8942;</text>
    <rect x="180" y="420" width="640" height="30" fill="#16191e" stroke="#3a3f47" stroke-width="1"/>
    <text x="230" y="440" text-anchor="middle" fill="#cbd5e1" font-size="12.5">10000</text><text x="330" y="440" text-anchor="middle" fill="#cbd5e1" font-size="12.5">720</text><text x="470" y="440" text-anchor="middle" fill="#8aff8a" font-size="12.5">NULL</text><text x="610" y="440" text-anchor="middle" fill="#8aff8a" font-size="12.5">NULL</text><text x="750" y="440" text-anchor="middle" fill="#8aff8a" font-size="12.5">NULL</text>
  </g>
  <text x="500" y="474" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">10,000 Mi8 phones (item 720) &#8594; 10,000 rows. A unit is free when picked_at IS NULL.</text>

  <!-- two consequences -->
  <rect x="80" y="500" width="400" height="96" rx="10" fill="#1c1320" stroke="#ff8bd2" stroke-width="2"/>
  <text x="280" y="526" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="14" font-weight="bold">Contention spreads</text>
  <text x="280" y="552" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">10,000 buyers grab 10,000 different</text>
  <text x="280" y="572" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">rows at once, zero conflict between them</text>

  <rect x="520" y="500" width="400" height="96" rx="10" fill="#20200f" stroke="#ffff99" stroke-width="2"/>
  <text x="720" y="526" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="14" font-weight="bold">&#8220;Exactly N&#8221; is free</text>
  <text x="720" y="552" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">there are exactly N rows &#8212; you cannot</text>
  <text x="720" y="572" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">claim the (N+1)th, it doesn&#8217;t exist</text>

  <!-- new problem banner -->
  <rect x="60" y="616" width="880" height="116" rx="12" fill="#16202e" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="500" y="646" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="15" font-weight="bold">A decrement-the-counter problem became a claim-a-free-row problem.</text>
  <text x="500" y="676" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14">But a new race hides here: with 10,000 free rows and a million buyers,</text>
  <text x="500" y="700" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14">two buyers can still reach for the same free row at the same time.</text>
  <text x="500" y="722" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">That last bit of safety is the crux &#8594; FOR UPDATE SKIP LOCKED.</text>
</svg>
