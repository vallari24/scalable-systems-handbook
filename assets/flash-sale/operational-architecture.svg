<svg width="1180" height="720" viewBox="0 0 1180 720" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="m-w" markerWidth="12" markerHeight="12" refX="8.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4.5 L0,9 Z" fill="#cbd5e1"/></marker>
    <marker id="m-p" markerWidth="12" markerHeight="12" refX="8.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4.5 L0,9 Z" fill="#ff8bd2"/></marker>
    <marker id="m-g" markerWidth="12" markerHeight="12" refX="8.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4.5 L0,9 Z" fill="#8aff8a"/></marker>
    <marker id="m-b" markerWidth="12" markerHeight="12" refX="8.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4.5 L0,9 Z" fill="#93c5fd"/></marker>
  </defs>
  <rect x="0" y="0" width="1180" height="720" fill="#111317"/>

  <text x="590" y="46" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="29" font-weight="bold">The Operational Side: Meter the Stampede, Protect the DB</text>
  <text x="590" y="76" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">keep the crowd off the one thing that can&#8217;t scale instantly &#8212; the database</text>

  <!-- crowd -->
  <g stroke="#cbd5e1" stroke-width="1.8" fill="#cbd5e1">
    <g transform="translate(46,150)"><circle cx="0" cy="0" r="5" stroke="none"/><line x1="0" y1="5" x2="0" y2="18"/></g>
    <g transform="translate(76,150)"><circle cx="0" cy="0" r="5" stroke="none"/><line x1="0" y1="5" x2="0" y2="18"/></g>
    <g transform="translate(46,178)"><circle cx="0" cy="0" r="5" stroke="none"/><line x1="0" y1="5" x2="0" y2="18"/></g>
    <g transform="translate(76,178)"><circle cx="0" cy="0" r="5" stroke="none"/><line x1="0" y1="5" x2="0" y2="18"/></g>
    <g transform="translate(46,206)"><circle cx="0" cy="0" r="5" stroke="none"/><line x1="0" y1="5" x2="0" y2="18"/></g>
    <g transform="translate(76,206)"><circle cx="0" cy="0" r="5" stroke="none"/><line x1="0" y1="5" x2="0" y2="18"/></g>
  </g>
  <text x="61" y="244" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">the crowd</text>

  <!-- Edge -->
  <line x1="100" y1="180" x2="142" y2="180" stroke="#cbd5e1" stroke-width="2.4" marker-end="url(#m-w)"/>
  <rect x="146" y="128" width="180" height="104" rx="10" fill="#16202e" stroke="#93c5fd" stroke-width="2.4"/>
  <text x="236" y="160" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="15" font-weight="bold">Edge</text>
  <text x="236" y="182" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">Nginx + Lua</text>
  <text x="236" y="204" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">heat shield + throttle</text>

  <!-- LB -->
  <line x1="326" y1="180" x2="368" y2="180" stroke="#cbd5e1" stroke-width="2.4" marker-end="url(#m-w)"/>
  <rect x="372" y="128" width="170" height="104" rx="10" fill="#16202e" stroke="#93c5fd" stroke-width="2.4"/>
  <text x="457" y="160" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="15" font-weight="bold">Load Balancer</text>
  <text x="457" y="182" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">warm &#183; pre-cached</text>
  <text x="457" y="204" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">absorbs the polling</text>

  <!-- API fleet -->
  <line x1="542" y1="180" x2="584" y2="180" stroke="#ff8bd2" stroke-width="2.6" marker-end="url(#m-p)"/>
  <text x="563" y="170" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="10.5">trickle</text>
  <rect x="600" y="120" width="150" height="104" rx="10" fill="#16191e" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="592" y="128" width="150" height="104" rx="10" fill="#16191e" stroke="#cbd5e1" stroke-width="2"/>
  <text x="667" y="164" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="14" font-weight="bold">API servers</text>
  <text x="667" y="186" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">stateless</text>
  <text x="667" y="206" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="12" font-weight="bold">scale out freely</text>

  <!-- Pod -->
  <line x1="742" y1="180" x2="784" y2="180" stroke="#ff8bd2" stroke-width="2.6" marker-end="url(#m-p)"/>
  <text x="763" y="170" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="10.5">writes</text>
  <rect x="790" y="110" width="350" height="138" rx="12" fill="#1a1a10" stroke="#ffff99" stroke-width="2.4"/>
  <text x="965" y="134" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="13.5" font-weight="bold">Pod (isolated stack)</text>
  <!-- mysql cylinder -->
  <ellipse cx="875" cy="160" rx="52" ry="13" fill="#20200f" stroke="#ffff99" stroke-width="2"/>
  <path d="M823,160 v44 a52,13 0 0 0 104,0 v-44" fill="#20200f" stroke="#ffff99" stroke-width="2"/>
  <text x="875" y="190" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="12.5" font-weight="bold">MySQL</text>
  <text x="875" y="226" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11">units + ledger</text>
  <!-- redis -->
  <rect x="985" y="150" width="130" height="58" rx="8" fill="#16202e" stroke="#93c5fd" stroke-width="2"/>
  <text x="1050" y="176" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="12.5" font-weight="bold">Redis</text>
  <text x="1050" y="196" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11">hot reads cache</text>

  <!-- bounce back read path -->
  <path d="M372,212 C320,270 210,270 240,236" fill="none" stroke="#8aff8a" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#m-g)"/>
  <text x="300" y="286" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="12" font-weight="bold">most buyers wait here on a cached throttle page</text>
  <text x="300" y="304" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">cheap reads bounce at the edge &#8212; never reach the app or DB</text>

  <!-- write path label -->
  <text x="840" y="286" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="12" font-weight="bold">only admitted buyers do writes</text>
  <text x="840" y="304" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">grab / checkout / payment &#8212; the precious, metered path</text>

  <!-- divider -->
  <line x1="40" y1="332" x2="1140" y2="332" stroke="#3a3f47" stroke-width="1.4"/>
  <text x="590" y="360" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="16" font-weight="bold">Four knobs you turn before and during the sale</text>

  <!-- lever 1 -->
  <rect x="40" y="378" width="265" height="150" rx="12" fill="#20200f" stroke="#ffff99" stroke-width="2.2"/>
  <text x="172" y="406" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="15" font-weight="bold">1 &#183; Scale up the DB</text>
  <text x="172" y="436" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">bigger primary + more read</text>
  <text x="172" y="456" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">replicas, set up AHEAD of time</text>
  <text x="172" y="488" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11.5">you can&#8217;t add DB capacity</text>
  <text x="172" y="506" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11.5">instantly mid-spike</text>

  <!-- lever 2 -->
  <rect x="320" y="378" width="265" height="150" rx="12" fill="#16202e" stroke="#93c5fd" stroke-width="2.2"/>
  <text x="452" y="406" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="15" font-weight="bold">2 &#183; Warm LB &amp; caches</text>
  <text x="452" y="436" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">pre-warm so the first burst</text>
  <text x="452" y="456" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">doesn&#8217;t hit cold caches</text>
  <text x="452" y="488" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11.5">cache the throttle page so the</text>
  <text x="452" y="506" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11.5">LB soaks up the polling</text>

  <!-- lever 3 -->
  <rect x="600" y="378" width="265" height="150" rx="12" fill="#0f2417" stroke="#8aff8a" stroke-width="2.2"/>
  <text x="732" y="406" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="15" font-weight="bold">3 &#183; Add API servers</text>
  <text x="732" y="436" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">stateless, so scale them</text>
  <text x="732" y="456" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">horizontally to soak up volume</text>
  <text x="732" y="488" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11.5">they&#8217;re cheap to add;</text>
  <text x="732" y="506" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11.5">the database is not</text>

  <!-- lever 4 -->
  <rect x="880" y="378" width="260" height="150" rx="12" fill="#2a1622" stroke="#ff8bd2" stroke-width="2.4"/>
  <text x="1010" y="406" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="15" font-weight="bold">4 &#183; The kill switch</text>
  <text x="1010" y="436" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">feature flag that turns the</text>
  <text x="1010" y="456" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">buy button OFF in the UI</text>
  <text x="1010" y="488" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="11.5" font-weight="bold">no button = no writes</text>
  <text x="1010" y="506" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11.5">flip it the instant it sells out</text>

  <!-- takeaway -->
  <rect x="40" y="556" width="1100" height="120" rx="12" fill="#16191e" stroke="#3a3f47" stroke-width="1.6"/>
  <text x="590" y="588" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">The whole operational job: turn a one-second spike into a steady stream the database can absorb.</text>
  <text x="590" y="618" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">Cheap reads (product page, inventory count, throttle page) stay near the edge and caches.</text>
  <text x="590" y="640" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">Precious writes (grab, checkout, payment) are metered through the throttle so the primary never sees a stampede.</text>
  <text x="590" y="664" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">scale the cheap things out; protect the one thing you can&#8217;t scale fast &#8212; and keep a switch to pull when it&#8217;s over</text>
</svg>
