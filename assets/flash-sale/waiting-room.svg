<svg width="1000" height="640" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="m-b" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#93c5fd"/></marker>
    <marker id="m-w" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#cbd5e1"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="640" fill="#111317"/>

  <text x="500" y="42" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="28" font-weight="bold">Protect the Database: The Virtual Waiting Room</text>
  <text x="500" y="70" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="16">the cheapest contention is the kind that never reaches the database</text>

  <!-- crowd -->
  <g stroke="#cbd5e1" stroke-width="1.6" fill="#cbd5e1">
    <g transform="translate(48,130)"><circle cx="0" cy="0" r="4" stroke="none"/><line x1="0" y1="4" x2="0" y2="15"/></g>
    <g transform="translate(78,130)"><circle cx="0" cy="0" r="4" stroke="none"/><line x1="0" y1="4" x2="0" y2="15"/></g>
    <g transform="translate(108,130)"><circle cx="0" cy="0" r="4" stroke="none"/><line x1="0" y1="4" x2="0" y2="15"/></g>
    <g transform="translate(48,160)"><circle cx="0" cy="0" r="4" stroke="none"/><line x1="0" y1="4" x2="0" y2="15"/></g>
    <g transform="translate(78,160)"><circle cx="0" cy="0" r="4" stroke="none"/><line x1="0" y1="4" x2="0" y2="15"/></g>
    <g transform="translate(108,160)"><circle cx="0" cy="0" r="4" stroke="none"/><line x1="0" y1="4" x2="0" y2="15"/></g>
    <g transform="translate(48,190)"><circle cx="0" cy="0" r="4" stroke="none"/><line x1="0" y1="4" x2="0" y2="15"/></g>
    <g transform="translate(78,190)"><circle cx="0" cy="0" r="4" stroke="none"/><line x1="0" y1="4" x2="0" y2="15"/></g>
    <g transform="translate(108,190)"><circle cx="0" cy="0" r="4" stroke="none"/><line x1="0" y1="4" x2="0" y2="15"/></g>
    <g transform="translate(48,220)"><circle cx="0" cy="0" r="4" stroke="none"/><line x1="0" y1="4" x2="0" y2="15"/></g>
    <g transform="translate(78,220)"><circle cx="0" cy="0" r="4" stroke="none"/><line x1="0" y1="4" x2="0" y2="15"/></g>
    <g transform="translate(108,220)"><circle cx="0" cy="0" r="4" stroke="none"/><line x1="0" y1="4" x2="0" y2="15"/></g>
  </g>
  <text x="80" y="262" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="bold">a million,</text>
  <text x="80" y="280" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="bold">at 12:00:00</text>

  <line x1="135" y1="175" x2="195" y2="175" stroke="#cbd5e1" stroke-width="2.4" marker-end="url(#m-w)"/>

  <!-- waiting room gate -->
  <rect x="200" y="110" width="240" height="200" rx="12" fill="#16202e" stroke="#93c5fd" stroke-width="2.6"/>
  <text x="320" y="138" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="15" font-weight="bold">Waiting Room</text>
  <text x="320" y="158" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11.5">admission gate</text>
  <!-- queue inside -->
  <rect x="222" y="172" width="196" height="40" rx="6" fill="#0f1620" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="320" y="190" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">you are #84,219 in line</text>
  <text x="320" y="206" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="10.5">held in a queue, shown your position</text>
  <rect x="222" y="222" width="196" height="40" rx="6" fill="#0f1620" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="320" y="240" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="11.5" font-weight="bold">token bucket</text>
  <text x="320" y="256" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="10.5">admit N buyers / second</text>
  <text x="320" y="288" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">most wait here &#8212; a few trickle through</text>

  <!-- thin stream out -->
  <line x1="442" y1="175" x2="540" y2="175" stroke="#93c5fd" stroke-width="2.4" marker-end="url(#m-b)"/>
  <text x="491" y="164" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="11">trickle</text>

  <!-- API servers -->
  <rect x="544" y="146" width="150" height="58" rx="8" fill="#16191e" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="552" y="138" width="150" height="58" rx="8" fill="#16191e" stroke="#cbd5e1" stroke-width="2"/>
  <text x="627" y="172" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">API servers</text>
  <text x="627" y="190" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="10.5">run the grab</text>

  <line x1="704" y1="167" x2="780" y2="167" stroke="#ff8bd2" stroke-width="2.4" marker-end="url(#m-b)"/>

  <!-- units DB -->
  <ellipse cx="860" cy="138" rx="60" ry="14" fill="#20200f" stroke="#ffff99" stroke-width="2"/>
  <path d="M800,138 v44 a60,14 0 0 0 120,0 v-44" fill="#20200f" stroke="#ffff99" stroke-width="2"/>
  <text x="860" y="170" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="13" font-weight="bold">units DB</text>
  <text x="860" y="208" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11">SKIP LOCKED grab</text>

  <!-- annotations -->
  <rect x="60" y="330" width="880" height="80" rx="10" fill="#20200f" stroke="#ffff99" stroke-width="2"/>
  <text x="500" y="358" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="14" font-weight="bold">Match admission to inventory</text>
  <text x="500" y="384" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13.5">No point admitting a million people to claim 10,000 phones. Once enough buyers to plausibly sell out</text>
  <text x="500" y="402" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">are in, everyone else is shown &#8220;sold out&#8221; at the gate &#8212; without ever touching the database.</text>

  <rect x="60" y="424" width="880" height="80" rx="10" fill="#16202e" stroke="#93c5fd" stroke-width="2"/>
  <text x="500" y="452" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="14" font-weight="bold">Protect at the edge</text>
  <text x="500" y="478" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13.5">The UI doesn&#8217;t render the buy button &#8212; or the sale &#8212; until the buyer is admitted, so bots and</text>
  <text x="500" y="496" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">early-refreshers can&#8217;t pound the backend. Protection starts in the client and the gate, before the DB.</text>

  <!-- takeaway -->
  <rect x="60" y="520" width="880" height="92" rx="12" fill="#1c1320" stroke="#ff8bd2" stroke-width="2.5"/>
  <text x="500" y="550" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="15" font-weight="bold">Every locking trick makes the grab correct and parallel; admission control keeps the volume survivable.</text>
  <text x="500" y="578" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14">Shape a one-second spike into a manageable stream, and keep the crowd out of the database entirely.</text>
  <text x="500" y="600" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">this is the operational side &#8212; expanded in part two</text>
</svg>
