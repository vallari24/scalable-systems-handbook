<svg width="1000" height="680" viewBox="0 0 1000 680" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="m-b" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#93c5fd"/></marker>
    <marker id="m-g" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aff8a"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="680" fill="#111317"/>

  <text x="500" y="42" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="28" font-weight="bold">What If No Payment? The Cron Reaper</text>
  <text x="500" y="70" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="16">a buyer grabs, then vanishes &#8212; no webhook ever comes. The reaper hands the unit back.</text>

  <!-- reaper -->
  <circle cx="150" cy="180" r="42" fill="#16202e" stroke="#93c5fd" stroke-width="2.5"/>
  <line x1="150" y1="180" x2="150" y2="154" stroke="#93c5fd" stroke-width="2.5"/>
  <line x1="150" y1="180" x2="170" y2="190" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="150" y="248" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="14" font-weight="bold">Reaper</text>
  <text x="150" y="268" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">cron, runs every minute</text>

  <line x1="200" y1="180" x2="280" y2="180" stroke="#93c5fd" stroke-width="2.4" marker-end="url(#m-b)"/>
  <text x="240" y="168" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="11">scans</text>

  <!-- units table with abandoned row -->
  <text x="540" y="120" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="13" font-weight="bold">units</text>
  <g font-family="sans-serif">
    <rect x="300" y="132" width="500" height="30" fill="#20200f" stroke="#ffff99" stroke-width="1.8"/>
    <text x="340" y="152" text-anchor="middle" fill="#9aa6b2" font-size="12">id</text><text x="470" y="152" text-anchor="middle" fill="#9aa6b2" font-size="12">picked_at</text><text x="600" y="152" text-anchor="middle" fill="#9aa6b2" font-size="12">picked_by</text><text x="740" y="152" text-anchor="middle" fill="#9aa6b2" font-size="12">purchased_by</text>
    <rect x="300" y="162" width="500" height="36" fill="#2a1414" stroke="#ff8a8a" stroke-width="2"/>
    <text x="340" y="185" text-anchor="middle" fill="#cbd5e1" font-size="12.5">7</text><text x="470" y="185" text-anchor="middle" fill="#ff8a8a" font-size="12">10:01 (old)</text><text x="600" y="185" text-anchor="middle" fill="#cbd5e1" font-size="12.5">5567</text><text x="740" y="185" text-anchor="middle" fill="#ff8a8a" font-size="12">NULL</text>
  </g>
  <text x="540" y="220" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="12.5">picked &gt; 12 min ago, never purchased &#8594; abandoned</text>

  <!-- the SQL -->
  <rect x="300" y="238" width="500" height="92" rx="8" fill="#16191e" stroke="#93c5fd" stroke-width="1.8"/>
  <text x="316" y="262" fill="#cbd5e1" font-family="monospace" font-size="12.5">UPDATE units SET picked_at = NULL, picked_by = NULL</text>
  <text x="316" y="286" fill="#93c5fd" font-family="monospace" font-size="12.5">WHERE picked_at &lt; NOW() - INTERVAL '12 minutes'</text>
  <text x="316" y="310" fill="#ffff99" font-family="monospace" font-size="12.5">  AND purchased_by IS NULL;   -- never reclaim a paid unit</text>

  <!-- released row -->
  <line x1="540" y1="330" x2="540" y2="360" stroke="#8aff8a" stroke-width="2.2" marker-end="url(#m-g)"/>
  <g font-family="sans-serif">
    <rect x="300" y="366" width="500" height="34" fill="#0f2417" stroke="#8aff8a" stroke-width="2"/>
    <text x="340" y="388" text-anchor="middle" fill="#cbd5e1" font-size="12.5">7</text><text x="470" y="388" text-anchor="middle" fill="#8aff8a" font-size="12">NULL</text><text x="600" y="388" text-anchor="middle" fill="#8aff8a" font-size="12">NULL</text><text x="740" y="388" text-anchor="middle" fill="#8aff8a" font-size="12">NULL</text>
  </g>
  <text x="540" y="420" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="12.5" font-weight="bold">released, available again &#8212; next SKIP LOCKED grab takes it</text>

  <!-- tradeoff scale -->
  <text x="500" y="462" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="15" font-weight="bold">How long is the timeout? A business dial with disappointment on both ends.</text>

  <rect x="80" y="478" width="400" height="120" rx="10" fill="#2a1414" stroke="#ff8a8a" stroke-width="2"/>
  <text x="280" y="504" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="14" font-weight="bold">Too SHORT</text>
  <text x="280" y="530" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">you yank carts away from real buyers</text>
  <text x="280" y="550" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">who are still mid-payment</text>
  <text x="280" y="578" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="12.5" font-weight="bold">disappoint genuine customers</text>

  <rect x="520" y="478" width="400" height="120" rx="10" fill="#2a1414" stroke="#ff8a8a" stroke-width="2"/>
  <text x="720" y="504" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="14" font-weight="bold">Too LONG</text>
  <text x="720" y="530" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">abandoned units sit locked, item shows</text>
  <text x="720" y="550" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">&#8220;sold out&#8221; while phones go unsold</text>
  <text x="720" y="578" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="12.5" font-weight="bold">under-sell &#8212; payment drop, lost revenue</text>

  <text x="500" y="636" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">No free lunch: disappoint a few in-flight buyers, or lose sales to under-selling. The timeout is where you set the dial.</text>
  <text x="500" y="660" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">the purchased_by IS NULL guard means the reaper can never claw back a unit someone actually bought</text>
</svg>
