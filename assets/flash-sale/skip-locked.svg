<svg width="1000" height="760" viewBox="0 0 1000 760" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="m-g" markerWidth="12" markerHeight="12" refX="8.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4.5 L0,9 Z" fill="#8aff8a"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="760" fill="#111317"/>

  <text x="500" y="42" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="28" font-weight="bold">The Grab: FOR UPDATE SKIP LOCKED</text>
  <text x="500" y="70" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="16">find one free row, lock it, stamp it &#8212; thousands run this at once, each gets a distinct row</text>

  <!-- the query -->
  <rect x="40" y="92" width="500" height="190" rx="10" fill="#16191e" stroke="#3a3f47" stroke-width="1.6"/>
  <text x="58" y="116" fill="#ff8bd2" font-family="sans-serif" font-size="12.5" font-weight="bold">BEGIN</text>
  <text x="58" y="142" fill="#cbd5e1" font-family="monospace" font-size="12.5">SELECT id FROM units</text>
  <text x="58" y="162" fill="#cbd5e1" font-family="monospace" font-size="12.5">  WHERE item_id = 720 AND picked_at IS NULL</text>
  <text x="58" y="182" fill="#cbd5e1" font-family="monospace" font-size="12.5">  ORDER BY id  LIMIT 1</text>
  <text x="58" y="202" fill="#ff8bd2" font-family="monospace" font-size="13" font-weight="bold">  FOR UPDATE SKIP LOCKED;</text>
  <text x="58" y="232" fill="#cbd5e1" font-family="monospace" font-size="12.5">UPDATE units SET picked_at = NOW(),</text>
  <text x="58" y="252" fill="#cbd5e1" font-family="monospace" font-size="12.5">  picked_by = 1023 WHERE id = :found;</text>
  <text x="58" y="276" fill="#ff8bd2" font-family="sans-serif" font-size="12.5" font-weight="bold">COMMIT</text>

  <!-- what each clause does -->
  <rect x="560" y="92" width="400" height="190" rx="10" fill="#1c1320" stroke="#ff8bd2" stroke-width="2"/>
  <text x="760" y="116" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="14" font-weight="bold">what each clause does</text>
  <text x="580" y="146" fill="#ffff99" font-family="sans-serif" font-size="13" font-weight="bold">FOR UPDATE</text>
  <text x="580" y="166" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">write-locks the selected row &#8212; the item is</text>
  <text x="580" y="184" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">now unavailable to everyone else (no double-grab)</text>
  <text x="580" y="216" fill="#ff8bd2" font-family="sans-serif" font-size="13" font-weight="bold">SKIP LOCKED</text>
  <text x="580" y="236" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">don&#8217;t block on a locked row &#8212; skip it, take</text>
  <text x="580" y="254" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">the next free one. Convoy &#8594; parallel claims.</text>

  <!-- units table -->
  <text x="240" y="318" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="14" font-weight="bold">units (item 720)</text>
  <g font-family="sans-serif">
    <rect x="60" y="330" width="360" height="30" fill="#20200f" stroke="#ffff99" stroke-width="1.8"/>
    <text x="100" y="350" text-anchor="middle" fill="#9aa6b2" font-size="12">id</text><text x="200" y="350" text-anchor="middle" fill="#9aa6b2" font-size="12">picked_at</text><text x="330" y="350" text-anchor="middle" fill="#9aa6b2" font-size="12">picked_by</text>
    <rect x="60" y="360" width="360" height="30" fill="#221" stroke="#3a3f47" stroke-width="1"/>
    <text x="100" y="380" text-anchor="middle" fill="#cbd5e1" font-size="12">1</text><text x="200" y="380" text-anchor="middle" fill="#ff8bd2" font-size="11.5">10:01</text><text x="330" y="380" text-anchor="middle" fill="#ff8bd2" font-size="12">1023</text>
    <rect x="60" y="390" width="360" height="30" fill="#16191e" stroke="#3a3f47" stroke-width="1"/>
    <text x="100" y="410" text-anchor="middle" fill="#cbd5e1" font-size="12">2</text><text x="200" y="410" text-anchor="middle" fill="#8aff8a" font-size="12">NULL</text><text x="330" y="410" text-anchor="middle" fill="#8aff8a" font-size="12">NULL</text>
    <rect x="60" y="420" width="360" height="30" fill="#16191e" stroke="#3a3f47" stroke-width="1"/>
    <text x="100" y="440" text-anchor="middle" fill="#cbd5e1" font-size="12">3</text><text x="200" y="440" text-anchor="middle" fill="#8aff8a" font-size="12">NULL</text><text x="330" y="440" text-anchor="middle" fill="#8aff8a" font-size="12">NULL</text>
    <rect x="60" y="450" width="360" height="30" fill="#16191e" stroke="#3a3f47" stroke-width="1"/>
    <text x="100" y="470" text-anchor="middle" fill="#cbd5e1" font-size="12">4</text><text x="200" y="470" text-anchor="middle" fill="#8aff8a" font-size="12">NULL</text><text x="330" y="470" text-anchor="middle" fill="#8aff8a" font-size="12">NULL</text>
  </g>

  <!-- three buyers fanning to different rows -->
  <g stroke="#8aff8a" stroke-width="2">
    <g transform="translate(560,360)"><circle cx="0" cy="0" r="6" fill="#8aff8a" stroke="none"/><line x1="0" y1="6" x2="0" y2="22"/><line x1="0" y1="22" x2="-6" y2="32"/><line x1="0" y1="22" x2="6" y2="32"/></g>
    <g transform="translate(560,415)"><circle cx="0" cy="0" r="6" fill="#8aff8a" stroke="none"/><line x1="0" y1="6" x2="0" y2="22"/><line x1="0" y1="22" x2="-6" y2="32"/><line x1="0" y1="22" x2="6" y2="32"/></g>
    <g transform="translate(560,470)"><circle cx="0" cy="0" r="6" fill="#8aff8a" stroke="none"/><line x1="0" y1="6" x2="0" y2="22"/><line x1="0" y1="22" x2="-6" y2="32"/><line x1="0" y1="22" x2="6" y2="32"/></g>
  </g>
  <text x="585" y="356" fill="#8aff8a" font-family="sans-serif" font-size="11.5">1023</text>
  <text x="585" y="411" fill="#8aff8a" font-family="sans-serif" font-size="11.5">2044</text>
  <text x="585" y="466" fill="#8aff8a" font-family="sans-serif" font-size="11.5">3199</text>
  <line x1="548" y1="362" x2="430" y2="405" stroke="#8aff8a" stroke-width="2" marker-end="url(#m-g)"/>
  <line x1="548" y1="417" x2="430" y2="435" stroke="#8aff8a" stroke-width="2" marker-end="url(#m-g)"/>
  <line x1="548" y1="472" x2="430" y2="465" stroke="#8aff8a" stroke-width="2" marker-end="url(#m-g)"/>
  <text x="700" y="430" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="12.5">three buyers, same query, same instant</text>
  <text x="700" y="450" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="12.5">&#8594; each lands on a DIFFERENT free row,</text>
  <text x="700" y="470" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="12.5">no waiting, no overlap</text>

  <!-- sold out panel -->
  <rect x="60" y="512" width="430" height="92" rx="10" fill="#20200f" stroke="#ffff99" stroke-width="2"/>
  <text x="275" y="538" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="14" font-weight="bold">&#8220;Sold out&#8221; comes free</text>
  <text x="275" y="564" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">once every row has picked_at set, WHERE</text>
  <text x="275" y="584" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">picked_at IS NULL matches nothing &#8212; empty result = sold out</text>

  <!-- contrast panel -->
  <rect x="510" y="512" width="430" height="92" rx="10" fill="#2a1414" stroke="#ff8a8a" stroke-width="2"/>
  <text x="725" y="538" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="14" font-weight="bold">without SKIP LOCKED</text>
  <text x="725" y="564" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">plain FOR UPDATE makes all buyers queue behind</text>
  <text x="725" y="584" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">the same first free row &#8212; the hot-row convoy, again</text>

  <!-- takeaway -->
  <rect x="60" y="624" width="880" height="100" rx="12" fill="#1c1320" stroke="#ff8bd2" stroke-width="2.5"/>
  <text x="500" y="654" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="15" font-weight="bold">SKIP LOCKED converts a lock convoy into parallel, non-blocking, non-overlapping claims.</text>
  <text x="500" y="684" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14">Each buyer gets a distinct free row; only N grabs ever succeed.</text>
  <text x="500" y="708" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">Same primitive the task scheduler&#8217;s pullers use to claim due jobs without colliding.</text>
</svg>
