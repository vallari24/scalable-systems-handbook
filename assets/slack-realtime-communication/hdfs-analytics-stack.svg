<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">HDFS Analytics Stack</title>
  <desc id="desc">A high-level analytics stack where HDFS stores files as blocks, Hive provides table metadata, and Spark executes queries over Parquet data; a managed warehouse such as BigQuery hides many of these layers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f5f7fb"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff9db8"/>
    </marker>
    <style>
      .bg { fill: #101217; }
      .grid { stroke: #2a2f37; stroke-width: 1; opacity: .75; }
      .title { fill: #fff59d; font: 700 38px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #d7dae0; font: 400 20px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .box { fill: #171b22; stroke: #e8ecf3; stroke-width: 2.5; rx: 12; }
      .db { fill: #18191c; stroke: #ffd166; stroke-width: 3; rx: 12; }
      .hot { fill: #1b2420; stroke: #7cf29a; stroke-width: 3; rx: 12; }
      .pink { fill: #241920; stroke: #ff9db8; stroke-width: 3; rx: 12; }
      .blue { fill: #171a2b; stroke: #b8b3ff; stroke-width: 3; rx: 12; }
      .label { fill: #f5f7fb; font: 700 23px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #d7dae0; font: 500 17px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tiny { fill: #aeb5c2; font: 500 14px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .note { fill: #fff59d; font: 700 19px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .pinkText { fill: #ff9db8; }
      .greenText { fill: #7cf29a; }
      .yellowText { fill: #ffd166; }
      .arrow { stroke: #f5f7fb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .arrowPink { stroke: #ff9db8; stroke-width: 3; fill: none; marker-end: url(#arrowPink); }
      .block { fill: #263529; stroke: #7cf29a; stroke-width: 2; rx: 6; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="760"/>
  <g>
    <line class="grid" x1="0" y1="120" x2="1280" y2="120"/>
    <line class="grid" x1="0" y1="275" x2="1280" y2="275"/>
    <line class="grid" x1="0" y1="455" x2="1280" y2="455"/>
    <line class="grid" x1="0" y1="640" x2="1280" y2="640"/>
  </g>

  <text class="title" x="56" y="62">HDFS is storage; Hive and Spark make it queryable</text>
  <text class="subtitle" x="56" y="100">Files live as distributed blocks. Query engines read those files, often in Parquet columnar format.</text>

  <rect class="box" x="58" y="170" width="190" height="92"/>
  <text class="label" x="100" y="207">User</text>
  <text class="small" x="88" y="237">SQL query</text>

  <rect class="pink" x="315" y="155" width="235" height="122"/>
  <text class="label" x="358" y="198">Hive / Spark</text>
  <text class="small" x="348" y="230">planner + execution</text>
  <text class="tiny" x="348" y="254">runs the query work</text>

  <rect class="blue" x="315" y="338" width="235" height="92"/>
  <text class="label" x="352" y="375">Hive metastore</text>
  <text class="small" x="348" y="405">table -> file paths</text>

  <rect class="db" x="620" y="150" width="230" height="126"/>
  <text class="label" x="669" y="190">NameNode</text>
  <text class="small" x="652" y="222">file metadata</text>
  <text class="tiny" x="652" y="248">where blocks live</text>

  <rect class="hot" x="620" y="338" width="500" height="220"/>
  <text class="label" x="665" y="378">DataNodes</text>
  <text class="small" x="665" y="408">store HDFS blocks</text>

  <g transform="translate(660 435)">
    <rect class="block" x="0" y="0" width="80" height="48"/>
    <rect class="block" x="96" y="0" width="80" height="48"/>
    <rect class="block" x="192" y="0" width="80" height="48"/>
    <rect class="block" x="288" y="0" width="80" height="48"/>
    <text class="tiny" x="18" y="30">B1</text>
    <text class="tiny" x="114" y="30">B2</text>
    <text class="tiny" x="210" y="30">B3</text>
    <text class="tiny" x="306" y="30">B4</text>
    <text class="tiny" x="0" y="78">Parquet files keep columns together inside each file.</text>
  </g>

  <path class="arrow" d="M248 216 L315 216"/>
  <path class="arrow" d="M432 277 L432 338"/>
  <path class="arrow" d="M550 216 L620 213"/>
  <path class="arrowPink" d="M550 394 C590 432 592 448 620 448"/>
  <text class="tiny pinkText" x="548" y="430">read blocks</text>
  <text class="tiny" x="562" y="196">ask metadata</text>

  <rect class="box" x="58" y="505" width="405" height="86"/>
  <text class="label" x="90" y="540">HDFS alone is not the database</text>
  <text class="small" x="90" y="570">It stores bytes. Engines interpret and scan them.</text>

  <rect class="db" x="738" y="612" width="420" height="84"/>
  <text class="label" x="780" y="648">Managed warehouse</text>
  <text class="small" x="780" y="676">BigQuery hides storage, metadata, and execution layers.</text>

  <path class="arrow" d="M463 548 C575 636 645 654 738 654"/>
  <text class="note" x="510" y="623">rough mental model</text>

  <text class="note" x="56" y="724">Memory hook: HDFS + Parquet + Hive/Spark gives a warehouse-like analytics stack; BigQuery abstracts that stack.</text>
</svg>
