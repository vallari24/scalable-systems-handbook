<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" role="img" aria-labelledby="title desc">
  <title id="title">Slack Realtime Communication Architecture</title>
  <desc id="desc">A complete Slack-like architecture with clients, load balancers, WebSocket edge servers, REST API servers, membership lookup, realtime pubsub, Kafka, workers, and partitioned message databases.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f5f7fb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7cf29a"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8fb3"/>
    </marker>
    <style>
      .bg { fill: #101217; }
      .grid { stroke: #2a2f37; stroke-width: 1; opacity: .75; }
      .title { fill: #fff59d; font: 700 39px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #d7dae0; font: 400 20px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .box { fill: #171b22; stroke: #e8ecf3; stroke-width: 2.5; rx: 14; }
      .edge { fill: #151d23; stroke: #8fd3ff; stroke-width: 3; rx: 14; }
      .pubsub { fill: #202017; stroke: #ffd166; stroke-width: 3; rx: 14; }
      .kafka { fill: #1a1722; stroke: #b6a3ff; stroke-width: 3; rx: 14; }
      .db { fill: #18191c; stroke: #ffd166; stroke-width: 3; rx: 14; }
      .membership { fill: #1b2420; stroke: #7cf29a; stroke-width: 3; rx: 14; }
      .label { fill: #f5f7fb; font: 700 21px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #d7dae0; font: 500 16px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tiny { fill: #aeb5c2; font: 500 14px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .note { fill: #fff59d; font: 700 18px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .green { fill: #7cf29a; }
      .pink { fill: #ff8fb3; }
      .blue { fill: #8fd3ff; }
      .arrow { stroke: #f5f7fb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .arrowGreen { stroke: #7cf29a; stroke-width: 3; fill: none; marker-end: url(#arrowGreen); }
      .arrowPink { stroke: #ff8fb3; stroke-width: 3; fill: none; marker-end: url(#arrowPink); }
      .dash { stroke-dasharray: 7 7; }
    </style>
  </defs>
  <rect class="bg" width="1280" height="840"/>
  <g>
    <line class="grid" x1="0" y1="128" x2="1280" y2="128"/>
    <line class="grid" x1="0" y1="292" x2="1280" y2="292"/>
    <line class="grid" x1="0" y1="492" x2="1280" y2="492"/>
    <line class="grid" x1="0" y1="700" x2="1280" y2="700"/>
  </g>

  <text class="title" x="58" y="64">Slack-like realtime communication architecture</text>
  <text class="subtitle" x="58" y="102">WebSockets push live events. REST reads history. Kafka and the message store make missed pushes recoverable.</text>

  <rect class="box" x="60" y="205" width="160" height="92"/>
  <text class="label" x="103" y="243">Clients</text>
  <text class="tiny" x="86" y="270">desktop, mobile, web</text>

  <rect class="box" x="285" y="178" width="120" height="145"/>
  <text class="label" x="323" y="232">Load</text>
  <text class="label" x="300" y="260">balancer</text>

  <rect class="edge" x="480" y="150" width="260" height="90"/>
  <text class="label" x="529" y="185">Edge WS fleet</text>
  <text class="tiny" x="524" y="213">one persistent socket per user</text>

  <rect class="box" x="480" y="300" width="260" height="90"/>
  <text class="label" x="536" y="335">REST API fleet</text>
  <text class="tiny" x="525" y="363">send, scroll, channel load</text>

  <rect class="membership" x="825" y="150" width="250" height="90"/>
  <text class="label" x="872" y="185">Membership</text>
  <text class="tiny" x="864" y="213">who belongs to channel C?</text>

  <rect class="pubsub" x="825" y="300" width="250" height="95"/>
  <text class="label" x="866" y="337">Realtime Pub/Sub</text>
  <text class="tiny" x="872" y="365">topic per channel</text>

  <rect class="kafka" x="480" y="535" width="220" height="88"/>
  <text class="label" x="552" y="570">Kafka</text>
  <text class="tiny" x="523" y="598">durable write stream</text>

  <rect class="box" x="790" y="535" width="220" height="88"/>
  <text class="label" x="838" y="570">Message workers</text>
  <text class="tiny" x="826" y="598">validate and persist</text>

  <rect class="db" x="1060" y="500" width="170" height="160"/>
  <text class="label" x="1098" y="535">Messages</text>
  <text class="label" x="1118" y="562">DB</text>
  <text class="tiny" x="1088" y="592">partitioned by</text>
  <text class="tiny" x="1098" y="616">channel_id</text>

  <rect class="box" x="60" y="720" width="420" height="70"/>
  <text class="note" x="90" y="750">History path:</text>
  <text class="small" x="205" y="750">read recent or older messages.</text>
  <text class="small" x="90" y="775">Muted channels can wait for this path.</text>

  <rect class="box" x="520" y="720" width="660" height="70"/>
  <text class="note" x="550" y="750">Realtime path:</text>
  <text class="small" x="690" y="750">publish only live notifications; history fixes missed delivery.</text>
  <text class="small" x="550" y="775">Do not make every edge server connect to every other edge server.</text>

  <path class="arrow" d="M220 250 L285 250"/>
  <path class="arrowGreen" d="M405 220 L480 195"/>
  <text class="tiny green" x="414" y="188">WebSocket</text>
  <path class="arrow" d="M405 278 L480 345"/>
  <text class="tiny" x="417" y="332">REST</text>

  <path class="arrowGreen" d="M740 195 L825 195"/>
  <text class="tiny green" x="758" y="178">membership lookup</text>
  <path class="arrowGreen" d="M740 215 C795 230 805 330 825 347"/>
  <text class="tiny green" x="752" y="280">subscribe/publish</text>
  <path class="arrowGreen" d="M1075 347 C1134 348 1138 214 1075 204"/>
  <text class="tiny green" x="1098" y="285">fanout to subscribed edges</text>

  <path class="arrowPink" d="M610 240 L610 535"/>
  <text class="tiny pink" x="624" y="442">message event</text>
  <path class="arrowPink" d="M700 579 L790 579"/>
  <path class="arrowPink" d="M1010 579 L1060 579"/>

  <path class="arrow" d="M610 390 C620 455 940 465 1115 500"/>
  <text class="tiny" x="735" y="448">scroll history by channel_id</text>

  <text class="small blue" x="58" y="824">The split is the design: websocket edge servers deliver now, partitioned storage answers later.</text>
</svg>
