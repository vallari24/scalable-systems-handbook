<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Slack Message Storage: Shard by Channel</title>
  <desc id="desc">A Slack-like message store where workspaces contain channels, DMs are channels with two members, and messages are routed to shards by channel id.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f5f7fb"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8fb3"/>
    </marker>
    <style>
      .bg { fill: #101217; }
      .grid { stroke: #2a2f37; stroke-width: 1; opacity: .75; }
      .title { fill: #fff59d; font: 700 40px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #d7dae0; font: 400 20px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .box { fill: #171b22; stroke: #e8ecf3; stroke-width: 2.5; rx: 12; }
      .soft { fill: #151922; stroke: #6d7280; stroke-width: 2; rx: 12; }
      .db { fill: #18191c; stroke: #ffd166; stroke-width: 3; rx: 12; }
      .hot { fill: #1b2420; stroke: #7cf29a; stroke-width: 3; rx: 12; }
      .pink { fill: #241920; stroke: #ff8fb3; stroke-width: 3; rx: 12; }
      .label { fill: #f5f7fb; font: 700 22px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #d7dae0; font: 500 17px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tiny { fill: #aeb5c2; font: 500 15px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .note { fill: #fff59d; font: 700 19px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .green { fill: #7cf29a; }
      .pinkText { fill: #ff8fb3; }
      .arrow { stroke: #f5f7fb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .arrowPink { stroke: #ff8fb3; stroke-width: 3; fill: none; marker-end: url(#arrowPink); }
    </style>
  </defs>
  <rect class="bg" width="1280" height="760"/>
  <g>
    <line class="grid" x1="0" y1="130" x2="1280" y2="130"/>
    <line class="grid" x1="0" y1="300" x2="1280" y2="300"/>
    <line class="grid" x1="0" y1="520" x2="1280" y2="520"/>
    <line class="grid" x1="0" y1="700" x2="1280" y2="700"/>
  </g>

  <text class="title" x="60" y="64">Slack schema: DMs are channels</text>
  <text class="subtitle" x="60" y="102">Model every destination as a channel, then shard message history by channel_id.</text>

  <rect class="box" x="60" y="178" width="150" height="92"/>
  <text class="label" x="97" y="216">Client</text>
  <text class="small" x="88" y="245">send/read</text>

  <rect class="box" x="280" y="160" width="190" height="128"/>
  <text class="label" x="330" y="204">API</text>
  <text class="small" x="310" y="235">send_message</text>
  <text class="small" x="312" y="262">read_messages</text>

  <rect class="pink" x="540" y="160" width="210" height="128"/>
  <text class="label" x="583" y="203">Shard</text>
  <text class="label" x="580" y="230">router</text>
  <text class="small" x="573" y="260">uses channel_id</text>

  <rect class="db" x="820" y="125" width="380" height="390"/>
  <text class="label" x="908" y="165">Partitioned messages DB</text>

  <rect class="soft" x="850" y="190" width="320" height="75"/>
  <text class="small" x="875" y="220">Shard 1</text>
  <text class="tiny" x="875" y="246">channels: C1, C4, DM3</text>

  <rect class="hot" x="850" y="295" width="320" height="88"/>
  <text class="small green" x="875" y="328">Shard 2</text>
  <text class="tiny" x="875" y="354">channel C2 and DM7 live here</text>

  <rect class="soft" x="850" y="415" width="320" height="75"/>
  <text class="small" x="875" y="445">Shard 3</text>
  <text class="tiny" x="875" y="471">channels: C3, C8, DM9</text>

  <path class="arrow" d="M210 224 L280 224"/>
  <text class="tiny" x="224" y="207">REST</text>
  <path class="arrow" d="M470 224 L540 224"/>
  <text class="tiny" x="487" y="207">channel_id</text>
  <path class="arrowPink" d="M750 224 C790 230 800 334 850 339"/>
  <text class="tiny pinkText" x="768" y="294">C2 -> shard 2</text>

  <rect class="soft" x="70" y="565" width="190" height="120"/>
  <text class="label" x="98" y="603">workspace</text>
  <text class="tiny" x="98" y="633">id, name</text>
  <text class="tiny" x="98" y="657">W1, W2</text>

  <rect class="soft" x="305" y="565" width="190" height="120"/>
  <text class="label" x="345" y="603">user</text>
  <text class="tiny" x="345" y="633">id, name</text>
  <text class="tiny" x="345" y="657">A, B, C</text>

  <rect class="soft" x="540" y="565" width="225" height="120"/>
  <text class="label" x="580" y="603">channel</text>
  <text class="tiny" x="580" y="633">id, workspace_id, name</text>
  <text class="tiny" x="580" y="657">type: dm / channel / group</text>

  <rect class="soft" x="810" y="565" width="210" height="120"/>
  <text class="label" x="842" y="603">membership</text>
  <text class="tiny" x="842" y="633">user_id, channel_id</text>
  <text class="tiny" x="842" y="657">checkpoint = last read</text>

  <rect class="soft" x="1050" y="565" width="200" height="120"/>
  <text class="label" x="1080" y="603">message</text>
  <text class="tiny" x="1080" y="633">channel_id, sender_id</text>
  <text class="tiny" x="1080" y="657">text, created_at</text>

  <path class="arrow" d="M260 625 L305 625"/>
  <path class="arrow" d="M495 625 L540 625"/>
  <path class="arrow" d="M765 625 L810 625"/>
  <path class="arrow" d="M1020 625 L1050 625"/>

  <text class="note" x="60" y="725">Memory hook: DMs are channels. Membership tracks readers. Messages live under channel_id.</text>
</svg>
