<svg width="1100" height="600" viewBox="0 0 1100 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="hs-w" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#cdd9e5"/></marker>
    <radialGradient id="hs-hot" cx="50%" cy="50%" r="60%"><stop offset="0%" stop-color="#5a1418"/><stop offset="100%" stop-color="#241416"/></radialGradient>
  </defs>
  <rect x="0" y="0" width="1100" height="600" fill="#0d1117"/>
  <text x="40" y="48" fill="#e6edf3" font-size="31" font-weight="700">The hot-shard problem: shard by load, not geography</text>
  <text x="40" y="78" fill="#9aa7b4" font-size="17">One contiguous region per shard makes the busy region's shard a permanent hotspot.</text>

  <line x1="550" y1="105" x2="550" y2="430" stroke="#2b3441" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="285" y="120" fill="#ff8a8a" font-size="17" font-weight="700" text-anchor="middle">Naive: one region per shard</text>
  <text x="825" y="120" fill="#8aff8a" font-size="17" font-weight="700" text-anchor="middle">Fix: mix regions per shard</text>

  <!-- LEFT naive -->
  <path d="M120,170 a70,20 0 0,0 140,0 v90 a70,20 0 0,1 -140,0 z" fill="url(#hs-hot)" stroke="#ff8a8a" stroke-width="3"/>
  <ellipse cx="190" cy="170" rx="70" ry="20" fill="#5a1418" stroke="#ff8a8a" stroke-width="3"/>
  <text x="190" y="205" fill="#ff8a8a" font-size="16" font-weight="700" text-anchor="middle">Shard 1</text>
  <text x="190" y="228" fill="#ffb3b3" font-size="12.5" text-anchor="middle">downtown, 6pm</text>
  <text x="190" y="292" fill="#ff8a8a" font-size="13" font-weight="700" text-anchor="middle">🔥 peak — overloaded</text>

  <path d="M340,180 a62,17 0 0,0 124,0 v78 a62,17 0 0,1 -124,0 z" fill="#12161c" stroke="#3b4654" stroke-width="2"/>
  <ellipse cx="402" cy="180" rx="62" ry="17" fill="#12161c" stroke="#3b4654" stroke-width="2"/>
  <text x="402" y="212" fill="#7c8896" font-size="16" font-weight="700" text-anchor="middle">Shard 2</text>
  <text x="402" y="234" fill="#5f6b78" font-size="12.5" text-anchor="middle">rural, 3am</text>
  <text x="402" y="292" fill="#5f6b78" font-size="13" text-anchor="middle">idle — wasted</text>

  <rect x="80" y="330" width="430" height="80" rx="10" fill="#1a1113" stroke="#ff8a8a" stroke-width="1.4"/>
  <text x="100" y="358" fill="#e6edf3" font-size="13.5">One contiguous region per shard → the busy</text>
  <text x="100" y="380" fill="#e6edf3" font-size="13.5">region's shard is a hotspot; the quiet one</text>
  <text x="100" y="402" fill="#e6edf3" font-size="13.5">wastes capacity. Splitting a single query helps,</text>

  <!-- RIGHT fix -->
  <rect x="770" y="150" width="120" height="50" rx="8" fill="#161b22" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="830" y="172" fill="#93c5fd" font-size="14" font-weight="700" text-anchor="middle">Allocation</text>
  <text x="830" y="190" fill="#93c5fd" font-size="12" text-anchor="middle">Service (ADS)</text>

  <path d="M620,250 a58,16 0 0,0 116,0 v78 a58,16 0 0,1 -116,0 z" fill="#221019" stroke="#ff8bd2" stroke-width="2.5"/>
  <ellipse cx="678" cy="250" rx="58" ry="16" fill="#221019" stroke="#ff8bd2" stroke-width="2.5"/>
  <text x="678" y="282" fill="#ff8bd2" font-size="14" font-weight="700" text-anchor="middle">Master 1</text>
  <text x="678" y="304" fill="#e6edf3" font-size="11" text-anchor="middle">downtown cell</text>
  <text x="678" y="320" fill="#9aa7b4" font-size="11" text-anchor="middle">+ a suburb</text>

  <path d="M910,250 a58,16 0 0,0 116,0 v78 a58,16 0 0,1 -116,0 z" fill="#221019" stroke="#ff8bd2" stroke-width="2.5"/>
  <ellipse cx="968" cy="250" rx="58" ry="16" fill="#221019" stroke="#ff8bd2" stroke-width="2.5"/>
  <text x="968" y="282" fill="#ff8bd2" font-size="14" font-weight="700" text-anchor="middle">Master 2</text>
  <text x="968" y="304" fill="#e6edf3" font-size="11" text-anchor="middle">another downtown</text>
  <text x="968" y="320" fill="#9aa7b4" font-size="11" text-anchor="middle">+ a rural area</text>

  <line x1="800" y1="200" x2="710" y2="245" stroke="#cdd9e5" stroke-width="2" marker-end="url(#hs-w)"/>
  <line x1="862" y1="200" x2="940" y2="245" stroke="#cdd9e5" stroke-width="2" marker-end="url(#hs-w)"/>

  <rect x="600" y="360" width="470" height="66" rx="10" fill="#11161d" stroke="#2b3441" stroke-width="1.4"/>
  <text x="620" y="385" fill="#ffff99" font-size="13" font-weight="700">★ Native Redis Cluster hashes keys blindly — no business</text>
  <text x="620" y="407" fill="#e6edf3" font-size="13">context. A load-aware allocation service places regions on purpose.</text>

  <!-- impact -->
  <rect x="80" y="455" width="940" height="120" rx="10" fill="#11221a" stroke="#8aff8a" stroke-width="1.6"/>
  <text x="100" y="485" fill="#8aff8a" font-size="16" font-weight="700">Impact (Gojek's geo-search service)</text>
  <text x="110" y="518" fill="#e6edf3" font-size="15">• ~600,000 writes / minute</text>
  <text x="110" y="546" fill="#e6edf3" font-size="15">• ~200,000 reads / minute</text>
  <text x="480" y="518" fill="#e6edf3" font-size="15">• highly available &amp; low latency</text>
  <text x="480" y="546" fill="#e6edf3" font-size="15">• truly horizontally scalable</text>
  <text x="740" y="533" fill="#ffd27f" font-size="15" font-weight="700">→ more load? add more nodes.</text>
</svg>
