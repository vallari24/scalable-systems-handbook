<svg width="1100" height="600" viewBox="0 0 1100 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="sf-a" markerWidth="10" markerHeight="10" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#ffff99"/></marker>
    <marker id="sf-g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8aff8a"/></marker>
    <marker id="sf-b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#93c5fd"/></marker>
  </defs>
  <rect x="0" y="0" width="1100" height="600" fill="#0d1117"/>
  <text x="40" y="50" fill="#e6edf3" font-size="31" font-weight="700">A space-filling curve: thread one line through all of 2D</text>
  <text x="40" y="82" fill="#9aa7b4" font-size="17">A point's value = how far along the curve it sits. Visited close together &#8594; near on the map.</text>

  <!-- the square region -->
  <rect x="70" y="120" width="440" height="440" rx="6" fill="#161b22" stroke="#3b4654" stroke-width="2"/>
  <text x="290" y="145" fill="#9aa7b4" font-size="14" text-anchor="middle">a region of the map</text>

  <!-- folding / spiral curve -->
  <path d="M 100 530
           L 480 530 L 480 180 L 140 180 L 140 490
           L 440 490 L 440 220 L 180 220 L 180 450
           L 400 450 L 400 260 L 220 260 L 220 410
           L 360 410 L 360 300 L 260 300 L 260 370 L 320 370 L 320 335"
        fill="none" stroke="#8aff8a" stroke-width="2.5" stroke-linejoin="round" opacity="0.85"/>
  <circle cx="100" cy="530" r="6" fill="#ffff99"/>
  <text x="100" y="552" fill="#ffff99" font-size="13" text-anchor="middle">start (value 0)</text>
  <text x="470" y="510" fill="#8aff8a" font-size="13">increasing value &#8594;</text>

  <!-- scattered points -->
  <circle cx="290" cy="330" r="7" fill="#ff8bd2"/><text x="290" y="322" fill="#ff8bd2" font-size="15" font-weight="700" text-anchor="middle">(x,y)</text>
  <circle cx="330" cy="365" r="7" fill="#8aff8a"/><text x="345" y="368" fill="#8aff8a" font-size="15" font-weight="700">B</text>
  <circle cx="255" cy="300" r="7" fill="#8aff8a"/><text x="238" y="298" fill="#8aff8a" font-size="15" font-weight="700">C</text>
  <circle cx="180" cy="220" r="7" fill="#93c5fd"/><text x="192" y="216" fill="#93c5fd" font-size="15" font-weight="700">Z</text>
  <line x1="290" y1="330" x2="330" y2="365" stroke="#8aff8a" stroke-width="1.6" stroke-dasharray="3 3"/>
  <line x1="290" y1="330" x2="255" y2="300" stroke="#8aff8a" stroke-width="1.6" stroke-dasharray="3 3"/>
  <line x1="290" y1="330" x2="180" y2="220" stroke="#93c5fd" stroke-width="1.6" stroke-dasharray="3 3"/>

  <!-- highlight small segment -->
  <circle cx="290" cy="330" r="16" fill="none" stroke="#ffd27f" stroke-width="2"/>
  <text x="360" y="315" fill="#ffd27f" font-size="12">reached close together</text>

  <!-- right side explanation -->
  <line x1="560" y1="300" x2="640" y2="300" stroke="#ffff99" stroke-width="2.5" marker-end="url(#sf-a)"/>
  <text x="600" y="290" fill="#ffff99" font-size="13" text-anchor="middle">value =</text>
  <text x="600" y="332" fill="#ffff99" font-size="13" text-anchor="middle">arc length</text>

  <!-- values on a line -->
  <line x1="680" y1="360" x2="1040" y2="360" stroke="#3b4654" stroke-width="2"/>
  <line x1="800" y1="352" x2="800" y2="368" stroke="#ff8bd2" stroke-width="3"/><text x="800" y="340" fill="#ff8bd2" font-size="14" font-weight="700" text-anchor="middle">(x,y)</text>
  <line x1="830" y1="352" x2="830" y2="368" stroke="#8aff8a" stroke-width="3"/><text x="838" y="340" fill="#8aff8a" font-size="14" font-weight="700">B</text>
  <line x1="770" y1="352" x2="770" y2="368" stroke="#8aff8a" stroke-width="3"/><text x="758" y="340" fill="#8aff8a" font-size="14" font-weight="700">C</text>
  <line x1="990" y1="352" x2="990" y2="368" stroke="#93c5fd" stroke-width="3"/><text x="990" y="340" fill="#93c5fd" font-size="14" font-weight="700" text-anchor="middle">Z</text>
  <text x="800" y="392" fill="#8aff8a" font-size="12" text-anchor="middle">B, C get similar values</text>
  <text x="990" y="392" fill="#93c5fd" font-size="12" text-anchor="middle">Z far</text>

  <rect x="680" y="430" width="360" height="120" rx="10" fill="#13241a" stroke="#8aff8a" stroke-width="2"/>
  <text x="700" y="462" fill="#8aff8a" font-size="15" font-weight="700">Distance-preserving by construction:</text>
  <text x="700" y="490" fill="#cdd9e5" font-size="14">the curve never jumps &#8212; points it visits</text>
  <text x="700" y="512" fill="#cdd9e5" font-size="14">at nearly the same time are physically</text>
  <text x="700" y="534" fill="#cdd9e5" font-size="14">near, so their values are close.</text>
</svg>
