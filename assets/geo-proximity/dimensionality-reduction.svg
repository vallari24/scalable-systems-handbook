<svg width="1100" height="640" viewBox="0 0 1100 640" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="dr-a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#9aa7b4"/></marker>
  </defs>
  <rect x="0" y="0" width="1100" height="640" fill="#0d1117"/>
  <text x="40" y="50" fill="#e6edf3" font-size="31" font-weight="700">The property a geohash must satisfy: keep relative distance</text>
  <text x="40" y="82" fill="#9aa7b4" font-size="17">Close on the map &#8594; close on the line. f must preserve the ordering of distances.</text>

  <!-- ===== TOP: correct mapping ===== -->
  <rect x="40" y="105" width="1020" height="240" rx="10" fill="#11161d" stroke="#2b3441" stroke-width="1.5"/>
  <text x="60" y="135" fill="#8aff8a" font-size="17" font-weight="700">&#10003; correct &#8212; A and B are the close pair on the map, and stay close on the line</text>

  <!-- map with points -->
  <rect x="70" y="150" width="330" height="175" rx="8" fill="#161b22" stroke="#3b4654" stroke-width="2"/>
  <text x="235" y="172" fill="#9aa7b4" font-size="13" text-anchor="middle">the map (2D)</text>
  <circle cx="180" cy="235" r="7" fill="#ff8bd2"/><text x="168" y="230" fill="#ff8bd2" font-size="16" font-weight="700">A</text>
  <circle cx="205" cy="250" r="7" fill="#8aff8a"/><text x="214" y="248" fill="#8aff8a" font-size="16" font-weight="700">B</text>
  <circle cx="330" cy="290" r="7" fill="#93c5fd"/><text x="340" y="295" fill="#93c5fd" font-size="16" font-weight="700">C</text>
  <line x1="180" y1="235" x2="205" y2="250" stroke="#8aff8a" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="180" y1="235" x2="330" y2="290" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- f arrows -->
  <text x="430" y="200" fill="#9aa7b4" font-size="15">(x&#8321;, y&#8321;) &#8594; z_A</text>
  <text x="430" y="230" fill="#9aa7b4" font-size="15">(x&#8322;, y&#8322;) &#8594; z_B</text>
  <text x="430" y="260" fill="#9aa7b4" font-size="15">(x&#8323;, y&#8323;) &#8594; z_C</text>
  <text x="470" y="150" fill="#ffff99" font-size="15" font-weight="700">f</text>

  <!-- number line -->
  <line x1="600" y1="250" x2="1030" y2="250" stroke="#3b4654" stroke-width="2" marker-end="url(#dr-a)"/>
  <line x1="680" y1="242" x2="680" y2="258" stroke="#ff8bd2" stroke-width="3"/><text x="680" y="230" fill="#ff8bd2" font-size="15" font-weight="700" text-anchor="middle">z_A</text>
  <line x1="720" y1="242" x2="720" y2="258" stroke="#8aff8a" stroke-width="3"/><text x="720" y="230" fill="#8aff8a" font-size="15" font-weight="700" text-anchor="middle">z_B</text>
  <line x1="900" y1="242" x2="900" y2="258" stroke="#93c5fd" stroke-width="3"/><text x="900" y="230" fill="#93c5fd" font-size="15" font-weight="700" text-anchor="middle">z_C</text>
  <text x="700" y="290" fill="#8aff8a" font-size="13" text-anchor="middle">small gap</text>
  <text x="790" y="315" fill="#93c5fd" font-size="13" text-anchor="middle">big gap</text>
  <text x="815" y="180" fill="#e6edf3" font-size="17" font-weight="700" text-anchor="middle">|z_B &#8722; z_A| &lt; |z_C &#8722; z_A|</text>

  <!-- ===== BOTTOM: counterexample ===== -->
  <rect x="40" y="360" width="1020" height="210" rx="10" fill="#1a1113" stroke="#5a2a2f" stroke-width="1.5"/>
  <text x="60" y="390" fill="#ff8a8a" font-size="17" font-weight="700">&#10007; broken &#8212; assign A = 10, B = 15, C = 9</text>

  <line x1="120" y1="470" x2="1000" y2="470" stroke="#3b4654" stroke-width="2"/>
  <g text-anchor="middle">
    <line x1="300" y1="462" x2="300" y2="478" stroke="#93c5fd" stroke-width="3"/><text x="300" y="450" fill="#93c5fd" font-size="16" font-weight="700">C = 9</text>
    <line x1="360" y1="462" x2="360" y2="478" stroke="#ff8bd2" stroke-width="3"/><text x="360" y="450" fill="#ff8bd2" font-size="16" font-weight="700">A = 10</text>
    <line x1="660" y1="462" x2="660" y2="478" stroke="#8aff8a" stroke-width="3"/><text x="660" y="450" fill="#8aff8a" font-size="16" font-weight="700">B = 15</text>
  </g>
  <text x="330" y="505" fill="#ff8a8a" font-size="13" text-anchor="middle">9 and 10 sit adjacent</text>
  <text x="510" y="530" fill="#e6edf3" font-size="15.5">A range query around A = 10 sweeps up the <tspan fill="#93c5fd" font-weight="700">far</tspan> point C and misses the <tspan fill="#8aff8a" font-weight="700">near</tspan> point B.</text>
  <text x="60" y="530" fill="#ff8a8a" font-size="14.5" font-weight="600">Relative distance</text>
  <text x="60" y="550" fill="#ff8a8a" font-size="14.5" font-weight="600">is violated.</text>
</svg>
