<svg width="1280" height="760" viewBox="0 0 1280 760" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="md-w" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#cdd9e5"/></marker>
    <marker id="md-g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8aff8a"/></marker>
    <marker id="md-p" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#ff8bd2"/></marker>
    <marker id="md-b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#93c5fd"/></marker>
    <marker id="md-y" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#ffff99"/></marker>
    <marker id="md-o" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#ffd27f"/></marker>
    <filter id="md-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1280" height="760" fill="#0d1117"/>
  <text x="44" y="50" fill="#e6edf3" font-size="32" font-weight="700">From nearby drivers to one committed match</text>
  <text x="44" y="82" fill="#9aa7b4" font-size="17">The geo index only finds candidates. The dispatcher still has to score, optimize, reserve, and learn from the outcome.</text>

  <!-- lane labels -->
  <rect x="42" y="112" width="278" height="30" rx="6" fill="#13241a" stroke="#8aff8a" stroke-width="1"/>
  <text x="181" y="133" fill="#8aff8a" font-size="14" font-weight="700" text-anchor="middle">1. RETRIEVE CANDIDATES</text>
  <rect x="345" y="112" width="282" height="30" rx="6" fill="#1a1420" stroke="#ffd27f" stroke-width="1"/>
  <text x="486" y="133" fill="#ffd27f" font-size="14" font-weight="700" text-anchor="middle">2. SCORE POSSIBLE EDGES</text>
  <rect x="652" y="112" width="282" height="30" rx="6" fill="#15233a" stroke="#93c5fd" stroke-width="1"/>
  <text x="793" y="133" fill="#93c5fd" font-size="14" font-weight="700" text-anchor="middle">3. SOLVE A BATCH</text>
  <rect x="960" y="112" width="278" height="30" rx="6" fill="#25220e" stroke="#ffff99" stroke-width="1"/>
  <text x="1099" y="133" fill="#ffff99" font-size="14" font-weight="700" text-anchor="middle">4. COMMIT OR RETRY</text>

  <!-- request -->
  <g stroke="#cdd9e5" stroke-width="2" fill="none">
    <circle cx="76" cy="203" r="10"/>
    <line x1="76" y1="213" x2="76" y2="242"/>
    <line x1="76" y1="222" x2="61" y2="235"/>
    <line x1="76" y1="222" x2="91" y2="235"/>
    <line x1="76" y1="242" x2="63" y2="264"/>
    <line x1="76" y1="242" x2="89" y2="264"/>
  </g>
  <text x="76" y="286" fill="#e6edf3" font-size="13" text-anchor="middle">rider / order</text>
  <text x="76" y="306" fill="#9aa7b4" font-size="12" text-anchor="middle">pickup point</text>

  <!-- geo candidate service -->
  <rect x="135" y="174" width="188" height="118" rx="10" fill="#13241a" stroke="#8aff8a" stroke-width="2.5" filter="url(#md-shadow)"/>
  <text x="229" y="208" fill="#8aff8a" font-size="17" font-weight="700" text-anchor="middle">Geo Candidate</text>
  <text x="229" y="230" fill="#8aff8a" font-size="17" font-weight="700" text-anchor="middle">Service</text>
  <text x="229" y="256" fill="#e6edf3" font-size="12.5" text-anchor="middle">query cell + neighbors</text>
  <text x="229" y="275" fill="#9aa7b4" font-size="12" text-anchor="middle">Redis GEO / H3 / S2</text>
  <line x1="95" y1="231" x2="132" y2="231" stroke="#cdd9e5" stroke-width="2.5" marker-end="url(#md-w)"/>

  <!-- geo index store -->
  <path d="M162,355 a58,17 0 0,0 116,0 v72 a58,17 0 0,1 -116,0 z" fill="#102018" stroke="#8aff8a" stroke-width="2"/>
  <ellipse cx="220" cy="355" rx="58" ry="17" fill="#102018" stroke="#8aff8a" stroke-width="2"/>
  <text x="220" y="388" fill="#8aff8a" font-size="14" font-weight="700" text-anchor="middle">Geo Index</text>
  <text x="220" y="409" fill="#9aa7b4" font-size="11.5" text-anchor="middle">live locations + TTL</text>
  <path d="M228,293 C224,318 222,330 221,352" fill="none" stroke="#8aff8a" stroke-width="2.3" marker-end="url(#md-g)"/>

  <!-- candidate count -->
  <rect x="132" y="470" width="195" height="68" rx="9" fill="#11161d" stroke="#2b3441" stroke-width="1.4"/>
  <text x="229" y="496" fill="#8aff8a" font-size="14" font-weight="700" text-anchor="middle">candidate set</text>
  <text x="229" y="518" fill="#e6edf3" font-size="12.5" text-anchor="middle">50-500 nearby drivers</text>
  <text x="229" y="534" fill="#9aa7b4" font-size="11.5" text-anchor="middle">not the whole city</text>
  <line x1="220" y1="429" x2="220" y2="467" stroke="#8aff8a" stroke-width="2.3" marker-end="url(#md-g)"/>

  <!-- filters -->
  <rect x="370" y="174" width="205" height="118" rx="10" fill="#221019" stroke="#ff8bd2" stroke-width="2.5" filter="url(#md-shadow)"/>
  <text x="472" y="207" fill="#ff8bd2" font-size="17" font-weight="700" text-anchor="middle">State Filter</text>
  <text x="472" y="234" fill="#e6edf3" font-size="12.5" text-anchor="middle">available, fresh, vehicle</text>
  <text x="472" y="252" fill="#e6edf3" font-size="12.5" text-anchor="middle">type, capacity, not busy</text>
  <text x="472" y="275" fill="#9aa7b4" font-size="11.5" text-anchor="middle">drop impossible matches early</text>
  <line x1="325" y1="231" x2="367" y2="231" stroke="#8aff8a" stroke-width="2.4" marker-end="url(#md-g)"/>

  <!-- feature services -->
  <rect x="370" y="348" width="205" height="145" rx="10" fill="#1f1a10" stroke="#ffd27f" stroke-width="2.5" filter="url(#md-shadow)"/>
  <text x="472" y="383" fill="#ffd27f" font-size="17" font-weight="700" text-anchor="middle">Feature + ETA</text>
  <text x="472" y="405" fill="#ffd27f" font-size="17" font-weight="700" text-anchor="middle">Services</text>
  <text x="472" y="432" fill="#e6edf3" font-size="12.5" text-anchor="middle">pickup ETA, route time</text>
  <text x="472" y="451" fill="#e6edf3" font-size="12.5" text-anchor="middle">prep time, acceptance</text>
  <text x="472" y="470" fill="#e6edf3" font-size="12.5" text-anchor="middle">future demand / supply</text>
  <path d="M326,504 C345,505 350,421 367,421" fill="none" stroke="#ffd27f" stroke-width="2.4" marker-end="url(#md-o)"/>
  <line x1="472" y1="292" x2="472" y2="345" stroke="#ff8bd2" stroke-width="2.3" marker-end="url(#md-o)"/>

  <!-- graph -->
  <rect x="660" y="174" width="245" height="205" rx="10" fill="#121820" stroke="#93c5fd" stroke-width="2.5" filter="url(#md-shadow)"/>
  <text x="782" y="207" fill="#93c5fd" font-size="17" font-weight="700" text-anchor="middle">Weighted Candidate Graph</text>
  <text x="782" y="232" fill="#9aa7b4" font-size="12" text-anchor="middle">edge weight = match value</text>

  <!-- graph nodes -->
  <g fill="#161b22" stroke="#cdd9e5" stroke-width="1.8">
    <circle cx="700" cy="270" r="13"/>
    <circle cx="700" cy="320" r="13"/>
    <circle cx="865" cy="252" r="13"/>
    <circle cx="865" cy="302" r="13"/>
    <circle cx="865" cy="352" r="13"/>
  </g>
  <text x="700" y="274" fill="#e6edf3" font-size="10.5" text-anchor="middle">R1</text>
  <text x="700" y="324" fill="#e6edf3" font-size="10.5" text-anchor="middle">R2</text>
  <text x="865" y="256" fill="#e6edf3" font-size="10.5" text-anchor="middle">D1</text>
  <text x="865" y="306" fill="#e6edf3" font-size="10.5" text-anchor="middle">D2</text>
  <text x="865" y="356" fill="#e6edf3" font-size="10.5" text-anchor="middle">D3</text>
  <line x1="713" y1="267" x2="852" y2="253" stroke="#8aff8a" stroke-width="2"/>
  <line x1="713" y1="273" x2="852" y2="302" stroke="#ffd27f" stroke-width="2"/>
  <line x1="713" y1="319" x2="852" y2="303" stroke="#8aff8a" stroke-width="2"/>
  <line x1="713" y1="323" x2="852" y2="352" stroke="#ffd27f" stroke-width="2"/>
  <text x="700" y="397" fill="#9aa7b4" font-size="11.5">requests/orders</text>
  <text x="823" y="397" fill="#9aa7b4" font-size="11.5">drivers/dashers</text>
  <line x1="578" y1="232" x2="657" y2="250" stroke="#ff8bd2" stroke-width="2.4" marker-end="url(#md-p)"/>
  <line x1="578" y1="421" x2="657" y2="338" stroke="#ffd27f" stroke-width="2.4" marker-end="url(#md-o)"/>

  <!-- batch optimizer -->
  <rect x="660" y="470" width="245" height="140" rx="10" fill="#15233a" stroke="#93c5fd" stroke-width="2.5" filter="url(#md-shadow)"/>
  <text x="782" y="504" fill="#93c5fd" font-size="17" font-weight="700" text-anchor="middle">Batch Optimizer</text>
  <text x="782" y="531" fill="#e6edf3" font-size="12.5" text-anchor="middle">solve every few seconds</text>
  <text x="782" y="550" fill="#e6edf3" font-size="12.5" text-anchor="middle">one-to-one: bipartite match</text>
  <text x="782" y="569" fill="#e6edf3" font-size="12.5" text-anchor="middle">delivery batching: MIP</text>
  <text x="782" y="590" fill="#9aa7b4" font-size="11.5" text-anchor="middle">quality vs utilization vs future value</text>
  <line x1="782" y1="382" x2="782" y2="467" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#md-b)"/>

  <!-- commit/reserve -->
  <rect x="988" y="206" width="212" height="118" rx="10" fill="#25220e" stroke="#ffff99" stroke-width="2.5" filter="url(#md-shadow)"/>
  <text x="1094" y="239" fill="#ffff99" font-size="17" font-weight="700" text-anchor="middle">Atomic Reservation</text>
  <text x="1094" y="266" fill="#e6edf3" font-size="12.5" text-anchor="middle">reserve driver/order once</text>
  <text x="1094" y="285" fill="#e6edf3" font-size="12.5" text-anchor="middle">write assignment record</text>
  <text x="1094" y="306" fill="#9aa7b4" font-size="11.5" text-anchor="middle">prevents double dispatch</text>
  <path d="M906,540 C965,520 956,300 985,276" fill="none" stroke="#ffff99" stroke-width="2.5" marker-end="url(#md-y)"/>

  <rect x="988" y="385" width="212" height="118" rx="10" fill="#13241a" stroke="#8aff8a" stroke-width="2.5" filter="url(#md-shadow)"/>
  <text x="1094" y="418" fill="#8aff8a" font-size="17" font-weight="700" text-anchor="middle">Offer + Response</text>
  <text x="1094" y="445" fill="#e6edf3" font-size="12.5" text-anchor="middle">send offer to driver</text>
  <text x="1094" y="464" fill="#e6edf3" font-size="12.5" text-anchor="middle">accept -> assign</text>
  <text x="1094" y="485" fill="#9aa7b4" font-size="11.5" text-anchor="middle">decline / timeout -> retry</text>
  <line x1="1094" y1="326" x2="1094" y2="382" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#md-g)"/>
  <path d="M988,455 C944,454 932,579 908,579" fill="none" stroke="#ff8a8a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#md-p)"/>
  <text x="944" y="615" fill="#ff8a8a" font-size="11.5" text-anchor="middle">decline loops back</text>

  <!-- feedback -->
  <rect x="358" y="610" width="250" height="80" rx="10" fill="#101823" stroke="#93c5fd" stroke-width="1.8"/>
  <text x="483" y="641" fill="#93c5fd" font-size="15" font-weight="700" text-anchor="middle">Feedback Events</text>
  <text x="483" y="664" fill="#e6edf3" font-size="12.5" text-anchor="middle">acceptance, pickup, lateness, cancel</text>
  <text x="483" y="682" fill="#9aa7b4" font-size="11.5" text-anchor="middle">train models + tune optimizer</text>
  <path d="M1094,506 C1050,690 650,650 611,650" fill="none" stroke="#93c5fd" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#md-b)"/>
  <path d="M483,610 C485,568 517,535 610,536" fill="none" stroke="#93c5fd" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#md-b)"/>

  <!-- bottom note -->
  <rect x="44" y="710" width="1192" height="34" rx="7" fill="#11161d" stroke="#2b3441" stroke-width="1.2"/>
  <text x="640" y="732" fill="#ffff99" font-size="13.5" font-style="italic" text-anchor="middle">Mental model: geohash/H3/S2 finds a small candidate set; matching chooses the globally best feasible assignment and commits it exactly once.</text>
</svg>
