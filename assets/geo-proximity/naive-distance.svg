<svg width="1100" height="600" viewBox="0 0 1100 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="nd-g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8aff8a"/></marker>
    <marker id="nd-r" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#ff8a8a"/></marker>
  </defs>
  <rect x="0" y="0" width="1100" height="600" fill="#0d1117"/>
  <text x="40" y="50" fill="#e6edf3" font-size="32" font-weight="700">The naive check: measure distance to everyone</text>
  <text x="40" y="82" fill="#9aa7b4" font-size="17">A point is near if distance(A, point) &#60; k. Cheap arithmetic — but you must run it against the whole fleet.</text>

  <!-- radius circle -->
  <circle cx="360" cy="330" r="200" fill="#12203a" fill-opacity="0.45" stroke="#93c5fd" stroke-width="2"/>
  <!-- center A -->
  <circle cx="360" cy="330" r="8" fill="#ffff99"/>
  <text x="360" y="315" fill="#ffff99" font-size="20" font-weight="700" text-anchor="middle">A</text>
  <!-- radius label -->
  <line x1="360" y1="330" x2="560" y2="330" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="455" y="322" fill="#93c5fd" font-size="16" text-anchor="middle">radius k</text>

  <!-- scattered candidate points -->
  <g fill="#ff8bd2">
    <circle cx="300" cy="230" r="6"/><circle cx="430" cy="250" r="6"/><circle cx="260" cy="360" r="6"/>
    <circle cx="410" cy="420" r="6"/><circle cx="330" cy="450" r="6"/><circle cx="470" cy="360" r="6"/>
    <circle cx="220" cy="300" r="6"/>
    <circle cx="150" cy="180" r="6"/><circle cx="620" cy="200" r="6"/><circle cx="650" cy="470" r="6"/>
    <circle cx="180" cy="520" r="6"/><circle cx="560" cy="520" r="6"/><circle cx="90" cy="400" r="6"/>
  </g>

  <!-- B inside -->
  <circle cx="300" cy="230" r="8" fill="#8aff8a"/>
  <text x="288" y="222" fill="#8aff8a" font-size="18" font-weight="700" text-anchor="end">B</text>
  <line x1="360" y1="330" x2="303" y2="234" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#nd-g)"/>
  <!-- C inside -->
  <circle cx="470" cy="360" r="8" fill="#8aff8a"/>
  <text x="484" y="366" fill="#8aff8a" font-size="18" font-weight="700">C</text>
  <line x1="360" y1="330" x2="466" y2="358" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#nd-g)"/>
  <text x="360" y="560" fill="#8aff8a" font-size="15" text-anchor="middle">B, C inside &#8594; distance &#60; k &#8594; near</text>

  <!-- Z outside -->
  <circle cx="720" cy="140" r="8" fill="#ff8a8a"/>
  <text x="734" y="140" fill="#ff8a8a" font-size="18" font-weight="700">Z</text>
  <line x1="360" y1="330" x2="714" y2="145" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#nd-r)"/>
  <text x="560" y="228" fill="#ff8a8a" font-size="15" text-anchor="middle">Z outside &#8594; distance &#62; k &#8594; far</text>

  <!-- the catch panel -->
  <rect x="640" y="300" width="420" height="250" rx="12" fill="#2a1517" stroke="#ff8a8a" stroke-width="2.5"/>
  <text x="850" y="336" fill="#ff8a8a" font-size="19" font-weight="700" text-anchor="middle">The catch</text>
  <text x="662" y="372" fill="#e6edf3" font-size="15">Nothing tells you in advance which points</text>
  <text x="662" y="396" fill="#e6edf3" font-size="15">are close. So you must measure the distance</text>
  <text x="662" y="420" fill="#e6edf3" font-size="15">from A to <tspan fill="#ffff99" font-weight="700">every single point</tspan> — B, C, Z,</text>
  <text x="662" y="444" fill="#e6edf3" font-size="15">and all the others.</text>
  <text x="850" y="492" fill="#ff8a8a" font-size="30" font-weight="700" text-anchor="middle">O(N) per query</text>
  <text x="850" y="524" fill="#9aa7b4" font-size="14" text-anchor="middle">every query scans the whole fleet —</text>
  <text x="850" y="542" fill="#9aa7b4" font-size="14" text-anchor="middle">hundreds of thousands of drivers</text>
</svg>
