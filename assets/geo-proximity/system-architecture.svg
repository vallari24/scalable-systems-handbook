<svg width="1100" height="700" viewBox="0 0 1100 700" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="sa-p" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#ff8bd2"/></marker>
    <marker id="sa-g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8aff8a"/></marker>
    <marker id="sa-b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#93c5fd"/></marker>
    <marker id="sa-w" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#cdd9e5"/></marker>
  </defs>
  <rect x="0" y="0" width="1100" height="700" fill="#0d1117"/>
  <text x="40" y="48" fill="#e6edf3" font-size="31" font-weight="700">The proximity service: write path and read path</text>
  <text x="40" y="78" fill="#9aa7b4" font-size="17">Locations stream in and get buffered; matching queries fan out over read replicas.</text>

  <!-- big half labels -->
  <rect x="30" y="98" width="530" height="30" rx="6" fill="#221019" stroke="#ff8bd2" stroke-width="1"/>
  <text x="295" y="119" fill="#ff8bd2" font-size="15" font-weight="700" text-anchor="middle">WRITE HEAVY — locations streaming in</text>
  <rect x="575" y="98" width="495" height="30" rx="6" fill="#13241a" stroke="#8aff8a" stroke-width="1"/>
  <text x="822" y="119" fill="#8aff8a" font-size="15" font-weight="700" text-anchor="middle">READ HEAVY — matching queries</text>

  <!-- phones -->
  <text x="95" y="162" fill="#e6edf3" font-size="15" font-weight="700" text-anchor="middle">Driver phones</text>
  <g fill="#161b22" stroke="#3b4654" stroke-width="2">
    <rect x="65" y="176" width="48" height="70" rx="6"/>
    <rect x="65" y="256" width="48" height="70" rx="6"/>
    <rect x="65" y="336" width="48" height="70" rx="6"/>
  </g>
  <text x="89" y="218" font-size="17" text-anchor="middle">📍</text>
  <text x="89" y="298" font-size="17" text-anchor="middle">📍</text>
  <text x="89" y="378" font-size="17" text-anchor="middle">📍</text>
  <text x="89" y="428" fill="#9aa7b4" font-size="11" text-anchor="middle">every few sec</text>

  <!-- ingestion service -->
  <rect x="150" y="240" width="130" height="100" rx="10" fill="#161b22" stroke="#ff8bd2" stroke-width="2.5"/>
  <text x="215" y="278" fill="#ff8bd2" font-size="14" font-weight="700" text-anchor="middle">Location</text>
  <text x="215" y="296" fill="#ff8bd2" font-size="14" font-weight="700" text-anchor="middle">Ingestion</text>
  <text x="215" y="320" fill="#9aa7b4" font-size="11" text-anchor="middle">stateless, behind LB</text>
  <line x1="116" y1="211" x2="147" y2="270" stroke="#ff8bd2" stroke-width="2" marker-end="url(#sa-p)"/>
  <line x1="116" y1="291" x2="147" y2="290" stroke="#ff8bd2" stroke-width="2" marker-end="url(#sa-p)"/>
  <line x1="116" y1="371" x2="147" y2="312" stroke="#ff8bd2" stroke-width="2" marker-end="url(#sa-p)"/>

  <!-- kafka -->
  <rect x="305" y="250" width="150" height="80" rx="8" fill="#1a1420" stroke="#ffff99" stroke-width="2"/>
  <text x="380" y="280" fill="#ffff99" font-size="16" font-weight="700" text-anchor="middle">Kafka</text>
  <g stroke="#ffff99" stroke-width="1.4" fill="none">
    <rect x="320" y="295" width="18" height="20"/><rect x="340" y="295" width="18" height="20"/><rect x="360" y="295" width="18" height="20"/><rect x="380" y="295" width="18" height="20"/><rect x="400" y="295" width="18" height="20"/><rect x="420" y="295" width="18" height="20"/>
  </g>
  <text x="380" y="348" fill="#9aa7b4" font-size="11" text-anchor="middle">partitioned log — absorbs spikes</text>
  <line x1="282" y1="290" x2="302" y2="290" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#sa-p)"/>

  <!-- consumers -->
  <rect x="305" y="386" width="150" height="46" rx="8" fill="#161b22" stroke="#3b4654" stroke-width="2"/>
  <text x="380" y="414" fill="#e6edf3" font-size="13" text-anchor="middle">consumer pool</text>
  <line x1="380" y1="332" x2="380" y2="384" stroke="#ffff99" stroke-width="2.5" marker-end="url(#sa-g)"/>

  <!-- redis master -->
  <path d="M480,250 a58,17 0 0,0 116,0 v78 a58,17 0 0,1 -116,0 z" fill="#221019" stroke="#ff8bd2" stroke-width="2.5"/>
  <ellipse cx="538" cy="250" rx="58" ry="17" fill="#221019" stroke="#ff8bd2" stroke-width="2.5"/>
  <text x="538" y="285" fill="#ff8bd2" font-size="15" font-weight="700" text-anchor="middle">Redis</text>
  <text x="538" y="304" fill="#ff8bd2" font-size="15" font-weight="700" text-anchor="middle">Master</text>
  <text x="538" y="326" fill="#9aa7b4" font-size="10.5" text-anchor="middle">write-heavy</text>
  <line x1="456" y1="409" x2="500" y2="330" stroke="#ffff99" stroke-width="2.5" marker-end="url(#sa-p)"/>
  <text x="540" y="360" fill="#9aa7b4" font-size="11" text-anchor="middle">key = user id</text>
  <text x="540" y="376" fill="#9aa7b4" font-size="11" text-anchor="middle">value = current loc</text>
  <text x="540" y="392" fill="#9aa7b4" font-size="10.5" font-style="italic" text-anchor="middle">overwrite — no history</text>

  <!-- async repl to follower -->
  <path d="M596,272 C660,255 700,255 662,272" fill="none" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#sa-b)"/>
  <text x="640" y="238" fill="#93c5fd" font-size="12" text-anchor="middle">async replication</text>

  <!-- redis followers -->
  <path d="M660,250 a52,15 0 0,0 104,0 v72 a52,15 0 0,1 -104,0 z" fill="#15233a" stroke="#93c5fd" stroke-width="2"/>
  <ellipse cx="712" cy="250" rx="52" ry="15" fill="#15233a" stroke="#93c5fd" stroke-width="2"/>
  <text x="712" y="282" fill="#93c5fd" font-size="13" font-weight="700" text-anchor="middle">Redis</text>
  <text x="712" y="300" fill="#93c5fd" font-size="13" font-weight="700" text-anchor="middle">Followers</text>
  <text x="712" y="320" fill="#9aa7b4" font-size="10.5" text-anchor="middle">read replicas</text>

  <!-- matching service -->
  <rect x="800" y="240" width="140" height="100" rx="10" fill="#161b22" stroke="#8aff8a" stroke-width="2.5"/>
  <text x="870" y="278" fill="#8aff8a" font-size="15" font-weight="700" text-anchor="middle">Matching</text>
  <text x="870" y="297" fill="#8aff8a" font-size="15" font-weight="700" text-anchor="middle">Service</text>
  <text x="870" y="320" fill="#9aa7b4" font-size="11" text-anchor="middle">read-heavy</text>
  <line x1="800" y1="290" x2="766" y2="290" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#sa-g)"/>
  <text x="783" y="278" fill="#8aff8a" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">GEOSEARCH</text>

  <!-- users -->
  <g stroke="#cdd9e5" stroke-width="2" fill="none">
    <circle cx="1010" cy="255" r="9"/><line x1="1010" y1="264" x2="1010" y2="288"/><line x1="1010" y1="272" x2="998" y2="284"/><line x1="1010" y1="272" x2="1022" y2="284"/>
    <circle cx="1010" cy="310" r="9"/><line x1="1010" y1="319" x2="1010" y2="343"/><line x1="1010" y1="327" x2="998" y2="339"/><line x1="1010" y1="327" x2="1022" y2="339"/>
  </g>
  <text x="1010" y="365" fill="#9aa7b4" font-size="11" text-anchor="middle">riders / eaters</text>
  <line x1="942" y1="290" x2="988" y2="285" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#sa-g)"/>

  <!-- sharded store bottom -->
  <rect x="40" y="470" width="1020" height="210" rx="10" fill="#11161d" stroke="#2b3441" stroke-width="1.5"/>
  <text x="60" y="500" fill="#ffd27f" font-size="16" font-weight="700">The store is sharded by region / city — each a Master + replicas group</text>
  <g>
    <!-- group 1 -->
    <path d="M110,540 a40,12 0 0,0 80,0 v56 a40,12 0 0,1 -80,0 z" fill="#221019" stroke="#ff8bd2" stroke-width="2"/>
    <ellipse cx="150" cy="540" rx="40" ry="12" fill="#221019" stroke="#ff8bd2" stroke-width="2"/>
    <text x="150" y="575" fill="#ff8bd2" font-size="12" text-anchor="middle">Master 1</text>
    <path d="M215,545 a34,10 0 0,0 68,0 v48 a34,10 0 0,1 -68,0 z" fill="#15233a" stroke="#93c5fd" stroke-width="1.6"/>
    <ellipse cx="249" cy="545" rx="34" ry="10" fill="#15233a" stroke="#93c5fd" stroke-width="1.6"/>
    <text x="249" y="576" fill="#93c5fd" font-size="11" text-anchor="middle">replicas</text>
    <text x="200" y="620" fill="#9aa7b4" font-size="12" text-anchor="middle">region A (NYC)</text>
  </g>
  <g>
    <path d="M410,540 a40,12 0 0,0 80,0 v56 a40,12 0 0,1 -80,0 z" fill="#221019" stroke="#ff8bd2" stroke-width="2"/>
    <ellipse cx="450" cy="540" rx="40" ry="12" fill="#221019" stroke="#ff8bd2" stroke-width="2"/>
    <text x="450" y="575" fill="#ff8bd2" font-size="12" text-anchor="middle">Master 2</text>
    <path d="M515,545 a34,10 0 0,0 68,0 v48 a34,10 0 0,1 -68,0 z" fill="#15233a" stroke="#93c5fd" stroke-width="1.6"/>
    <ellipse cx="549" cy="545" rx="34" ry="10" fill="#15233a" stroke="#93c5fd" stroke-width="1.6"/>
    <text x="549" y="576" fill="#93c5fd" font-size="11" text-anchor="middle">replicas</text>
    <text x="500" y="620" fill="#9aa7b4" font-size="12" text-anchor="middle">region B (SF)</text>
  </g>
  <g>
    <path d="M710,540 a40,12 0 0,0 80,0 v56 a40,12 0 0,1 -80,0 z" fill="#221019" stroke="#ff8bd2" stroke-width="2"/>
    <ellipse cx="750" cy="540" rx="40" ry="12" fill="#221019" stroke="#ff8bd2" stroke-width="2"/>
    <text x="750" y="575" fill="#ff8bd2" font-size="12" text-anchor="middle">Master N</text>
    <path d="M815,545 a34,10 0 0,0 68,0 v48 a34,10 0 0,1 -68,0 z" fill="#15233a" stroke="#93c5fd" stroke-width="1.6"/>
    <ellipse cx="849" cy="545" rx="34" ry="10" fill="#15233a" stroke="#93c5fd" stroke-width="1.6"/>
    <text x="849" y="576" fill="#93c5fd" font-size="11" text-anchor="middle">replicas</text>
    <text x="800" y="620" fill="#9aa7b4" font-size="12" text-anchor="middle">region … (Chicago)</text>
  </g>
  <text x="950" y="560" fill="#9aa7b4" font-size="13" text-anchor="middle">add more</text>
  <text x="950" y="578" fill="#9aa7b4" font-size="13" text-anchor="middle">groups to</text>
  <text x="950" y="596" fill="#9aa7b4" font-size="13" text-anchor="middle">scale out</text>
  <text x="550" y="660" fill="#ffff99" font-size="13.5" font-style="italic" text-anchor="middle">sharded master — a query in NYC never touches Chicago's data</text>
</svg>
