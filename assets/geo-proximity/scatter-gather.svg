<svg width="1100" height="560" viewBox="0 0 1100 560" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="sg-w" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#cdd9e5"/></marker>
    <marker id="sg-g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8aff8a"/></marker>
    <marker id="sg-r" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#ff8a8a"/></marker>
  </defs>
  <rect x="0" y="0" width="1100" height="560" fill="#0d1117"/>
  <text x="40" y="48" fill="#e6edf3" font-size="31" font-weight="700">Low latency at the tail: scatter-gather</text>
  <text x="40" y="78" fill="#9aa7b4" font-size="17">Split one big radius query into smaller parallel sub-queries; gather what returns by the deadline.</text>

  <!-- coordinator -->
  <rect x="55" y="235" width="160" height="110" rx="12" fill="#161b22" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="135" y="273" fill="#93c5fd" font-size="15" font-weight="700" text-anchor="middle">Coordinator</text>
  <text x="135" y="293" fill="#9aa7b4" font-size="12" text-anchor="middle">(Matching svc)</text>
  <text x="135" y="318" fill="#e6edf3" font-size="12" text-anchor="middle">1 query in →</text>
  <text x="135" y="335" fill="#e6edf3" font-size="12" text-anchor="middle">split into sub-queries</text>
  <text x="135" y="210" fill="#9aa7b4" font-size="12" text-anchor="middle">one proximity query</text>
  <line x1="135" y1="180" x2="135" y2="232" stroke="#cdd9e5" stroke-width="2.5" marker-end="url(#sg-w)"/>

  <!-- split note -->
  <text x="300" y="215" fill="#9aa7b4" font-size="12" text-anchor="middle">by sub-region /</text>
  <text x="300" y="231" fill="#9aa7b4" font-size="12" text-anchor="middle">neighbor geohash cells</text>

  <!-- three redis nodes -->
  <!-- node A fast -->
  <path d="M470,150 a48,14 0 0,0 96,0 v50 a48,14 0 0,1 -96,0 z" fill="#13241a" stroke="#8aff8a" stroke-width="2"/>
  <ellipse cx="518" cy="150" rx="48" ry="14" fill="#13241a" stroke="#8aff8a" stroke-width="2"/>
  <text x="518" y="182" fill="#8aff8a" font-size="14" font-weight="700" text-anchor="middle">Redis</text>
  <text x="518" y="222" fill="#8aff8a" font-size="12" text-anchor="middle">fast ✓</text>
  <line x1="217" y1="270" x2="466" y2="180" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#sg-g)"/>

  <!-- node B fast -->
  <path d="M470,265 a48,14 0 0,0 96,0 v50 a48,14 0 0,1 -96,0 z" fill="#13241a" stroke="#8aff8a" stroke-width="2"/>
  <ellipse cx="518" cy="265" rx="48" ry="14" fill="#13241a" stroke="#8aff8a" stroke-width="2"/>
  <text x="518" y="297" fill="#8aff8a" font-size="14" font-weight="700" text-anchor="middle">Redis</text>
  <text x="518" y="337" fill="#8aff8a" font-size="12" text-anchor="middle">fast ✓</text>
  <line x1="217" y1="290" x2="466" y2="290" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#sg-g)"/>

  <!-- node C slow -->
  <path d="M470,385 a48,14 0 0,0 96,0 v50 a48,14 0 0,1 -96,0 z" fill="#241416" stroke="#ff8a8a" stroke-width="2"/>
  <ellipse cx="518" cy="385" rx="48" ry="14" fill="#241416" stroke="#ff8a8a" stroke-width="2"/>
  <text x="518" y="417" fill="#ff8a8a" font-size="14" font-weight="700" text-anchor="middle">Redis</text>
  <text x="518" y="457" fill="#ff8a8a" font-size="12" text-anchor="middle">slow / down ✕</text>
  <line x1="217" y1="315" x2="466" y2="405" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#sg-r)" stroke-dasharray="6 4"/>

  <!-- merge / gather -->
  <rect x="640" y="235" width="150" height="110" rx="12" fill="#161b22" stroke="#8aff8a" stroke-width="2.5"/>
  <text x="715" y="285" fill="#8aff8a" font-size="15" font-weight="700" text-anchor="middle">Gather</text>
  <text x="715" y="308" fill="#9aa7b4" font-size="12" text-anchor="middle">merge responses</text>
  <text x="715" y="325" fill="#9aa7b4" font-size="12" text-anchor="middle">arrived by deadline</text>
  <line x1="566" y1="175" x2="637" y2="258" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#sg-g)"/>
  <line x1="566" y1="290" x2="637" y2="290" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#sg-g)"/>
  <line x1="566" y1="410" x2="637" y2="322" stroke="#ff8a8a" stroke-width="2" marker-end="url(#sg-r)" stroke-dasharray="6 4"/>

  <!-- three wins -->
  <rect x="825" y="150" width="245" height="76" rx="10" fill="#11221a" stroke="#8aff8a" stroke-width="1.4"/>
  <text x="845" y="178" fill="#8aff8a" font-size="14" font-weight="700">Availability</text>
  <text x="845" y="200" fill="#e6edf3" font-size="12.5">one slow/down node doesn't</text>
  <text x="845" y="217" fill="#e6edf3" font-size="12.5">stall the rest.</text>

  <rect x="825" y="242" width="245" height="76" rx="10" fill="#15233a" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="845" y="270" fill="#93c5fd" font-size="14" font-weight="700">Latency</text>
  <text x="845" y="292" fill="#e6edf3" font-size="12.5">parallel sub-queries beat one</text>
  <text x="845" y="309" fill="#e6edf3" font-size="12.5">big serial scan.</text>

  <rect x="825" y="334" width="245" height="86" rx="10" fill="#1a1420" stroke="#ffd27f" stroke-width="1.4"/>
  <text x="845" y="362" fill="#ffd27f" font-size="14" font-weight="700">Graceful degradation</text>
  <text x="845" y="384" fill="#e6edf3" font-size="12.5">SLA deadline hit? return a</text>
  <text x="845" y="401" fill="#e6edf3" font-size="12.5">partial result from whoever</text>
  <text x="845" y="416" fill="#e6edf3" font-size="12.5">answered — skip the straggler.</text>

  <text x="550" y="500" fill="#ffff99" font-size="14" font-style="italic" text-anchor="middle">"Here are 18 of the 20 nearby drivers, right now" beats "the perfect 20, 300 ms late."</text>
  <text x="550" y="525" fill="#9aa7b4" font-size="13" text-anchor="middle">Partial results are only OK because the task is approximate — the AP choice pays off again.</text>
</svg>
