<svg width="1100" height="560" viewBox="0 0 1100 560" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ev-w" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#cdd9e5"/></marker>
    <marker id="ev-r" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#ff8a8a"/></marker>
    <marker id="ev-g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8aff8a"/></marker>
  </defs>
  <rect x="0" y="0" width="1100" height="560" fill="#0d1117"/>
  <text x="40" y="48" fill="#e6edf3" font-size="31" font-weight="700">Filtering on replicas: the EVAL_RO challenge</text>
  <text x="40" y="78" fill="#9aa7b4" font-size="17">Rich filtering runs as a server-side Lua script — but Redis won't run a plain EVAL on a replica.</text>

  <line x1="550" y1="110" x2="550" y2="530" stroke="#2b3441" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="290" y="120" fill="#ff8a8a" font-size="17" font-weight="700" text-anchor="middle">The problem</text>
  <text x="825" y="120" fill="#8aff8a" font-size="17" font-weight="700" text-anchor="middle">The fix — Redis 7.0</text>

  <!-- LEFT: problem -->
  <!-- client -->
  <g stroke="#cdd9e5" stroke-width="2.5" fill="none">
    <circle cx="90" cy="250" r="13"/><line x1="90" y1="263" x2="90" y2="300"/><line x1="90" y1="275" x2="72" y2="292"/><line x1="90" y1="275" x2="108" y2="292"/>
  </g>
  <text x="90" y="325" fill="#9aa7b4" font-size="12" text-anchor="middle">client</text>
  <text x="90" y="342" fill="#9aa7b4" font-size="11" text-anchor="middle">(filter script)</text>

  <!-- EVAL to replica -->
  <rect x="330" y="150" width="180" height="66" rx="10" fill="#15233a" stroke="#93c5fd" stroke-width="2"/>
  <text x="420" y="180" fill="#93c5fd" font-size="15" font-weight="700" text-anchor="middle">Replica 2-1</text>
  <text x="420" y="202" fill="#9aa7b4" font-size="12" text-anchor="middle">read-only</text>
  <line x1="118" y1="245" x2="326" y2="188" stroke="#cdd9e5" stroke-width="2.5" marker-end="url(#ev-w)"/>
  <text x="222" y="205" fill="#cdd9e5" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle" font-weight="700">EVAL</text>

  <!-- MOVED response -->
  <line x1="326" y1="216" x2="150" y2="268" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#ev-r)" stroke-dasharray="6 4"/>
  <text x="252" y="262" fill="#ff8a8a" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">MOVED &lt;master ip&gt;</text>

  <!-- forced to master -->
  <rect x="330" y="300" width="180" height="66" rx="10" fill="#241416" stroke="#ff8a8a" stroke-width="2.2"/>
  <text x="420" y="330" fill="#ff8a8a" font-size="15" font-weight="700" text-anchor="middle">Master</text>
  <text x="420" y="352" fill="#9aa7b4" font-size="12" text-anchor="middle">bottleneck</text>
  <line x1="118" y1="300" x2="326" y2="333" stroke="#cdd9e5" stroke-width="2.5" marker-end="url(#ev-w)"/>
  <text x="215" y="345" fill="#cdd9e5" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle" font-weight="700">EVAL</text>

  <rect x="55" y="410" width="470" height="110" rx="10" fill="#1a1113" stroke="#ff8a8a" stroke-width="1.4"/>
  <text x="75" y="438" fill="#ff8a8a" font-size="13.5" font-weight="700">Why refuse? A script could contain a write,</text>
  <text x="75" y="460" fill="#e6edf3" font-size="13.5">and replicas are read-only — so Redis routes</text>
  <text x="75" y="482" fill="#e6edf3" font-size="13.5">every EVAL to the master. Replicas sit idle,</text>
  <text x="75" y="504" fill="#e6edf3" font-size="13.5">the master becomes the read bottleneck.</text>

  <!-- RIGHT: fix -->
  <g stroke="#cdd9e5" stroke-width="2.5" fill="none">
    <circle cx="640" cy="250" r="13"/><line x1="640" y1="263" x2="640" y2="300"/><line x1="640" y1="275" x2="622" y2="292"/><line x1="640" y1="275" x2="658" y2="292"/>
  </g>
  <text x="640" y="325" fill="#9aa7b4" font-size="12" text-anchor="middle">client</text>

  <rect x="820" y="215" width="200" height="70" rx="10" fill="#15233a" stroke="#8aff8a" stroke-width="2.2"/>
  <text x="920" y="245" fill="#8aff8a" font-size="15" font-weight="700" text-anchor="middle">Replica 2-1</text>
  <text x="920" y="268" fill="#9aa7b4" font-size="12" text-anchor="middle">runs it locally</text>
  <line x1="668" y1="250" x2="816" y2="250" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#ev-g)"/>
  <text x="742" y="238" fill="#8aff8a" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle" font-weight="700">EVAL_RO</text>
  <text x="1000" y="238" fill="#8aff8a" font-size="26" font-weight="700">✓</text>

  <rect x="620" y="320" width="420" height="90" rx="10" fill="#11221a" stroke="#8aff8a" stroke-width="1.4"/>
  <text x="640" y="347" fill="#8aff8a" font-size="13.5" font-weight="700">EVAL_RO / EVALSHA_RO — a read-only script</text>
  <text x="640" y="369" fill="#e6edf3" font-size="13.5">variant (readonly flag), safe on replicas. Any</text>
  <text x="640" y="391" fill="#e6edf3" font-size="13.5">write inside fails with an error — no corruption.</text>

  <rect x="620" y="424" width="420" height="96" rx="10" fill="#11161d" stroke="#2b3441" stroke-width="1.4"/>
  <text x="640" y="450" fill="#ffff99" font-size="13.5" font-weight="700">Gojek hit this exact wall &amp; fixed it upstream:</text>
  <text x="640" y="472" fill="#e6edf3" font-size="13">• proposed EVAL_RO to Redis (issue #8537,</text>
  <text x="654" y="490" fill="#9aa7b4" font-size="12.5">GEORADIUS_RO set the precedent)</text>
  <text x="640" y="510" fill="#e6edf3" font-size="13">• patched go-redis to route it to replicas (PR #1581)</text>

  <text x="550" y="548" fill="#9aa7b4" font-size="13.5" font-style="italic" text-anchor="middle">Read-only scripts on replicas ⇒ filtering scales with the read fleet, not bottlenecked on the master.</text>
</svg>
