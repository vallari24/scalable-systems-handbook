<svg width="1100" height="620" viewBox="0 0 1100 620" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pq-o" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#ffd27f"/></marker>
  </defs>
  <rect x="0" y="0" width="1100" height="620" fill="#0d1117"/>
  <text x="40" y="50" fill="#e6edf3" font-size="31" font-weight="700">Querying by prefix, expanding by zooming out</text>
  <text x="40" y="82" fill="#9aa7b4" font-size="17">Pull everyone under your prefix. Too few? Drop the last character — one level up the trie, a 32&#215; bigger cell — and re-query.</text>

  <!-- LEFT: trie -->
  <text x="70" y="128" fill="#93c5fd" font-size="17" font-weight="700">Trie of geohashes</text>
  <!-- path highlighted 9 q 8 y y -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15">
    <!-- vertical chain of nodes -->
    <line x1="120" y1="160" x2="120" y2="215" stroke="#8aff8a" stroke-width="2.4"/>
    <line x1="120" y1="215" x2="120" y2="270" stroke="#8aff8a" stroke-width="2.4"/>
    <line x1="120" y1="270" x2="120" y2="325" stroke="#ffd27f" stroke-width="2.8"/>
    <line x1="120" y1="325" x2="120" y2="380" stroke="#8aff8a" stroke-width="2.4"/>
    <circle cx="120" cy="160" r="11" fill="#161b22" stroke="#3b4654" stroke-width="2"/><text x="142" y="165" fill="#9aa7b4">9</text>
    <circle cx="120" cy="215" r="11" fill="#161b22" stroke="#3b4654" stroke-width="2"/><text x="142" y="220" fill="#9aa7b4">q</text>
    <circle cx="120" cy="270" r="11" fill="#161b22" stroke="#ffd27f" stroke-width="2.4"/><text x="142" y="275" fill="#ffd27f" font-weight="700">8   &#8592; drop to 9q8</text>
    <circle cx="120" cy="325" r="11" fill="#1f2417" stroke="#ffd27f" stroke-width="2.4"/><text x="142" y="330" fill="#ffd27f" font-weight="700">y   &#8592; drop to 9q8y</text>
    <circle cx="120" cy="380" r="12" fill="#13241a" stroke="#8aff8a" stroke-width="2.6"/><text x="142" y="385" fill="#8aff8a" font-weight="700">y   = 9q8yy (query cell)</text>
  </g>
  <!-- drivers under node: only 2 -->
  <circle cx="95" cy="430" r="8" fill="#8aff8a"/><circle cx="145" cy="430" r="8" fill="#8aff8a"/>
  <line x1="112" y1="392" x2="98" y2="418" stroke="#3b4654" stroke-width="1.6"/>
  <line x1="128" y1="392" x2="142" y2="418" stroke="#3b4654" stroke-width="1.6"/>
  <text x="120" y="462" fill="#ff8a8a" font-size="14" text-anchor="middle">only 2 drivers &#8212; not enough</text>

  <!-- CENTER: expand -->
  <line x1="290" y1="330" x2="410" y2="330" stroke="#ffd27f" stroke-width="2.5" marker-end="url(#pq-o)"/>
  <text x="350" y="315" fill="#ffd27f" font-size="14" text-anchor="middle" font-weight="600">zoom out</text>
  <rect x="425" y="150" width="270" height="330" rx="12" fill="#11161d" stroke="#2b3441" stroke-width="1.5"/>
  <text x="450" y="182" fill="#ffd27f" font-size="16" font-weight="700">Drop last char &#8594; 9q8y</text>
  <text x="450" y="205" fill="#9aa7b4" font-size="13">one level up = subtree of sibling cells</text>
  <!-- subtree -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">
    <circle cx="560" cy="240" r="11" fill="#1f2417" stroke="#ffd27f" stroke-width="2.4"/><text x="560" y="245" fill="#ffd27f" text-anchor="middle">y</text>
    <line x1="560" y1="251" x2="500" y2="300" stroke="#8aff8a" stroke-width="2"/>
    <line x1="560" y1="251" x2="560" y2="300" stroke="#8aff8a" stroke-width="2"/>
    <line x1="560" y1="251" x2="620" y2="300" stroke="#8aff8a" stroke-width="2"/>
    <circle cx="500" cy="312" r="11" fill="#13241a" stroke="#8aff8a" stroke-width="2"/><text x="500" y="317" fill="#8aff8a" text-anchor="middle">y</text>
    <circle cx="560" cy="312" r="11" fill="#161b22" stroke="#8aff8a" stroke-width="2"/><text x="560" y="317" fill="#8aff8a" text-anchor="middle">b</text>
    <circle cx="620" cy="312" r="11" fill="#161b22" stroke="#8aff8a" stroke-width="2"/><text x="620" y="317" fill="#8aff8a" text-anchor="middle">c</text>
    <text x="470" y="345" fill="#9aa7b4">9q8yy</text>
    <text x="540" y="345" fill="#9aa7b4">9q8yb</text>
    <text x="600" y="345" fill="#9aa7b4">9q8yc</text>
  </g>
  <!-- many drivers -->
  <g fill="#8aff8a">
    <circle cx="470" cy="385" r="7"/><circle cx="495" cy="400" r="7"/><circle cx="520" cy="382" r="7"/>
    <circle cx="550" cy="402" r="7"/><circle cx="580" cy="386" r="7"/><circle cx="610" cy="400" r="7"/><circle cx="635" cy="384" r="7"/>
  </g>
  <text x="560" y="440" fill="#8aff8a" font-size="14" text-anchor="middle">many more drivers</text>
  <text x="560" y="462" fill="#9aa7b4" font-size="12.5" text-anchor="middle">still too few? drop again: 9q8y &#8594; 9q8</text>

  <!-- RIGHT: nested map cells -->
  <text x="770" y="128" fill="#93c5fd" font-size="17" font-weight="700">On the map</text>
  <rect x="770" y="150" width="290" height="290" fill="#12202e" stroke="#93c5fd" stroke-width="2"/>
  <text x="1045" y="170" fill="#93c5fd" font-size="13" text-anchor="end">9q8</text>
  <rect x="820" y="200" width="180" height="180" fill="#1f2417" stroke="#ffd27f" stroke-width="2"/>
  <text x="985" y="220" fill="#ffd27f" font-size="13" text-anchor="end">9q8y</text>
  <rect x="860" y="245" width="90" height="90" fill="#13241a" stroke="#8aff8a" stroke-width="2.4"/>
  <text x="905" y="295" fill="#8aff8a" font-size="13" text-anchor="middle">9q8yy</text>
  <text x="770" y="472" fill="#9aa7b4" font-size="13">each dropped char = one level up the trie</text>
  <text x="770" y="491" fill="#9aa7b4" font-size="13">= a cell 32&#215; larger (5 bits)</text>

  <!-- caption -->
  <rect x="40" y="540" width="1030" height="60" rx="10" fill="#161b22" stroke="#8aff8a" stroke-width="1.5"/>
  <text x="60" y="567" fill="#cdd9e5" font-size="15.5">Query the prefix; if the result set is too small, shorten the prefix and re-query — zoom out until you have enough candidates,</text>
  <text x="60" y="589" fill="#cdd9e5" font-size="15.5">then rank <tspan fill="#8aff8a" font-weight="700">just those few</tspan> by true distance. Prefix scan prunes; distance ranks.</text>
</svg>
