<svg width="1100" height="580" viewBox="0 0 1100 580" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="tw-y" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffff99"/></marker>
    <marker id="tw-b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#93c5fd"/></marker>
  </defs>
  <rect x="0" y="0" width="1100" height="580" fill="#0d1117"/>
  <text x="40" y="50" fill="#e6edf3" font-size="32" font-weight="700">The 2D wall: you can't index distance</text>
  <text x="40" y="82" fill="#9aa7b4" font-size="17">An index imposes a linear order. No linear order preserves planar distance — so we reframe the problem.</text>

  <!-- Panel 1: the disk -->
  <rect x="40" y="120" width="320" height="330" rx="10" fill="#11161d" stroke="#2b3441" stroke-width="1.5"/>
  <text x="200" y="150" fill="#93c5fd" font-size="16" font-weight="700" text-anchor="middle">nearness in 2D is a disk</text>
  <circle cx="200" cy="300" r="95" fill="#12203a" fill-opacity="0.5" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="200" cy="300" r="7" fill="#ffff99"/>
  <g fill="#ff8bd2">
    <circle cx="160" cy="250" r="6"/><circle cx="245" cy="260" r="6"/><circle cx="150" cy="330" r="6"/>
    <circle cx="255" cy="345" r="6"/><circle cx="210" cy="365" r="6"/><circle cx="130" cy="290" r="6"/>
    <circle cx="270" cy="300" r="6"/>
  </g>
  <text x="200" y="430" fill="#9aa7b4" font-size="13.5" text-anchor="middle">spans N, S, E, W and every</text>
  <text x="200" y="447" fill="#9aa7b4" font-size="13.5" text-anchor="middle">diagonal at once</text>

  <!-- Panel 2: project to latitude -->
  <rect x="390" y="120" width="320" height="330" rx="10" fill="#11161d" stroke="#2b3441" stroke-width="1.5"/>
  <text x="550" y="150" fill="#ff8a8a" font-size="16" font-weight="700" text-anchor="middle">index by latitude alone</text>
  <!-- axis -->
  <line x1="440" y1="180" x2="440" y2="420" stroke="#3b4654" stroke-width="2.5"/>
  <text x="424" y="300" fill="#9aa7b4" font-size="13" text-anchor="middle" transform="rotate(-90 424 300)">latitude axis</text>
  <!-- two far-apart map points same latitude -->
  <circle cx="560" cy="240" r="7" fill="#8aff8a"/><text x="575" y="245" fill="#8aff8a" font-size="13">far east</text>
  <circle cx="680" cy="242" r="7" fill="#8aff8a"/><text x="640" y="225" fill="#8aff8a" font-size="13">far west</text>
  <!-- collapse arrows to same spot on axis -->
  <line x1="553" y1="240" x2="448" y2="240" stroke="#8aff8a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="673" y1="242" x2="448" y2="242" stroke="#8aff8a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="440" cy="241" r="6" fill="#8aff8a"/>
  <text x="550" y="280" fill="#9aa7b4" font-size="12.5" text-anchor="middle">both collapse to one spot</text>
  <!-- true neighbor lands far -->
  <circle cx="560" cy="360" r="7" fill="#ffff99"/><text x="575" y="365" fill="#ffff99" font-size="12">true neighbor</text>
  <line x1="553" y1="360" x2="448" y2="360" stroke="#ffff99" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="440" cy="360" r="6" fill="#ffff99"/>
  <text x="500" y="405" fill="#ff8a8a" font-size="26" font-weight="700" text-anchor="middle">&#10007;</text>
  <text x="560" y="435" fill="#ff8a8a" font-size="12.5" text-anchor="middle">sorting one axis scrambles distance</text>

  <!-- Panel 3: the reframe -->
  <rect x="740" y="120" width="320" height="330" rx="10" fill="#1c1f14" stroke="#ffff99" stroke-width="2"/>
  <text x="900" y="150" fill="#ffff99" font-size="16" font-weight="700" text-anchor="middle">the reframed goal</text>
  <text x="762" y="190" fill="#e6edf3" font-size="14">We're great at 1D range queries.</text>
  <text x="762" y="214" fill="#e6edf3" font-size="14">Can we transform each 2D point</text>
  <text x="762" y="238" fill="#e6edf3" font-size="14">into a single number so that</text>
  <text x="762" y="262" fill="#e6edf3" font-size="14">map-neighbors stay close?</text>
  <text x="900" y="315" fill="#ffff99" font-size="22" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">z = f(lat, long)</text>
  <line x1="820" y1="345" x2="980" y2="345" stroke="#ffff99" stroke-width="2.5" marker-end="url(#tw-y)"/>
  <text x="900" y="392" fill="#e6edf3" font-size="14" text-anchor="middle">if such an f exists,</text>
  <text x="900" y="416" fill="#8aff8a" font-size="15" font-weight="700" text-anchor="middle">2D proximity &#8594; a 1D range query</text>

  <text x="40" y="520" fill="#9aa7b4" font-size="15" font-style="italic">That function f is the geohash — the rest of Half A builds it.</text>
</svg>
