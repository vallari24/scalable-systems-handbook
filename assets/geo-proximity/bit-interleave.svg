<svg width="1100" height="640" viewBox="0 0 1100 640" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="bi-a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#9aa7b4"/></marker>
    <marker id="bi-b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#93c5fd"/></marker>
  </defs>
  <rect x="0" y="0" width="1100" height="640" fill="#0d1117"/>
  <text x="40" y="50" fill="#e6edf3" font-size="31" font-weight="700">Bit interleaving: two coordinates collapse to one number</text>
  <text x="40" y="82" fill="#9aa7b4" font-size="17">Zip longitude and latitude bits together — long picks left/right, lat picks top/bottom — the split-the-world procedure, done in one pass.</text>

  <!-- mapping -->
  <text x="40" y="128" fill="#ffff99" font-size="19" font-family="ui-monospace, Menlo, Consolas, monospace">(x, y) &#8594; z</text>
  <text x="230" y="128" fill="#ffff99" font-size="19" font-family="ui-monospace, Menlo, Consolas, monospace">(lat, long) &#8594; g</text>
  <text x="470" y="128" fill="#9aa7b4" font-size="15">two coordinates &#8594; a single value</text>

  <!-- lat row -->
  <text x="40" y="188" fill="#ff8bd2" font-size="16" font-weight="700">lat</text>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" text-anchor="middle">
    <rect x="80" y="168" width="44" height="40" rx="6" fill="#241726" stroke="#ff8bd2" stroke-width="1.6"/><text x="102" y="196" fill="#ff8bd2">0</text>
    <rect x="128" y="168" width="44" height="40" rx="6" fill="#241726" stroke="#ff8bd2" stroke-width="1.6"/><text x="150" y="196" fill="#ff8bd2">1</text>
    <rect x="176" y="168" width="44" height="40" rx="6" fill="#241726" stroke="#ff8bd2" stroke-width="1.6"/><text x="198" y="196" fill="#ff8bd2">0</text>
    <rect x="224" y="168" width="44" height="40" rx="6" fill="#241726" stroke="#ff8bd2" stroke-width="1.6"/><text x="246" y="196" fill="#ff8bd2">1</text>
    <rect x="272" y="168" width="44" height="40" rx="6" fill="#241726" stroke="#ff8bd2" stroke-width="1.6"/><text x="294" y="196" fill="#ff8bd2">1</text>
    <text x="345" y="196" fill="#9aa7b4">...</text>
  </g>

  <!-- long row -->
  <text x="40" y="258" fill="#93c5fd" font-size="16" font-weight="700">long</text>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" text-anchor="middle">
    <rect x="80" y="238" width="44" height="40" rx="6" fill="#12202e" stroke="#93c5fd" stroke-width="1.6"/><text x="102" y="266" fill="#93c5fd">1</text>
    <rect x="128" y="238" width="44" height="40" rx="6" fill="#12202e" stroke="#93c5fd" stroke-width="1.6"/><text x="150" y="266" fill="#93c5fd">0</text>
    <rect x="176" y="238" width="44" height="40" rx="6" fill="#12202e" stroke="#93c5fd" stroke-width="1.6"/><text x="198" y="266" fill="#93c5fd">0</text>
    <rect x="224" y="238" width="44" height="40" rx="6" fill="#12202e" stroke="#93c5fd" stroke-width="1.6"/><text x="246" y="266" fill="#93c5fd">1</text>
    <rect x="272" y="238" width="44" height="40" rx="6" fill="#12202e" stroke="#93c5fd" stroke-width="1.6"/><text x="294" y="266" fill="#93c5fd">0</text>
    <text x="345" y="266" fill="#9aa7b4">...</text>
  </g>

  <!-- zip arrows -->
  <text x="200" y="312" fill="#9aa7b4" font-size="14" text-anchor="middle">zip: long-bit, lat-bit, long-bit, lat-bit ...</text>
  <line x1="102" y1="282" x2="118" y2="352" stroke="#93c5fd" stroke-width="1.6" marker-end="url(#bi-b)"/>
  <line x1="102" y1="212" x2="166" y2="352" stroke="#ff8bd2" stroke-width="1.6" marker-end="url(#bi-a)"/>

  <!-- interleaved row -->
  <text x="40" y="392" fill="#ffff99" font-size="16" font-weight="700">g</text>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" text-anchor="middle">
    <rect x="80" y="368" width="44" height="42" rx="6" fill="#12202e" stroke="#93c5fd" stroke-width="1.6"/><text x="102" y="397" fill="#93c5fd">1</text>
    <rect x="128" y="368" width="44" height="42" rx="6" fill="#241726" stroke="#ff8bd2" stroke-width="1.6"/><text x="150" y="397" fill="#ff8bd2">0</text>
    <rect x="176" y="368" width="44" height="42" rx="6" fill="#12202e" stroke="#93c5fd" stroke-width="1.6"/><text x="198" y="397" fill="#93c5fd">0</text>
    <rect x="224" y="368" width="44" height="42" rx="6" fill="#241726" stroke="#ff8bd2" stroke-width="1.6"/><text x="246" y="397" fill="#ff8bd2">1</text>
    <rect x="272" y="368" width="44" height="42" rx="6" fill="#12202e" stroke="#93c5fd" stroke-width="1.6"/><text x="294" y="397" fill="#93c5fd">0</text>
    <rect x="320" y="368" width="44" height="42" rx="6" fill="#241726" stroke="#ff8bd2" stroke-width="1.6"/><text x="342" y="397" fill="#ff8bd2">1</text>
    <text x="395" y="397" fill="#9aa7b4">...</text>
  </g>
  <text x="80" y="440" fill="#9aa7b4" font-size="14.5">even position = longitude (left/right split) &#183; odd position = latitude (top/bottom split)</text>
  <text x="80" y="463" fill="#8aff8a" font-size="14.5">32 + 32 bits interleave &#8594; one 64-bit geohash; finest cell &#8776; a square centimeter. No loop.</text>

  <!-- trie panel -->
  <rect x="620" y="150" width="450" height="330" rx="12" fill="#11161d" stroke="#2b3441" stroke-width="1.5"/>
  <text x="645" y="182" fill="#93c5fd" font-size="17" font-weight="700">Trie keyed by geohash</text>
  <text x="645" y="205" fill="#9aa7b4" font-size="13.5">root&#8594;node path spells the prefix; near points are siblings</text>

  <!-- trie edges -->
  <g stroke="#3b4654" stroke-width="2" fill="none">
    <line x1="845" y1="230" x2="790" y2="275"/>
    <line x1="790" y1="275" x2="760" y2="320"/>
    <line x1="760" y1="320" x2="735" y2="365"/>
    <line x1="735" y1="365" x2="720" y2="410"/>
    <line x1="735" y1="365" x2="760" y2="410"/>
  </g>
  <g stroke="#8aff8a" stroke-width="2.4" fill="none">
    <line x1="720" y1="410" x2="705" y2="452"/>
    <line x1="720" y1="410" x2="745" y2="452"/>
  </g>
  <!-- edge bit labels -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#9aa7b4">
    <text x="808" y="255">1</text>
    <text x="762" y="300">0</text>
    <text x="736" y="345">0</text>
    <text x="708" y="392">1</text>
    <text x="758" y="392">1</text>
    <text x="690" y="438">B</text>
    <text x="748" y="438">A</text>
  </g>
  <!-- nodes -->
  <g>
    <circle cx="845" cy="230" r="9" fill="#161b22" stroke="#3b4654" stroke-width="2"/>
    <circle cx="790" cy="275" r="8" fill="#161b22" stroke="#3b4654" stroke-width="2"/>
    <circle cx="760" cy="320" r="8" fill="#161b22" stroke="#3b4654" stroke-width="2"/>
    <circle cx="735" cy="365" r="8" fill="#161b22" stroke="#3b4654" stroke-width="2"/>
    <circle cx="760" cy="410" r="8" fill="#2a1c1c" stroke="#ff8a8a" stroke-width="2"/>
    <circle cx="720" cy="410" r="8" fill="#161b22" stroke="#8aff8a" stroke-width="2"/>
    <circle cx="705" cy="452" r="9" fill="#13241a" stroke="#8aff8a" stroke-width="2.2"/>
    <circle cx="745" cy="452" r="9" fill="#13241a" stroke="#8aff8a" stroke-width="2.2"/>
  </g>
  <!-- point labels -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14">
    <text x="880" y="415" fill="#8aff8a">A: 1 0011</text>
    <text x="880" y="438" fill="#8aff8a">B: 1 0011</text>
    <text x="880" y="461" fill="#ff8a8a">C: 1 0010</text>
  </g>
  <text x="645" y="474" fill="#9aa7b4" font-size="12.5">A, B share the full path (same cell); C is the adjacent cell.</text>

  <!-- caption -->
  <rect x="40" y="560" width="1030" height="56" rx="10" fill="#161b22" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="60" y="594" fill="#cdd9e5" font-size="16">Interleave once &#8594; 64-bit geohash. Load all points into a trie keyed by the geohash; nearby points are siblings under a shared prefix.</text>
</svg>
