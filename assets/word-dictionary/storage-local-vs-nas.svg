<svg width="1200" height="620" viewBox="0 0 1200 620" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ln-g" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8aff8a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="620" fill="#111317"/>

  <text x="600" y="46" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="29" font-weight="bold">Where the Bytes Live: N Local Copies vs. One Shared Store</text>
  <text x="600" y="78" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">putting the full 1 TB on every API server duplicates storage and fans out every update &#8212; a central store fixes both</text>

  <!-- LEFT: per-server copies (anti-pattern) -->
  <rect x="60" y="110" width="520" height="436" rx="12" fill="#1d1216" stroke="#ff8a8a" stroke-width="2.5"/>
  <text x="84" y="150" fill="#ff8a8a" font-family="sans-serif" font-size="19" font-weight="bold">Copy the 1 TB onto each server's disk</text>

  <g font-family="sans-serif" font-size="15" font-weight="bold">
    <rect x="110" y="174" width="280" height="52" rx="9" fill="#16191e" stroke="#ffffff" stroke-width="2"/>
    <text x="134" y="206" fill="#ffffff">API server</text>
    <rect x="280" y="184" width="96" height="32" rx="6" fill="#1d1d12" stroke="#ffff99" stroke-width="2"/>
    <text x="328" y="206" text-anchor="middle" fill="#ffff99" font-size="14">1 TB copy</text>

    <rect x="110" y="236" width="280" height="52" rx="9" fill="#16191e" stroke="#ffffff" stroke-width="2"/>
    <text x="134" y="268" fill="#ffffff">API server</text>
    <rect x="280" y="246" width="96" height="32" rx="6" fill="#1d1d12" stroke="#ffff99" stroke-width="2"/>
    <text x="328" y="268" text-anchor="middle" fill="#ffff99" font-size="14">1 TB copy</text>

    <rect x="110" y="298" width="280" height="52" rx="9" fill="#16191e" stroke="#ffffff" stroke-width="2"/>
    <text x="134" y="330" fill="#ffffff">API server</text>
    <rect x="280" y="308" width="96" height="32" rx="6" fill="#1d1d12" stroke="#ffff99" stroke-width="2"/>
    <text x="328" y="330" text-anchor="middle" fill="#ffff99" font-size="14">1 TB copy</text>
  </g>
  <text x="250" y="378" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="20" font-weight="bold">&#8942;</text>

  <rect x="84" y="396" width="472" height="132" rx="10" fill="#241016" stroke="#ff8a8a" stroke-width="2"/>
  <text x="108" y="430" fill="#ff8a8a" font-family="sans-serif" font-size="16" font-weight="bold">20 servers = 20 TB of duplicated storage</text>
  <text x="108" y="462" fill="#cbd5e1" font-family="sans-serif" font-size="15">every weekly update must reach all 20 disks</text>
  <text x="108" y="494" fill="#ff8a8a" font-family="sans-serif" font-size="16" font-weight="bold">&#8594; wasteful + redundancy + inconsistency risk</text>

  <!-- RIGHT: shared store (good) -->
  <rect x="620" y="110" width="520" height="436" rx="12" fill="#0f2417" stroke="#8aff8a" stroke-width="2.5"/>
  <text x="644" y="150" fill="#8aff8a" font-family="sans-serif" font-size="19" font-weight="bold">One shared store every server reads</text>

  <g font-family="sans-serif" font-size="15" font-weight="bold">
    <rect x="644" y="186" width="150" height="48" rx="9" fill="#16191e" stroke="#ffffff" stroke-width="2"/>
    <text x="719" y="216" text-anchor="middle" fill="#ffffff">API</text>
    <rect x="644" y="252" width="150" height="48" rx="9" fill="#16191e" stroke="#ffffff" stroke-width="2"/>
    <text x="719" y="282" text-anchor="middle" fill="#ffffff">API</text>
    <rect x="644" y="318" width="150" height="48" rx="9" fill="#16191e" stroke="#ffffff" stroke-width="2"/>
    <text x="719" y="348" text-anchor="middle" fill="#ffffff">API</text>
  </g>

  <!-- central store cylinder -->
  <g stroke="#ffff99" stroke-width="2.5" fill="#1d1d12">
    <ellipse cx="1010" cy="248" rx="60" ry="18"/>
    <rect x="950" y="248" width="120" height="120" fill="#1d1d12" stroke="none"/>
    <path d="M950,248 L950,368" fill="none"/><path d="M1070,248 L1070,368" fill="none"/>
    <path d="M950,368 A60,18 0 0 0 1070,368" fill="none"/>
    <ellipse cx="1010" cy="248" rx="60" ry="18" fill="none"/>
  </g>
  <text x="1010" y="300" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="16" font-weight="bold">NAS / S3</text>
  <text x="1010" y="324" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">1 TB, stored</text>
  <text x="1010" y="342" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">exactly once</text>

  <line x1="794" y1="210" x2="946" y2="270" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#ln-g)"/>
  <line x1="794" y1="276" x2="946" y2="296" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#ln-g)"/>
  <line x1="794" y1="342" x2="946" y2="322" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#ln-g)"/>
  <text x="868" y="248" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13" font-weight="bold">read</text>

  <rect x="644" y="396" width="472" height="132" rx="10" fill="#0c1f15" stroke="#8aff8a" stroke-width="2"/>
  <text x="668" y="430" fill="#8aff8a" font-family="sans-serif" font-size="16" font-weight="bold">store the 1 TB once; update it once</text>
  <text x="668" y="462" fill="#cbd5e1" font-family="sans-serif" font-size="15">API servers stay <tspan fill="#8aff8a" font-weight="bold">stateless</tspan> &#8212; add as many as you like</text>
  <text x="668" y="494" fill="#cbd5e1" font-family="sans-serif" font-size="15">this is what <tspan fill="#ffff99" font-weight="bold">NAS</tspan> is &#8212; and S3 is its managed cloud version</text>
</svg>
