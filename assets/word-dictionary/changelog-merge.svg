<svg width="1200" height="680" viewBox="0 0 1200 680" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="cm-w" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="680" fill="#111317"/>

  <text x="600" y="46" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="30" font-weight="bold">Weekly Updates: Merge Two Sorted Lists</text>
  <text x="600" y="78" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">updates arrive as a sorted <tspan fill="#ff8bd2" font-weight="bold">changelog</tspan>; merge it with the sorted dictionary in <tspan fill="#8aff8a" font-weight="bold">O(n)</tspan> to build a fresh dictionary + index</text>

  <!-- Dictionary -->
  <text x="80" y="120" fill="#cbd5e1" font-family="sans-serif" font-size="18" font-weight="bold">Current dictionary</text>
  <text x="80" y="140" fill="#9aa6b2" font-family="sans-serif" font-size="13">sorted by word</text>
  <rect x="80" y="152" width="230" height="328" rx="10" fill="#16191e" stroke="#cbd5e1" stroke-width="2"/>
  <g font-family="monospace" font-size="18" fill="#cbd5e1">
    <text x="110" y="190">a &#8594; a'</text>
    <text x="110" y="230">b &#8594; b'</text>
    <text x="110" y="270">c &#8594; c'</text>
    <text x="110" y="310">d &#8594; d'</text>
    <text x="110" y="350">f &#8594; f'</text>
    <text x="110" y="390">g &#8594; g'</text>
    <text x="110" y="430">h &#8594; h'</text>
  </g>

  <text x="395" y="320" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold">+</text>

  <!-- Changelog -->
  <text x="430" y="120" fill="#ff8bd2" font-family="sans-serif" font-size="18" font-weight="bold">This week's changelog</text>
  <text x="430" y="140" fill="#9aa6b2" font-family="sans-serif" font-size="13">also sorted</text>
  <rect x="430" y="152" width="230" height="328" rx="10" fill="#241019" stroke="#ff8bd2" stroke-width="2.5"/>
  <g font-family="monospace" font-size="18" fill="#ff8bd2">
    <text x="460" y="200">c &#8594; c''</text>
    <text x="460" y="260">e &#8594; e'</text>
    <text x="460" y="320">f &#8594; f''</text>
  </g>
  <text x="545" y="372" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13">c, f rewritten</text>
  <text x="545" y="392" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13">e is brand new</text>

  <line x1="668" y1="316" x2="712" y2="316" stroke="#ffffff" stroke-width="2.5" marker-end="url(#cm-w)"/>

  <!-- New dictionary -->
  <text x="740" y="120" fill="#8aff8a" font-family="sans-serif" font-size="18" font-weight="bold">New dictionary</text>
  <text x="740" y="140" fill="#9aa6b2" font-family="sans-serif" font-size="13">one O(n) pass, still sorted</text>
  <rect x="740" y="152" width="240" height="400" rx="10" fill="#0f2417" stroke="#8aff8a" stroke-width="2.5"/>
  <g font-family="monospace" font-size="18">
    <text x="772" y="190" fill="#cbd5e1">a &#8594; a'</text>
    <text x="772" y="230" fill="#cbd5e1">b &#8594; b'</text>
    <text x="772" y="270" fill="#ff8bd2" font-weight="bold">c &#8594; c''</text>
    <text x="772" y="310" fill="#cbd5e1">d &#8594; d'</text>
    <text x="772" y="350" fill="#ff8bd2" font-weight="bold">e &#8594; e'</text>
    <text x="772" y="390" fill="#ff8bd2" font-weight="bold">f &#8594; f''</text>
    <text x="772" y="430" fill="#cbd5e1">g &#8594; g'</text>
    <text x="772" y="470" fill="#cbd5e1">h &#8594; h'</text>
  </g>
  <text x="860" y="520" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13" font-weight="bold">overrides applied,</text>
  <text x="860" y="540" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13" font-weight="bold">new words inserted in order</text>

  <!-- right note -->
  <rect x="1004" y="152" width="136" height="180" rx="10" fill="#16191e" stroke="#8aff8a" stroke-width="2"/>
  <text x="1072" y="184" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="15" font-weight="bold">Why O(n)?</text>
  <text x="1020" y="214" fill="#cbd5e1" font-family="sans-serif" font-size="13">Both lists are</text>
  <text x="1020" y="234" fill="#cbd5e1" font-family="sans-serif" font-size="13">sorted, so this</text>
  <text x="1020" y="254" fill="#cbd5e1" font-family="sans-serif" font-size="13">is the merge</text>
  <text x="1020" y="274" fill="#cbd5e1" font-family="sans-serif" font-size="13">step of merge</text>
  <text x="1020" y="294" fill="#cbd5e1" font-family="sans-serif" font-size="13">sort &#8212; one</text>
  <text x="1020" y="314" fill="#cbd5e1" font-family="sans-serif" font-size="13">linear walk.</text>

  <!-- procedure -->
  <rect x="1004" y="352" width="136" height="200" rx="10" fill="#16191e" stroke="#93c5fd" stroke-width="2"/>
  <text x="1072" y="384" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="15" font-weight="bold">Rebuild job</text>
  <g font-family="sans-serif" font-size="13" fill="#cbd5e1">
    <text x="1020" y="414">1. spin up a</text>
    <text x="1032" y="432">worker</text>
    <text x="1020" y="458">2. pull dict +</text>
    <text x="1032" y="476">changelog</text>
    <text x="1020" y="502">3. merge &#8594; new</text>
    <text x="1032" y="520">dict + index</text>
    <text x="1020" y="546">4. upload to S3</text>
  </g>

  <!-- bottom takeaway -->
  <rect x="80" y="580" width="900" height="76" rx="12" fill="#16191e" stroke="#8aff8a" stroke-width="2"/>
  <text x="104" y="614" fill="#8aff8a" font-family="sans-serif" font-size="17" font-weight="bold">Both the dictionary and the index are kept sorted</text>
  <text x="104" y="640" fill="#cbd5e1" font-family="sans-serif" font-size="15">so applying a week of changes is a single linear merge, not a re-sort &#8212; cheap to run on a throwaway worker every week.</text>
</svg>
