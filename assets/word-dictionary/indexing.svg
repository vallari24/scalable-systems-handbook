<svg width="1200" height="680" viewBox="0 0 1200 680" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ix-g" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8aff8a"/>
    </marker>
    <marker id="ix-r" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#ff8a8a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="680" fill="#111317"/>

  <text x="600" y="46" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="29" font-weight="bold">Making Lookups Fast: Split Into an Index and a Data File</text>
  <text x="600" y="78" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">one 1 TB file means scanning to find a word; a tiny sorted <tspan fill="#8aff8a" font-weight="bold">index</tspan> gives the exact byte offset to jump to</text>

  <!-- LEFT: approach 2, one big file -->
  <text x="60" y="120" fill="#ff8a8a" font-family="sans-serif" font-size="19" font-weight="bold">Approach 2: one big file (CSV)</text>
  <rect x="60" y="138" width="300" height="380" rx="10" fill="#1d1d12" stroke="#ffff99" stroke-width="2"/>
  <g font-family="monospace" font-size="14" fill="#cbd5e1">
    <text x="78" y="170">a, first letter ...</text>
    <text x="78" y="202">abandon, to leave ...</text>
    <text x="78" y="234">ability, power or ...</text>
    <text x="78" y="266">able, having the ...</text>
    <text x="86" y="300" fill="#9aa6b2">.</text>
    <text x="86" y="320" fill="#9aa6b2">.</text>
    <text x="86" y="340" fill="#9aa6b2">.</text>
    <text x="78" y="374">zone, an area ...</text>
    <text x="78" y="406">zoo, a place ...</text>
  </g>
  <text x="210" y="452" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="15" font-weight="bold">one file &#183; ~1 TB</text>
  <line x1="80" y1="470" x2="340" y2="470" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#ix-r)"/>
  <text x="210" y="498" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="14" font-weight="bold">lookup = scan the file</text>
  <text x="210" y="518" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="14" font-weight="bold">too slow, too expensive</text>

  <!-- MIDDLE: index.dat -->
  <text x="430" y="120" fill="#8aff8a" font-family="sans-serif" font-size="19" font-weight="bold">index.dat</text>
  <text x="430" y="142" fill="#9aa6b2" font-family="sans-serif" font-size="13">word : offset : length &#8212; sorted, tiny</text>
  <rect x="430" y="156" width="300" height="362" rx="10" fill="#0f2417" stroke="#8aff8a" stroke-width="2.5"/>
  <g font-family="monospace" font-size="15" fill="#cbd5e1">
    <text x="448" y="190">a       : 0 : 127</text>
    <text x="448" y="224">abandon : 127 : 130</text>
    <text x="448" y="258">ability : 257 : 100</text>
    <text x="448" y="292" fill="#8aff8a" font-weight="bold">able    : 357 : 150</text>
    <text x="456" y="326" fill="#9aa6b2">.</text>
    <text x="456" y="346" fill="#9aa6b2">.</text>
    <text x="448" y="380">zone : 1023795 : 100</text>
    <text x="448" y="414">zoo  : 1023895 : 196</text>
  </g>
  <text x="580" y="462" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="14" font-weight="bold">a separate, small file</text>
  <text x="580" y="486" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">look up the word &#8594; get its</text>
  <text x="580" y="506" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13"><tspan fill="#8aff8a" font-weight="bold">offset</tspan> and <tspan fill="#8aff8a" font-weight="bold">length</tspan> in data.dat</text>

  <!-- jump arrow -->
  <line x1="730" y1="291" x2="838" y2="291" stroke="#8aff8a" stroke-width="3" marker-end="url(#ix-g)"/>
  <text x="784" y="280" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13" font-weight="bold">seek 357</text>
  <text x="784" y="312" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">read 150 bytes</text>

  <!-- RIGHT: data.dat -->
  <text x="842" y="120" fill="#ffff99" font-family="sans-serif" font-size="19" font-weight="bold">data.dat</text>
  <text x="842" y="142" fill="#9aa6b2" font-family="sans-serif" font-size="13">the 1 TB of meanings, byte-addressed</text>
  <rect x="842" y="156" width="298" height="362" rx="10" fill="#1d1d12" stroke="#ffff99" stroke-width="2"/>
  <g font-family="monospace" font-size="14" fill="#cbd5e1">
    <text x="860" y="190">a, first letter ...</text>
    <text x="860" y="224">abandon, to leave ...</text>
    <text x="860" y="258">ability, power or ...</text>
  </g>
  <rect x="850" y="276" width="282" height="30" rx="5" fill="#15281b" stroke="#8aff8a" stroke-width="2"/>
  <text x="860" y="297" fill="#8aff8a" font-family="monospace" font-size="14" font-weight="bold">able, having the power ...</text>
  <g font-family="monospace" font-size="14" fill="#9aa6b2">
    <text x="868" y="338">.</text>
    <text x="868" y="358">.</text>
  </g>
  <g font-family="monospace" font-size="14" fill="#cbd5e1">
    <text x="860" y="392">zone, an area ...</text>
    <text x="860" y="426">zoo, a place ...</text>
  </g>
  <text x="991" y="470" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13">offset 357, length 150 &#8594; exactly</text>
  <text x="991" y="490" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13">the bytes for "able" &#8212; no scan</text>

  <!-- bottom takeaway -->
  <rect x="60" y="552" width="1080" height="104" rx="12" fill="#16191e" stroke="#8aff8a" stroke-width="2"/>
  <text x="84" y="588" fill="#8aff8a" font-family="sans-serif" font-size="18" font-weight="bold">The universal trick: indexing</text>
  <text x="84" y="620" fill="#cbd5e1" font-family="sans-serif" font-size="15">Keep the bulk data in <tspan fill="#ffff99" font-weight="bold">data.dat</tspan>; keep a small sorted <tspan fill="#8aff8a" font-weight="bold">index.dat</tspan> mapping each word to its <tspan fill="#8aff8a" font-weight="bold">byte offset + length</tspan>.</text>
  <text x="84" y="644" fill="#cbd5e1" font-family="sans-serif" font-size="15">A lookup becomes: find the word in the index, then seek straight to those bytes in the data file. No 1 TB scan.</text>
</svg>
