<svg width="1300" height="760" viewBox="0 0 1300 760" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="fm-w" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ffffff"/>
    </marker>
    <marker id="fm-g" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8aff8a"/>
    </marker>
    <marker id="fm-b" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#93c5fd"/>
    </marker>
    <marker id="fm-p" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ff8bd2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="760" fill="#111317"/>

  <text x="650" y="46" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="30" font-weight="bold">The Complete Picture</text>
  <text x="650" y="78" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">reads come from an in-memory index + S3; each week a worker merges the changelog into a new versioned snapshot and flips <tspan fill="#93c5fd" font-weight="bold">meta.json</tspan></text>

  <!-- read path label -->
  <text x="60" y="124" fill="#8aff8a" font-family="sans-serif" font-size="16" font-weight="bold">READ PATH</text>

  <!-- user -->
  <circle cx="78" cy="220" r="13" fill="none" stroke="#ffffff" stroke-width="2"/>
  <line x1="78" y1="233" x2="78" y2="258" stroke="#ffffff" stroke-width="2"/>
  <line x1="60" y1="245" x2="96" y2="245" stroke="#ffffff" stroke-width="2"/>
  <line x1="78" y1="258" x2="67" y2="276" stroke="#ffffff" stroke-width="2"/>
  <line x1="78" y1="258" x2="89" y2="276" stroke="#ffffff" stroke-width="2"/>
  <text x="78" y="300" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">user</text>

  <line x1="100" y1="234" x2="142" y2="234" stroke="#ffffff" stroke-width="2.5" marker-end="url(#fm-w)"/>

  <!-- LB -->
  <rect x="146" y="206" width="92" height="56" rx="9" fill="#10243a" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="192" y="240" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="16" font-weight="bold">LB</text>
  <line x1="238" y1="234" x2="288" y2="234" stroke="#ffffff" stroke-width="2.5" marker-end="url(#fm-w)"/>

  <!-- API fleet -->
  <rect x="316" y="180" width="230" height="110" rx="10" fill="#13161b" stroke="#5b6470" stroke-width="2"/>
  <rect x="304" y="194" width="230" height="110" rx="10" fill="#13161b" stroke="#7c8694" stroke-width="2"/>
  <rect x="292" y="208" width="230" height="110" rx="10" fill="#16191e" stroke="#ffffff" stroke-width="2.5"/>
  <text x="312" y="240" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">API server fleet</text>
  <rect x="312" y="254" width="190" height="44" rx="7" fill="#0f2417" stroke="#8aff8a" stroke-width="2"/>
  <text x="407" y="282" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="14" font-weight="bold">index in RAM (~2.6 MB)</text>

  <!-- S3 -->
  <rect x="770" y="120" width="480" height="408" rx="20" fill="#1a1a10" stroke="#ffff99" stroke-width="2.5"/>
  <text x="1010" y="152" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="20" font-weight="bold">S3 (durable store)</text>

  <rect x="800" y="170" width="240" height="64" rx="9" fill="#10243a" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="820" y="198" fill="#93c5fd" font-family="monospace" font-size="15" font-weight="bold">meta.json</text>
  <text x="820" y="222" fill="#cbd5e1" font-family="monospace" font-size="13">current &#8594; <tspan fill="#8aff8a">002/</tspan></text>

  <rect x="800" y="256" width="420" height="76" rx="9" fill="#15281b" stroke="#8aff8a" stroke-width="2.5"/>
  <text x="820" y="284" fill="#8aff8a" font-family="monospace" font-size="15" font-weight="bold">002/  [ header | index | data ]</text>
  <text x="820" y="312" fill="#9aa6b2" font-family="sans-serif" font-size="13">current snapshot &#8212; one portable file</text>

  <rect x="800" y="350" width="420" height="64" rx="9" fill="#1c1f25" stroke="#5b6470" stroke-width="2"/>
  <text x="820" y="378" fill="#9aa6b2" font-family="monospace" font-size="15">001/  [ header | index | data ]</text>
  <text x="820" y="400" fill="#9aa6b2" font-family="sans-serif" font-size="13">previous snapshot &#8212; never overwritten</text>

  <!-- read arrows -->
  <line x1="524" y1="232" x2="796" y2="200" stroke="#93c5fd" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#fm-b)"/>
  <text x="660" y="206" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="13" font-weight="bold">1. which version?</text>

  <line x1="796" y1="276" x2="526" y2="262" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#fm-b)"/>
  <text x="662" y="256" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="13" font-weight="bold">2. load index on boot</text>

  <line x1="524" y1="300" x2="796" y2="312" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#fm-g)"/>
  <text x="662" y="332" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13" font-weight="bold">3. ranged read of data per lookup</text>

  <!-- weekly rebuild -->
  <text x="60" y="476" fill="#ff8bd2" font-family="sans-serif" font-size="16" font-weight="bold">WEEKLY REBUILD</text>

  <rect x="60" y="496" width="190" height="60" rx="9" fill="#241019" stroke="#ff8bd2" stroke-width="2.5"/>
  <text x="155" y="524" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="15" font-weight="bold">weekly changelog</text>
  <text x="155" y="544" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">sorted updates</text>

  <rect x="60" y="572" width="190" height="56" rx="9" fill="#1c1f25" stroke="#5b6470" stroke-width="2"/>
  <text x="155" y="599" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="14">current dictionary</text>
  <text x="155" y="618" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">pulled from S3</text>

  <rect x="320" y="516" width="220" height="96" rx="10" fill="#16191e" stroke="#ff8bd2" stroke-width="2.5"/>
  <text x="430" y="552" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="16" font-weight="bold">merge worker</text>
  <text x="430" y="578" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">merge two sorted lists</text>
  <text x="430" y="598" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13" font-weight="bold">O(n) &#8594; new snapshot</text>

  <line x1="250" y1="524" x2="316" y2="546" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#fm-p)"/>
  <line x1="250" y1="598" x2="316" y2="580" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#fm-p)"/>

  <line x1="540" y1="546" x2="796" y2="320" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#fm-p)"/>
  <text x="560" y="414" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="13" font-weight="bold">publish 002/, then flip meta.json</text>

  <!-- legend -->
  <rect x="60" y="668" width="1180" height="64" rx="10" fill="#16191e" stroke="#5b6470" stroke-width="1.8"/>
  <g font-family="sans-serif" font-size="14" font-weight="bold">
    <line x1="84" y1="700" x2="120" y2="700" stroke="#ffffff" stroke-width="3" marker-end="url(#fm-w)"/>
    <text x="128" y="705" fill="#cbd5e1">user request</text>
    <line x1="270" y1="700" x2="306" y2="700" stroke="#93c5fd" stroke-width="3" marker-end="url(#fm-b)"/>
    <text x="314" y="705" fill="#cbd5e1">control: version + boot load</text>
    <line x1="610" y1="700" x2="646" y2="700" stroke="#8aff8a" stroke-width="3" marker-end="url(#fm-g)"/>
    <text x="654" y="705" fill="#cbd5e1">read: ranged data fetch</text>
    <line x1="900" y1="700" x2="936" y2="700" stroke="#ff8bd2" stroke-width="3" marker-end="url(#fm-p)"/>
    <text x="944" y="705" fill="#cbd5e1">weekly write: merge + publish</text>
  </g>
</svg>
