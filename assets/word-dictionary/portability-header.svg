<svg width="1200" height="720" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="720" fill="#111317"/>

  <text x="600" y="46" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="29" font-weight="bold">One Portable File: A Fixed-Width Header + Index + Data</text>
  <text x="600" y="78" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">merge the two files; a <tspan fill="#ffff99" font-weight="bold">fixed-width header</tspan> with a <tspan fill="#93c5fd" font-weight="bold">magic identifier</tspan> says where each section lives &#8212; no fragile separator</text>

  <!-- file layout bar -->
  <rect x="80" y="106" width="110" height="66" rx="6" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
  <text x="135" y="142" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="14" font-weight="bold">Header</text>
  <text x="135" y="161" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11">16 bytes</text>

  <rect x="190" y="106" width="300" height="66" rx="6" fill="#0f2417" stroke="#8aff8a" stroke-width="2.5"/>
  <text x="340" y="146" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="16" font-weight="bold">Index</text>

  <rect x="490" y="106" width="630" height="66" rx="6" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
  <text x="805" y="146" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="16" font-weight="bold">Data</text>

  <!-- zoom connectors -->
  <line x1="84" y1="172" x2="100" y2="276" stroke="#5b6470" stroke-width="1.6" stroke-dasharray="4 4"/>
  <line x1="188" y1="172" x2="612" y2="276" stroke="#5b6470" stroke-width="1.6" stroke-dasharray="4 4"/>
  <text x="250" y="232" fill="#cbd5e1" font-family="sans-serif" font-size="14">zoom into the 16-byte header &#8595;</text>

  <!-- byte-size labels -->
  <g font-family="monospace" font-size="14" fill="#9aa6b2" font-weight="bold">
    <text x="192" y="268" text-anchor="middle">6 B</text>
    <text x="345" y="268" text-anchor="middle">4 B</text>
    <text x="467" y="268" text-anchor="middle">4 B</text>
    <text x="559" y="268" text-anchor="middle">2 B</text>
  </g>

  <!-- byte strip -->
  <rect x="100" y="278" width="184" height="54" fill="#10243a" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="192" y="312" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="18" font-weight="bold">DICEDB</text>

  <rect x="284" y="278" width="122" height="54" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
  <text x="345" y="312" text-anchor="middle" fill="#ffff99" font-family="monospace" font-size="16" font-weight="bold">170000</text>

  <rect x="406" y="278" width="122" height="54" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
  <text x="467" y="312" text-anchor="middle" fill="#ffff99" font-family="monospace" font-size="16" font-weight="bold">3563214</text>

  <rect x="528" y="278" width="62" height="54" fill="#16191e" stroke="#9aa6b2" stroke-width="2.5"/>
  <text x="559" y="312" text-anchor="middle" fill="#9aa6b2" font-family="monospace" font-size="16" font-weight="bold">&#183;&#183;</text>

  <text x="620" y="312" fill="#8aff8a" font-family="sans-serif" font-size="16" font-weight="bold">= 16 bytes, fixed</text>

  <!-- meanings -->
  <g font-family="sans-serif" font-size="12.5">
    <text x="192" y="356" text-anchor="middle" fill="#93c5fd" font-weight="bold">magic string</text>
    <text x="192" y="374" text-anchor="middle" fill="#9aa6b2">names the format</text>

    <text x="345" y="356" text-anchor="middle" fill="#cbd5e1" font-weight="bold">word count</text>
    <text x="345" y="374" text-anchor="middle" fill="#9aa6b2">int: 170,000</text>

    <text x="467" y="356" text-anchor="middle" fill="#cbd5e1" font-weight="bold">index size</text>
    <text x="467" y="374" text-anchor="middle" fill="#9aa6b2">int: bytes</text>

    <text x="559" y="356" text-anchor="middle" fill="#cbd5e1" font-weight="bold">version</text>
    <text x="559" y="374" text-anchor="middle" fill="#9aa6b2">/ reserved</text>
  </g>

  <!-- LEFT card: magic header vs separator -->
  <rect x="80" y="408" width="540" height="284" rx="12" fill="#16191e" stroke="#93c5fd" stroke-width="2"/>
  <text x="104" y="444" fill="#93c5fd" font-family="sans-serif" font-size="18" font-weight="bold">Why a magic header, not a separator</text>
  <text x="104" y="480" fill="#cbd5e1" font-family="sans-serif" font-size="15">A <tspan fill="#ff8a8a" font-weight="bold">separator</tspan> byte can occur inside the data &#8212; the</text>
  <text x="104" y="502" fill="#cbd5e1" font-family="sans-serif" font-size="15">meanings are arbitrary text, so you'd split in the</text>
  <text x="104" y="524" fill="#cbd5e1" font-family="sans-serif" font-size="15">wrong place.</text>
  <text x="104" y="560" fill="#cbd5e1" font-family="sans-serif" font-size="15">So every real file format starts with a fixed-width</text>
  <text x="104" y="582" fill="#cbd5e1" font-family="sans-serif" font-size="15">header whose first bytes are a <tspan fill="#93c5fd" font-weight="bold">magic identifier</tspan></text>
  <text x="104" y="604" fill="#cbd5e1" font-family="sans-serif" font-size="15">(PNG, ZIP, class files all do this).</text>
  <text x="104" y="640" fill="#cbd5e1" font-family="sans-serif" font-size="15">Read the first 6 bytes &#8594; <tspan fill="#93c5fd" font-weight="bold">DICEDB</tspan> &#8594; you know the</text>
  <text x="104" y="662" fill="#cbd5e1" font-family="sans-serif" font-size="15">format, and that the header is 16 bytes wide.</text>

  <!-- RIGHT card: derived offsets + flow -->
  <rect x="640" y="408" width="480" height="284" rx="12" fill="#0f2417" stroke="#8aff8a" stroke-width="2"/>
  <text x="664" y="444" fill="#8aff8a" font-family="sans-serif" font-size="18" font-weight="bold">The offsets fall out of the header</text>
  <g font-family="monospace" font-size="14.5" fill="#cbd5e1">
    <text x="664" y="478">index starts = 16</text>
    <text x="664" y="504">index ends   = 16 + index_size</text>
    <text x="664" y="530">data starts  = index ends</text>
  </g>
  <text x="664" y="562" fill="#9aa6b2" font-family="sans-serif" font-size="13.5">nothing extra to store &#8212; the sizes derive every boundary.</text>

  <line x1="664" y1="582" x2="1096" y2="582" stroke="#2b3340" stroke-width="1.5"/>
  <text x="664" y="612" fill="#8aff8a" font-family="sans-serif" font-size="15" font-weight="bold">boot:</text>
  <text x="716" y="612" fill="#cbd5e1" font-family="sans-serif" font-size="15">read 16-byte header &#8594; load index &#8594; serve</text>
  <text x="664" y="648" fill="#ff8bd2" font-family="sans-serif" font-size="15" font-weight="bold">update:</text>
  <text x="740" y="648" fill="#cbd5e1" font-family="sans-serif" font-size="15">the whole file is recreated as a new</text>
  <text x="664" y="670" fill="#cbd5e1" font-family="sans-serif" font-size="15">version (header + index + data rebuilt together).</text>
</svg>
