<svg width="1180" height="600" viewBox="0 0 1180 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ps-a" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#cbd5e1"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1180" height="600" fill="#111317"/>

  <text x="590" y="42" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="29" font-weight="bold">Syncing Down: a device pulls only what changed</text>
  <text x="590" y="70" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="16">each device is an independent consumer of the log &#8212; it pulls from its cursor, then fetches only the blocks it lacks</text>

  <!-- lifelines -->
  <g font-family="sans-serif">
    <rect x="100" y="92" width="200" height="40" rx="9" fill="#1a1018" stroke="#ff8bd2" stroke-width="2.5"/>
    <text x="200" y="118" text-anchor="middle" fill="#ff8bd2" font-size="15" font-weight="bold">Mac &#183; at cursor v5</text>
    <line x1="200" y1="132" x2="200" y2="500" stroke="#3a4a5e" stroke-width="2"/>

    <rect x="470" y="92" width="180" height="40" rx="9" fill="#16202e" stroke="#93c5fd" stroke-width="2.5"/>
    <text x="560" y="118" text-anchor="middle" fill="#93c5fd" font-size="15" font-weight="bold">meta server</text>
    <line x1="560" y1="132" x2="560" y2="500" stroke="#3a4a5e" stroke-width="2"/>

    <rect x="870" y="92" width="190" height="40" rx="9" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
    <text x="965" y="118" text-anchor="middle" fill="#ffff99" font-size="15" font-weight="bold">blocks server</text>
    <line x1="965" y1="132" x2="965" y2="500" stroke="#3a4a5e" stroke-width="2"/>
  </g>

  <g font-family="monospace" font-size="14">
    <!-- 1 pull -->
    <line x1="200" y1="184" x2="556" y2="184" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#ps-a)"/>
    <text x="378" y="174" text-anchor="middle" fill="#ff8bd2">changed in vallari_mehta after v5?</text>
    <text x="690" y="188" fill="#9aa6b2" font-family="sans-serif">reads the log past offset 5</text>

    <!-- 2 response -->
    <line x1="560" y1="230" x2="204" y2="230" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#ps-a)"/>
    <text x="378" y="220" text-anchor="middle" fill="#93c5fd">v6: /video.avi &#8594; [h1, h2, h3, h4]</text>

    <!-- 3 local diff -->
    <rect x="70" y="258" width="280" height="46" rx="9" fill="#1a1018" stroke="#ff8bd2" stroke-width="2"/>
    <text x="210" y="278" text-anchor="middle" fill="#cbd5e1" font-size="12.5">Mac has h1, h2, h4 locally &#8212;</text>
    <text x="210" y="296" text-anchor="middle" fill="#ff6b6b" font-size="12.5" font-weight="bold">only h3 is missing</text>

    <!-- 4 fetch -->
    <line x1="200" y1="346" x2="961" y2="346" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#ps-a)"/>
    <text x="560" y="336" text-anchor="middle" fill="#ff8bd2">fetch h3</text>

    <!-- 5 block -->
    <line x1="965" y1="392" x2="204" y2="392" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#ps-a)"/>
    <text x="560" y="382" text-anchor="middle" fill="#8aff8a">block b3</text>

    <!-- 6 reconstruct -->
    <rect x="60" y="420" width="300" height="64" rx="9" fill="#152015" stroke="#8aff8a" stroke-width="2"/>
    <text x="210" y="442" text-anchor="middle" fill="#cbd5e1" font-size="12.5">reconstruct /video.avi from</text>
    <text x="210" y="460" text-anchor="middle" fill="#93c5fd" font-size="12.5">[h1, h2, h3, h4]</text>
    <text x="210" y="478" text-anchor="middle" fill="#8aff8a" font-size="12.5" font-weight="bold">advance cursor &#8594; v6</text>
  </g>

  <!-- bottom notes -->
  <rect x="50" y="512" width="1080" height="40" rx="10" fill="#1f1a10" stroke="#ffb86b" stroke-width="1.8"/>
  <text x="68" y="531" fill="#ffb86b" font-family="sans-serif" font-size="13.5" font-weight="bold">Pull, not push.</text>
  <text x="170" y="531" fill="#cbd5e1" font-family="sans-serif" font-size="13">A device can be offline for a week and still catch up from its cursor. A WebSocket push is only a &#8220;pull now&#8221; nudge layered on top &#8212; never the source of correctness.</text>

  <text x="68" y="578" fill="#9aa6b2" font-family="sans-serif" font-size="13"><tspan fill="#ff8bd2" font-weight="bold">Note:</tspan> v6 here is a revert to v1&#8217;s blocklist &#8212; restoring an old version is just another commit, so syncing a restore looks identical to syncing any edit.</text>
</svg>
