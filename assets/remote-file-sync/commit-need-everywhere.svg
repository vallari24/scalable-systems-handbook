<svg width="1180" height="660" viewBox="0 0 1180 660" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ce-a" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#cbd5e1"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1180" height="660" fill="#111317"/>

  <text x="590" y="42" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="29" font-weight="bold">The commit / need handshake, beyond files</text>

  <!-- abstract pattern banner -->
  <rect x="80" y="62" width="1020" height="46" rx="10" fill="#1b2735" stroke="#93c5fd" stroke-width="2"/>
  <text x="590" y="91" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="16">declare the desired state by content&#8209;derived names &#8594; server diffs against what it has &#8594; transfer only the gap</text>

  <!-- four cards -->
  <!-- Git -->
  <rect x="30" y="132" width="262" height="222" rx="12" fill="#1f1a10" stroke="#ffb86b" stroke-width="2.5"/>
  <text x="161" y="162" text-anchor="middle" fill="#ffb86b" font-family="sans-serif" font-size="19" font-weight="bold">Git</text>
  <text x="48" y="196" fill="#cbd5e1" font-family="sans-serif" font-size="13"><tspan fill="#9aa6b2" font-weight="bold">unit:</tspan> object (blob/tree/commit)</text>
  <text x="48" y="216" fill="#cbd5e1" font-family="sans-serif" font-size="13">addressed by its SHA</text>
  <text x="48" y="252" fill="#ff8bd2" font-family="sans-serif" font-size="13"><tspan fill="#9aa6b2" font-weight="bold">commit:</tspan> push these refs</text>
  <text x="48" y="288" fill="#93c5fd" font-family="sans-serif" font-size="13"><tspan fill="#9aa6b2" font-weight="bold">need:</tspan> the missing objects</text>
  <text x="48" y="324" fill="#9aa6b2" font-family="sans-serif" font-size="12" font-style="italic">= pack negotiation</text>

  <!-- Docker -->
  <rect x="306" y="132" width="262" height="222" rx="12" fill="#16202e" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="437" y="162" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="19" font-weight="bold">Container registries</text>
  <text x="324" y="196" fill="#cbd5e1" font-family="sans-serif" font-size="13"><tspan fill="#9aa6b2" font-weight="bold">unit:</tspan> image layer</text>
  <text x="324" y="216" fill="#cbd5e1" font-family="sans-serif" font-size="13">addressed by digest</text>
  <text x="324" y="252" fill="#ff8bd2" font-family="sans-serif" font-size="13"><tspan fill="#9aa6b2" font-weight="bold">commit:</tspan> push the manifest</text>
  <text x="324" y="288" fill="#93c5fd" font-family="sans-serif" font-size="13"><tspan fill="#9aa6b2" font-weight="bold">need:</tspan> absent layer digests</text>
  <text x="324" y="324" fill="#9aa6b2" font-family="sans-serif" font-size="12" font-style="italic">change 1 layer &#8594; push 1 layer</text>

  <!-- LinkedIn (highlighted) -->
  <rect x="582" y="124" width="278" height="238" rx="12" fill="#1a1018" stroke="#ff8bd2" stroke-width="3.5"/>
  <rect x="660" y="116" width="122" height="24" rx="8" fill="#ff8bd2"/>
  <text x="721" y="133" text-anchor="middle" fill="#0b1220" font-family="sans-serif" font-size="12" font-weight="bold">WORKED CASE</text>
  <text x="721" y="166" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="19" font-weight="bold">LinkedIn</text>
  <text x="600" y="200" fill="#8aff8a" font-family="sans-serif" font-size="13" font-weight="bold">media dedup</text>
  <text x="600" y="220" fill="#cbd5e1" font-family="sans-serif" font-size="12">same logo/doc/photo &#8594; stored once</text>
  <text x="600" y="256" fill="#93c5fd" font-family="sans-serif" font-size="13" font-weight="bold">resumable uploads</text>
  <text x="600" y="276" fill="#cbd5e1" font-family="sans-serif" font-size="12">video posts &amp; attachments on mobile</text>
  <text x="600" y="312" fill="#ffff99" font-family="sans-serif" font-size="13" font-weight="bold">delta sync</text>
  <text x="600" y="332" fill="#cbd5e1" font-family="sans-serif" font-size="12">feed / connections / messages</text>
  <text x="600" y="350" fill="#cbd5e1" font-family="sans-serif" font-size="12">via a sync cursor (= version_id)</text>

  <!-- Backup / CI -->
  <rect x="874" y="132" width="262" height="222" rx="12" fill="#152015" stroke="#8aff8a" stroke-width="2.5"/>
  <text x="1005" y="162" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="19" font-weight="bold">Backup &amp; build caches</text>
  <text x="892" y="196" fill="#cbd5e1" font-family="sans-serif" font-size="13"><tspan fill="#9aa6b2" font-weight="bold">unit:</tspan> chunk / action result</text>
  <text x="892" y="216" fill="#cbd5e1" font-family="sans-serif" font-size="13">addressed by hash</text>
  <text x="892" y="252" fill="#ff8bd2" font-family="sans-serif" font-size="13"><tspan fill="#9aa6b2" font-weight="bold">commit:</tspan> store this snapshot</text>
  <text x="892" y="288" fill="#93c5fd" font-family="sans-serif" font-size="13"><tspan fill="#9aa6b2" font-weight="bold">need:</tspan> only unseen hashes</text>
  <text x="892" y="324" fill="#9aa6b2" font-family="sans-serif" font-size="12" font-style="italic">incremental backup, free</text>

  <!-- LinkedIn delta-sync sequence -->
  <text x="590" y="408" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="17" font-weight="bold">LinkedIn delta sync &#8212; the version pillar generalized to a cursor</text>

  <g font-family="sans-serif">
    <rect x="160" y="432" width="190" height="40" rx="9" fill="#1a1018" stroke="#ff8bd2" stroke-width="2.5"/>
    <text x="255" y="458" text-anchor="middle" fill="#ff8bd2" font-size="15" font-weight="bold">mobile client</text>
    <line x1="255" y1="472" x2="255" y2="612" stroke="#3a4a5e" stroke-width="2"/>

    <rect x="830" y="432" width="190" height="40" rx="9" fill="#16202e" stroke="#93c5fd" stroke-width="2.5"/>
    <text x="925" y="458" text-anchor="middle" fill="#93c5fd" font-size="15" font-weight="bold">feed service</text>
    <line x1="925" y1="472" x2="925" y2="612" stroke="#3a4a5e" stroke-width="2"/>
  </g>

  <g font-family="monospace" font-size="14">
    <line x1="255" y1="516" x2="921" y2="516" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#ce-a)"/>
    <text x="588" y="506" text-anchor="middle" fill="#ff8bd2">sync feed &#8212; I&#8217;m at cursor 42</text>
    <text x="950" y="520" fill="#9aa6b2" font-family="sans-serif">diffs against 42</text>

    <line x1="925" y1="566" x2="259" y2="566" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#ce-a)"/>
    <text x="588" y="556" text-anchor="middle" fill="#8aff8a">items 43&#8230;57  +  new cursor 57</text>
  </g>
  <text x="588" y="606" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13" font-style="italic">same commit/need shape: client declares where it is, server returns only the gap</text>
</svg>
