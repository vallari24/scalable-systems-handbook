<svg width="1180" height="560" viewBox="0 0 1180 560" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1180" height="560" fill="#111317"/>

  <text x="590" y="40" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="29" font-weight="bold">Multi-versioning: a version is a list of pointers, not a copy</text>
  <text x="590" y="68" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="16">blocks live once in a shared pool; each version just references the blocks it needs &#8212; so a revert that reuses blocks is free</text>

  <!-- legend -->
  <circle cx="320" cy="96" r="9" fill="#152015" stroke="#8aff8a" stroke-width="2.5"/>
  <text x="336" y="101" fill="#8aff8a" font-family="sans-serif" font-size="13">new block, stored by this commit</text>
  <circle cx="620" cy="96" r="9" fill="#93c5fd"/>
  <text x="636" y="101" fill="#93c5fd" font-family="sans-serif" font-size="13">reused block, already in pool (free)</text>
  <text x="884" y="101" fill="#5e6b7e" font-family="sans-serif" font-size="13">&#8211;  not referenced by this version</text>

  <!-- column headers: the 5 distinct blocks -->
  <g font-family="monospace" font-size="15" font-weight="bold">
    <rect x="60" y="128" width="120" height="42" fill="#2a2a16" stroke="#5e5a2f" stroke-width="1.5"/><text x="120" y="155" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">version</text>
    <rect x="190" y="128" width="130" height="42" rx="7" fill="#16202e" stroke="#93c5fd" stroke-width="2"/><text x="255" y="155" text-anchor="middle" fill="#93c5fd">b1</text>
    <rect x="320" y="128" width="130" height="42" rx="7" fill="#16202e" stroke="#93c5fd" stroke-width="2"/><text x="385" y="155" text-anchor="middle" fill="#93c5fd">b2</text>
    <rect x="450" y="128" width="130" height="42" rx="7" fill="#16202e" stroke="#93c5fd" stroke-width="2"/><text x="515" y="155" text-anchor="middle" fill="#93c5fd">b3</text>
    <rect x="580" y="128" width="130" height="42" rx="7" fill="#2a1018" stroke="#ff6b6b" stroke-width="2"/><text x="645" y="155" text-anchor="middle" fill="#ff6b6b">b3'</text>
    <rect x="710" y="128" width="130" height="42" rx="7" fill="#16202e" stroke="#93c5fd" stroke-width="2"/><text x="775" y="155" text-anchor="middle" fill="#93c5fd">b4</text>
  </g>
  <text x="945" y="154" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13" font-weight="bold">what this commit costs</text>

  <!-- v1 row : initial upload -->
  <rect x="60" y="174" width="120" height="58" fill="#1d1d12" stroke="#5e5a2f" stroke-width="1.5"/>
  <text x="120" y="198" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="16" font-weight="bold">v1</text>
  <text x="120" y="218" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11.5">&#9312; initial upload</text>
  <rect x="190" y="174" width="130" height="58" fill="#15191f" stroke="#2a3340" stroke-width="1"/><circle cx="255" cy="203" r="11" fill="#152015" stroke="#8aff8a" stroke-width="2.5"/>
  <rect x="320" y="174" width="130" height="58" fill="#15191f" stroke="#2a3340" stroke-width="1"/><circle cx="385" cy="203" r="11" fill="#152015" stroke="#8aff8a" stroke-width="2.5"/>
  <rect x="450" y="174" width="130" height="58" fill="#15191f" stroke="#2a3340" stroke-width="1"/><circle cx="515" cy="203" r="11" fill="#152015" stroke="#8aff8a" stroke-width="2.5"/>
  <rect x="580" y="174" width="130" height="58" fill="#15191f" stroke="#2a3340" stroke-width="1"/><text x="645" y="209" text-anchor="middle" fill="#5e6b7e" font-family="monospace" font-size="18">&#8211;</text>
  <rect x="710" y="174" width="130" height="58" fill="#15191f" stroke="#2a3340" stroke-width="1"/><circle cx="775" cy="203" r="11" fill="#152015" stroke="#8aff8a" stroke-width="2.5"/>
  <text x="945" y="199" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13.5" font-weight="bold">+4 new blocks</text>
  <text x="945" y="217" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">stores 14 MB</text>

  <!-- v2 row : edit block 3 -->
  <rect x="60" y="232" width="120" height="58" fill="#152015" stroke="#5e5a2f" stroke-width="1.5"/>
  <text x="120" y="256" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="16" font-weight="bold">v2</text>
  <text x="120" y="276" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11.5">&#9313; edit block 3</text>
  <rect x="190" y="232" width="130" height="58" fill="#15191f" stroke="#2a3340" stroke-width="1"/><circle cx="255" cy="261" r="11" fill="#93c5fd"/>
  <rect x="320" y="232" width="130" height="58" fill="#15191f" stroke="#2a3340" stroke-width="1"/><circle cx="385" cy="261" r="11" fill="#93c5fd"/>
  <rect x="450" y="232" width="130" height="58" fill="#15191f" stroke="#2a3340" stroke-width="1"/><text x="515" y="267" text-anchor="middle" fill="#5e6b7e" font-family="monospace" font-size="18">&#8211;</text>
  <rect x="580" y="232" width="130" height="58" fill="#15191f" stroke="#2a3340" stroke-width="1"/><circle cx="645" cy="261" r="11" fill="#1a2a16" stroke="#8aff8a" stroke-width="2.5"/>
  <rect x="710" y="232" width="130" height="58" fill="#15191f" stroke="#2a3340" stroke-width="1"/><circle cx="775" cy="261" r="11" fill="#93c5fd"/>
  <text x="945" y="257" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13.5" font-weight="bold">+1 new block (b3')</text>
  <text x="945" y="275" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">stores just 4 MB</text>

  <!-- v3 row : revert -->
  <rect x="60" y="290" width="120" height="58" fill="#1a1018" stroke="#ff8bd2" stroke-width="2"/>
  <text x="120" y="314" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="16" font-weight="bold">v3</text>
  <text x="120" y="334" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="11.5">&#9314; revert to v1</text>
  <rect x="190" y="290" width="130" height="58" fill="#15191f" stroke="#2a3340" stroke-width="1"/><circle cx="255" cy="319" r="11" fill="#93c5fd"/>
  <rect x="320" y="290" width="130" height="58" fill="#15191f" stroke="#2a3340" stroke-width="1"/><circle cx="385" cy="319" r="11" fill="#93c5fd"/>
  <rect x="450" y="290" width="130" height="58" fill="#15191f" stroke="#2a3340" stroke-width="1"/><circle cx="515" cy="319" r="11" fill="#93c5fd"/>
  <rect x="580" y="290" width="130" height="58" fill="#15191f" stroke="#2a3340" stroke-width="1"/><text x="645" y="325" text-anchor="middle" fill="#5e6b7e" font-family="monospace" font-size="18">&#8211;</text>
  <rect x="710" y="290" width="130" height="58" fill="#15191f" stroke="#2a3340" stroke-width="1"/><circle cx="775" cy="319" r="11" fill="#93c5fd"/>
  <text x="945" y="315" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="13.5" font-weight="bold">+0 new blocks</text>
  <text x="945" y="333" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">pure pointers &#8212; free</text>

  <!-- stored-once row -->
  <rect x="60" y="348" width="120" height="44" fill="#15140d" stroke="#5e5a2f" stroke-width="1.5"/><text x="120" y="375" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="12.5" font-weight="bold">stored in S3</text>
  <g font-family="sans-serif" font-size="12.5">
    <rect x="190" y="348" width="130" height="44" fill="#15140d" stroke="#5e5a2f" stroke-width="1.5"/><text x="255" y="370" text-anchor="middle" fill="#cbd5e1">&#215;1 &#183; 4 MB</text>
    <rect x="320" y="348" width="130" height="44" fill="#15140d" stroke="#5e5a2f" stroke-width="1.5"/><text x="385" y="370" text-anchor="middle" fill="#cbd5e1">&#215;1 &#183; 4 MB</text>
    <rect x="450" y="348" width="130" height="44" fill="#15140d" stroke="#5e5a2f" stroke-width="1.5"/><text x="515" y="370" text-anchor="middle" fill="#cbd5e1">&#215;1 &#183; 4 MB</text>
    <rect x="580" y="348" width="130" height="44" fill="#15140d" stroke="#5e5a2f" stroke-width="1.5"/><text x="645" y="370" text-anchor="middle" fill="#cbd5e1">&#215;1 &#183; 4 MB</text>
    <rect x="710" y="348" width="130" height="44" fill="#15140d" stroke="#5e5a2f" stroke-width="1.5"/><text x="775" y="370" text-anchor="middle" fill="#cbd5e1">&#215;1 &#183; 2 MB</text>
  </g>
  <text x="945" y="375" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="13.5" font-weight="bold">pool total: 18 MB</text>

  <!-- punchline -->
  <rect x="60" y="424" width="1060" height="100" rx="12" fill="#1b2735" stroke="#93c5fd" stroke-width="2"/>
  <text x="84" y="454" fill="#ffff99" font-family="sans-serif" font-size="16" font-weight="bold">Three full versions of a 14 MB file cost 18 MB total &#8212; not 42 MB.</text>
  <text x="84" y="482" fill="#cbd5e1" font-family="sans-serif" font-size="14">A version is a <tspan fill="#8aff8a" font-weight="bold">recipe</tspan> &#8212; a list of pointers into the shared pool. The edit (v2) added only the one block that changed;</text>
  <text x="84" y="504" fill="#cbd5e1" font-family="sans-serif" font-size="14">the revert (v3) added <tspan fill="#ff8bd2" font-weight="bold">nothing</tspan>, it just points back at blocks already there. Any version rebuilds instantly by following its row.</text>
</svg>
