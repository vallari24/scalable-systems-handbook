<svg width="1180" height="680" viewBox="0 0 1180 680" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="mv-arrow" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#cbd5e1"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1180" height="680" fill="#111317"/>

  <text x="590" y="42" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="29" font-weight="bold">Multi-versioning: every update appends a namespace version</text>
  <text x="590" y="72" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="16">a restore is a new row with an old blocklist; clients see the new row and fetch only missing blocks</text>

  <!-- namespace log table -->
  <rect x="50" y="102" width="1080" height="350" rx="12" fill="#15191f" stroke="#3a4655" stroke-width="1.8"/>
  <g font-family="sans-serif" font-size="13" font-weight="bold">
    <rect x="72" y="124" width="92" height="38" fill="#2a2a16" stroke="#5e5a2f" stroke-width="1.3"/>
    <text x="118" y="149" text-anchor="middle" fill="#cbd5e1">version</text>
    <rect x="164" y="124" width="238" height="38" fill="#2a2a16" stroke="#5e5a2f" stroke-width="1.3"/>
    <text x="283" y="149" text-anchor="middle" fill="#cbd5e1">relative_path</text>
    <rect x="402" y="124" width="372" height="38" fill="#2a2a16" stroke="#5e5a2f" stroke-width="1.3"/>
    <text x="588" y="149" text-anchor="middle" fill="#cbd5e1">blocklist / tombstone</text>
    <rect x="774" y="124" width="334" height="38" fill="#2a2a16" stroke="#5e5a2f" stroke-width="1.3"/>
    <text x="941" y="149" text-anchor="middle" fill="#cbd5e1">what this version means</text>
  </g>

  <g font-family="monospace" font-size="15">
    <!-- v1 -->
    <rect x="72" y="162" width="92" height="45" fill="#1d1d12" stroke="#3a4655" stroke-width="1"/>
    <text x="118" y="190" text-anchor="middle" fill="#8aff8a" font-weight="bold">v1</text>
    <rect x="164" y="162" width="238" height="45" fill="#15191f" stroke="#3a4655" stroke-width="1"/>
    <text x="186" y="190" fill="#ff8bd2">/video.avi</text>
    <rect x="402" y="162" width="372" height="45" fill="#15191f" stroke="#3a4655" stroke-width="1"/>
    <text x="424" y="190" fill="#93c5fd">[h1, h2, h3, h4]</text>
    <rect x="774" y="162" width="334" height="45" fill="#15191f" stroke="#3a4655" stroke-width="1"/>
    <text x="796" y="190" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">initial upload stores four blocks</text>

    <!-- v2 -->
    <rect x="72" y="207" width="92" height="45" fill="#1d1d12" stroke="#3a4655" stroke-width="1"/>
    <text x="118" y="235" text-anchor="middle" fill="#8aff8a" font-weight="bold">v2</text>
    <rect x="164" y="207" width="238" height="45" fill="#15191f" stroke="#3a4655" stroke-width="1"/>
    <text x="186" y="235" fill="#ff8bd2">/video.avi</text>
    <rect x="402" y="207" width="372" height="45" fill="#15191f" stroke="#3a4655" stroke-width="1"/>
    <text x="424" y="235" fill="#93c5fd">[h1, h2, h3', h4]</text>
    <rect x="774" y="207" width="334" height="45" fill="#15191f" stroke="#3a4655" stroke-width="1"/>
    <text x="796" y="235" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">edit block 3; upload h3' only</text>

    <!-- v3 -->
    <rect x="72" y="252" width="92" height="45" fill="#1d1d12" stroke="#3a4655" stroke-width="1"/>
    <text x="118" y="280" text-anchor="middle" fill="#8aff8a" font-weight="bold">v3</text>
    <rect x="164" y="252" width="238" height="45" fill="#15191f" stroke="#3a4655" stroke-width="1"/>
    <text x="186" y="280" fill="#ff8bd2">/photo.jpg</text>
    <rect x="402" y="252" width="372" height="45" fill="#15191f" stroke="#3a4655" stroke-width="1"/>
    <text x="424" y="280" fill="#93c5fd">[h6]</text>
    <rect x="774" y="252" width="334" height="45" fill="#15191f" stroke="#3a4655" stroke-width="1"/>
    <text x="796" y="280" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">another file changes in same namespace</text>

    <!-- v4 -->
    <rect x="72" y="297" width="92" height="45" fill="#1d1d12" stroke="#3a4655" stroke-width="1"/>
    <text x="118" y="325" text-anchor="middle" fill="#8aff8a" font-weight="bold">v4</text>
    <rect x="164" y="297" width="238" height="45" fill="#15191f" stroke="#3a4655" stroke-width="1"/>
    <text x="186" y="325" fill="#ff8bd2">/notes.txt</text>
    <rect x="402" y="297" width="372" height="45" fill="#15191f" stroke="#3a4655" stroke-width="1"/>
    <text x="424" y="325" fill="#93c5fd">[h2, h8]</text>
    <rect x="774" y="297" width="334" height="45" fill="#15191f" stroke="#3a4655" stroke-width="1"/>
    <text x="796" y="325" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">notes update; h2 can be reused</text>

    <!-- v5 -->
    <rect x="72" y="342" width="92" height="45" fill="#1d1d12" stroke="#3a4655" stroke-width="1"/>
    <text x="118" y="370" text-anchor="middle" fill="#8aff8a" font-weight="bold">v5</text>
    <rect x="164" y="342" width="238" height="45" fill="#15191f" stroke="#3a4655" stroke-width="1"/>
    <text x="186" y="370" fill="#ff8bd2">/photo.jpg</text>
    <rect x="402" y="342" width="372" height="45" fill="#15191f" stroke="#3a4655" stroke-width="1"/>
    <text x="424" y="370" fill="#93c5fd">[h6']</text>
    <rect x="774" y="342" width="334" height="45" fill="#15191f" stroke="#3a4655" stroke-width="1"/>
    <text x="796" y="370" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">photo edit; upload h6' only</text>

    <!-- v6 -->
    <rect x="72" y="387" width="92" height="45" fill="#1a1018" stroke="#ff8bd2" stroke-width="2"/>
    <text x="118" y="415" text-anchor="middle" fill="#8aff8a" font-weight="bold">v6</text>
    <rect x="164" y="387" width="238" height="45" fill="#1a1018" stroke="#ff8bd2" stroke-width="1.4"/>
    <text x="186" y="415" fill="#ff8bd2">/video.avi</text>
    <rect x="402" y="387" width="372" height="45" fill="#1a1018" stroke="#ff8bd2" stroke-width="1.4"/>
    <text x="424" y="415" fill="#93c5fd">[h1, h2, h3, h4]</text>
    <rect x="774" y="387" width="334" height="45" fill="#1a1018" stroke="#ff8bd2" stroke-width="1.4"/>
    <text x="796" y="415" fill="#ff8bd2" font-family="sans-serif" font-size="13.5" font-weight="bold">restore: new row, old recipe, 0 uploads</text>
  </g>

  <!-- catch-up path -->
  <rect x="70" y="486" width="500" height="130" rx="12" fill="#16202e" stroke="#93c5fd" stroke-width="2"/>
  <text x="94" y="520" fill="#93c5fd" font-family="sans-serif" font-size="17" font-weight="bold">Client catch-up</text>
  <text x="94" y="552" fill="#cbd5e1" font-family="sans-serif" font-size="14">client at cursor v5 asks: "anything after 5?"</text>
  <text x="94" y="580" fill="#cbd5e1" font-family="sans-serif" font-size="14">server returns v6: /video.avi -> [h1, h2, h3, h4]</text>
  <text x="94" y="608" fill="#8aff8a" font-family="sans-serif" font-size="14" font-weight="bold">client fetches only missing h3, then advances cursor to v6</text>

  <line x1="590" y1="551" x2="638" y2="551" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#mv-arrow)"/>

  <!-- storage rule -->
  <rect x="660" y="486" width="450" height="130" rx="12" fill="#1d1d12" stroke="#ffff99" stroke-width="2"/>
  <text x="684" y="520" fill="#ffff99" font-family="sans-serif" font-size="17" font-weight="bold">Storage rule</text>
  <text x="684" y="552" fill="#cbd5e1" font-family="sans-serif" font-size="14">version rows are small recipes over shared blocks</text>
  <text x="684" y="580" fill="#cbd5e1" font-family="sans-serif" font-size="14">the edit stores h3'; the restore stores no new bytes</text>
  <text x="684" y="608" fill="#9aa6b2" font-family="sans-serif" font-size="14">GC deletes blocks only when no retained version references them</text>
</svg>
