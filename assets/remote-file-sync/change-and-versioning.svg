<svg width="1180" height="640" viewBox="0 0 1180 640" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="cv-a" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#cbd5e1"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1180" height="640" fill="#111317"/>

  <text x="590" y="44" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="29" font-weight="bold">What Changes When a File Changes</text>
  <text x="590" y="72" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="16">edit a few bytes &#8594; only one block&#8217;s hash changes &#8594; upload only that block &#8594; new version</text>

  <!-- old blocklist -->
  <text x="120" y="120" fill="#cbd5e1" font-family="sans-serif" font-size="15" font-weight="bold">before edit</text>
  <g font-family="monospace" font-size="15" font-weight="bold">
    <rect x="120" y="132" width="80" height="40" rx="7" fill="#16202e" stroke="#93c5fd" stroke-width="2"/><text x="160" y="158" text-anchor="middle" fill="#93c5fd">h1</text>
    <rect x="206" y="132" width="80" height="40" rx="7" fill="#16202e" stroke="#93c5fd" stroke-width="2"/><text x="246" y="158" text-anchor="middle" fill="#93c5fd">h2</text>
    <rect x="292" y="132" width="80" height="40" rx="7" fill="#16202e" stroke="#93c5fd" stroke-width="2"/><text x="332" y="158" text-anchor="middle" fill="#93c5fd">h3</text>
    <rect x="378" y="132" width="80" height="40" rx="7" fill="#16202e" stroke="#93c5fd" stroke-width="2"/><text x="418" y="158" text-anchor="middle" fill="#93c5fd">h4</text>
  </g>

  <line x1="500" y1="152" x2="556" y2="152" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#cv-a)"/>
  <text x="528" y="142" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">edit</text>

  <!-- new blocklist -->
  <text x="600" y="120" fill="#cbd5e1" font-family="sans-serif" font-size="15" font-weight="bold">after edit &#8212; only block 3 differs</text>
  <g font-family="monospace" font-size="15" font-weight="bold">
    <rect x="600" y="132" width="80" height="40" rx="7" fill="#16202e" stroke="#3a4a5e" stroke-width="2"/><text x="640" y="158" text-anchor="middle" fill="#5e6b7e">h1</text>
    <rect x="686" y="132" width="80" height="40" rx="7" fill="#16202e" stroke="#3a4a5e" stroke-width="2"/><text x="726" y="158" text-anchor="middle" fill="#5e6b7e">h2</text>
    <rect x="772" y="132" width="80" height="40" rx="7" fill="#2a1018" stroke="#ff6b6b" stroke-width="2.5"/><text x="812" y="158" text-anchor="middle" fill="#ff6b6b">h3'</text>
    <rect x="858" y="132" width="80" height="40" rx="7" fill="#16202e" stroke="#3a4a5e" stroke-width="2"/><text x="898" y="158" text-anchor="middle" fill="#5e6b7e">h4</text>
  </g>
  <text x="980" y="158" fill="#9aa6b2" font-family="sans-serif" font-size="13">h1,h2,h4 unchanged</text>

  <!-- mini sequence -->
  <g font-family="sans-serif">
    <rect x="200" y="218" width="150" height="36" rx="9" fill="#1a1018" stroke="#ff8bd2" stroke-width="2.5"/>
    <text x="275" y="242" text-anchor="middle" fill="#ff8bd2" font-size="15" font-weight="bold">client</text>
    <line x1="275" y1="254" x2="275" y2="470" stroke="#3a4a5e" stroke-width="2"/>

    <rect x="700" y="218" width="180" height="36" rx="9" fill="#16202e" stroke="#93c5fd" stroke-width="2.5"/>
    <text x="790" y="242" text-anchor="middle" fill="#93c5fd" font-size="15" font-weight="bold">meta server</text>
    <line x1="790" y1="254" x2="790" y2="470" stroke="#3a4a5e" stroke-width="2"/>
  </g>

  <g font-family="monospace" font-size="14">
    <line x1="275" y1="296" x2="786" y2="296" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#cv-a)"/>
    <text x="530" y="286" text-anchor="middle" fill="#ff8bd2">commit /video.avi  [h1, h2, h3', h4]</text>

    <line x1="790" y1="340" x2="279" y2="340" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#cv-a)"/>
    <text x="530" y="330" text-anchor="middle" fill="#93c5fd">need h3'  &#8212; only the changed block</text>

    <line x1="275" y1="392" x2="786" y2="392" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#cv-a)"/>
    <text x="530" y="382" text-anchor="middle" fill="#ff8bd2">upload b3'  &#8594;  re-commit</text>

    <line x1="790" y1="436" x2="279" y2="436" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#cv-a)"/>
    <text x="530" y="426" text-anchor="middle" fill="#8aff8a">OK &#8212; saved as version 2</text>
  </g>
  <text x="950" y="360" fill="#9aa6b2" font-family="sans-serif" font-size="13">one 4 MB block</text>
  <text x="950" y="380" fill="#9aa6b2" font-family="sans-serif" font-size="13">on the wire, not 14 MB</text>

  <!-- version table -->
  <text x="120" y="510" fill="#ffff99" font-family="sans-serif" font-size="16" font-weight="bold">File Metadata DB &#8212; a new row per version, never an overwrite</text>
  <g font-family="monospace" font-size="14">
    <rect x="120" y="524" width="120" height="34" fill="#2a2a16" stroke="#5e5a2f" stroke-width="1.5"/><text x="180" y="546" text-anchor="middle" fill="#cbd5e1" font-weight="bold">version</text>
    <rect x="240" y="524" width="240" height="34" fill="#2a2a16" stroke="#5e5a2f" stroke-width="1.5"/><text x="360" y="546" text-anchor="middle" fill="#cbd5e1" font-weight="bold">namespace</text>
    <rect x="480" y="524" width="240" height="34" fill="#2a2a16" stroke="#5e5a2f" stroke-width="1.5"/><text x="600" y="546" text-anchor="middle" fill="#cbd5e1" font-weight="bold">relative_path</text>
    <rect x="720" y="524" width="300" height="34" fill="#2a2a16" stroke="#5e5a2f" stroke-width="1.5"/><text x="870" y="546" text-anchor="middle" fill="#cbd5e1" font-weight="bold">blocklist</text>

    <rect x="120" y="558" width="120" height="34" fill="#1d1d12" stroke="#5e5a2f" stroke-width="1.5"/><text x="180" y="580" text-anchor="middle" fill="#8aff8a">1</text>
    <rect x="240" y="558" width="240" height="34" fill="#1d1d12" stroke="#5e5a2f" stroke-width="1.5"/><text x="360" y="580" text-anchor="middle" fill="#ffff99">vallari_mehta</text>
    <rect x="480" y="558" width="240" height="34" fill="#1d1d12" stroke="#5e5a2f" stroke-width="1.5"/><text x="600" y="580" text-anchor="middle" fill="#ff8bd2">/video.avi</text>
    <rect x="720" y="558" width="300" height="34" fill="#1d1d12" stroke="#5e5a2f" stroke-width="1.5"/><text x="870" y="580" text-anchor="middle" fill="#93c5fd">[h1, h2, h3, h4]</text>

    <rect x="120" y="592" width="120" height="34" fill="#152015" stroke="#5e5a2f" stroke-width="1.5"/><text x="180" y="614" text-anchor="middle" fill="#8aff8a">2</text>
    <rect x="240" y="592" width="240" height="34" fill="#152015" stroke="#5e5a2f" stroke-width="1.5"/><text x="360" y="614" text-anchor="middle" fill="#ffff99">vallari_mehta</text>
    <rect x="480" y="592" width="240" height="34" fill="#152015" stroke="#5e5a2f" stroke-width="1.5"/><text x="600" y="614" text-anchor="middle" fill="#ff8bd2">/video.avi</text>
    <rect x="720" y="592" width="300" height="34" fill="#152015" stroke="#5e5a2f" stroke-width="1.5"/><text x="870" y="614" text-anchor="middle" fill="#93c5fd">[h1, h2, <tspan fill="#ff6b6b">h3'</tspan>, h4]</text>
  </g>
</svg>
