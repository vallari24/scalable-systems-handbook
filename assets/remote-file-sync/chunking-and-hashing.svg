<svg width="1180" height="600" viewBox="0 0 1180 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ch-a" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#cbd5e1"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1180" height="600" fill="#111317"/>

  <text x="590" y="46" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="29" font-weight="bold">Chunking + Content Hashing</text>
  <text x="590" y="76" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="16">split the file into fixed-size blocks, hash each block, and a file becomes a list of hashes</text>

  <!-- the file -->
  <text x="120" y="128" fill="#cbd5e1" font-family="sans-serif" font-size="15" font-weight="bold">14 MB &#8194;video.avi</text>
  <g>
    <rect x="120" y="142" width="160" height="58" fill="#1a1018" stroke="#ff8bd2" stroke-width="2.5"/>
    <rect x="280" y="142" width="160" height="58" fill="#1a1018" stroke="#ff8bd2" stroke-width="2.5"/>
    <rect x="440" y="142" width="160" height="58" fill="#1a1018" stroke="#ff8bd2" stroke-width="2.5"/>
    <rect x="600" y="142" width="80"  height="58" fill="#1a1018" stroke="#ff8bd2" stroke-width="2.5"/>
  </g>
  <text x="200" y="222" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="14">4 MB</text>
  <text x="360" y="222" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="14">4 MB</text>
  <text x="520" y="222" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="14">4 MB</text>
  <text x="640" y="222" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="14">2 MB</text>
  <text x="200" y="180" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="14" font-weight="bold">block&#8201;1</text>
  <text x="360" y="180" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="14" font-weight="bold">block&#8201;2</text>
  <text x="520" y="180" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="14" font-weight="bold">block&#8201;3</text>
  <text x="640" y="180" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="13" font-weight="bold">b4</text>

  <text x="850" y="168" fill="#cbd5e1" font-family="sans-serif" font-size="15">file is broken into</text>
  <text x="850" y="190" fill="#cbd5e1" font-family="sans-serif" font-size="15">fixed&#8209;size chunks; each</text>
  <text x="850" y="212" fill="#cbd5e1" font-family="sans-serif" font-size="15">chunk is called a <tspan fill="#ff8bd2" font-weight="bold">block</tspan></text>

  <!-- hash arrows -->
  <line x1="200" y1="240" x2="200" y2="288" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#ch-a)"/>
  <line x1="360" y1="240" x2="360" y2="288" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#ch-a)"/>
  <line x1="520" y1="240" x2="520" y2="288" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#ch-a)"/>
  <line x1="640" y1="240" x2="640" y2="288" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#ch-a)"/>
  <text x="245" y="270" fill="#9aa6b2" font-family="sans-serif" font-size="13" font-style="italic">hash()</text>

  <!-- hashes -->
  <g font-family="monospace" font-size="16" font-weight="bold">
    <rect x="158" y="296" width="84" height="34" rx="7" fill="#16202e" stroke="#93c5fd" stroke-width="2"/>
    <text x="200" y="319" text-anchor="middle" fill="#93c5fd">h1</text>
    <rect x="318" y="296" width="84" height="34" rx="7" fill="#16202e" stroke="#93c5fd" stroke-width="2"/>
    <text x="360" y="319" text-anchor="middle" fill="#93c5fd">h2</text>
    <rect x="478" y="296" width="84" height="34" rx="7" fill="#16202e" stroke="#93c5fd" stroke-width="2"/>
    <text x="520" y="319" text-anchor="middle" fill="#93c5fd">h3</text>
    <rect x="600" y="296" width="80" height="34" rx="7" fill="#16202e" stroke="#93c5fd" stroke-width="2"/>
    <text x="640" y="319" text-anchor="middle" fill="#93c5fd">h4</text>
  </g>
  <text x="850" y="318" fill="#cbd5e1" font-family="sans-serif" font-size="15">a hash uniquely identifies a block</text>

  <!-- blocklist -->
  <text x="120" y="396" fill="#ffff99" font-family="sans-serif" font-size="16" font-weight="bold">A file = an ordered list of block hashes (the <tspan fill="#8aff8a">blocklist</tspan>)</text>
  <rect x="120" y="412" width="560" height="44" rx="9" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
  <text x="400" y="440" text-anchor="middle" fill="#ffff99" font-family="monospace" font-size="18" font-weight="bold">video.avi  &#8594;  [ h1, h2, h3, h4 ]</text>

  <!-- blocks stored content-addressed in S3 -->
  <text x="120" y="508" fill="#cbd5e1" font-family="sans-serif" font-size="15" font-weight="bold">Blocks live in blob storage (S3), keyed by their own hash &#8212; <tspan fill="#9aa6b2" font-weight="normal">content-addressed</tspan></text>
  <rect x="120" y="524" width="700" height="42" rx="9" fill="#16202e" stroke="#93c5fd" stroke-width="2"/>
  <text x="138" y="551" fill="#93c5fd" font-family="monospace" font-size="16">s3://my-dropbox/&lt;account_id&gt;/&lt;block_hash&gt;</text>
  <text x="980" y="430" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13">identical bytes</text>
  <text x="980" y="450" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13">&#8594; identical hash</text>
  <text x="980" y="470" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13">&#8594; stored once</text>
</svg>
