<svg width="1200" height="700" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="cd-w" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ffffff"/>
    </marker>
    <marker id="cd-y" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ffff99"/>
    </marker>
    <marker id="cd-g" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8aff8a"/>
    </marker>
    <marker id="cd-p" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ff8bd2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="700" fill="#111317"/>

  <text x="600" y="44" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="30" font-weight="bold">Change Data Capture: Tap the Source of Truth</text>
  <text x="600" y="74" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">don&#8217;t trust hand-written events &#8212; read the database&#8217;s own <tspan fill="#8aff8a" font-weight="bold">commit log</tspan></text>

  <!-- ===== left: the pipeline ===== -->
  <!-- client -> API -> MongoDB -->
  <circle cx="90" cy="150" r="14" fill="none" stroke="#ffffff" stroke-width="2"/>
  <line x1="90" y1="164" x2="90" y2="196" stroke="#ffffff" stroke-width="2"/>
  <line x1="74" y1="178" x2="106" y2="178" stroke="#ffffff" stroke-width="2"/>
  <line x1="90" y1="196" x2="78" y2="218" stroke="#ffffff" stroke-width="2"/>
  <line x1="90" y1="196" x2="102" y2="218" stroke="#ffffff" stroke-width="2"/>
  <text x="90" y="240" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13">client</text>

  <rect x="170" y="122" width="110" height="56" rx="9" fill="#1c1f25" stroke="#ffffff" stroke-width="2"/>
  <text x="225" y="156" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">API</text>
  <line x1="110" y1="150" x2="166" y2="150" stroke="#ffffff" stroke-width="2" marker-end="url(#cd-w)"/>

  <g stroke="#ffff99" stroke-width="2.5" fill="#1d1d12">
    <ellipse cx="430" cy="128" rx="46" ry="15"/>
    <rect x="384" y="128" width="92" height="50" fill="#1d1d12" stroke="none"/>
    <path d="M384,128 L384,178" fill="none"/><path d="M476,128 L476,178" fill="none"/>
    <path d="M384,178 A46,15 0 0 0 476,178" fill="none"/>
    <ellipse cx="430" cy="128" rx="46" ry="15" fill="none"/>
  </g>
  <text x="430" y="204" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="15" font-weight="bold">MongoDB</text>
  <text x="430" y="223" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">source of truth</text>
  <line x1="282" y1="150" x2="380" y2="150" stroke="#ffff99" stroke-width="2" marker-end="url(#cd-y)"/>

  <!-- bin-log strip -->
  <rect x="330" y="258" width="200" height="50" rx="8" fill="#0f2417" stroke="#8aff8a" stroke-width="2"/>
  <text x="430" y="280" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="14" font-weight="bold">commit-log / bin-log</text>
  <text x="430" y="299" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11">every commit appends here</text>
  <line x1="430" y1="240" x2="430" y2="254" stroke="#8aff8a" stroke-width="2" marker-end="url(#cd-g)"/>

  <!-- CDC stacked -->
  <rect x="356" y="356" width="148" height="50" rx="8" fill="#2a0f1f" stroke="#ff8bd2" stroke-width="2"/>
  <rect x="348" y="364" width="148" height="50" rx="8" fill="#2a0f1f" stroke="#ff8bd2" stroke-width="2"/>
  <rect x="340" y="372" width="148" height="50" rx="8" fill="#2a0f1f" stroke="#ff8bd2" stroke-width="2.5"/>
  <text x="414" y="402" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="15" font-weight="bold">CDC</text>
  <line x1="430" y1="308" x2="424" y2="368" stroke="#8aff8a" stroke-width="2" marker-end="url(#cd-g)"/>
  <text x="556" y="350" fill="#9aa6b2" font-family="sans-serif" font-size="12">tails the log,</text>
  <text x="556" y="368" fill="#9aa6b2" font-family="sans-serif" font-size="12">no app code</text>

  <!-- CDC -> sink -->
  <line x1="414" y1="422" x2="414" y2="486" stroke="#ff8bd2" stroke-width="2" marker-end="url(#cd-p)"/>
  <text x="426" y="458" fill="#ff8bd2" font-family="sans-serif" font-size="12">transform + load</text>

  <!-- MySQL sink -->
  <g stroke="#ffff99" stroke-width="2.5" fill="#1d1d12">
    <ellipse cx="414" cy="500" rx="46" ry="15"/>
    <rect x="368" y="500" width="92" height="50" fill="#1d1d12" stroke="none"/>
    <path d="M368,500 L368,550" fill="none"/><path d="M460,500 L460,550" fill="none"/>
    <path d="M368,550 A46,15 0 0 0 460,550" fill="none"/>
    <ellipse cx="414" cy="500" rx="46" ry="15" fill="none"/>
  </g>
  <text x="414" y="576" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="15" font-weight="bold">sink: MySQL</text>

  <!-- ===== right panel ===== -->
  <rect x="640" y="104" width="520" height="476" rx="12" fill="#16191e" stroke="#ff8bd2" stroke-width="2"/>
  <text x="664" y="138" fill="#ff8bd2" font-family="sans-serif" font-size="20" font-weight="bold">What CDC actually does</text>

  <text x="664" y="174" fill="#cbd5e1" font-family="sans-serif" font-size="15">Reads the log the DB <tspan font-style="italic">already</tspan> keeps for crash</text>
  <text x="664" y="196" fill="#cbd5e1" font-family="sans-serif" font-size="15">recovery and replication &#8212; no app changes.</text>

  <text x="664" y="236" fill="#8aff8a" font-family="sans-serif" font-size="16" font-weight="bold">One event per row/doc change</text>
  <g font-family="monospace" font-size="14" text-anchor="middle">
    <rect x="664" y="252" width="130" height="38" rx="6" fill="#1d1216" stroke="#ff8bd2" stroke-width="1.6"/><text x="729" y="276" fill="#ff8bd2">INSERT</text>
    <rect x="806" y="252" width="130" height="38" rx="6" fill="#1d1216" stroke="#ff8bd2" stroke-width="1.6"/><text x="871" y="276" fill="#ff8bd2">UPDATE</text>
    <rect x="948" y="252" width="130" height="38" rx="6" fill="#1d1216" stroke="#ff8bd2" stroke-width="1.6"/><text x="1013" y="276" fill="#ff8bd2">DELETE</text>
  </g>
  <text x="664" y="316" fill="#9aa6b2" font-family="sans-serif" font-size="13">insert/update/delete on the Blogs table &#8594; one event each.</text>

  <text x="664" y="356" fill="#ffff99" font-family="sans-serif" font-size="16" font-weight="bold">Off-the-shelf tools</text>
  <text x="664" y="382" fill="#cbd5e1" font-family="sans-serif" font-size="15">&#8226; <tspan fill="#ffff99" font-weight="bold">Airbyte</tspan>, <tspan fill="#ffff99" font-weight="bold">Debezium</tspan> &#8212; configure source &#8594; sink.</text>

  <text x="664" y="420" fill="#ffff99" font-family="sans-serif" font-size="16" font-weight="bold">Or do it yourself</text>
  <text x="664" y="446" fill="#cbd5e1" font-family="sans-serif" font-size="15">Pick any sink &#8212; <tspan fill="#93c5fd" font-weight="bold">Kafka</tspan>, <tspan fill="#93c5fd" font-weight="bold">SQS</tspan>, a broker &#8212; and</text>
  <text x="664" y="468" fill="#cbd5e1" font-family="sans-serif" font-size="15">build your own complex transformations on the stream.</text>

  <rect x="664" y="498" width="472" height="64" rx="9" fill="#2a0f1f" stroke="#ff8bd2" stroke-width="2"/>
  <text x="900" y="524" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="15" font-weight="bold">The core idea</text>
  <text x="900" y="548" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="14">do NOT rely on events &#8212; rely on the database.</text>

  <!-- bottom note -->
  <text x="414" y="624" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13">Every change to the data is captured &#8212;</text>
  <text x="414" y="644" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13">because the log is the truth, not the app code.</text>
</svg>
