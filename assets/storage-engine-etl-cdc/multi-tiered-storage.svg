<svg width="1200" height="600" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="mt-g" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8aff8a"/>
    </marker>
    <marker id="mt-p" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ff8bd2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="600" fill="#111317"/>

  <text x="600" y="44" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="30" font-weight="bold">CDC Powers Multi-Tiered Storage</text>
  <text x="600" y="74" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">one source of truth fans out to a store specialized for each job</text>

  <!-- column headers -->
  <g font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">
    <text x="150" y="124" fill="#ffff99">Transactional</text>
    <text x="480" y="124" fill="#8aff8a">Search</text>
    <text x="760" y="124" fill="#8aff8a">Analytics</text>
    <text x="1040" y="124" fill="#8aff8a">Backup</text>
  </g>

  <!-- source: MySQL -->
  <g stroke="#ffff99" stroke-width="2.5" fill="#1d1d12">
    <ellipse cx="150" cy="170" rx="48" ry="16"/>
    <rect x="102" y="170" width="96" height="58" fill="#1d1d12" stroke="none"/>
    <path d="M102,170 L102,228" fill="none"/><path d="M198,170 L198,228" fill="none"/>
    <path d="M102,228 A48,16 0 0 0 198,228" fill="none"/>
    <ellipse cx="150" cy="170" rx="48" ry="16" fill="none"/>
  </g>
  <text x="150" y="254" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="15" font-weight="bold">MySQL</text>
  <text x="150" y="274" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">source of truth</text>

  <!-- sinks -->
  <!-- ElasticSearch -->
  <g stroke="#ffffff" stroke-width="2.5" fill="#15171c">
    <ellipse cx="480" cy="170" rx="46" ry="15"/>
    <rect x="434" y="170" width="92" height="54" fill="#15171c" stroke="none"/>
    <path d="M434,170 L434,224" fill="none"/><path d="M526,170 L526,224" fill="none"/>
    <path d="M434,224 A46,15 0 0 0 526,224" fill="none"/>
    <ellipse cx="480" cy="170" rx="46" ry="15" fill="none"/>
  </g>
  <text x="480" y="250" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">ElasticSearch</text>

  <!-- Redshift -->
  <g stroke="#ffffff" stroke-width="2.5" fill="#15171c">
    <ellipse cx="760" cy="170" rx="46" ry="15"/>
    <rect x="714" y="170" width="92" height="54" fill="#15171c" stroke="none"/>
    <path d="M714,170 L714,224" fill="none"/><path d="M806,170 L806,224" fill="none"/>
    <path d="M714,224 A46,15 0 0 0 806,224" fill="none"/>
    <ellipse cx="760" cy="170" rx="46" ry="15" fill="none"/>
  </g>
  <text x="760" y="250" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Redshift</text>

  <!-- S3 cloud -->
  <path d="M1000,210 q -28,0 -28,-26 q 0,-26 30,-22 q 8,-26 40,-18 q 30,-14 42,16 q 28,-2 24,28 q 0,22 -26,22 z"
        fill="#15171c" stroke="#ffffff" stroke-width="2.5"/>
  <text x="1042" y="196" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">S3</text>
  <text x="1042" y="250" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">object store</text>

  <!-- change stream from source: down then across -->
  <path d="M150,290 L150,430 L1040,430" fill="none" stroke="#8aff8a" stroke-width="2.5"/>
  <text x="180" y="420" fill="#8aff8a" font-family="sans-serif" font-size="13" font-weight="bold">change stream (the commit log)</text>

  <!-- CDC boxes on the stream, each feeding a sink -->
  <!-- ES CDC -->
  <rect x="430" y="406" width="100" height="48" rx="8" fill="#2a0f1f" stroke="#ff8bd2" stroke-width="2.5"/>
  <text x="480" y="435" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="14" font-weight="bold">CDC</text>
  <line x1="480" y1="404" x2="480" y2="230" stroke="#8aff8a" stroke-width="2" marker-end="url(#mt-g)"/>
  <!-- Redshift CDC -->
  <rect x="710" y="406" width="100" height="48" rx="8" fill="#2a0f1f" stroke="#ff8bd2" stroke-width="2.5"/>
  <text x="760" y="435" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="14" font-weight="bold">CDC</text>
  <line x1="760" y1="404" x2="760" y2="230" stroke="#8aff8a" stroke-width="2" marker-end="url(#mt-g)"/>
  <!-- S3 CDC -->
  <rect x="990" y="406" width="100" height="48" rx="8" fill="#2a0f1f" stroke="#ff8bd2" stroke-width="2.5"/>
  <text x="1040" y="435" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="14" font-weight="bold">CDC</text>
  <line x1="1040" y1="404" x2="1040" y2="216" stroke="#8aff8a" stroke-width="2" marker-end="url(#mt-g)"/>

  <!-- bottom note -->
  <rect x="40" y="498" width="1120" height="78" rx="12" fill="#16191e" stroke="#8aff8a" stroke-width="2"/>
  <text x="60" y="530" fill="#8aff8a" font-family="sans-serif" font-size="16" font-weight="bold">Write once to the source; CDC keeps every tier in sync.</text>
  <text x="60" y="558" fill="#cbd5e1" font-family="sans-serif" font-size="14">Each store is tuned for its job &#8212; full-text <tspan fill="#8aff8a" font-weight="bold">search</tspan>, columnar <tspan fill="#8aff8a" font-weight="bold">analytics</tspan>, cheap durable <tspan fill="#8aff8a" font-weight="bold">backup</tspan> &#8212; all fed from one truth.</text>
</svg>
