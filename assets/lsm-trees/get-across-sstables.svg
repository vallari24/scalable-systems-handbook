<svg width="1180" height="762" viewBox="0 0 1180 762" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ga-g" markerWidth="12" markerHeight="12" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8aff8a"/>
    </marker>
    <marker id="ga-b" markerWidth="12" markerHeight="12" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#93c5fd"/>
    </marker>
    <marker id="ga-r" markerWidth="12" markerHeight="12" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#ff8a8a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="762" fill="#111317"/>

  <text x="590" y="46" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="29" font-weight="bold">GET Across Many SSTables &#8212; and the Worst Case</text>
  <text x="590" y="78" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">check the memtable, then files <tspan fill="#93c5fd" font-weight="bold">newest &#8594; oldest</tspan>, stopping at the <tspan fill="#8aff8a" font-weight="bold">first hit</tspan></text>

  <!-- TOP ROW: memtable + 5 sstables -->
  <text x="80" y="124" fill="#ff8bd2" font-family="sans-serif" font-size="15" font-weight="bold">in RAM</text>
  <rect x="80" y="134" width="170" height="150" rx="11" fill="#2a1622" stroke="#ff8bd2" stroke-width="2.5"/>
  <text x="165" y="166" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="18" font-weight="bold">memtable</text>
  <text x="165" y="190" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13">recent writes,</text>
  <text x="165" y="208" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13">sorted in memory</text>
  <rect x="100" y="222" width="130" height="20" rx="4" fill="#16191e" stroke="#7c8694" stroke-width="1.2"/>
  <text x="165" y="237" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="12">k7 : v7</text>
  <rect x="100" y="248" width="130" height="20" rx="4" fill="#16191e" stroke="#7c8694" stroke-width="1.2"/>
  <text x="165" y="263" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="12">k2 : v2'</text>

  <!-- on-disk label -->
  <text x="675" y="124" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="15" font-weight="bold">on disk &#183; sorted string tables</text>

  <!-- 5 SSTable glyphs. starts: 300, 477.5, 655, 832.5, 1010 ; width 90 ; top 134 ; height 150 -->
  <!-- 001.sst (oldest) -->
  <rect x="300" y="134" width="90" height="150" rx="8" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
  <rect x="300" y="134" width="90" height="16" rx="7" fill="#ffff99"/>
  <rect x="310" y="160" width="70" height="22" rx="4" fill="#0f2417" stroke="#8aff8a" stroke-width="1.5"/>
  <text x="345" y="176" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="12" font-weight="bold">index</text>
  <rect x="310" y="190" width="70" height="13" rx="3" fill="#16191e" stroke="#5b6470" stroke-width="1.1"/>
  <rect x="310" y="207" width="70" height="13" rx="3" fill="#16191e" stroke="#5b6470" stroke-width="1.1"/>
  <rect x="310" y="224" width="70" height="13" rx="3" fill="#16191e" stroke="#5b6470" stroke-width="1.1"/>
  <rect x="310" y="241" width="70" height="13" rx="3" fill="#16191e" stroke="#5b6470" stroke-width="1.1"/>
  <rect x="310" y="258" width="70" height="13" rx="3" fill="#16191e" stroke="#5b6470" stroke-width="1.1"/>
  <text x="345" y="308" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="14" font-weight="bold">001.sst</text>
  <text x="345" y="328" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">oldest</text>

  <!-- 002.sst -->
  <rect x="477.5" y="134" width="90" height="150" rx="8" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
  <rect x="477.5" y="134" width="90" height="16" rx="7" fill="#ffff99"/>
  <rect x="487.5" y="160" width="70" height="22" rx="4" fill="#0f2417" stroke="#8aff8a" stroke-width="1.5"/>
  <text x="522.5" y="176" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="12" font-weight="bold">index</text>
  <rect x="487.5" y="190" width="70" height="13" rx="3" fill="#16191e" stroke="#5b6470" stroke-width="1.1"/>
  <rect x="487.5" y="207" width="70" height="13" rx="3" fill="#16191e" stroke="#5b6470" stroke-width="1.1"/>
  <rect x="487.5" y="224" width="70" height="13" rx="3" fill="#16191e" stroke="#5b6470" stroke-width="1.1"/>
  <rect x="487.5" y="241" width="70" height="13" rx="3" fill="#16191e" stroke="#5b6470" stroke-width="1.1"/>
  <rect x="487.5" y="258" width="70" height="13" rx="3" fill="#16191e" stroke="#5b6470" stroke-width="1.1"/>
  <text x="522.5" y="308" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="14" font-weight="bold">002.sst</text>

  <!-- 003.sst -->
  <rect x="655" y="134" width="90" height="150" rx="8" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
  <rect x="655" y="134" width="90" height="16" rx="7" fill="#ffff99"/>
  <rect x="665" y="160" width="70" height="22" rx="4" fill="#0f2417" stroke="#8aff8a" stroke-width="1.5"/>
  <text x="700" y="176" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="12" font-weight="bold">index</text>
  <rect x="665" y="190" width="70" height="13" rx="3" fill="#16191e" stroke="#5b6470" stroke-width="1.1"/>
  <rect x="665" y="207" width="70" height="13" rx="3" fill="#16191e" stroke="#5b6470" stroke-width="1.1"/>
  <rect x="665" y="224" width="70" height="13" rx="3" fill="#16191e" stroke="#5b6470" stroke-width="1.1"/>
  <rect x="665" y="241" width="70" height="13" rx="3" fill="#16191e" stroke="#5b6470" stroke-width="1.1"/>
  <rect x="665" y="258" width="70" height="13" rx="3" fill="#16191e" stroke="#5b6470" stroke-width="1.1"/>
  <text x="700" y="308" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="14" font-weight="bold">003.sst</text>

  <!-- 004.sst -->
  <rect x="832.5" y="134" width="90" height="150" rx="8" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
  <rect x="832.5" y="134" width="90" height="16" rx="7" fill="#ffff99"/>
  <rect x="842.5" y="160" width="70" height="22" rx="4" fill="#0f2417" stroke="#8aff8a" stroke-width="1.5"/>
  <text x="877.5" y="176" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="12" font-weight="bold">index</text>
  <rect x="842.5" y="190" width="70" height="13" rx="3" fill="#16191e" stroke="#5b6470" stroke-width="1.1"/>
  <rect x="842.5" y="207" width="70" height="13" rx="3" fill="#16191e" stroke="#5b6470" stroke-width="1.1"/>
  <rect x="842.5" y="224" width="70" height="13" rx="3" fill="#16191e" stroke="#5b6470" stroke-width="1.1"/>
  <rect x="842.5" y="241" width="70" height="13" rx="3" fill="#16191e" stroke="#5b6470" stroke-width="1.1"/>
  <rect x="842.5" y="258" width="70" height="13" rx="3" fill="#16191e" stroke="#5b6470" stroke-width="1.1"/>
  <text x="877.5" y="308" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="14" font-weight="bold">004.sst</text>

  <!-- 005.sst (newest) -->
  <rect x="1010" y="134" width="90" height="150" rx="8" fill="#1d1d12" stroke="#93c5fd" stroke-width="2.5"/>
  <rect x="1010" y="134" width="90" height="16" rx="7" fill="#93c5fd"/>
  <rect x="1020" y="160" width="70" height="22" rx="4" fill="#0f2417" stroke="#8aff8a" stroke-width="1.5"/>
  <text x="1055" y="176" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="12" font-weight="bold">index</text>
  <rect x="1020" y="190" width="70" height="13" rx="3" fill="#16191e" stroke="#5b6470" stroke-width="1.1"/>
  <rect x="1020" y="207" width="70" height="13" rx="3" fill="#16191e" stroke="#5b6470" stroke-width="1.1"/>
  <rect x="1020" y="224" width="70" height="13" rx="3" fill="#16191e" stroke="#5b6470" stroke-width="1.1"/>
  <rect x="1020" y="241" width="70" height="13" rx="3" fill="#16191e" stroke="#5b6470" stroke-width="1.1"/>
  <rect x="1020" y="258" width="70" height="13" rx="3" fill="#16191e" stroke="#5b6470" stroke-width="1.1"/>
  <text x="1055" y="308" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="14" font-weight="bold">005.sst</text>
  <text x="1055" y="328" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="12" font-weight="bold">newest</text>

  <!-- search-order arrow: newest -> oldest (blue), in the gap below the files -->
  <text x="900" y="350" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="13" font-weight="bold">search order: newest &#8594; oldest</text>
  <path d="M1055 360 L 392 360" fill="none" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#ga-b)"/>

  <!-- green "return" arrow: leaves the first file that contains the key (003), down to the right -->
  <path d="M700 284 L 700 386" fill="none" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#ga-g)"/>
  <text x="712" y="334" fill="#8aff8a" font-family="sans-serif" font-size="13" font-weight="bold">first hit</text>
  <text x="712" y="352" fill="#8aff8a" font-family="sans-serif" font-size="13" font-weight="bold">&#8594; return value</text>

  <!-- GET(k) FLOW panel (green) -->
  <rect x="80" y="412" width="612" height="216" rx="12" fill="#0f2417" stroke="#8aff8a" stroke-width="2.5"/>
  <text x="104" y="444" fill="#8aff8a" font-family="sans-serif" font-size="19" font-weight="bold">GET(k)</text>
  <g font-family="sans-serif" font-size="14.5" fill="#cbd5e1">
    <text x="104" y="478"><tspan fill="#8aff8a" font-weight="bold">1.</tspan> look up k in <tspan fill="#ff8bd2" font-weight="bold">memtable</tspan> (RAM) &#8594; present? return.</text>
    <text x="104" y="512"><tspan fill="#8aff8a" font-weight="bold">2.</tspan> else start from <tspan fill="#93c5fd" font-weight="bold">NEWEST</tspan> file (005.sst), check its index &#8594;</text>
    <text x="124" y="534" fill="#9aa6b2" font-size="13.5">present? seek-read + return (stop at first hit &#183; newest is freshest).</text>
    <text x="104" y="568"><tspan fill="#8aff8a" font-weight="bold">3.</tspan> else move to next-older (004, 003 &#8230;) and repeat.</text>
    <text x="104" y="602"><tspan fill="#8aff8a" font-weight="bold">4.</tspan> no file has it &#8594; return <tspan fill="#ff8a8a" font-weight="bold">not-found (404)</tspan>.</text>
  </g>

  <!-- note: index-first (neutral / green) -->
  <rect x="716" y="412" width="384" height="216" rx="12" fill="#16191e" stroke="#8aff8a" stroke-width="2"/>
  <text x="740" y="444" fill="#8aff8a" font-family="sans-serif" font-size="17" font-weight="bold">We probe the INDEX first</text>
  <text x="740" y="478" fill="#cbd5e1" font-family="sans-serif" font-size="14.5">For each file we consult its</text>
  <text x="740" y="500" fill="#cbd5e1" font-family="sans-serif" font-size="14.5"><tspan fill="#8aff8a" font-weight="bold">index</tspan> (cheap, often in memory)</text>
  <text x="740" y="522" fill="#cbd5e1" font-family="sans-serif" font-size="14.5">&#8212; we do <tspan fill="#8aff8a" font-weight="bold">not</tspan> scan its data.</text>
  <text x="740" y="556" fill="#cbd5e1" font-family="sans-serif" font-size="14.5">A real seek-read happens only</text>
  <text x="740" y="578" fill="#cbd5e1" font-family="sans-serif" font-size="14.5">for the file that actually holds</text>
  <text x="740" y="600" fill="#cbd5e1" font-family="sans-serif" font-size="14.5">the key.</text>

  <!-- BOTTOM red worst-case panel -->
  <rect x="80" y="648" width="1020" height="96" rx="12" fill="#2a1414" stroke="#ff8a8a" stroke-width="2.5"/>
  <text x="104" y="678" fill="#ff8a8a" font-family="sans-serif" font-size="18" font-weight="bold">Worst case: a key that does NOT exist</text>
  <text x="104" y="704" fill="#cbd5e1" font-family="sans-serif" font-size="14">It forces an index probe into <tspan fill="#ff8a8a" font-weight="bold">EVERY</tspan> file (001&#8230;005) before we can conclude not-found &#8212; <tspan fill="#ff8a8a" font-weight="bold">k files = k index lookups + disk I/O</tspan> just to answer &#8220;no&#8221;.</text>
  <text x="104" y="728" fill="#cbd5e1" font-family="sans-serif" font-size="14">We attack this next with <tspan fill="#8aff8a" font-weight="bold">compaction</tspan> + <tspan fill="#8aff8a" font-weight="bold">Bloom filters</tspan>.</text>
</svg>
