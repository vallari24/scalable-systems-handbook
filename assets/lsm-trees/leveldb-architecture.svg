<svg width="1280" height="920" viewBox="0 0 1280 920" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ldb-p" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#ff8bd2"/>
    </marker>
    <marker id="ldb-g" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8aff8a"/>
    </marker>
    <marker id="ldb-b" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#93c5fd"/>
    </marker>
    <marker id="ldb-y" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#ffff99"/>
    </marker>
  </defs>

  <rect width="1280" height="920" fill="#111317"/>
  <text x="640" y="46" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="31" font-weight="bold">LevelDB Internals: End to End</text>
  <text x="640" y="78" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">a minimal LSM design: foreground writes, versioned reads, background file replacement, recoverable metadata</text>

  <!-- lane backgrounds -->
  <rect x="34" y="112" width="1212" height="238" rx="14" fill="#211522" stroke="#ff8bd2" stroke-width="1.8"/>
  <rect x="34" y="370" width="1212" height="236" rx="14" fill="#102018" stroke="#8aff8a" stroke-width="1.8"/>
  <rect x="34" y="626" width="1212" height="224" rx="14" fill="#101d2b" stroke="#93c5fd" stroke-width="1.8"/>

  <text x="58" y="140" fill="#ff8bd2" font-family="sans-serif" font-size="17" font-weight="bold">WRITE + FLUSH</text>
  <text x="58" y="398" fill="#8aff8a" font-family="sans-serif" font-size="17" font-weight="bold">READ</text>
  <text x="58" y="654" fill="#93c5fd" font-family="sans-serif" font-size="17" font-weight="bold">COMPACTION + RECOVERY METADATA</text>

  <!-- write path -->
  <rect x="62" y="170" width="142" height="94" rx="10" fill="#16191e" stroke="#ff8bd2" stroke-width="2.2"/>
  <text x="133" y="201" text-anchor="middle" fill="#ff8bd2" font-family="monospace" font-size="16" font-weight="bold">WriteBatch</text>
  <text x="133" y="226" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">Put / Delete</text>
  <text x="133" y="246" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">atomic ordered edits</text>

  <path d="M204 217 L246 217" fill="none" stroke="#ff8bd2" stroke-width="2.8" marker-end="url(#ldb-p)"/>
  <text x="225" y="202" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="12.5">1</text>

  <path d="M256 184 a84 15 0 0 0 168 0 v70 a84 15 0 0 1 -168 0 z" fill="#211f10" stroke="#ffff99" stroke-width="2.2"/>
  <ellipse cx="340" cy="184" rx="84" ry="15" fill="#211f10" stroke="#ffff99" stroke-width="2.2"/>
  <text x="340" y="214" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="16" font-weight="bold">current .log</text>
  <text x="340" y="238" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">sequential WAL</text>
  <text x="340" y="258" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">sync is configurable</text>

  <path d="M424 217 L468 217" fill="none" stroke="#ff8bd2" stroke-width="2.8" marker-end="url(#ldb-p)"/>
  <text x="446" y="202" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="12.5">2</text>

  <rect x="478" y="158" width="184" height="118" rx="11" fill="#2a1622" stroke="#ff8bd2" stroke-width="2.2"/>
  <text x="570" y="190" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="17" font-weight="bold">active memtable</text>
  <text x="570" y="216" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">sorted skip list</text>
  <text x="570" y="238" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13">serves newest reads</text>
  <text x="570" y="258" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">ordered flush later</text>

  <path d="M662 217 L706 217" fill="none" stroke="#93c5fd" stroke-width="2.8" marker-end="url(#ldb-b)"/>
  <text x="684" y="201" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="12">full: rotate</text>

  <rect x="716" y="158" width="184" height="118" rx="11" fill="#10243a" stroke="#93c5fd" stroke-width="2.2"/>
  <text x="808" y="190" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="17" font-weight="bold">immutable memtable</text>
  <text x="808" y="216" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">frozen write buffer</text>
  <text x="808" y="238" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">background flush</text>
  <text x="808" y="258" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">new writes use new pair</text>

  <path d="M900 217 L944 217" fill="none" stroke="#93c5fd" stroke-width="2.8" marker-end="url(#ldb-b)"/>
  <text x="922" y="201" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="12">flush</text>

  <rect x="954" y="146" width="260" height="142" rx="11" fill="#1d1d12" stroke="#ffff99" stroke-width="2.2"/>
  <text x="1084" y="174" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="17" font-weight="bold">Level 0 SSTables</text>
  <rect x="978" y="194" width="94" height="58" rx="7" fill="#292812" stroke="#ffff99" stroke-width="1.8"/>
  <rect x="1048" y="204" width="94" height="58" rx="7" fill="#292812" stroke="#ffff99" stroke-width="1.8"/>
  <rect x="1096" y="186" width="94" height="58" rx="7" fill="#292812" stroke="#ffff99" stroke-width="1.8"/>
  <text x="1025" y="229" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="12">SST</text>
  <text x="1095" y="239" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="12">SST</text>
  <text x="1143" y="221" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="12">SST</text>
  <text x="1084" y="278" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="12.5" font-weight="bold">key ranges may overlap</text>

  <!-- write reasons -->
  <text x="340" y="318" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="13.5" font-weight="bold">WHY: replay after a crash</text>
  <text x="570" y="318" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="13.5" font-weight="bold">WHY: cheap writes + sorted output</text>
  <text x="808" y="318" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="13.5" font-weight="bold">WHY: flush without stopping writes</text>
  <text x="1084" y="318" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="13.5" font-weight="bold">WHY: each flush is immutable</text>

  <!-- read path -->
  <rect x="62" y="438" width="124" height="82" rx="10" fill="#16191e" stroke="#8aff8a" stroke-width="2.2"/>
  <text x="124" y="470" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="17" font-weight="bold">GET(k)</text>
  <text x="124" y="495" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">snapshot sequence</text>

  <path d="M186 479 L232 479" fill="none" stroke="#8aff8a" stroke-width="2.8" marker-end="url(#ldb-g)"/>

  <rect x="242" y="424" width="206" height="110" rx="11" fill="#0f2417" stroke="#8aff8a" stroke-width="2.2"/>
  <text x="345" y="454" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="16" font-weight="bold">memory first</text>
  <text x="345" y="480" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">1. active memtable</text>
  <text x="345" y="503" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">2. immutable memtable</text>
  <text x="345" y="523" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">newest sequence wins</text>

  <path d="M448 479 L492 479" fill="none" stroke="#8aff8a" stroke-width="2.8" marker-end="url(#ldb-g)"/>

  <rect x="502" y="424" width="190" height="110" rx="11" fill="#16191e" stroke="#7c8694" stroke-width="2"/>
  <text x="597" y="454" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">current Version</text>
  <text x="597" y="480" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">live files + key ranges</text>
  <text x="597" y="503" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">select candidates</text>
  <text x="597" y="523" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">consistent file-set view</text>

  <path d="M692 464 C 730 430, 748 426, 782 426" fill="none" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#ldb-g)"/>
  <path d="M692 494 C 730 528, 748 532, 782 532" fill="none" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#ldb-g)"/>

  <rect x="792" y="404" width="184" height="88" rx="10" fill="#1d1d12" stroke="#ffff99" stroke-width="2"/>
  <text x="884" y="434" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="16" font-weight="bold">L0 candidates</text>
  <text x="884" y="459" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">check overlapping files</text>
  <text x="884" y="479" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">newest first</text>

  <rect x="792" y="510" width="184" height="78" rx="10" fill="#1d1d12" stroke="#ffff99" stroke-width="2"/>
  <text x="884" y="540" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="16" font-weight="bold">L1 ... L6</text>
  <text x="884" y="565" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">≤ 1 candidate / level</text>

  <path d="M976 479 L1018 479" fill="none" stroke="#8aff8a" stroke-width="2.8" marker-end="url(#ldb-g)"/>

  <rect x="1028" y="404" width="186" height="184" rx="11" fill="#0f2417" stroke="#8aff8a" stroke-width="2.2"/>
  <text x="1121" y="434" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="16" font-weight="bold">SSTable lookup</text>
  <text x="1121" y="461" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">optional Bloom filter</text>
  <text x="1121" y="484" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">index → data block</text>
  <line x1="1050" y1="500" x2="1192" y2="500" stroke="#5b6470" stroke-width="1.3"/>
  <text x="1121" y="525" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="13" font-weight="bold">table cache</text>
  <text x="1121" y="546" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">open files / readers</text>
  <text x="1121" y="570" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="13" font-weight="bold">block cache</text>
  <text x="1121" y="586" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">hot uncompressed blocks</text>

  <text x="345" y="575" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13.5" font-weight="bold">WHY: newest updates avoid disk</text>
  <text x="597" y="575" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13.5" font-weight="bold">WHY: route using immutable metadata</text>
  <text x="1121" y="595" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13" font-weight="bold">WHY: avoid file opens and block I/O</text>

  <!-- background and metadata -->
  <rect x="62" y="684" width="278" height="126" rx="11" fill="#16191e" stroke="#ffff99" stroke-width="2.2"/>
  <text x="201" y="714" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="17" font-weight="bold">CURRENT → MANIFEST</text>
  <text x="201" y="742" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">levels, files, key ranges</text>
  <text x="201" y="765" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">append file-set changes</text>
  <text x="201" y="790" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="13" font-weight="bold">WHY: recover the serving state</text>

  <rect x="392" y="674" width="530" height="146" rx="11" fill="#10243a" stroke="#93c5fd" stroke-width="2.2"/>
  <text x="657" y="706" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="17" font-weight="bold">background compaction</text>
  <text x="657" y="735" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">L0 + overlapping L1 → bounded L1 output files</text>
  <text x="657" y="759" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">Ln file + overlaps in Ln+1 → new Ln+1 files</text>
  <text x="657" y="783" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">drop obsolete versions when snapshots and lower levels permit</text>
  <text x="657" y="807" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="13" font-weight="bold">WHY: bound read/space amplification using sequential merge I/O</text>

  <rect x="974" y="674" width="240" height="146" rx="11" fill="#1d1d12" stroke="#ffff99" stroke-width="2.2"/>
  <text x="1094" y="706" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="17" font-weight="bold">leveled files</text>
  <text x="1094" y="734" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="13">L0: overlapping</text>
  <text x="1094" y="758" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13">L1+: non-overlapping</text>
  <text x="1094" y="782" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">larger capacity by level</text>
  <text x="1094" y="806" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="13" font-weight="bold">WHY: predictable lookup</text>

  <path d="M340 746 L388 746" fill="none" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#ldb-b)"/>
  <path d="M922 746 L970 746" fill="none" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#ldb-b)"/>

  <!-- legend/footer -->
  <g font-family="sans-serif" font-size="12.5">
    <line x1="62" y1="878" x2="98" y2="878" stroke="#ff8bd2" stroke-width="3" marker-end="url(#ldb-p)"/>
    <text x="108" y="883" fill="#cbd5e1">foreground write</text>
    <line x1="246" y1="878" x2="282" y2="878" stroke="#8aff8a" stroke-width="3" marker-end="url(#ldb-g)"/>
    <text x="292" y="883" fill="#cbd5e1">foreground read</text>
    <line x1="426" y1="878" x2="462" y2="878" stroke="#93c5fd" stroke-width="3" marker-end="url(#ldb-b)"/>
    <text x="472" y="883" fill="#cbd5e1">background work</text>
    <line x1="626" y1="878" x2="662" y2="878" stroke="#ffff99" stroke-width="3" marker-end="url(#ldb-y)"/>
    <text x="672" y="883" fill="#cbd5e1">durable state</text>
  </g>
  <text x="1214" y="883" text-anchor="end" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">one DB · one WAL/memtable pair · seven levels in the reference implementation</text>
</svg>
