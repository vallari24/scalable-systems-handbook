<svg width="1000" height="720" viewBox="0 0 1000 720" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ft-g" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8aff8a"/>
    </marker>
    <marker id="ft-b" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#93c5fd"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="720" fill="#111317"/>

  <text x="500" y="48" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="29" font-weight="bold">Where Does a Flush Go? One New File Per Flush</text>
  <text x="500" y="80" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">don't append to one giant file &#8212; write a fresh, immutable <tspan fill="#8aff8a" font-weight="bold">SSTable</tspan> every flush</text>

  <!-- OPTION 1: rejected (red) -->
  <rect x="44" y="112" width="440" height="300" rx="11" fill="#2a1414" stroke="#ff8a8a" stroke-width="2.5"/>
  <text x="68" y="146" fill="#ff8a8a" font-family="sans-serif" font-size="18" font-weight="bold">Option 1 &#183; REJECTED</text>
  <text x="68" y="170" fill="#cbd5e1" font-family="sans-serif" font-size="15">append to one ever-growing file</text>

  <!-- problem 1 -->
  <rect x="68" y="186" width="392" height="104" rx="9" fill="#1c0f0f" stroke="#ff8a8a" stroke-width="1.5"/>
  <text x="86" y="210" fill="#ff8a8a" font-family="sans-serif" font-size="14" font-weight="bold">file gets too long</text>
  <text x="86" y="232" fill="#cbd5e1" font-family="sans-serif" font-size="13">every filesystem caps a single file (an inode</text>
  <text x="86" y="250" fill="#cbd5e1" font-family="sans-serif" font-size="13">tracks a finite block list; FAT32 capped a file</text>
  <text x="86" y="268" fill="#cbd5e1" font-family="sans-serif" font-size="13">at 2^32 B &#8776; 4 GB) <tspan fill="#ff8a8a" font-weight="bold">&#8594; hits a hard wall</tspan></text>

  <!-- problem 2 -->
  <rect x="68" y="300" width="392" height="92" rx="9" fill="#1c0f0f" stroke="#ff8a8a" stroke-width="1.5"/>
  <text x="86" y="324" fill="#ff8a8a" font-family="sans-serif" font-size="14" font-weight="bold">flush gets slow</text>
  <text x="86" y="346" fill="#cbd5e1" font-family="sans-serif" font-size="13">appending to the end of a huge open file</text>
  <text x="86" y="364" fill="#cbd5e1" font-family="sans-serif" font-size="13">isn't a clean one-shot write</text>

  <!-- VS divider -->
  <text x="500" y="270" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="18" font-weight="bold">vs</text>

  <!-- OPTION 2: chosen (green) -->
  <rect x="516" y="112" width="440" height="300" rx="11" fill="#0f2417" stroke="#8aff8a" stroke-width="2.5"/>
  <text x="540" y="146" fill="#8aff8a" font-family="sans-serif" font-size="18" font-weight="bold">Option 2 &#183; CHOSEN</text>
  <text x="540" y="170" fill="#cbd5e1" font-family="sans-serif" font-size="15">write a brand-new file every flush</text>

  <!-- benefit 1 -->
  <rect x="540" y="186" width="392" height="104" rx="9" fill="#15281b" stroke="#8aff8a" stroke-width="1.5"/>
  <text x="558" y="210" fill="#8aff8a" font-family="sans-serif" font-size="14" font-weight="bold">single one-shot sequential write</text>
  <text x="558" y="232" fill="#cbd5e1" font-family="sans-serif" font-size="13">a small file written fast and efficiently,</text>
  <text x="558" y="250" fill="#cbd5e1" font-family="sans-serif" font-size="13">the whole buffer at once &#8212; no seeking</text>
  <text x="558" y="268" fill="#cbd5e1" font-family="sans-serif" font-size="13">into an existing file</text>

  <!-- benefit 2 -->
  <rect x="540" y="300" width="392" height="92" rx="9" fill="#15281b" stroke="#8aff8a" stroke-width="1.5"/>
  <text x="558" y="324" fill="#8aff8a" font-family="sans-serif" font-size="14" font-weight="bold">each file naturally bounded</text>
  <text x="558" y="346" fill="#cbd5e1" font-family="sans-serif" font-size="13">its size is one buffer's worth, so it never</text>
  <text x="558" y="364" fill="#cbd5e1" font-family="sans-serif" font-size="13">approaches any filesystem limit</text>

  <!-- arrow from option 2 down to result -->
  <path d="M736 412 L736 452" fill="none" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#ft-g)"/>
  <text x="752" y="438" fill="#8aff8a" font-family="sans-serif" font-size="13" font-weight="bold">result</text>

  <!-- BOTTOM: row of 5 SSTable files on disk -->
  <text x="44" y="476" fill="#ffff99" font-family="sans-serif" font-size="16" font-weight="bold">On disk &#8212; immutable SSTables</text>

  <!-- file shapes: tall narrow rect with thin top cap, label below -->
  <!-- file 1 -->
  <rect x="120" y="496" width="100" height="120" rx="8" fill="#1d1d12" stroke="#ffff99" stroke-width="2"/>
  <rect x="120" y="496" width="100" height="14" rx="8" fill="#ffff99"/>
  <text x="170" y="566" text-anchor="middle" fill="#ffff99" font-family="monospace" font-size="13" font-weight="bold">SST</text>
  <text x="170" y="640" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="14" font-weight="bold">001.sst</text>

  <!-- file 2 -->
  <rect x="280" y="496" width="100" height="120" rx="8" fill="#1d1d12" stroke="#ffff99" stroke-width="2"/>
  <rect x="280" y="496" width="100" height="14" rx="8" fill="#ffff99"/>
  <text x="330" y="566" text-anchor="middle" fill="#ffff99" font-family="monospace" font-size="13" font-weight="bold">SST</text>
  <text x="330" y="640" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="14" font-weight="bold">002.sst</text>

  <!-- file 3 -->
  <rect x="440" y="496" width="100" height="120" rx="8" fill="#1d1d12" stroke="#ffff99" stroke-width="2"/>
  <rect x="440" y="496" width="100" height="14" rx="8" fill="#ffff99"/>
  <text x="490" y="566" text-anchor="middle" fill="#ffff99" font-family="monospace" font-size="13" font-weight="bold">SST</text>
  <text x="490" y="640" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="14" font-weight="bold">003.sst</text>

  <!-- file 4 -->
  <rect x="600" y="496" width="100" height="120" rx="8" fill="#1d1d12" stroke="#ffff99" stroke-width="2"/>
  <rect x="600" y="496" width="100" height="14" rx="8" fill="#ffff99"/>
  <text x="650" y="566" text-anchor="middle" fill="#ffff99" font-family="monospace" font-size="13" font-weight="bold">SST</text>
  <text x="650" y="640" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="14" font-weight="bold">004.sst</text>

  <!-- file 5 -->
  <rect x="760" y="496" width="100" height="120" rx="8" fill="#1d1d12" stroke="#ffff99" stroke-width="2"/>
  <rect x="760" y="496" width="100" height="14" rx="8" fill="#ffff99"/>
  <text x="810" y="566" text-anchor="middle" fill="#ffff99" font-family="monospace" font-size="13" font-weight="bold">SST</text>
  <text x="810" y="640" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="14" font-weight="bold">005.sst</text>

  <text x="490" y="666" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13">each = frozen contents of one memtable flush, never modified again</text>

  <!-- final label -->
  <rect x="44" y="676" width="912" height="2" fill="#222"/>
  <text x="500" y="697" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="14">each file is an <tspan fill="#8aff8a" font-weight="bold">SSTable</tspan>; every flush creates a new one.</text>
  <text x="500" y="715" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="14">Data now lives in two places: <tspan fill="#ff8bd2" font-weight="bold">in-memory (memtable)</tspan> and <tspan fill="#ffff99" font-weight="bold">on-disk (many SSTables)</tspan>.</text>
</svg>
