<svg width="1000" height="680" viewBox="0 0 1000 680" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="bw-y" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#ffff99"/>
    </marker>
    <marker id="bw-p" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#ff8bd2"/>
    </marker>
    <marker id="bw-r" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#ff8a8a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="680" fill="#111317"/>

  <text x="500" y="46" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="29" font-weight="bold">The Bitcask Wall &#8212; and the Two Things We Fix</text>
  <text x="500" y="78" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">Bitcask keeps <tspan fill="#8aff8a" font-weight="bold">one index entry per key in RAM</tspan> &#8212; that is the ceiling we break</text>

  <!-- divider -->
  <line x1="500" y1="110" x2="500" y2="600" stroke="#3a4150" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- ============ LEFT: Bitcask recap ============ -->
  <text x="60" y="132" fill="#cbd5e1" font-family="sans-serif" font-size="15" font-weight="bold">RECAP &#183; BITCASK</text>

  <!-- in-RAM hash index -->
  <text x="60" y="166" fill="#8aff8a" font-family="sans-serif" font-size="18" font-weight="bold">In-RAM hash index</text>
  <rect x="60" y="180" width="300" height="186" rx="11" fill="#0f2417" stroke="#8aff8a" stroke-width="2.5"/>
  <text x="210" y="208" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13">key &#8594; (file, offset) of latest record</text>

  <rect x="84" y="224" width="252" height="38" rx="8" fill="#15281b" stroke="#8aff8a" stroke-width="2"/>
  <text x="104" y="249" fill="#8aff8a" font-family="monospace" font-size="16" font-weight="bold">k1 &#8594; (f1, o1)</text>
  <rect x="84" y="270" width="252" height="38" rx="8" fill="#15281b" stroke="#8aff8a" stroke-width="2"/>
  <text x="104" y="295" fill="#8aff8a" font-family="monospace" font-size="16" font-weight="bold">k2 &#8594; (f2, o2)</text>
  <rect x="84" y="316" width="252" height="38" rx="8" fill="#15281b" stroke="#8aff8a" stroke-width="2"/>
  <text x="104" y="341" fill="#8aff8a" font-family="monospace" font-size="16" font-weight="bold">k3 &#8594; (f3, o3)</text>

  <!-- red brace: one entry per key -->
  <path d="M372 224 q 12 0 12 12 v 47 q 0 12 12 12 q -12 0 -12 12 v 47 q 0 12 -12 12" fill="none" stroke="#ff8a8a" stroke-width="2.5"/>
  <text x="396" y="290" fill="#ff8a8a" font-family="sans-serif" font-size="13" font-weight="bold">one entry</text>
  <text x="396" y="308" fill="#ff8a8a" font-family="sans-serif" font-size="13" font-weight="bold">PER KEY,</text>
  <text x="396" y="326" fill="#ff8a8a" font-family="sans-serif" font-size="13" font-weight="bold">forever</text>

  <!-- pink write arrow into disk file -->
  <line x1="210" y1="366" x2="210" y2="406" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#bw-p)"/>

  <!-- append-only data file on disk (cylinder) -->
  <text x="60" y="404" fill="#ffff99" font-family="sans-serif" font-size="18" font-weight="bold">Append-only data file</text>
  <text x="280" y="404" fill="#9aa6b2" font-family="sans-serif" font-size="13">on disk</text>
  <g>
    <path d="M120 432 q 90 -20 180 0 v 110 q -90 20 -180 0 z" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
    <path d="M120 432 q 90 20 180 0" fill="none" stroke="#ffff99" stroke-width="2.5"/>
  </g>
  <text x="210" y="478" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="14">records appended</text>
  <text x="210" y="500" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="14">in write order</text>
  <text x="210" y="524" text-anchor="middle" fill="#ffff99" font-family="monospace" font-size="13">huge &#183; cheap &#183; grows freely</text>

  <!-- red callout: the wall -->
  <rect x="60" y="566" width="380" height="92" rx="12" fill="#2a1414" stroke="#ff8a8a" stroke-width="2.5"/>
  <text x="78" y="592" fill="#ff8a8a" font-family="sans-serif" font-size="16" font-weight="bold">The wall: keys must fit in RAM</text>
  <text x="78" y="616" fill="#cbd5e1" font-family="sans-serif" font-size="13">You run out of memory past a few hundred</text>
  <text x="78" y="636" fill="#cbd5e1" font-family="sans-serif" font-size="13">million keys &#8212; no matter how big your disk is.</text>

  <!-- ============ RIGHT: two goals ============ -->
  <text x="540" y="132" fill="#cbd5e1" font-family="sans-serif" font-size="15" font-weight="bold">TWO GOALS</text>

  <!-- Goal 1 (yellow) -->
  <rect x="540" y="160" width="400" height="190" rx="12" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
  <text x="562" y="194" fill="#ffff99" font-family="sans-serif" font-size="17" font-weight="bold">Goal 1 &#8212; bound #keys by DISK, not RAM</text>
  <line x1="562" y1="208" x2="918" y2="208" stroke="#ffff99" stroke-width="1.5" opacity="0.5"/>
  <text x="562" y="240" fill="#cbd5e1" font-family="sans-serif" font-size="15">Push keys back to disk; keep only a</text>
  <text x="562" y="264" fill="#cbd5e1" font-family="sans-serif" font-size="15">small buffer in memory.</text>
  <rect x="562" y="286" width="356" height="48" rx="9" fill="#16191e" stroke="#ffff99" stroke-width="2"/>
  <text x="582" y="316" fill="#ffff99" font-family="sans-serif" font-size="14" font-weight="bold">RAM is no longer the limit &#8212; disk is.</text>

  <!-- Goal 2 (pink) -->
  <rect x="540" y="372" width="400" height="190" rx="12" fill="#2a1622" stroke="#ff8bd2" stroke-width="2.5"/>
  <text x="562" y="406" fill="#ff8bd2" font-family="sans-serif" font-size="17" font-weight="bold">Goal 2 &#8212; writes faster than Bitcask</text>
  <line x1="562" y1="420" x2="918" y2="420" stroke="#ff8bd2" stroke-width="1.5" opacity="0.5"/>
  <text x="562" y="452" fill="#cbd5e1" font-family="sans-serif" font-size="15">Don&#8217;t touch disk on the hot path:</text>
  <text x="562" y="476" fill="#cbd5e1" font-family="sans-serif" font-size="15">write to memory first, flush in batches.</text>
  <rect x="562" y="498" width="356" height="48" rx="9" fill="#16191e" stroke="#ff8bd2" stroke-width="2"/>
  <text x="582" y="528" fill="#ff8bd2" font-family="sans-serif" font-size="14" font-weight="bold">The disk seek leaves the write path.</text>

  <!-- BOTTOM caption -->
  <text x="500" y="668" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="15">Keep Bitcask&#8217;s append-only, high-write shape; change what lives in RAM.</text>
</svg>
