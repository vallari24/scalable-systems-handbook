<svg width="1180" height="680" viewBox="0 0 1180 680" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="bl-g" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8aff8a"/>
    </marker>
    <marker id="bl-p" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#ff8bd2"/>
    </marker>
    <marker id="bl-n" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#9aa6b2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="680" fill="#111317"/>

  <text x="590" y="46" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="29" font-weight="bold">Bloom Filters in Front of the SSTables</text>
  <text x="590" y="78" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">a <tspan fill="#8aff8a" font-weight="bold">GET</tspan> for a missing key asks each file's filter first &#8212; <tspan fill="#8aff8a" font-weight="bold">NO</tspan> means skip with zero disk I/O</text>

  <!-- query start -->
  <rect x="44" y="300" width="118" height="74" rx="11" fill="#0f2417" stroke="#8aff8a" stroke-width="2.5"/>
  <text x="103" y="332" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="17" font-weight="bold">GET(k)</text>
  <text x="103" y="356" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">missing key</text>

  <!-- RAM / disk band labels -->
  <text x="200" y="118" fill="#93c5fd" font-family="sans-serif" font-size="14" font-weight="bold">in RAM</text>
  <text x="200" y="468" fill="#ffff99" font-family="sans-serif" font-size="14" font-weight="bold">on disk</text>

  <!-- 5 SSTable files with bloom boxes. x centers: 232, 360, 488, 616, 744 -->
  <!-- file template: file rect 188..> width 88, top y=210 height 250; bloom box y=130 height 60 -->

  <!-- 005.sst (queried first, leftmost of the row near query) -->
  <!-- We render newest->oldest left to right: 005,004,003,002,001 -->

  <!-- FILE 005 -->
  <rect x="188" y="210" width="88" height="250" rx="10" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
  <rect x="188" y="210" width="88" height="14" rx="6" fill="#ffff99"/>
  <text x="232" y="345" text-anchor="middle" fill="#ffff99" font-family="monospace" font-size="15" font-weight="bold">005.sst</text>
  <rect x="190" y="130" width="84" height="60" rx="9" fill="#16203a" stroke="#93c5fd" stroke-width="2"/>
  <text x="232" y="153" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="12" font-weight="bold">bloom</text>
  <text x="232" y="176" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="14" font-weight="bold">NO</text>

  <!-- FILE 004 -->
  <rect x="316" y="210" width="88" height="250" rx="10" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
  <rect x="316" y="210" width="88" height="14" rx="6" fill="#ffff99"/>
  <text x="360" y="345" text-anchor="middle" fill="#ffff99" font-family="monospace" font-size="15" font-weight="bold">004.sst</text>
  <rect x="318" y="130" width="84" height="60" rx="9" fill="#16203a" stroke="#93c5fd" stroke-width="2"/>
  <text x="360" y="153" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="12" font-weight="bold">bloom</text>
  <text x="360" y="176" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="14" font-weight="bold">NO</text>

  <!-- FILE 003 -->
  <rect x="444" y="210" width="88" height="250" rx="10" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
  <rect x="444" y="210" width="88" height="14" rx="6" fill="#ffff99"/>
  <text x="488" y="345" text-anchor="middle" fill="#ffff99" font-family="monospace" font-size="15" font-weight="bold">003.sst</text>
  <rect x="446" y="130" width="84" height="60" rx="9" fill="#16203a" stroke="#93c5fd" stroke-width="2"/>
  <text x="488" y="153" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="12" font-weight="bold">bloom</text>
  <text x="488" y="176" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="14" font-weight="bold">NO</text>

  <!-- FILE 002 -->
  <rect x="572" y="210" width="88" height="250" rx="10" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
  <rect x="572" y="210" width="88" height="14" rx="6" fill="#ffff99"/>
  <text x="616" y="345" text-anchor="middle" fill="#ffff99" font-family="monospace" font-size="15" font-weight="bold">002.sst</text>
  <rect x="574" y="130" width="84" height="60" rx="9" fill="#16203a" stroke="#93c5fd" stroke-width="2"/>
  <text x="616" y="153" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="12" font-weight="bold">bloom</text>
  <text x="616" y="176" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="14" font-weight="bold">NO</text>

  <!-- FILE 001 (the MAYBE / disk-touch case) -->
  <rect x="700" y="210" width="88" height="250" rx="10" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
  <rect x="700" y="210" width="88" height="14" rx="6" fill="#ffff99"/>
  <text x="744" y="345" text-anchor="middle" fill="#ffff99" font-family="monospace" font-size="15" font-weight="bold">001.sst</text>
  <rect x="702" y="130" width="84" height="60" rx="9" fill="#2a1622" stroke="#ff8bd2" stroke-width="2"/>
  <text x="744" y="153" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="12" font-weight="bold">bloom</text>
  <text x="744" y="176" text-anchor="middle" fill="#ff8bd2" font-family="monospace" font-size="14" font-weight="bold">MAYBE</text>

  <!-- traversal arrows across the bloom row (neutral, the GET moving file to file) -->
  <path d="M162 320 C 200 320, 200 230, 226 200" fill="none" stroke="#9aa6b2" stroke-width="2.5" marker-end="url(#bl-n)"/>
  <path d="M278 160 L 314 160" fill="none" stroke="#9aa6b2" stroke-width="2.5" marker-end="url(#bl-n)"/>
  <path d="M406 160 L 442 160" fill="none" stroke="#9aa6b2" stroke-width="2.5" marker-end="url(#bl-n)"/>
  <path d="M534 160 L 570 160" fill="none" stroke="#9aa6b2" stroke-width="2.5" marker-end="url(#bl-n)"/>
  <path d="M662 160 L 698 160" fill="none" stroke="#9aa6b2" stroke-width="2.5" marker-end="url(#bl-n)"/>

  <!-- skip labels under the four NO files -->
  <text x="232" y="492" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="12">skip</text>
  <text x="232" y="508" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="11">no disk touch</text>
  <text x="360" y="492" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="12">skip</text>
  <text x="360" y="508" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="11">no disk touch</text>
  <text x="488" y="492" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="12">skip</text>
  <text x="488" y="508" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="11">no disk touch</text>
  <text x="616" y="492" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="12">skip</text>
  <text x="616" y="508" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="11">no disk touch</text>

  <!-- 001 pays disk: arrow down into the file body -->
  <path d="M744 192 L 744 206" fill="none" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#bl-p)"/>
  <text x="744" y="492" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="12" font-weight="bold">index + seek</text>
  <text x="744" y="508" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="11">+ disk read</text>

  <!-- RIGHT panels: outcome (a) and (b) -->
  <!-- (a) all NO -->
  <rect x="828" y="118" width="308" height="186" rx="11" fill="#0f2417" stroke="#8aff8a" stroke-width="2.5"/>
  <text x="848" y="148" fill="#8aff8a" font-family="sans-serif" font-size="17" font-weight="bold">(a) EVERY filter says NO</text>
  <text x="848" y="174" fill="#cbd5e1" font-family="sans-serif" font-size="13">key is <tspan fill="#8aff8a" font-weight="bold">definitely absent</tspan> &#8212; return</text>
  <text x="848" y="194" fill="#cbd5e1" font-family="sans-serif" font-size="13">not-found after only cheap in-RAM</text>
  <text x="848" y="214" fill="#cbd5e1" font-family="sans-serif" font-size="13">bit checks.</text>
  <text x="848" y="248" fill="#cbd5e1" font-family="sans-serif" font-size="13">The missing-key worst case</text>
  <text x="848" y="268" fill="#cbd5e1" font-family="monospace" font-size="14"><tspan fill="#ff8a8a" font-weight="bold">k disk probes</tspan> &#8594; <tspan fill="#8aff8a" font-weight="bold">k in-RAM</tspan></text>
  <text x="848" y="288" fill="#cbd5e1" font-family="monospace" font-size="14"><tspan fill="#8aff8a" font-weight="bold">bit-checks</tspan>.</text>

  <!-- (b) a MAYBE -->
  <rect x="828" y="322" width="308" height="186" rx="11" fill="#2a1622" stroke="#ff8bd2" stroke-width="2.5"/>
  <text x="848" y="352" fill="#ff8bd2" font-family="sans-serif" font-size="17" font-weight="bold">(b) a filter says MAYBE</text>
  <text x="848" y="378" fill="#cbd5e1" font-family="sans-serif" font-size="13"><tspan fill="#ff8bd2" font-weight="bold">only THEN</tspan> pay disk: go to that</text>
  <text x="848" y="398" fill="#cbd5e1" font-family="sans-serif" font-size="13">file's index, seek, read.</text>
  <text x="848" y="430" fill="#cbd5e1" font-family="sans-serif" font-size="13">Most MAYBEs are <tspan fill="#8aff8a" font-weight="bold">true hits</tspan>.</text>
  <text x="848" y="458" fill="#cbd5e1" font-family="sans-serif" font-size="13">An occasional <tspan fill="#ff8a8a" font-weight="bold">false positive</tspan></text>
  <text x="848" y="478" fill="#cbd5e1" font-family="sans-serif" font-size="13">= one wasted lookup, nothing</text>
  <text x="848" y="498" fill="#cbd5e1" font-family="sans-serif" font-size="13">worse.</text>

  <!-- BOTTOM caption -->
  <rect x="44" y="588" width="1092" height="68" rx="12" fill="#16191e" stroke="#7c8694" stroke-width="2"/>
  <text x="68" y="618" fill="#ffff99" font-family="sans-serif" font-size="17" font-weight="bold">The biggest read win for absent and old keys</text>
  <text x="68" y="642" fill="#cbd5e1" font-family="sans-serif" font-size="14">The Bloom filter turns <tspan fill="#ff8a8a">"probe every file on disk to prove a key is missing"</tspan> into <tspan fill="#8aff8a">"check a few bits in RAM per file."</tspan></text>
</svg>
