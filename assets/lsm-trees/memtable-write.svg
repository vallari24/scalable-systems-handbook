<svg width="1000" height="680" viewBox="0 0 1000 680" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="mw-p" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#ff8bd2"/>
    </marker>
    <marker id="mw-b" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#93c5fd"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="680" fill="#111317"/>

  <text x="500" y="46" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="29" font-weight="bold">Write to RAM First: The Memtable</text>
  <text x="500" y="78" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">a fast volatile tier absorbs writes; a slow durable tier holds everything older</text>

  <!-- TOP caption -->
  <rect x="120" y="104" width="760" height="58" rx="11" fill="#0f2417" stroke="#8aff8a" stroke-width="2"/>
  <text x="500" y="130" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="15" font-weight="bold">Writing directly to RAM gives even higher write throughput than Bitcask</text>
  <text x="500" y="151" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="14">&#8212; excellent for high ingestion volumes.</text>

  <!-- ===== CENTER FLOW left -> right ===== -->
  <!-- client / person -->
  <g>
    <circle cx="118" cy="318" r="20" fill="#16191e" stroke="#cbd5e1" stroke-width="2.5"/>
    <path d="M88 372 q 30 -42 60 0 z" fill="#16191e" stroke="#cbd5e1" stroke-width="2.5"/>
  </g>
  <text x="118" y="402" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="14" font-weight="bold">client</text>

  <!-- pink arrow: WRITE (sync) -->
  <line x1="158" y1="345" x2="318" y2="345" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#mw-p)"/>
  <text x="240" y="332" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="14" font-weight="bold">WRITE (sync)</text>

  <!-- memtable RAM rectangle -->
  <rect x="330" y="290" width="220" height="110" rx="12" fill="#2a1622" stroke="#ff8bd2" stroke-width="2.5"/>
  <text x="440" y="328" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="18" font-weight="bold">memtable</text>
  <text x="440" y="354" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="14">in-memory buffer</text>
  <text x="440" y="380" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13">fast volatile RAM tier</text>

  <!-- blue arrow: WRITE (async, periodic) -->
  <line x1="562" y1="345" x2="722" y2="345" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#mw-b)"/>
  <text x="642" y="328" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="14" font-weight="bold">WRITE</text>
  <text x="642" y="368" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="13">(async, periodic)</text>

  <!-- DISK cylinder -->
  <g>
    <path d="M740 296 q 70 -18 140 0 v 98 q -70 18 -140 0 z" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
    <path d="M740 296 q 70 18 140 0" fill="none" stroke="#ffff99" stroke-width="2.5"/>
  </g>
  <text x="810" y="338" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="17" font-weight="bold">disk</text>
  <text x="810" y="362" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">durable tier</text>
  <text x="810" y="382" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">holds older data</text>

  <!-- LEFT red callout (below client) -->
  <rect x="60" y="450" width="400" height="120" rx="12" fill="#2a1414" stroke="#ff8a8a" stroke-width="2.5"/>
  <text x="80" y="478" fill="#ff8a8a" font-family="sans-serif" font-size="16" font-weight="bold">Durability takes a hit</text>
  <text x="80" y="504" fill="#cbd5e1" font-family="sans-serif" font-size="14">RAM is volatile, so a crash before the next</text>
  <text x="80" y="526" fill="#cbd5e1" font-family="sans-serif" font-size="14">flush loses everything still in the buffer</text>
  <text x="80" y="552" fill="#9aa6b2" font-family="sans-serif" font-size="13">(fixed later with a write-ahead log).</text>

  <!-- RIGHT: three example-workload cards (green) -->
  <text x="540" y="476" fill="#8aff8a" font-family="sans-serif" font-size="15" font-weight="bold">Great-fit workloads</text>
  <rect x="540" y="490" width="400" height="40" rx="9" fill="#0f2417" stroke="#8aff8a" stroke-width="2"/>
  <text x="560" y="515" fill="#8aff8a" font-family="sans-serif" font-size="15" font-weight="bold">location tracking</text>
  <rect x="540" y="536" width="400" height="40" rx="9" fill="#0f2417" stroke="#8aff8a" stroke-width="2"/>
  <text x="560" y="561" fill="#8aff8a" font-family="sans-serif" font-size="15" font-weight="bold">clickstream / watch-stats</text>
  <rect x="540" y="582" width="400" height="40" rx="9" fill="#0f2417" stroke="#8aff8a" stroke-width="2"/>
  <text x="560" y="607" fill="#8aff8a" font-family="sans-serif" font-size="15" font-weight="bold">IoT metrics</text>

  <!-- BOTTOM caption -->
  <text x="500" y="660" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="15">Two tiers: a fast volatile RAM tier absorbs writes; a slow durable disk tier holds everything older.</text>
</svg>
