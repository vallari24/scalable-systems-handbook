<svg width="1000" height="660" viewBox="0 0 1000 660" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="rt-g" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8aff8a"/>
    </marker>
    <marker id="rt-y" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#ffff99"/>
    </marker>
    <marker id="rt-b" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#93c5fd"/>
    </marker>
    <marker id="rt-n" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#9aa6b2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="660" fill="#111317"/>

  <text x="500" y="46" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="29" font-weight="bold">Reading Across Two Tiers</text>
  <text x="500" y="78" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">check the fast volatile tier first, then fall through to the durable tier</text>

  <!-- GET(k) request enters at left -->
  <rect x="56" y="116" width="150" height="58" rx="11" fill="#16191e" stroke="#7c8694" stroke-width="2.5"/>
  <text x="131" y="142" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="18" font-weight="bold">GET(k)</text>
  <text x="131" y="163" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">read request</text>

  <!-- arrow from GET into step 1 -->
  <path d="M206 145 L 340 145 L 340 170" fill="none" stroke="#9aa6b2" stroke-width="2.5" marker-end="url(#rt-n)"/>

  <!-- ===== STEP 1: memtable (RAM) green ===== -->
  <rect x="190" y="178" width="420" height="106" rx="12" fill="#0f2417" stroke="#8aff8a" stroke-width="2.5"/>
  <circle cx="218" cy="206" r="13" fill="#15281b" stroke="#8aff8a" stroke-width="2"/>
  <text x="218" y="211" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="14" font-weight="bold">1</text>
  <text x="240" y="211" fill="#8aff8a" font-family="sans-serif" font-size="18" font-weight="bold">memtable (RAM)</text>
  <text x="212" y="240" fill="#cbd5e1" font-family="sans-serif" font-size="15">look here first &#8212; if the key is present,</text>
  <text x="212" y="264" fill="#cbd5e1" font-family="sans-serif" font-size="15">it&#8217;s a <tspan fill="#8aff8a" font-weight="bold">hit</tspan>: return the latest value.</text>

  <!-- green hit arrow exiting to the right -->
  <line x1="610" y1="231" x2="780" y2="231" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#rt-g)"/>
  <text x="694" y="220" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="14" font-weight="bold">hit &#8594; return</text>
  <text x="694" y="252" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13">(latest value)</text>

  <!-- miss arrow down to step 2 -->
  <path d="M400 284 L 400 326" fill="none" stroke="#9aa6b2" stroke-width="2.5" marker-end="url(#rt-n)"/>
  <text x="416" y="312" fill="#9aa6b2" font-family="sans-serif" font-size="13">not in RAM</text>

  <!-- ===== STEP 2: on-disk files yellow ===== -->
  <rect x="190" y="334" width="420" height="106" rx="12" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
  <circle cx="218" cy="362" r="13" fill="#16191e" stroke="#ffff99" stroke-width="2"/>
  <text x="218" y="367" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="14" font-weight="bold">2</text>
  <text x="240" y="367" fill="#ffff99" font-family="sans-serif" font-size="18" font-weight="bold">on-disk files</text>
  <text x="212" y="396" fill="#cbd5e1" font-family="sans-serif" font-size="15">not in RAM? search the on-disk files &#8212;</text>
  <text x="212" y="420" fill="#cbd5e1" font-family="sans-serif" font-size="15">if <tspan fill="#ffff99" font-weight="bold">found</tspan>, return the value.</text>

  <!-- yellow found arrow exiting to the right -->
  <line x1="610" y1="387" x2="780" y2="387" stroke="#ffff99" stroke-width="2.5" marker-end="url(#rt-y)"/>
  <text x="694" y="376" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="14" font-weight="bold">found &#8594; return</text>

  <!-- miss arrow down to step 3 -->
  <path d="M400 440 L 400 482" fill="none" stroke="#9aa6b2" stroke-width="2.5" marker-end="url(#rt-n)"/>
  <text x="416" y="468" fill="#9aa6b2" font-family="sans-serif" font-size="13">not on disk</text>

  <!-- ===== STEP 3: not found blue ===== -->
  <rect x="190" y="490" width="420" height="92" rx="12" fill="#16203a" stroke="#93c5fd" stroke-width="2.5"/>
  <circle cx="218" cy="518" r="13" fill="#16191e" stroke="#93c5fd" stroke-width="2"/>
  <text x="218" y="523" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="14" font-weight="bold">3</text>
  <text x="240" y="523" fill="#93c5fd" font-family="sans-serif" font-size="18" font-weight="bold">in neither tier</text>
  <text x="212" y="552" fill="#cbd5e1" font-family="sans-serif" font-size="15">return <tspan fill="#93c5fd" font-weight="bold">not-found (404)</tspan> &#8212; the key</text>
  <text x="212" y="574" fill="#cbd5e1" font-family="sans-serif" font-size="15">does not exist.</text>

  <!-- SIDE note (right of steps 2-3) -->
  <rect x="660" y="430" width="290" height="152" rx="12" fill="#16191e" stroke="#7c8694" stroke-width="2"/>
  <text x="680" y="458" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">Why RAM before disk?</text>
  <text x="680" y="486" fill="#cbd5e1" font-family="sans-serif" font-size="14">If a key is in memory it has to</text>
  <text x="680" y="508" fill="#cbd5e1" font-family="sans-serif" font-size="14">be the <tspan fill="#8aff8a" font-weight="bold">most recent</tspan> value &#8212;</text>
  <text x="680" y="530" fill="#cbd5e1" font-family="sans-serif" font-size="14">that&#8217;s why we check RAM</text>
  <text x="680" y="552" fill="#cbd5e1" font-family="sans-serif" font-size="14">before disk.</text>

  <!-- BOTTOM caption -->
  <text x="500" y="636" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="15">Tiered storage: a key may live in RAM, on disk, or both; read the fast tier first.</text>
</svg>
