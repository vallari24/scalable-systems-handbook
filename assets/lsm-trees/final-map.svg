<svg width="1180" height="880" viewBox="0 0 1180 880" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="fm-g" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8aff8a"/>
    </marker>
    <marker id="fm-p" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#ff8bd2"/>
    </marker>
    <marker id="fm-b" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#93c5fd"/>
    </marker>
    <marker id="fm-y" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#ffff99"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="880" fill="#111317"/>

  <text x="590" y="46" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="29" font-weight="bold">The Complete LSM-Tree Storage Engine</text>
  <text x="590" y="78" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">write &#183; flush &#183; storage &#183; read &#183; compaction &#8212; every path in one map</text>

  <!-- ===================== API ENTRY ===================== -->
  <rect x="44" y="300" width="132" height="150" rx="11" fill="#16191e" stroke="#7c8694" stroke-width="2.5"/>
  <text x="110" y="332" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="bold">API</text>
  <text x="110" y="366" text-anchor="middle" fill="#ff8bd2" font-family="monospace" font-size="16" font-weight="bold">PUT</text>
  <text x="110" y="392" text-anchor="middle" fill="#ff8bd2" font-family="monospace" font-size="16" font-weight="bold">DEL</text>
  <text x="110" y="424" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="16" font-weight="bold">GET(k)</text>

  <!-- ===================== WAL (disk cylinder) ===================== -->
  <text x="338" y="128" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="16" font-weight="bold">Write-Ahead Log (WAL)</text>
  <text x="338" y="148" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">on disk &#183; durability</text>
  <path d="M268 168 a70 14 0 0 0 140 0 v74 a70 14 0 0 1 -140 0 z" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
  <ellipse cx="338" cy="168" rx="70" ry="14" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
  <text x="338" y="206" text-anchor="middle" fill="#ffff99" font-family="monospace" font-size="14" font-weight="bold">WAL</text>
  <text x="338" y="226" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">append-only</text>

  <!-- ===================== MEMTABLE (RAM buffer) ===================== -->
  <rect x="244" y="300" width="200" height="150" rx="11" fill="#2a1622" stroke="#ff8bd2" stroke-width="2.5"/>
  <text x="344" y="330" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="17" font-weight="bold">MEMTABLE</text>
  <rect x="266" y="344" width="156" height="24" rx="6" fill="#2a1414" stroke="#ff8a8a" stroke-width="1.6"/>
  <text x="344" y="361" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="12" font-weight="bold">in RAM &#183; volatile</text>
  <text x="344" y="392" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">in-RAM sorted buffer</text>
  <text x="344" y="412" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">newest writes live here</text>
  <text x="344" y="436" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="12.5" font-weight="bold">checked first on reads</text>

  <!-- ===================== STORAGE LAYER (yellow, center) ===================== -->
  <rect x="500" y="150" width="640" height="368" rx="16" fill="#1a1a10" stroke="#ffff99" stroke-width="2.5"/>
  <text x="820" y="182" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="19" font-weight="bold">Storage Layer (disk) &#183; immutable SSTables</text>

  <!-- SSTable file template: tall narrow rounded rect + cap strip + bloom box on top -->
  <!-- Each file: width 118, x positions -->
  <!-- Bloom filters in RAM strip -->
  <text x="820" y="216" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="13" font-weight="bold">Bloom filters in RAM (one per file)</text>

  <!-- FILE 1 (newest) -->
  <rect x="526" y="226" width="118" height="36" rx="7" fill="#10243a" stroke="#93c5fd" stroke-width="2"/>
  <text x="585" y="249" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="12.5" font-weight="bold">Bloom</text>
  <rect x="526" y="276" width="118" height="206" rx="9" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
  <rect x="526" y="276" width="118" height="20" rx="9" fill="#2c2c18" stroke="#ffff99" stroke-width="2.5"/>
  <text x="585" y="291" text-anchor="middle" fill="#ffff99" font-family="monospace" font-size="11.5" font-weight="bold">SSTable</text>
  <text x="585" y="324" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">sorted data</text>
  <line x1="540" y1="338" x2="630" y2="338" stroke="#5b6470" stroke-width="1.5"/>
  <text x="585" y="362" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="11" font-weight="bold">sparse index</text>
  <text x="585" y="380" text-anchor="middle" fill="#9aa6b2" font-family="monospace" font-size="11">key&#8594;offset</text>
  <text x="585" y="470" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11.5">newest</text>

  <!-- FILE 2 -->
  <rect x="660" y="226" width="118" height="36" rx="7" fill="#10243a" stroke="#93c5fd" stroke-width="2"/>
  <text x="719" y="249" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="12.5" font-weight="bold">Bloom</text>
  <rect x="660" y="276" width="118" height="206" rx="9" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
  <rect x="660" y="276" width="118" height="20" rx="9" fill="#2c2c18" stroke="#ffff99" stroke-width="2.5"/>
  <text x="719" y="291" text-anchor="middle" fill="#ffff99" font-family="monospace" font-size="11.5" font-weight="bold">SSTable</text>
  <text x="719" y="324" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">sorted data</text>
  <line x1="674" y1="338" x2="764" y2="338" stroke="#5b6470" stroke-width="1.5"/>
  <text x="719" y="362" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="11" font-weight="bold">sparse index</text>
  <text x="719" y="380" text-anchor="middle" fill="#9aa6b2" font-family="monospace" font-size="11">key&#8594;offset</text>

  <!-- FILE 3 -->
  <rect x="794" y="226" width="118" height="36" rx="7" fill="#10243a" stroke="#93c5fd" stroke-width="2"/>
  <text x="853" y="249" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="12.5" font-weight="bold">Bloom</text>
  <rect x="794" y="276" width="118" height="206" rx="9" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
  <rect x="794" y="276" width="118" height="20" rx="9" fill="#2c2c18" stroke="#ffff99" stroke-width="2.5"/>
  <text x="853" y="291" text-anchor="middle" fill="#ffff99" font-family="monospace" font-size="11.5" font-weight="bold">SSTable</text>
  <text x="853" y="324" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">sorted data</text>
  <line x1="808" y1="338" x2="898" y2="338" stroke="#5b6470" stroke-width="1.5"/>
  <text x="853" y="362" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="11" font-weight="bold">sparse index</text>
  <text x="853" y="380" text-anchor="middle" fill="#9aa6b2" font-family="monospace" font-size="11">key&#8594;offset</text>

  <!-- FILE 4 (oldest) -->
  <rect x="928" y="226" width="118" height="36" rx="7" fill="#10243a" stroke="#93c5fd" stroke-width="2"/>
  <text x="987" y="249" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="12.5" font-weight="bold">Bloom</text>
  <rect x="928" y="276" width="118" height="206" rx="9" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
  <rect x="928" y="276" width="118" height="20" rx="9" fill="#2c2c18" stroke="#ffff99" stroke-width="2.5"/>
  <text x="987" y="291" text-anchor="middle" fill="#ffff99" font-family="monospace" font-size="11.5" font-weight="bold">SSTable</text>
  <text x="987" y="324" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">sorted data</text>
  <line x1="942" y1="338" x2="1032" y2="338" stroke="#5b6470" stroke-width="1.5"/>
  <text x="987" y="362" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="11" font-weight="bold">sparse index</text>
  <text x="987" y="380" text-anchor="middle" fill="#9aa6b2" font-family="monospace" font-size="11">key&#8594;offset</text>
  <text x="987" y="470" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11.5">oldest</text>

  <text x="820" y="504" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="13" font-weight="bold">immutable &#183; durable on disk &#183; each = sorted data + sparse key&#8594;offset index</text>

  <!-- ===================== WRITE PATH (pink) ===================== -->
  <!-- API -> WAL (step 1: append to WAL on disk) -->
  <path d="M150 312 C 200 230, 240 200, 268 200" fill="none" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#fm-p)"/>
  <text x="190" y="252" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="13" font-weight="bold">1. append</text>
  <text x="190" y="270" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="12.5">to WAL (disk)</text>

  <!-- WAL -> memtable (then apply) -->
  <path d="M338 244 C 338 270, 340 280, 343 296" fill="none" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#fm-p)"/>
  <text x="418" y="276" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="12.5" font-weight="bold">2. apply</text>

  <!-- ===================== FLUSH PATH (blue) ===================== -->
  <!-- memtable -> SSTable file1 (flush) -->
  <path d="M444 320 C 480 290, 500 270, 522 262" fill="none" stroke="#93c5fd" stroke-width="2.8" marker-end="url(#fm-b)"/>
  <text x="478" y="296" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="12.5" font-weight="bold">flush (one shot)</text>
  <text x="478" y="630" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="12.5"> </text>

  <!-- flush condition + truncate WAL note -->
  <rect x="244" y="476" width="200" height="86" rx="10" fill="#10243a" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="344" y="500" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="14" font-weight="bold">Flush trigger</text>
  <text x="344" y="522" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">memtable hits size /</text>
  <text x="344" y="538" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">time threshold &#8594; flush</text>
  <text x="344" y="556" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="12.5" font-weight="bold">then truncate WAL to zero</text>

  <!-- ===================== READ PATH (green) ===================== -->
  <!-- API GET -> memtable (check first) -->
  <path d="M176 420 C 200 430, 220 428, 242 420" fill="none" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#fm-g)"/>
  <text x="210" y="456" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="12.5" font-weight="bold">check memtable first</text>

  <!-- memtable miss -> walk SSTables newest-first -->
  <path d="M444 360 C 470 360, 480 358, 522 358" fill="none" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#fm-g)"/>
  <text x="484" y="346" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="12" font-weight="bold">on miss &#8594;</text>

  <!-- read path explanation box -->
  <rect x="500" y="556" width="370" height="148" rx="12" fill="#0f2417" stroke="#8aff8a" stroke-width="2.5"/>
  <text x="524" y="582" fill="#8aff8a" font-family="sans-serif" font-size="16" font-weight="bold">READ &#183; GET(k)</text>
  <text x="524" y="608" fill="#cbd5e1" font-family="sans-serif" font-size="13"><tspan fill="#8aff8a" font-weight="bold">1.</tspan> check memtable (newest) &#8212; hit wins</text>
  <text x="524" y="630" fill="#cbd5e1" font-family="sans-serif" font-size="13"><tspan fill="#8aff8a" font-weight="bold">2.</tspan> else walk SSTables newest-first</text>
  <text x="524" y="652" fill="#cbd5e1" font-family="sans-serif" font-size="13"><tspan fill="#8aff8a" font-weight="bold">3.</tspan> at each file consult its Bloom in RAM</text>
  <text x="544" y="672" fill="#8aff8a" font-family="sans-serif" font-size="12.5" font-weight="bold">NO &#8594; SKIP file (no disk touch)</text>
  <text x="544" y="690" fill="#cbd5e1" font-family="sans-serif" font-size="12.5"><tspan fill="#93c5fd" font-weight="bold">MAYBE</tspan> &#8594; disk index-lookup + seek-read</text>

  <!-- first hit wins note -->
  <rect x="884" y="556" width="256" height="148" rx="12" fill="#16191e" stroke="#8aff8a" stroke-width="2"/>
  <text x="1012" y="582" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="15" font-weight="bold">Outcome</text>
  <text x="1012" y="610" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">first hit wins</text>
  <text x="1012" y="630" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">else <tspan fill="#93c5fd" font-weight="bold">not-found</tspan></text>
  <text x="1012" y="662" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">Bloom keeps disk probes</text>
  <text x="1012" y="680" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">to the few real candidates</text>

  <!-- read arrow from read box up into storage (consult bloom / seek) -->
  <path d="M700 556 C 720 540, 730 530, 760 484" fill="none" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#fm-g)"/>
  <text x="772" y="538" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="12.5" font-weight="bold">probe SSTables</text>

  <!-- ===================== MAINTENANCE / COMPACTION (blue, background) ===================== -->
  <rect x="500" y="724" width="640" height="92" rx="12" fill="#10243a" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="524" y="752" fill="#93c5fd" font-family="sans-serif" font-size="17" font-weight="bold">Compaction</text>
  <rect x="668" y="734" width="100" height="26" rx="6" fill="#13161b" stroke="#93c5fd" stroke-width="1.6"/>
  <text x="718" y="752" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="12.5" font-weight="bold">background</text>
  <text x="524" y="778" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">a job merges immutable SSTables in <tspan fill="#93c5fd" font-weight="bold">O(n)</tspan> (already sorted), drops stale + tombstoned</text>
  <text x="524" y="800" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">records, collapses many files into fewer &#8212; <tspan fill="#93c5fd" font-weight="bold">keeps read cost bounded</tspan></text>

  <!-- storage -> compaction (read files for merge) -->
  <path d="M928 504 C 1090 560, 1120 660, 1130 718" fill="none" stroke="#93c5fd" stroke-width="2.8" stroke-dasharray="6 5" marker-end="url(#fm-b)"/>
  <text x="1120" y="556" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="12" font-weight="bold">read &amp; merge</text>
  <!-- compaction -> storage (write fewer files back) -->
  <path d="M560 724 C 500 620, 480 540, 500 504" fill="none" stroke="#93c5fd" stroke-width="2.8" stroke-dasharray="6 5" marker-end="url(#fm-b)"/>
  <text x="476" y="660" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="12" font-weight="bold">write fewer</text>
  <text x="476" y="678" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="12" font-weight="bold">larger files</text>

  <!-- ===================== LEGEND ===================== -->
  <rect x="44" y="556" width="436" height="148" rx="10" fill="#16191e" stroke="#5b6470" stroke-width="1.8"/>
  <text x="66" y="582" fill="#cbd5e1" font-family="sans-serif" font-size="15" font-weight="bold">LEGEND</text>
  <g font-family="sans-serif" font-size="13.5">
    <line x1="68" y1="606" x2="104" y2="606" stroke="#ff8bd2" stroke-width="3" marker-end="url(#fm-p)"/>
    <text x="114" y="611" fill="#cbd5e1">write path</text>
    <line x1="68" y1="632" x2="104" y2="632" stroke="#8aff8a" stroke-width="3" marker-end="url(#fm-g)"/>
    <text x="114" y="637" fill="#cbd5e1">read path</text>
    <line x1="68" y1="658" x2="104" y2="658" stroke="#ffff99" stroke-width="3" marker-end="url(#fm-y)"/>
    <text x="114" y="663" fill="#cbd5e1">durable storage + indexes</text>
    <line x1="68" y1="684" x2="104" y2="684" stroke="#93c5fd" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#fm-b)"/>
    <text x="114" y="689" fill="#cbd5e1">background / flush / compaction</text>
    <rect x="270" y="600" width="18" height="14" rx="3" fill="#2a1414" stroke="#ff8a8a" stroke-width="2"/>
    <text x="296" y="611" fill="#cbd5e1">red = costs:</text>
    <text x="296" y="634" fill="#9aa6b2" font-size="12.5">volatile memtable,</text>
    <text x="296" y="652" fill="#9aa6b2" font-size="12.5">fsync trade</text>
  </g>

  <!-- ===================== CAPTION ===================== -->
  <text x="590" y="846" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="14">This is an LSM tree &#8212; <tspan fill="#ffff99" font-weight="bold">RocksDB, LevelDB, Cassandra, HBase, BadgerDB</tspan>. Typically leveled: memtable &#8594; small L0 files &#8594;</text>
  <text x="590" y="868" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="14">compact into larger L1, L2; rarely more than <tspan fill="#93c5fd" font-weight="bold">~3 levels</tspan>.</text>
</svg>
