    <rect x="892" y="212" width="150" height="54" rx="10" fill="#0f2417" stroke="#8aff8a" stroke-width="2"/><text x="967" y="245" text-anchor="middle" fill="#8aff8a">email_report</text>
  </g>
  <line x1="504" y1="237" x2="554" y2="216" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#dr-w)"/>
  <line x1="504" y1="241" x2="554" y2="270" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#dr-w)"/>
  <line x1="708" y1="214" x2="744" y2="232" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#dr-w)"/>
  <line x1="708" y1="272" x2="744" y2="246" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#dr-w)"/>
  <line x1="852" y1="239" x2="888" y2="239" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#dr-w)"/>

  <line x1="590" y1="332" x2="590" y2="376" stroke="#93c5fd" stroke-width="3" marker-end="url(#dr-b)"/>
  <text x="610" y="360" fill="#93c5fd" font-family="sans-serif" font-size="13" font-weight="700">run it twice</text>

  <rect x="44" y="382" width="1092" height="276" rx="16" fill="#15191f" stroke="#ff8bd2" stroke-width="2"/>
  <text x="68" y="414" fill="#ff8bd2" font-family="sans-serif" font-size="18" font-weight="700">RUNTIME LAYER · rows with state</text>

  <rect x="78" y="440" width="474" height="170" rx="13" fill="#1f0f18" stroke="#ff8bd2" stroke-width="2.5"/>
  <text x="102" y="470" fill="#ff8bd2" font-family="sans-serif" font-size="17" font-weight="700">DagRun · 2026-06-16</text>
  <text x="102" y="494" fill="#9aa6b2" font-family="sans-serif" font-size="13">one execution of the whole blueprint</text>
  <g font-family="sans-serif" font-size="12" font-weight="700">
    <rect x="102" y="520" width="94" height="48" rx="8" fill="#0f2417" stroke="#8aff8a" stroke-width="2"/><text x="149" y="549" text-anchor="middle" fill="#8aff8a">extract ✓</text>
    <rect x="210" y="520" width="104" height="48" rx="8" fill="#2a1622" stroke="#ff8bd2" stroke-width="2"/><text x="262" y="549" text-anchor="middle" fill="#ff8bd2">transforms ●</text>
    <rect x="328" y="520" width="86" height="48" rx="8" fill="#1a1c20" stroke="#7a828c" stroke-width="2"/><text x="371" y="549" text-anchor="middle" fill="#9aa6b2">load ○</text>
    <rect x="428" y="520" width="94" height="48" rx="8" fill="#1a1c20" stroke="#7a828c" stroke-width="2"/><text x="475" y="549" text-anchor="middle" fill="#9aa6b2">email ○</text>
  </g>
  <text x="102" y="592" fill="#cbd5e1" font-family="sans-serif" font-size="13">TaskInstance identity: dag_id + run_id + task_id</text>

  <rect x="628" y="440" width="474" height="170" rx="13" fill="#1f0f18" stroke="#ff8bd2" stroke-width="2.5"/>
  <text x="652" y="470" fill="#ff8bd2" font-family="sans-serif" font-size="17" font-weight="700">DagRun · 2026-06-17</text>
  <text x="652" y="494" fill="#9aa6b2" font-family="sans-serif" font-size="13">same definition, independent state</text>
  <g font-family="sans-serif" font-size="12" font-weight="700">
    <rect x="652" y="520" width="94" height="48" rx="8" fill="#16202e" stroke="#93c5fd" stroke-width="2"/><text x="699" y="549" text-anchor="middle" fill="#93c5fd">extract ◷</text>
    <rect x="760" y="520" width="104" height="48" rx="8" fill="#1a1c20" stroke="#7a828c" stroke-width="2"/><text x="812" y="549" text-anchor="middle" fill="#9aa6b2">transforms ○</text>
    <rect x="878" y="520" width="86" height="48" rx="8" fill="#1a1c20" stroke="#7a828c" stroke-width="2"/><text x="921" y="549" text-anchor="middle" fill="#9aa6b2">load ○</text>
    <rect x="978" y="520" width="94" height="48" rx="8" fill="#1a1c20" stroke="#7a828c" stroke-width="2"/><text x="1025" y="549" text-anchor="middle" fill="#9aa6b2">email ○</text>
  </g>
  <text x="652" y="592" fill="#cbd5e1" font-family="sans-serif" font-size="13">retries and status change this run only</text>

  <rect x="170" y="674" width="840" height="30" rx="8" fill="#181b20"/>
  <text x="590" y="695" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="14" font-weight="700">Definitions describe work. DagRuns and TaskInstances are the stateful executions.</text>
</svg>
