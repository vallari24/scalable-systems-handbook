  <rect width="1180" height="720" fill="#111317"/>

  <text x="590" y="44" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="30" font-weight="700">Definition vs Runtime: Where State Actually Lives</text>
  <text x="590" y="76" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">the DAG and its tasks are a reusable, stateless recipe; each run stamps out stateful instances</text>

  <rect x="44" y="112" width="1092" height="220" rx="16" fill="#15191f" stroke="#93c5fd" stroke-width="2"/>
  <text x="68" y="144" fill="#93c5fd" font-family="sans-serif" font-size="18" font-weight="700">DEFINITION LAYER · parsed from Python</text>

  <rect x="78" y="174" width="220" height="112" rx="12" fill="#16202e" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="188" y="207" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="18" font-weight="700">Operator / @task</text>
  <text x="188" y="234" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="14">a template for work</text>
  <text x="188" y="258" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13">configuring it creates a Task</text>

  <line x1="300" y1="230" x2="356" y2="230" stroke="#93c5fd" stroke-width="3" marker-end="url(#dr-b)"/>
  <text x="328" y="214" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="12">instantiate</text>

  <rect x="364" y="154" width="730" height="152" rx="12" fill="#1a1c20" stroke="#cbd5e1" stroke-width="2"/>
  <text x="390" y="184" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="700">DAG blueprint: daily_report</text>
  <g font-family="sans-serif" font-size="13" font-weight="700">
    <rect x="392" y="212" width="112" height="54" rx="10" fill="#1d1d12" stroke="#ffff99" stroke-width="2"/><text x="448" y="245" text-anchor="middle" fill="#ffff99">extract</text>
    <rect x="558" y="190" width="150" height="48" rx="10" fill="#1d1d12" stroke="#ffff99" stroke-width="2"/><text x="633" y="220" text-anchor="middle" fill="#ffff99">transform_sales</text>
    <rect x="558" y="248" width="150" height="48" rx="10" fill="#1d1d12" stroke="#ffff99" stroke-width="2"/><text x="633" y="278" text-anchor="middle" fill="#ffff99">transform_signups</text>
