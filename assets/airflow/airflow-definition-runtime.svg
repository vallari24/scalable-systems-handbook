  <rect width="1180" height="720" fill="#111317"/>

  <text x="590" y="44" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="30" font-weight="700">Definition vs Runtime: Where State Actually Lives</text>
  <text x="590" y="76" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">the DAG and tasks are reusable definitions; each run creates stateful runtime instances</text>

