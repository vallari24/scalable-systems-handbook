  <rect x="170" y="674" width="840" height="30" rx="8" fill="#181b20"/>
  <text x="590" y="695" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="14" font-weight="700">Definitions describe work. DagRuns and TaskInstances are the stateful executions.</text>
