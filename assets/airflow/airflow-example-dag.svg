<svg width="1180" height="650" viewBox="0 0 1180 650" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="vd-w" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cbd5e1"/>
    </marker>
    <marker id="vd-g" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8aff8a"/>
    </marker>
  </defs>
  <rect width="1180" height="650" fill="#111317"/>
  <text x="590" y="44" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="30" font-weight="700">The daily_report DAG: One Gate, One Independent Tail</text>
  <text x="590" y="76" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">edges express ordering; fan-out creates parallel work; fan-in waits for every required upstream</text>

  <rect x="48" y="112" width="1084" height="300" rx="16" fill="#15191f" stroke="#ffff99" stroke-width="2"/>
  <text x="72" y="144" fill="#ffff99" font-family="sans-serif" font-size="17" font-weight="700">REPORT GATE · the critical path</text>

  <g font-family="sans-serif" font-size="14" font-weight="700">
    <rect x="70" y="224" width="128" height="64" rx="11" fill="#16202e" stroke="#93c5fd" stroke-width="2.5"/><text x="134" y="251" text-anchor="middle" fill="#93c5fd">daily trigger</text><text x="134" y="272" text-anchor="middle" fill="#cbd5e1" font-size="12">starts a DagRun</text>
    <rect x="242" y="224" width="120" height="64" rx="11" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/><text x="302" y="261" text-anchor="middle" fill="#ffff99">extract</text>
    <rect x="408" y="170" width="180" height="58" rx="11" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/><text x="498" y="205" text-anchor="middle" fill="#ffff99">transform_sales</text>
    <rect x="408" y="284" width="180" height="58" rx="11" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/><text x="498" y="319" text-anchor="middle" fill="#ffff99">transform_signups</text>
    <rect x="650" y="224" width="120" height="64" rx="11" fill="#2a1622" stroke="#ff8bd2" stroke-width="2.5"/><text x="710" y="261" text-anchor="middle" fill="#ff8bd2">load</text>
    <rect x="836" y="224" width="170" height="64" rx="11" fill="#0f2417" stroke="#8aff8a" stroke-width="3"/><text x="921" y="261" text-anchor="middle" fill="#8aff8a">email_report</text>
  </g>

  <line x1="198" y1="256" x2="238" y2="256" stroke="#cbd5e1" stroke-width="3" marker-end="url(#vd-w)"/>
  <path d="M362 256 C 386 256, 390 199, 404 199" fill="none" stroke="#cbd5e1" stroke-width="3" marker-end="url(#vd-w)"/>
  <path d="M362 256 C 386 256, 390 313, 404 313" fill="none" stroke="#cbd5e1" stroke-width="3" marker-end="url(#vd-w)"/>
  <path d="M588 199 C 624 199, 614 244, 646 248" fill="none" stroke="#8aff8a" stroke-width="3" marker-end="url(#vd-g)"/>
  <path d="M588 313 C 624 313, 614 268, 646 264" fill="none" stroke="#8aff8a" stroke-width="3" marker-end="url(#vd-g)"/>
  <line x1="770" y1="256" x2="832" y2="256" stroke="#8aff8a" stroke-width="3" marker-end="url(#vd-g)"/>

  <text x="392" y="184" fill="#cbd5e1" font-family="sans-serif" font-size="12">fan-out</text>
  <text x="624" y="184" fill="#8aff8a" font-family="sans-serif" font-size="12" font-weight="700">fan-in</text>
  <rect x="640" y="322" width="366" height="58" rx="10" fill="#0f2417" stroke="#8aff8a" stroke-width="1.5"/>
  <text x="823" y="346" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13" font-weight="700">default trigger rule: all_success</text>
  <text x="823" y="367" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">load waits for BOTH transforms before it starts</text>

  <rect x="48" y="440" width="1084" height="154" rx="16" fill="#15191f" stroke="#93c5fd" stroke-width="2"/>
  <text x="72" y="472" fill="#93c5fd" font-family="sans-serif" font-size="17" font-weight="700">INDEPENDENT TAIL · never blocks the report</text>

  <rect x="92" y="500" width="120" height="58" rx="10" fill="#1d1d12" stroke="#ffff99" stroke-width="2"/>
  <text x="152" y="535" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="14" font-weight="700">extract</text>
  <rect x="470" y="505" width="240" height="48" rx="9" fill="#16202e" stroke="#93c5fd" stroke-width="2"/>
  <text x="590" y="535" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="14" font-weight="700">refresh_dashboard</text>
  <path d="M212 529 H400 V529" fill="none" stroke="#93c5fd" stroke-width="2.5"/>
  <line x1="400" y1="529" x2="466" y2="529" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#vd-w)"/>
  <text x="590" y="584" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="13">runs in parallel off extract and does not gate load or email_report</text>

  <text x="590" y="626" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="14" font-weight="700">The DAG is the policy: what may run now, what must wait, and what may proceed independently.</text>
</svg>
