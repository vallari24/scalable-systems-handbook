<svg width="1180" height="650" viewBox="0 0 1180 650" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="vd-w" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cbd5e1"/>
    </marker>
    <marker id="vd-g" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8aff8a"/>
    </marker>
  </defs>
  <rect width="1180" height="650" fill="#111317"/>
  <text x="590" y="44" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="30" font-weight="700">The Video DAG: One Gate, One Independent Tail</text>
  <text x="590" y="76" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">edges express ordering; fan-out creates parallel work; fan-in waits for every required upstream</text>

  <rect x="48" y="112" width="1084" height="300" rx="16" fill="#15191f" stroke="#ffff99" stroke-width="2"/>
  <text x="72" y="144" fill="#ffff99" font-family="sans-serif" font-size="17" font-weight="700">PUBLISH GATE · latency-critical path</text>

  <g font-family="sans-serif" font-size="14" font-weight="700">
    <rect x="78" y="224" width="128" height="64" rx="11" fill="#16202e" stroke="#93c5fd" stroke-width="2.5"/><text x="142" y="251" text-anchor="middle" fill="#93c5fd">upload event</text><text x="142" y="272" text-anchor="middle" fill="#cbd5e1" font-size="12">starts DagRun</text>
    <rect x="250" y="224" width="126" height="64" rx="11" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/><text x="313" y="263" text-anchor="middle" fill="#ffff99">validate</text>
    <rect x="420" y="224" width="126" height="64" rx="11" fill="#2a1622" stroke="#ff8bd2" stroke-width="2.5"/><text x="483" y="252" text-anchor="middle" fill="#ff8bd2">gen_360</text><text x="483" y="273" text-anchor="middle" fill="#cbd5e1" font-size="12">small rendition</text>
    <rect x="608" y="170" width="142" height="58" rx="11" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/><text x="679" y="205" text-anchor="middle" fill="#ffff99">copyright</text>
    <rect x="608" y="284" width="142" height="58" rx="11" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/><text x="679" y="319" text-anchor="middle" fill="#ffff99">nudity</text>
    <rect x="850" y="224" width="150" height="64" rx="11" fill="#0f2417" stroke="#8aff8a" stroke-width="3"/><text x="925" y="263" text-anchor="middle" fill="#8aff8a">publish</text>
  </g>

  <line x1="206" y1="256" x2="246" y2="256" stroke="#cbd5e1" stroke-width="3" marker-end="url(#vd-w)"/>
  <line x1="376" y1="256" x2="416" y2="256" stroke="#cbd5e1" stroke-width="3" marker-end="url(#vd-w)"/>
  <path d="M546 256 C 570 256, 574 199, 604 199" fill="none" stroke="#cbd5e1" stroke-width="3" marker-end="url(#vd-w)"/>
  <path d="M546 256 C 570 256, 574 313, 604 313" fill="none" stroke="#cbd5e1" stroke-width="3" marker-end="url(#vd-w)"/>
  <path d="M750 199 C 800 199, 808 244, 846 248" fill="none" stroke="#8aff8a" stroke-width="3" marker-end="url(#vd-g)"/>
  <path d="M750 313 C 800 313, 808 268, 846 264" fill="none" stroke="#8aff8a" stroke-width="3" marker-end="url(#vd-g)"/>

  <text x="574" y="184" fill="#cbd5e1" font-family="sans-serif" font-size="12">fan-out</text>
  <text x="790" y="184" fill="#8aff8a" font-family="sans-serif" font-size="12" font-weight="700">fan-in</text>
  <rect x="816" y="322" width="252" height="58" rx="10" fill="#0f2417" stroke="#8aff8a" stroke-width="1.5"/>
  <text x="942" y="346" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13" font-weight="700">default trigger rule: all_success</text>
  <text x="942" y="367" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">publish waits for both checks</text>

  <rect x="48" y="440" width="1084" height="154" rx="16" fill="#15191f" stroke="#93c5fd" stroke-width="2"/>
  <text x="72" y="472" fill="#93c5fd" font-family="sans-serif" font-size="17" font-weight="700">INDEPENDENT TAIL · improves the video later</text>

  <rect x="92" y="500" width="126" height="58" rx="10" fill="#1d1d12" stroke="#ffff99" stroke-width="2"/>
  <text x="155" y="535" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="14" font-weight="700">validate</text>
  <g font-family="sans-serif" font-size="13" font-weight="700">
    <rect x="326" y="518" width="142" height="48" rx="9" fill="#2a1622" stroke="#ff8bd2" stroke-width="2"/><text x="397" y="548" text-anchor="middle" fill="#ff8bd2">gen_720</text>
    <rect x="510" y="518" width="142" height="48" rx="9" fill="#2a1622" stroke="#ff8bd2" stroke-width="2"/><text x="581" y="548" text-anchor="middle" fill="#ff8bd2">gen_1080</text>
    <rect x="694" y="518" width="142" height="48" rx="9" fill="#2a1622" stroke="#ff8bd2" stroke-width="2"/><text x="765" y="548" text-anchor="middle" fill="#ff8bd2">captions</text>
    <rect x="878" y="518" width="142" height="48" rx="9" fill="#2a1622" stroke="#ff8bd2" stroke-width="2"/><text x="949" y="548" text-anchor="middle" fill="#ff8bd2">thumbnails</text>
  </g>
  <path d="M218 529 H274 V498 H949" fill="none" stroke="#93c5fd" stroke-width="2.5"/>
  <line x1="397" y1="498" x2="397" y2="514" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#vd-w)"/>
  <line x1="581" y1="498" x2="581" y2="514" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#vd-w)"/>
  <line x1="765" y1="498" x2="765" y2="514" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#vd-w)"/>
  <line x1="949" y1="498" x2="949" y2="514" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#vd-w)"/>
  <text x="590" y="584" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="13">these tasks can run in parallel and do not block publish</text>

  <text x="590" y="626" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="14" font-weight="700">The DAG is the policy: what may run now, what must wait, and what may proceed independently.</text>
</svg>
