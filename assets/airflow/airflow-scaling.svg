  <text x="183" y="198" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="14" font-weight="700">Git / DAG bundle</text>
  <rect x="390" y="158" width="220" height="68" rx="10" fill="#16202e" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="500" y="185" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="15" font-weight="700">DAG Processor ×N</text>
  <text x="500" y="207" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">parse · validate · serialize</text>
