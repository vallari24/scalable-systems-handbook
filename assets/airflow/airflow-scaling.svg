  <rect x="1110" y="158" width="250" height="68" rx="10" fill="#181b20" stroke="#ffff99" stroke-width="2"/>
  <text x="1235" y="185" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="15" font-weight="700">Secrets backend</text>
  <text x="1235" y="207" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">Connections resolve credentials</text>

