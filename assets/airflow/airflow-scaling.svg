  <rect x="200" y="770" width="170" height="46" rx="9" fill="#2a1622" stroke="#ff8bd2" stroke-width="2"/>
  <rect x="210" y="760" width="170" height="46" rx="9" fill="#2a1622" stroke="#ff8bd2" stroke-width="2.5"/>
  <text x="295" y="788" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="14" font-weight="700">Worker fleet</text>

  <rect x="520" y="764" width="256" height="62" rx="10" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
  <text x="648" y="789" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="14" font-weight="700">Pool: external_api = 8</text>
  <text x="648" y="811" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">backpressure protects scarce capacity</text>

  <rect x="934" y="764" width="350" height="62" rx="10" fill="#181b20" stroke="#ff8a8a" stroke-width="2"/>
  <text x="1109" y="789" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="14" font-weight="700">At-least-once effects</text>
  <text x="1109" y="811" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">tasks must be idempotent across retries and crash recovery</text>

