  <text x="806" y="631" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">S3 / GCS / log service</text>

  <path d="M1010 578 q 92 -18 184 0 v 70 q -92 18 -184 0 z" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
