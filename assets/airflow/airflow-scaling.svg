  <rect width="1480" height="900" fill="#111317"/>
  <text x="740" y="44" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="31" font-weight="700">Production Airflow: Complete System Map</text>
  <text x="740" y="77" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">scale stateless control and execution components; protect the stateful database and external systems</text>

