  <text x="411" y="375" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">active</text>
  <rect x="514" y="326" width="162" height="68" rx="10" fill="#16202e" stroke="#93c5fd" stroke-width="2.5"/>
