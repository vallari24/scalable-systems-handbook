  <text x="504" y="418" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">DB row locks protect enqueue + pool limits · no leader election</text>

  <rect x="746" y="326" width="194" height="68" rx="10" fill="#16202e" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="843" y="354" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="14" font-weight="700">Triggerer ×N</text>
  <text x="843" y="375" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">deferred event loops</text>

