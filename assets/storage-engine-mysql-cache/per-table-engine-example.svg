<svg width="1200" height="680" viewBox="0 0 1200 680" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="pt-w" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="680" fill="#111317"/>

  <text x="600" y="44" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="30" font-weight="bold">Where to Switch: Per-Table Engine, a Real 3&#215; Win</text>
  <text x="600" y="74" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">the engine is set <tspan fill="#ffff99" font-weight="bold">per table</tspan> &#8212; move one hot, near-static table to MEMORY and leave the rest on InnoDB</text>

  <!-- LEFT: one DB, mixed engines -->
  <rect x="60" y="104" width="380" height="332" rx="12" fill="#16191e" stroke="#ffffff" stroke-width="2"/>
  <text x="84" y="138" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">One database, mixed engines</text>

  <g font-family="monospace" font-size="16">
    <rect x="84" y="158" width="332" height="44" rx="7" fill="#1d1d12" stroke="#ffff99" stroke-width="1.8"/>
    <text x="102" y="186" fill="#cbd5e1">users</text>
    <text x="396" y="186" text-anchor="end" fill="#ffff99" font-weight="bold">InnoDB &#8594; disk</text>

    <rect x="84" y="210" width="332" height="44" rx="7" fill="#1d1d12" stroke="#ffff99" stroke-width="1.8"/>
    <text x="102" y="238" fill="#cbd5e1">posts</text>
    <text x="396" y="238" text-anchor="end" fill="#ffff99" font-weight="bold">InnoDB &#8594; disk</text>

    <rect x="84" y="262" width="332" height="44" rx="7" fill="#1d1d12" stroke="#ffff99" stroke-width="1.8"/>
    <text x="102" y="290" fill="#cbd5e1">orders</text>
    <text x="396" y="290" text-anchor="end" fill="#ffff99" font-weight="bold">InnoDB &#8594; disk</text>

    <rect x="84" y="314" width="332" height="44" rx="7" fill="#0f2417" stroke="#8aff8a" stroke-width="3"/>
    <text x="102" y="342" fill="#8aff8a" font-weight="bold">config</text>
    <text x="396" y="342" text-anchor="end" fill="#8aff8a" font-weight="bold">MEMORY &#8594; RAM</text>
  </g>
  <text x="84" y="386" fill="#9aa6b2" font-family="sans-serif" font-size="13"><tspan fill="#8aff8a" font-weight="bold">config</tspan>: small, near-static, but heavily joined</text>
  <text x="84" y="408" fill="#9aa6b2" font-family="sans-serif" font-size="13">into almost every query &#8212; a hot read path.</text>

  <!-- MIDDLE: the one-line change -->
  <text x="470" y="138" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold">The whole change</text>
  <rect x="470" y="158" width="290" height="100" rx="10" fill="#0c1622" stroke="#8aff8a" stroke-width="2"/>
  <text x="490" y="194" fill="#8aff8a" font-family="monospace" font-size="16" font-weight="bold">ALTER TABLE config</text>
  <text x="490" y="222" fill="#8aff8a" font-family="monospace" font-size="16" font-weight="bold">  ENGINE = MEMORY;</text>
  <text x="490" y="246" fill="#9aa6b2" font-family="sans-serif" font-size="12">no app code changes &#8212; same SQL</text>
  <line x1="450" y1="336" x2="466" y2="336" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#pt-w)"/>
  <text x="470" y="300" fill="#9aa6b2" font-family="sans-serif" font-size="13">Just this table moves to RAM;</text>
  <text x="470" y="320" fill="#9aa6b2" font-family="sans-serif" font-size="13">users / posts / orders stay on disk.</text>

  <!-- RIGHT: before / after -->
  <rect x="790" y="104" width="350" height="104" rx="12" fill="#1d1216" stroke="#ff8a8a" stroke-width="2.5"/>
  <text x="812" y="136" fill="#ff8a8a" font-family="sans-serif" font-size="17" font-weight="bold">Before &#8212; config on InnoDB</text>
  <text x="812" y="164" fill="#cbd5e1" font-family="sans-serif" font-size="14">every join re-reads its pages from disk</text>
  <text x="812" y="190" fill="#ff8a8a" font-family="sans-serif" font-size="15" font-weight="bold">&#8594; lots of disk I/O on the hot path</text>

  <rect x="790" y="224" width="350" height="104" rx="12" fill="#0f2417" stroke="#8aff8a" stroke-width="2.5"/>
  <text x="812" y="256" fill="#8aff8a" font-family="sans-serif" font-size="17" font-weight="bold">After &#8212; config in MEMORY</text>
  <text x="812" y="284" fill="#cbd5e1" font-family="sans-serif" font-size="14">joins hit RAM, never disk</text>
  <text x="812" y="310" fill="#8aff8a" font-family="sans-serif" font-size="18" font-weight="bold">&#8594; ~3&#215; faster queries</text>

  <rect x="790" y="344" width="350" height="92" rx="12" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
  <text x="812" y="374" fill="#ffff99" font-family="sans-serif" font-size="15" font-weight="bold">The catch: MEMORY is volatile</text>
  <text x="812" y="400" fill="#cbd5e1" font-family="sans-serif" font-size="13">on restart the table is empty &#8212; a background</text>
  <text x="812" y="420" fill="#cbd5e1" font-family="sans-serif" font-size="13">job reloads it from the source of truth.</text>

  <!-- bottom synthesis -->
  <rect x="60" y="468" width="1080" height="170" rx="12" fill="#16191e" stroke="#8aff8a" stroke-width="2"/>
  <text x="84" y="504" fill="#8aff8a" font-family="sans-serif" font-size="19" font-weight="bold">The pattern: data that's read constantly and changes rarely</text>
  <text x="84" y="538" fill="#cbd5e1" font-family="sans-serif" font-size="16">Some tables are small, nearly <tspan fill="#ffff99" font-weight="bold">static</tspan>, and joined into almost every query &#8212; runtime config, lookup tables, feature flags.</text>
  <text x="84" y="566" fill="#cbd5e1" font-family="sans-serif" font-size="16">Re-reading them from disk over and over is wasted I/O. So ask: <tspan fill="#8aff8a" font-weight="bold">why not keep them in memory forever?</tspan></text>
  <text x="84" y="600" fill="#cbd5e1" font-family="sans-serif" font-size="16">Switching just those tables to the MEMORY engine is surgical caching &#8212; <tspan fill="#8aff8a" font-weight="bold">no new system</tspan>, no cache-invalidation code,</text>
  <text x="84" y="626" fill="#cbd5e1" font-family="sans-serif" font-size="16">just MySQL keeping the right tables in RAM. The trade you accept is volatility, covered by a reload job.</text>
</svg>
