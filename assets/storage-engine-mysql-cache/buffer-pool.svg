<svg width="1200" height="640" viewBox="0 0 1200 640" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="bp-w" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ffffff"/>
    </marker>
    <marker id="bp-g" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8aff8a"/>
    </marker>
    <marker id="bp-p" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ff8bd2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="640" fill="#111317"/>

  <text x="600" y="44" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="30" font-weight="bold">First Lever: Tune the Buffer Pool</text>
  <text x="600" y="74" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">MySQL caches recently-used <tspan fill="#8aff8a" font-weight="bold">pages</tspan> in memory &#8212; but it only speeds up reads, not the write-to-disk path</text>

  <!-- client -->
  <text x="90" y="300" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">query</text>
  <line x1="120" y1="294" x2="226" y2="294" stroke="#ffffff" stroke-width="2.5" marker-end="url(#bp-w)"/>

  <!-- MySQL box containing buffer pool -->
  <rect x="232" y="150" width="430" height="320" rx="12" fill="#16191e" stroke="#ffffff" stroke-width="2"/>
  <text x="252" y="182" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">MySQL server</text>

  <!-- buffer pool -->
  <rect x="268" y="210" width="358" height="150" rx="10" fill="#0f2417" stroke="#8aff8a" stroke-width="2.5"/>
  <text x="447" y="240" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="17" font-weight="bold">buffer pool</text>
  <text x="447" y="261" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">cached copies of recently-used pages</text>
  <!-- cached pages -->
  <g>
    <rect x="292" y="278" width="56" height="64" rx="5" fill="#15281b" stroke="#8aff8a" stroke-width="1.8"/>
    <rect x="360" y="278" width="56" height="64" rx="5" fill="#15281b" stroke="#8aff8a" stroke-width="1.8"/>
    <rect x="428" y="278" width="56" height="64" rx="5" fill="#15281b" stroke="#8aff8a" stroke-width="1.8"/>
    <rect x="496" y="278" width="56" height="64" rx="5" fill="#1c1f25" stroke="#5b6470" stroke-width="1.8" stroke-dasharray="4 4"/>
    <rect x="564" y="278" width="40" height="64" rx="5" fill="#1c1f25" stroke="#5b6470" stroke-width="1.8" stroke-dasharray="4 4"/>
  </g>
  <text x="447" y="386" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13" font-weight="bold">tune it bigger &#8594; more pages cached &#8594; fewer disk reads</text>

  <!-- read served from pool (hit) -->
  <line x1="226" y1="280" x2="264" y2="280" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#bp-g)"/>
  <text x="180" y="262" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13" font-weight="bold">read hit:</text>
  <text x="184" y="332" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="12">served from</text>
  <text x="184" y="348" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="12">memory</text>

  <!-- disk -->
  <g stroke="#ffff99" stroke-width="2.5" fill="#1d1d12">
    <ellipse cx="900" cy="250" rx="58" ry="18"/>
    <rect x="842" y="250" width="116" height="92" fill="#1d1d12" stroke="none"/>
    <path d="M842,250 L842,342" fill="none"/><path d="M958,250 L958,342" fill="none"/>
    <path d="M842,342 A58,18 0 0 0 958,342" fill="none"/>
    <ellipse cx="900" cy="250" rx="58" ry="18" fill="none"/>
  </g>
  <text x="900" y="372" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="16" font-weight="bold">disk</text>
  <text x="900" y="392" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">the durable copy of every page</text>

  <!-- write path still goes to disk (pink) -->
  <line x1="626" y1="430" x2="900" y2="430" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#bp-p)"/>
  <line x1="900" y1="430" x2="900" y2="346" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#bp-p)"/>
  <text x="447" y="424" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="14" font-weight="bold">every write still flushes to disk &#8594;</text>

  <!-- read miss to disk -->
  <line x1="664" y1="285" x2="840" y2="262" stroke="#9aa6b2" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#bp-w)"/>
  <text x="752" y="270" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">read miss &#8594; fetch page</text>

  <!-- verdict -->
  <rect x="60" y="498" width="1080" height="118" rx="12" fill="#16191e" stroke="#ff8a8a" stroke-width="2"/>
  <text x="84" y="532" fill="#ff8a8a" font-family="sans-serif" font-size="18" font-weight="bold">Is this good enough? Not quite.</text>
  <text x="84" y="562" fill="#cbd5e1" font-family="sans-serif" font-size="15">The buffer pool is a <tspan fill="#8aff8a" font-weight="bold">read</tspan> cache. It hides disk on the read path, but <tspan fill="#ff8bd2" font-weight="bold">writes</tspan> still travel to disk for durability.</text>
  <text x="84" y="590" fill="#cbd5e1" font-family="sans-serif" font-size="15">So ask the real question: <tspan fill="#ffff99" font-weight="bold">who is actually writing to disk?</tspan> Answer that, and we know exactly what to replace.</text>
</svg>
