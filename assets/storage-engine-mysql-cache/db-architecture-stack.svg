<svg width="1200" height="720" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="st-w" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ffffff"/>
    </marker>
    <marker id="st-b" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#93c5fd"/>
    </marker>
    <marker id="st-y" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ffff99"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="#111317"/>

  <text x="600" y="44" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="30" font-weight="bold">How a Database Actually Works: Four Pluggable Layers</text>
  <text x="600" y="74" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">a query falls through protocol &#8594; parser &#8594; optimizer &#8594; storage engine &#8212; and you can <tspan fill="#93c5fd" font-weight="bold">swap any layer</tspan></text>

  <!-- client / person -->
  <circle cx="330" cy="104" r="12" fill="none" stroke="#ffffff" stroke-width="2"/>
  <line x1="330" y1="116" x2="330" y2="140" stroke="#ffffff" stroke-width="2"/>
  <line x1="314" y1="126" x2="346" y2="126" stroke="#ffffff" stroke-width="2"/>
  <line x1="330" y1="140" x2="320" y2="156" stroke="#ffffff" stroke-width="2"/>
  <line x1="330" y1="140" x2="340" y2="156" stroke="#ffffff" stroke-width="2"/>
  <text x="366" y="118" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">client writes SQL</text>
  <line x1="330" y1="156" x2="330" y2="176" stroke="#ffffff" stroke-width="2.5" marker-end="url(#st-w)"/>

  <!-- Layer 1: Protocol -->
  <rect x="110" y="178" width="440" height="60" rx="10" fill="#10243a" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="132" y="208" fill="#93c5fd" font-family="sans-serif" font-size="19" font-weight="bold">1. Protocol</text>
  <text x="132" y="228" fill="#9aa6b2" font-family="sans-serif" font-size="13">the language the DB understands &#8212; for a relational DB, SQL</text>
  <line x1="300" y1="238" x2="300" y2="270" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#st-b)"/>
  <text x="316" y="259" fill="#cbd5e1" font-family="sans-serif" font-size="13">raw SQL text</text>

  <!-- Layer 2: Query Parser -->
  <rect x="110" y="272" width="440" height="60" rx="10" fill="#10243a" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="132" y="302" fill="#93c5fd" font-family="sans-serif" font-size="19" font-weight="bold">2. Query Parser</text>
  <text x="132" y="322" fill="#9aa6b2" font-family="sans-serif" font-size="13">parses SQL &#8594; an <tspan fill="#cbd5e1" font-weight="bold">abstract syntax tree</tspan> (AST)</text>
  <line x1="300" y1="332" x2="300" y2="364" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#st-b)"/>
  <text x="316" y="353" fill="#cbd5e1" font-family="sans-serif" font-size="13">AST</text>

  <!-- Layer 3: Query Optimizer -->
  <rect x="110" y="366" width="440" height="60" rx="10" fill="#10243a" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="132" y="396" fill="#93c5fd" font-family="sans-serif" font-size="19" font-weight="bold">3. Query Optimizer</text>
  <text x="132" y="416" fill="#9aa6b2" font-family="sans-serif" font-size="13">turns the AST into an <tspan fill="#cbd5e1" font-weight="bold">evaluation plan</tspan> that does the least work</text>
  <line x1="300" y1="426" x2="300" y2="458" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#st-b)"/>
  <text x="316" y="447" fill="#cbd5e1" font-family="sans-serif" font-size="13">evaluation plan</text>

  <!-- Layer 4: Storage Engine -->
  <rect x="110" y="460" width="440" height="64" rx="10" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
  <text x="132" y="491" fill="#ffff99" font-family="sans-serif" font-size="19" font-weight="bold">4. Storage Engine</text>
  <text x="132" y="512" fill="#9aa6b2" font-family="sans-serif" font-size="13">a fixed API &#8212; read page / write page &#8212; decides <tspan fill="#cbd5e1" font-weight="bold">where bytes live</tspan></text>
  <!-- read/write page: storage engine writes to disk OR memory -->
  <line x1="345" y1="524" x2="345" y2="552" stroke="#ffff99" stroke-width="2.5"/>
  <text x="361" y="544" fill="#cbd5e1" font-family="sans-serif" font-size="13">read / write page</text>
  <line x1="345" y1="552" x2="248" y2="576" stroke="#ffff99" stroke-width="2.5" marker-end="url(#st-y)"/>
  <line x1="345" y1="552" x2="442" y2="566" stroke="#ffff99" stroke-width="2.5" marker-end="url(#st-y)"/>

  <!-- disk -->
  <g stroke="#ffff99" stroke-width="2.5" fill="#1d1d12">
    <ellipse cx="240" cy="592" rx="46" ry="14"/>
    <rect x="194" y="592" width="92" height="54" fill="#1d1d12" stroke="none"/>
    <path d="M194,592 L194,646" fill="none"/><path d="M286,592 L286,646" fill="none"/>
    <path d="M194,646 A46,14 0 0 0 286,646" fill="none"/>
    <ellipse cx="240" cy="592" rx="46" ry="14" fill="none"/>
  </g>
  <text x="240" y="676" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="14" font-weight="bold">disk</text>

  <!-- memory -->
  <rect x="384" y="570" width="132" height="70" rx="9" fill="#0f2417" stroke="#8aff8a" stroke-width="2.5"/>
  <text x="450" y="602" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="15" font-weight="bold">memory</text>
  <text x="450" y="624" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11">or a CSV file...</text>

  <text x="345" y="690" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">the storage engine picks where bytes live</text>

  <!-- RIGHT PANEL: pluggability -->
  <rect x="620" y="178" width="540" height="346" rx="12" fill="#16191e" stroke="#93c5fd" stroke-width="2"/>
  <text x="644" y="214" fill="#93c5fd" font-family="sans-serif" font-size="21" font-weight="bold">Every layer is pluggable</text>

  <text x="644" y="250" fill="#cbd5e1" font-family="sans-serif" font-size="15">None of these layers is welded in. Each is a contract</text>
  <text x="644" y="272" fill="#cbd5e1" font-family="sans-serif" font-size="15">you can replace with your own implementation.</text>

  <text x="644" y="312" fill="#93c5fd" font-family="sans-serif" font-size="16" font-weight="bold">Example: replace the parser</text>
  <text x="644" y="338" fill="#cbd5e1" font-family="sans-serif" font-size="15">Write your own parser in C, pluck out the default,</text>
  <text x="644" y="360" fill="#cbd5e1" font-family="sans-serif" font-size="15">and drop yours in its place.</text>

  <rect x="644" y="378" width="492" height="46" rx="8" fill="#0c1622" stroke="#93c5fd" stroke-width="1.8"/>
  <text x="668" y="406" fill="#93c5fd" font-family="monospace" font-size="15" font-weight="bold">compile &#8594; lib/my.so</text>
  <text x="876" y="406" fill="#9aa6b2" font-family="sans-serif" font-size="13">a shared object, loaded dynamically</text>

  <text x="644" y="456" fill="#cbd5e1" font-family="sans-serif" font-size="15">The DB loads the <tspan fill="#93c5fd" font-weight="bold">.so</tspan> at runtime and calls into it</text>
  <text x="644" y="478" fill="#cbd5e1" font-family="sans-serif" font-size="15">instead of the built-in layer. No fork, no recompile</text>
  <text x="644" y="500" fill="#cbd5e1" font-family="sans-serif" font-size="15">of the database itself.</text>

  <!-- takeaway strip -->
  <rect x="620" y="544" width="540" height="92" rx="12" fill="#0f2417" stroke="#8aff8a" stroke-width="2.5"/>
  <text x="890" y="578" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="16" font-weight="bold">The one we care about for caching</text>
  <text x="890" y="606" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="15">is layer 4 &#8212; swap the <tspan fill="#ffff99" font-weight="bold">storage engine</tspan>, and you change</text>
  <text x="890" y="626" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="15">whether MySQL writes to disk or to memory.</text>
</svg>
