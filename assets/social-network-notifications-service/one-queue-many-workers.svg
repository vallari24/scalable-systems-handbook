<svg width="1200" height="700" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="aW" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="700" fill="#111317"/>

  <text x="600" y="44" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="30" font-weight="bold">One Queue, Many Workers</text>
  <text x="600" y="74" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">all workers read the SAME queue &#183; each message goes to exactly one worker</text>

  <!-- ============ SQS QUEUE (one pile of messages) ============ -->
  <g stroke="#93c5fd" stroke-width="3" fill="none">
    <ellipse cx="80" cy="330" rx="13" ry="62"/>
    <line x1="80" y1="268" x2="430" y2="268"/>
    <line x1="80" y1="392" x2="430" y2="392"/>
    <ellipse cx="430" cy="330" rx="13" ry="62"/>
  </g>
  <g font-family="monospace" font-size="14" text-anchor="middle">
    <rect x="98"  y="308" width="44" height="44" rx="6" fill="#1a1d22" stroke="#ffffff" stroke-width="2.5"/><text x="120" y="335" fill="#ffffff">m1</text>
    <rect x="154" y="308" width="44" height="44" rx="6" fill="#1a1d22" stroke="#ffffff" stroke-width="2.5"/><text x="176" y="335" fill="#ffffff">m2</text>
    <rect x="210" y="308" width="44" height="44" rx="6" fill="#1a1d22" stroke="#ffffff" stroke-width="2.5"/><text x="232" y="335" fill="#ffffff">m3</text>
    <rect x="266" y="308" width="44" height="44" rx="6" fill="#1a1d22" stroke="#ffffff" stroke-width="2.5"/><text x="288" y="335" fill="#ffffff">m4</text>
    <rect x="322" y="308" width="44" height="44" rx="6" fill="#1a1d22" stroke="#ffffff" stroke-width="2.5"/><text x="344" y="335" fill="#ffffff">m5</text>
    <rect x="378" y="308" width="44" height="44" rx="6" fill="#1a1d22" stroke="#5b6470" stroke-width="2.5"/><text x="400" y="335" fill="#9aa6b2">m6</text>
  </g>
  <text x="255" y="430" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="17" font-weight="bold">one SQS queue</text>
  <text x="255" y="452" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13">one shared pile &#183; m6 still waiting</text>

  <!-- ============ WORKERS (one fleet, all on the same queue) ============ -->
  <g>
    <rect x="830" y="110" width="300" height="64" rx="9" fill="#111317" stroke="#ffffff" stroke-width="3"/>
    <text x="905" y="148" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="bold">Worker A</text>
    <rect x="990" y="124" width="124" height="26" rx="6" fill="#1a1d22" stroke="#cbd5e1" stroke-width="1.5"/><text x="1052" y="142" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="13">took m1</text>

    <rect x="830" y="210" width="300" height="64" rx="9" fill="#111317" stroke="#ffffff" stroke-width="3"/>
    <text x="905" y="248" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="bold">Worker B</text>
    <rect x="990" y="224" width="124" height="26" rx="6" fill="#1a1d22" stroke="#cbd5e1" stroke-width="1.5"/><text x="1052" y="242" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="13">took m2</text>

    <rect x="830" y="310" width="300" height="64" rx="9" fill="#111317" stroke="#ffffff" stroke-width="3"/>
    <text x="905" y="348" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="bold">Worker C</text>
    <rect x="990" y="324" width="124" height="26" rx="6" fill="#1a1d22" stroke="#cbd5e1" stroke-width="1.5"/><text x="1052" y="342" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="13">took m3</text>

    <rect x="830" y="410" width="300" height="64" rx="9" fill="#111317" stroke="#ffffff" stroke-width="3"/>
    <text x="905" y="448" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="bold">Worker D</text>
    <rect x="990" y="424" width="124" height="26" rx="6" fill="#1a1d22" stroke="#cbd5e1" stroke-width="1.5"/><text x="1052" y="442" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="13">took m4</text>

    <rect x="830" y="510" width="300" height="64" rx="9" fill="#111317" stroke="#ffffff" stroke-width="3"/>
    <text x="905" y="548" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="bold">Worker E</text>
    <rect x="990" y="524" width="124" height="26" rx="6" fill="#1a1d22" stroke="#cbd5e1" stroke-width="1.5"/><text x="1052" y="542" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="13">took m5</text>
  </g>

  <!-- arrows: each message -> a different worker (1 message -> 1 worker) -->
  <line x1="124" y1="308" x2="826" y2="142" stroke="#ffffff" stroke-width="2.5" marker-end="url(#aW)"/>
  <line x1="180" y1="318" x2="826" y2="242" stroke="#ffffff" stroke-width="2.5" marker-end="url(#aW)"/>
  <line x1="236" y1="352" x2="826" y2="342" stroke="#ffffff" stroke-width="2.5" marker-end="url(#aW)"/>
  <line x1="292" y1="352" x2="826" y2="442" stroke="#ffffff" stroke-width="2.5" marker-end="url(#aW)"/>
  <line x1="348" y1="352" x2="826" y2="542" stroke="#ffffff" stroke-width="2.5" marker-end="url(#aW)"/>

  <text x="600" y="92" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="14">different workers pull different messages, in parallel</text>

  <!-- ============ "IS IT ONE-TO-ONE?" ANSWER BOX ============ -->
  <rect x="70" y="486" width="600" height="150" rx="12" fill="#16191e" stroke="#93c5fd" stroke-width="2"/>
  <text x="96" y="518" fill="#ffff99" font-family="sans-serif" font-size="18" font-weight="bold">Is it one-to-one?</text>
  <text x="96" y="548" font-family="sans-serif" font-size="15"><tspan fill="#8aff8a" font-weight="bold">&#10003;</tspan><tspan fill="#cbd5e1" dx="8">one MESSAGE &#8594; one worker</tspan></text>
  <text x="96" y="576" font-family="sans-serif" font-size="15"><tspan fill="#8aff8a" font-weight="bold">&#10003;</tspan><tspan fill="#cbd5e1" dx="8">one QUEUE &#8594; MANY workers (they all share the one queue)</tspan></text>
  <text x="96" y="604" font-family="sans-serif" font-size="15"><tspan fill="#ff8a8a" font-weight="bold">&#10007;</tspan><tspan fill="#cbd5e1" dx="8">NOT one queue per worker</tspan></text>
  <text x="96" y="628" fill="#9aa6b2" font-family="sans-serif" font-size="13">multiple queues appear only by priority (P0&#8211;P3) &#8212; each priority queue still has many workers</text>

  <!-- ============ BOTTOM MEMORY LINE ============ -->
  <line x1="60" y1="660" x2="1140" y2="660" stroke="#3a3f47" stroke-width="1.5"/>
  <circle cx="70" cy="686" r="5" fill="#93c5fd"/>
  <text x="86" y="691" fill="#cbd5e1" font-family="sans-serif" font-size="15"><tspan fill="#ffffff" font-weight="bold">1 message &#8594; ONE worker; 1 queue &#8594; MANY workers</tspan> &#8212; workers split the pile; that's how SQS scales out.</text>
</svg>
