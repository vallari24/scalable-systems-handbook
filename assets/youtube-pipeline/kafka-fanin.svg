<svg width="1180" height="640" viewBox="0 0 1180 640" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="k-w" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#cbd5e1"/>
    </marker>
    <marker id="k-r" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#ff8a8a"/>
    </marker>
    <marker id="k-b" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#93c5fd"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1180" height="640" fill="#111317"/>

  <text x="590" y="46" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="30" font-weight="bold">Why Kafka Doesn't Work Here: The Fan-In Problem</text>
  <text x="590" y="78" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">a stream moves events forward; it has no notion of "this set of jobs has all finished"</text>

  <line x1="590" y1="104" x2="590" y2="600" stroke="#3a3f47" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- LEFT PANEL: simple chain works -->
  <text x="290" y="134" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="17" font-weight="bold">A straight chain looks fine</text>

  <rect x="40" y="168" width="120" height="48" rx="10" fill="#2a1622" stroke="#ff8bd2" stroke-width="2.5"/>
  <text x="100" y="197" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="14" font-weight="bold">producer</text>
  <line x1="100" y1="216" x2="100" y2="250" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#k-w)"/>

  <!-- kafka tube -->
  <rect x="40" y="256" width="500" height="36" rx="18" fill="#16202e" stroke="#93c5fd" stroke-width="2.5"/>
  <circle cx="58" cy="274" r="10" fill="#16202e" stroke="#93c5fd" stroke-width="2.5"/>
  <circle cx="522" cy="274" r="10" fill="#16202e" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="290" y="280" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="15" font-weight="bold">Kafka topic</text>

  <!-- consumers chain -->
  <line x1="160" y1="332" x2="160" y2="296" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#k-b)"/>
  <rect x="120" y="334" width="80" height="44" rx="9" fill="#16191e" stroke="#cbd5e1" stroke-width="2"/>
  <text x="160" y="361" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="16" font-weight="bold">A</text>
  <line x1="204" y1="356" x2="268" y2="356" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#k-w)"/>
  <rect x="272" y="334" width="80" height="44" rx="9" fill="#16191e" stroke="#cbd5e1" stroke-width="2"/>
  <text x="312" y="361" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="16" font-weight="bold">B</text>
  <line x1="356" y1="356" x2="420" y2="356" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#k-w)"/>
  <rect x="424" y="334" width="80" height="44" rx="9" fill="#16191e" stroke="#cbd5e1" stroke-width="2"/>
  <text x="464" y="361" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="16" font-weight="bold">C</text>

  <rect x="60" y="420" width="460" height="120" rx="12" fill="#0f2417" stroke="#8aff8a" stroke-width="2"/>
  <text x="290" y="448" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="15" font-weight="bold">Linear A &#8594; B &#8594; C is what a stream is for</text>
  <text x="290" y="476" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">each consumer reacts to a message and emits the</text>
  <text x="290" y="496" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">next. Nobody waits for anybody. Producers and</text>
  <text x="290" y="516" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">consumers are decoupled &#8212; Kafka's real strength.</text>

  <!-- RIGHT PANEL: fan-in breaks -->
  <text x="888" y="134" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="17" font-weight="bold">But fan-in breaks it</text>

  <!-- C and D -> E -->
  <rect x="660" y="168" width="100" height="48" rx="10" fill="#16191e" stroke="#cbd5e1" stroke-width="2"/>
  <text x="710" y="197" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="15" font-weight="bold">copyright (C)</text>
  <rect x="660" y="236" width="100" height="48" rx="10" fill="#16191e" stroke="#cbd5e1" stroke-width="2"/>
  <text x="710" y="265" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="15" font-weight="bold">nudity (D)</text>

  <line x1="762" y1="190" x2="848" y2="216" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#k-r)"/>
  <line x1="762" y1="262" x2="848" y2="234" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#k-r)"/>
  <rect x="852" y="200" width="120" height="50" rx="10" fill="#2a1414" stroke="#ff8a8a" stroke-width="2.5"/>
  <text x="912" y="222" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="14" font-weight="bold">publish (E)</text>
  <text x="912" y="240" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">needs BOTH C and D</text>

  <text x="888" y="296" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="13" font-weight="bold">Nothing in Kafka knows E needs both &#8594; you hand-build a join:</text>

  <!-- burdens list -->
  <rect x="636" y="312" width="504" height="232" rx="12" fill="#2a1414" stroke="#ff8a8a" stroke-width="2.5"/>
  <text x="656" y="340" fill="#ff8a8a" font-family="sans-serif" font-size="14" font-weight="bold">Everything you must reinvent by hand:</text>
  <text x="656" y="368" fill="#cbd5e1" font-family="sans-serif" font-size="13">&#8226; who signals completion? (each job emits a "done" event)</text>
  <text x="656" y="392" fill="#cbd5e1" font-family="sans-serif" font-size="13">&#8226; where is the join state stored? (a side DB keyed by video id)</text>
  <text x="656" y="416" fill="#cbd5e1" font-family="sans-serif" font-size="13">&#8226; out-of-order events: D may arrive before C</text>
  <text x="656" y="440" fill="#cbd5e1" font-family="sans-serif" font-size="13">&#8226; duplicate events: Kafka is at-least-once &#8594; must be idempotent</text>
  <text x="656" y="464" fill="#cbd5e1" font-family="sans-serif" font-size="13">&#8226; the event that never comes: timeouts, dead-letter, alerting</text>
  <text x="656" y="488" fill="#cbd5e1" font-family="sans-serif" font-size="13">&#8226; retries + backoff for a transient failure</text>
  <text x="656" y="512" fill="#cbd5e1" font-family="sans-serif" font-size="13">&#8226; "where is video X stuck?" &#8212; no single place knows the graph</text>
  <text x="656" y="534" fill="#ffff99" font-family="sans-serif" font-size="12" font-weight="bold">&#215; hundreds of dependencies = a workflow engine, reinvented badly</text>

  <text x="590" y="612" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="14">Kafka isn't bad &#8212; it's the wrong abstraction. Modeling a dependency graph as a stream of events is the mistake.</text>
</svg>
