<svg width="1100" height="540" viewBox="0 0 1100 540" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="po-w" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#cbd5e1"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="540" fill="#111317"/>

  <text x="550" y="48" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="30" font-weight="bold">A Video Platform: Three Stages</text>
  <text x="550" y="80" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">upload and distribution are solved problems &#8212; the middle stage is the hard one</text>

  <!-- STAGE 1: UPLOAD -->
  <rect x="40" y="120" width="300" height="300" rx="14" fill="#1a1018" stroke="#ff8bd2" stroke-width="2.5"/>
  <text x="190" y="152" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="20" font-weight="bold">1 &#183; UPLOAD</text>
  <!-- creator -->
  <circle cx="100" cy="232" r="18" fill="#16191e" stroke="#cbd5e1" stroke-width="2.5"/>
  <path d="M74 282 q 26 -38 52 0 z" fill="#16191e" stroke="#cbd5e1" stroke-width="2.5"/>
  <text x="100" y="312" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="bold">creator</text>
  <line x1="130" y1="250" x2="208" y2="250" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#po-w)"/>
  <text x="172" y="238" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="12">pre-signed PUT</text>
  <!-- S3 cylinder -->
  <path d="M218 224 q 50 -14 100 0 v 70 q -50 14 -100 0 z" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
  <path d="M218 224 q 50 14 100 0" fill="none" stroke="#ffff99" stroke-width="2.5"/>
  <text x="268" y="262" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="15" font-weight="bold">S3</text>
  <text x="268" y="282" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">raw video</text>
  <text x="190" y="372" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13">bytes go straight to S3,</text>
  <text x="190" y="392" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13">just like Instagram upload</text>

  <!-- arrow 1->2 -->
  <line x1="346" y1="270" x2="394" y2="270" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#po-w)"/>
  <text x="370" y="258" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">triggers</text>

  <!-- STAGE 2: PROCESSING (highlighted) -->
  <rect x="400" y="108" width="300" height="324" rx="14" fill="#16202e" stroke="#93c5fd" stroke-width="3.5"/>
  <rect x="476" y="118" width="148" height="26" rx="9" fill="#93c5fd"/>
  <text x="550" y="136" text-anchor="middle" fill="#0b1220" font-family="sans-serif" font-size="13" font-weight="bold">THE HARD PART</text>
  <text x="550" y="170" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="20" font-weight="bold">2 &#183; PROCESSING</text>
  <!-- mini DAG -->
  <circle cx="550" cy="208" r="9" fill="#16191e" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="550" y1="217" x2="478" y2="252" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="550" y1="217" x2="550" y2="252" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="550" y1="217" x2="622" y2="252" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="442" y="254" width="72" height="30" rx="7" fill="#1d1d12" stroke="#ffff99" stroke-width="2"/>
  <text x="478" y="274" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="12">transcode</text>
  <rect x="516" y="254" width="68" height="30" rx="7" fill="#1d1d12" stroke="#ffff99" stroke-width="2"/>
  <text x="550" y="274" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="12">checks</text>
  <rect x="586" y="254" width="74" height="30" rx="7" fill="#16202e" stroke="#93c5fd" stroke-width="2"/>
  <text x="623" y="274" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="12">captions</text>
  <line x1="478" y1="286" x2="540" y2="318" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="550" y1="286" x2="550" y2="318" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="498" y="320" width="104" height="32" rx="8" fill="#0f2417" stroke="#8aff8a" stroke-width="2.5"/>
  <text x="550" y="341" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13" font-weight="bold">publish gate</text>
  <text x="550" y="390" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">a graph of dependent jobs,</text>
  <text x="550" y="410" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">a gate, and an async tail</text>

  <!-- arrow 2->3 -->
  <line x1="706" y1="270" x2="754" y2="270" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#po-w)"/>

  <!-- STAGE 3: DISTRIBUTION -->
  <rect x="760" y="120" width="300" height="300" rx="14" fill="#0f2417" stroke="#8aff8a" stroke-width="2.5"/>
  <text x="910" y="152" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="20" font-weight="bold">3 &#183; DISTRIBUTION</text>
  <rect x="800" y="220" width="90" height="56" rx="9" fill="#16191e" stroke="#8aff8a" stroke-width="2.5"/>
  <text x="845" y="244" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="15" font-weight="bold">CDN</text>
  <text x="845" y="264" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">edge cache</text>
  <line x1="892" y1="248" x2="952" y2="248" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#po-w)"/>
  <circle cx="985" cy="232" r="16" fill="#16191e" stroke="#cbd5e1" stroke-width="2.5"/>
  <path d="M962 278 q 23 -34 46 0 z" fill="#16191e" stroke="#cbd5e1" stroke-width="2.5"/>
  <text x="985" y="306" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="bold">viewers</text>
  <text x="910" y="372" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13">read-heavy delivery,</text>
  <text x="910" y="392" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13">the image-delivery problem</text>

  <text x="550" y="468" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="15">Upload = Instagram-to-S3. Distribution = CDN read path. Processing = a dependency graph of jobs &#8212; the only new problem.</text>
  <text x="550" y="500" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="14">The raw object landing in S3 is the trigger that kicks off the whole processing pipeline.</text>
</svg>
