<svg width="1280" height="700" viewBox="0 0 1280 700" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a-b" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#93c5fd"/></marker>
    <marker id="a-y" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ffff99"/></marker>
    <marker id="a-w" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#cbd5e1"/></marker>
    <marker id="a-p" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ff8bd2"/></marker>
    <marker id="a-g" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aff8a"/></marker>
  </defs>
  <rect x="0" y="0" width="1280" height="700" fill="#111317"/>

  <text x="640" y="40" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="27" font-weight="bold">Airflow is a distributed system: master, queue, workers, metadata DB</text>
  <text x="640" y="66" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="15">the master orchestrates the DAG; a queue hands ready tasks to a pool of workers; the metadata DB is the single source of truth for state</text>

  <!-- trigger from video service -->
  <rect x="40" y="300" width="150" height="56" rx="10" fill="#16202e" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="115" y="325" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="13" font-weight="bold">Video Service</text>
  <text x="115" y="343" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11">upload finished</text>
  <line x1="190" y1="328" x2="312" y2="328" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#a-p)"/>
  <text x="251" y="318" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="11">trigger</text>
  <text x="251" y="346" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="10.5">(video_id, dag)</text>

  <!-- MASTER -->
  <rect x="316" y="288" width="170" height="82" rx="12" fill="#2a1622" stroke="#ff8bd2" stroke-width="2.5"/>
  <text x="401" y="320" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="16" font-weight="bold">Master</text>
  <text x="401" y="340" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">scheduler: reads the DAG,</text>
  <text x="401" y="356" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">decides what is ready</text>

  <!-- metadata DB under master -->
  <g>
    <ellipse cx="401" cy="468" rx="60" ry="13" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
    <path d="M341,468 v66 a60,13 0 0 0 120,0 v-66" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
    <ellipse cx="401" cy="468" rx="60" ry="13" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
  </g>
  <text x="401" y="512" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="13" font-weight="bold">metadata DB</text>
  <text x="401" y="556" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11">every task's state &#183; the &#8220;where is video X stuck?&#8221; view</text>
  <line x1="401" y1="370" x2="401" y2="452" stroke="#ffff99" stroke-width="2" marker-end="url(#a-y)"/>
  <line x1="430" y1="452" x2="430" y2="372" stroke="#ffff99" stroke-width="2" marker-end="url(#a-y)"/>
  <text x="500" y="420" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="10.5">read state /</text>
  <text x="500" y="434" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="10.5">create run</text>

  <!-- QUEUE -->
  <rect x="560" y="300" width="40" height="240" rx="20" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
  <text x="580" y="566" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="13" font-weight="bold">task queue</text>
  <line x1="486" y1="320" x2="556" y2="350" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#a-p)"/>
  <text x="528" y="312" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="10.5">enqueue</text>
  <text x="528" y="326" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="10.5">ready task</text>

  <!-- WORKER POOL -->
  <rect x="660" y="150" width="430" height="400" rx="14" fill="#10151c" stroke="#93c5fd" stroke-width="2"/>
  <text x="875" y="178" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="14" font-weight="bold">worker pool (stateless, scale horizontally)</text>
  <g font-family="sans-serif" font-size="12.5" font-weight="bold">
    <rect x="690" y="200" width="110" height="50" rx="9" fill="#16202e" stroke="#93c5fd" stroke-width="2.5"/><text x="745" y="223" text-anchor="middle" fill="#93c5fd">worker</text><text x="745" y="240" text-anchor="middle" fill="#9aa6b2" font-size="10.5">gen_360</text>
    <rect x="820" y="200" width="110" height="50" rx="9" fill="#16202e" stroke="#93c5fd" stroke-width="2.5"/><text x="875" y="223" text-anchor="middle" fill="#93c5fd">worker</text><text x="875" y="240" text-anchor="middle" fill="#9aa6b2" font-size="10.5">copyright</text>
    <rect x="950" y="200" width="110" height="50" rx="9" fill="#16202e" stroke="#93c5fd" stroke-width="2.5"/><text x="1005" y="223" text-anchor="middle" fill="#93c5fd">worker</text><text x="1005" y="240" text-anchor="middle" fill="#9aa6b2" font-size="10.5">nudity</text>
    <rect x="690" y="270" width="110" height="50" rx="9" fill="#16202e" stroke="#93c5fd" stroke-width="2.5"/><text x="745" y="293" text-anchor="middle" fill="#93c5fd">worker</text><text x="745" y="310" text-anchor="middle" fill="#9aa6b2" font-size="10.5">gen_720</text>
    <rect x="820" y="270" width="110" height="50" rx="9" fill="#16202e" stroke="#93c5fd" stroke-width="2.5"/><text x="875" y="293" text-anchor="middle" fill="#93c5fd">worker</text><text x="875" y="310" text-anchor="middle" fill="#9aa6b2" font-size="10.5">gen_1080</text>
    <rect x="950" y="270" width="110" height="50" rx="9" fill="#16202e" stroke="#93c5fd" stroke-width="2.5"/><text x="1005" y="293" text-anchor="middle" fill="#93c5fd">worker</text><text x="1005" y="310" text-anchor="middle" fill="#9aa6b2" font-size="10.5">captions</text>
  </g>
  <!-- worker pulls from queue -->
  <line x1="600" y1="360" x2="686" y2="300" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#a-b)"/>
  <text x="650" y="392" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="10.5">pull</text>
  <!-- workers update metadata DB -->
  <path d="M690,300 C 560,360 500,440 463,470" fill="none" stroke="#ffff99" stroke-width="2.5" marker-end="url(#a-y)"/>
  <text x="600" y="470" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="10.5">workers write task state &#8594; metadata DB</text>

  <!-- workers read/write S3 -->
  <g>
    <ellipse cx="875" cy="400" rx="56" ry="30" fill="#16191e" stroke="#cbd5e1" stroke-width="2.5"/>
    <text x="875" y="398" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="bold">S3</text>
    <text x="875" y="416" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="10.5">raw + renditions</text>
  </g>
  <line x1="800" y1="250" x2="855" y2="372" stroke="#cbd5e1" stroke-width="2" marker-end="url(#a-w)"/>
  <text x="930" y="320" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="10.5">read raw,</text>
  <text x="930" y="334" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="10.5">write renditions</text>

  <!-- on final stage: publish + kafka -->
  <rect x="690" y="470" width="160" height="56" rx="10" fill="#0f2417" stroke="#8aff8a" stroke-width="2.5"/>
  <text x="770" y="494" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13" font-weight="bold">final task: publish</text>
  <text x="770" y="512" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">status &#8594; PUBLISHED</text>
  <line x1="875" y1="320" x2="800" y2="466" stroke="#8aff8a" stroke-width="2" stroke-dasharray="5 4"/>

  <rect x="900" y="470" width="170" height="56" rx="10" fill="#2a1622" stroke="#ff8bd2" stroke-width="2.5"/>
  <text x="985" y="492" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="13" font-weight="bold">Kafka</text>
  <text x="985" y="510" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">ON-PUBLISH event</text>
  <line x1="850" y1="498" x2="896" y2="498" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#a-p)"/>
  <text x="873" y="488" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="9.5">CDC / API</text>

  <!-- the loop caption -->
  <rect x="40" y="600" width="1200" height="78" rx="12" fill="#181b20" stroke="#3a3f47" stroke-width="1.5"/>
  <text x="60" y="626" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="bold">The scheduler loop:</text>
  <text x="60" y="650" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">1. trigger creates a DAG run in the metadata DB &#8594; 2. master finds tasks whose upstreams are done &#8594; 3. enqueues them &#8594; 4. a free worker pulls one &#8594;</text>
  <text x="60" y="670" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">5. worker runs the stage (read S3, encode, write back) &#8594; 6. worker records success in the metadata DB &#8594; back to step 2 until the DAG completes &#8594; emit ON-PUBLISH.</text>
</svg>
