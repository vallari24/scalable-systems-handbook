<svg width="1400" height="1060" viewBox="0 0 1400 1060" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="s-p" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ff8bd2"/></marker>
    <marker id="s-y" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ffff99"/></marker>
    <marker id="s-b" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#93c5fd"/></marker>
    <marker id="s-g" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aff8a"/></marker>
    <marker id="s-w" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#cbd5e1"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1060" fill="#111317"/>

  <text x="700" y="40" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="29" font-weight="bold">The full YouTube pipeline architecture</text>
  <text x="700" y="68" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="16">two services for the two faces of a video &#183; Airflow orchestrates processing &#183; one publish event fans out to every consumer</text>

  <!-- ===================== S3 ===================== -->
  <ellipse cx="165" cy="215" rx="78" ry="50" fill="#16191e" stroke="#cbd5e1" stroke-width="2.5"/>
  <text x="165" y="208" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="19" font-weight="bold">S3</text>
  <text x="165" y="230" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">raw + renditions</text>

  <!-- ===================== Creator ===================== -->
  <circle cx="125" cy="445" r="16" fill="#16191e" stroke="#cbd5e1" stroke-width="2.5"/>
  <path d="M103 492 q 22 -32 44 0 z" fill="#16191e" stroke="#cbd5e1" stroke-width="2.5"/>
  <text x="125" y="518" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="bold">creator / viewer</text>

  <!-- ===================== Video Service ===================== -->
  <rect x="360" y="408" width="210" height="58" rx="10" fill="#16191e" stroke="#cbd5e1" stroke-width="2.5"/>
  <text x="465" y="437" text-anchor="middle" fill="#e5e7eb" font-family="sans-serif" font-size="17" font-weight="bold">Video Service</text>
  <text x="465" y="456" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11">the raw, physical video</text>

  <!-- Raw Video Meta DB -->
  <g>
    <ellipse cx="690" cy="412" rx="30" ry="9" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
    <path d="M660,412 v46 a30,9 0 0 0 60,0 v-46" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
    <ellipse cx="690" cy="412" rx="30" ry="9" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
  </g>
  <text x="690" y="486" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="13" font-weight="bold">Raw Video Meta DB</text>
  <!-- annotation -->
  <text x="800" y="410" fill="#9aa6b2" font-family="monospace" font-size="14">{</text>
  <text x="818" y="410" fill="#8aff8a" font-family="monospace" font-size="14">id</text>
  <text x="840" y="410" fill="#cbd5e1" font-family="monospace" font-size="14">,</text>
  <text x="818" y="432" fill="#cbd5e1" font-family="monospace" font-size="14">thumbnails: [ ],</text>
  <text x="818" y="454" fill="#cbd5e1" font-family="monospace" font-size="14">encoding,</text>
  <text x="818" y="476" fill="#cbd5e1" font-family="monospace" font-size="14">bitrate</text>
  <text x="800" y="498" fill="#9aa6b2" font-family="monospace" font-size="14">}</text>

  <!-- ===================== Channel Service ===================== -->
  <rect x="360" y="560" width="230" height="58" rx="10" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
  <text x="475" y="589" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="17" font-weight="bold">Channel Service</text>
  <text x="475" y="608" text-anchor="middle" fill="#cbe08a" font-family="sans-serif" font-size="11">the published, public video</text>

  <!-- Channel DB -->
  <g>
    <ellipse cx="690" cy="564" rx="30" ry="9" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
    <path d="M660,564 v46 a30,9 0 0 0 60,0 v-46" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
    <ellipse cx="690" cy="564" rx="30" ry="9" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
  </g>
  <text x="690" y="638" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="13" font-weight="bold">Channel DB</text>
  <!-- annotation -->
  <text x="800" y="566" fill="#9aa6b2" font-family="monospace" font-size="14">{</text>
  <text x="818" y="566" fill="#cbd5e1" font-family="monospace" font-size="14">title, description, tags,</text>
  <text x="818" y="588" fill="#8aff8a" font-family="monospace" font-size="14">video_id</text>
  <text x="900" y="588" fill="#cbd5e1" font-family="monospace" font-size="14">,</text>
  <text x="818" y="610" fill="#ffd27f" font-family="monospace" font-size="14">status</text>
  <text x="800" y="632" fill="#9aa6b2" font-family="monospace" font-size="14">}</text>

  <!-- ===================== Airflow box ===================== -->
  <rect x="880" y="92" width="500" height="246" rx="14" fill="#10151c" stroke="#cbd5e1" stroke-width="2"/>
  <text x="918" y="328" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="15" font-weight="bold">Airflow</text>
  <g font-family="sans-serif" font-size="11.5" font-weight="bold">
    <rect x="930" y="112" width="86" height="34" rx="7" fill="#16202e" stroke="#93c5fd" stroke-width="2.2"/><text x="973" y="134" text-anchor="middle" fill="#93c5fd">Worker</text>
    <rect x="1042" y="112" width="86" height="34" rx="7" fill="#16202e" stroke="#93c5fd" stroke-width="2.2"/><text x="1085" y="134" text-anchor="middle" fill="#93c5fd">Worker</text>
    <rect x="1154" y="112" width="86" height="34" rx="7" fill="#16202e" stroke="#93c5fd" stroke-width="2.2"/><text x="1197" y="134" text-anchor="middle" fill="#93c5fd">Worker</text>
    <rect x="916" y="158" width="86" height="34" rx="7" fill="#16202e" stroke="#93c5fd" stroke-width="2.2"/><text x="959" y="180" text-anchor="middle" fill="#93c5fd">Worker</text>
    <rect x="1028" y="158" width="86" height="34" rx="7" fill="#16202e" stroke="#93c5fd" stroke-width="2.2"/><text x="1071" y="180" text-anchor="middle" fill="#93c5fd">Worker</text>
    <rect x="1140" y="158" width="86" height="34" rx="7" fill="#16202e" stroke="#93c5fd" stroke-width="2.2"/><text x="1183" y="180" text-anchor="middle" fill="#93c5fd">Worker</text>
    <rect x="1262" y="158" width="86" height="34" rx="7" fill="#16202e" stroke="#93c5fd" stroke-width="2.2"/><text x="1305" y="180" text-anchor="middle" fill="#93c5fd">Worker</text>
  </g>
  <!-- master -->
  <rect x="1070" y="240" width="120" height="44" rx="9" fill="#2a1622" stroke="#ff8bd2" stroke-width="2.5"/>
  <text x="1130" y="267" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="15" font-weight="bold">Master</text>
  <!-- metadata db (left of master) -->
  <g>
    <ellipse cx="985" cy="246" rx="22" ry="7" fill="#1d1d12" stroke="#ffff99" stroke-width="2.2"/>
    <path d="M963,246 v32 a22,7 0 0 0 44,0 v-32" fill="#1d1d12" stroke="#ffff99" stroke-width="2.2"/>
    <ellipse cx="985" cy="246" rx="22" ry="7" fill="#1d1d12" stroke="#ffff99" stroke-width="2.2"/>
  </g>
  <line x1="1007" y1="262" x2="1066" y2="262" stroke="#cbd5e1" stroke-width="2"/>
  <text x="985" y="302" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="10.5">metadata DB</text>
  <!-- queue (right of master) -->
  <rect x="1240" y="252" width="118" height="20" rx="10" fill="#1d1d12" stroke="#ffff99" stroke-width="2.2"/>
  <line x1="1190" y1="262" x2="1238" y2="262" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1299" y="292" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="10.5">task queue</text>

  <!-- ===================== Watchtime ===================== -->
  <rect x="55" y="618" width="190" height="52" rx="10" fill="#16202e" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="150" y="650" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="16" font-weight="bold">Watchtime</text>

  <!-- ===================== Kafka bus ===================== -->
  <rect x="330" y="742" width="800" height="30" rx="15" fill="#2a1622" stroke="#ff8bd2" stroke-width="2.5"/>
  <ellipse cx="330" cy="757" rx="9" ry="15" fill="#2a1622" stroke="#ff8bd2" stroke-width="2.5"/>
  <ellipse cx="1130" cy="757" rx="9" ry="15" fill="#2a1622" stroke="#ff8bd2" stroke-width="2.5"/>
  <text x="470" y="734" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="17" font-weight="bold">Kafka</text>
  <text x="600" y="734" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">event bus &#8212; one event, many consumers</text>

  <!-- ===================== CDN Decider ===================== -->
  <rect x="215" y="852" width="210" height="56" rx="10" fill="#16202e" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="320" y="877" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="15" font-weight="bold">CDN Decider</text>
  <text x="320" y="896" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11">rule engine: cache or not?</text>

  <!-- CDN cloud -->
  <ellipse cx="135" cy="975" rx="72" ry="46" fill="#16191e" stroke="#8aff8a" stroke-width="2.5"/>
  <text x="135" y="970" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="17" font-weight="bold">CDN</text>
  <text x="135" y="992" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11">edge cache</text>

  <!-- ===================== Trending Svc ===================== -->
  <rect x="470" y="900" width="200" height="52" rx="10" fill="#2a2012" stroke="#ffd27f" stroke-width="2.5"/>
  <text x="570" y="932" text-anchor="middle" fill="#ffd27f" font-family="sans-serif" font-size="15" font-weight="bold">Trending Svc</text>
  <g>
    <ellipse cx="520" cy="1000" rx="24" ry="7" fill="#16191e" stroke="#cbd5e1" stroke-width="2.2"/>
    <path d="M496,1000 v30 a24,7 0 0 0 48,0 v-30" fill="#16191e" stroke="#cbd5e1" stroke-width="2.2"/>
    <ellipse cx="520" cy="1000" rx="24" ry="7" fill="#16191e" stroke="#cbd5e1" stroke-width="2.2"/>
  </g>
  <text x="520" y="1052" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11">DB</text>
  <g>
    <ellipse cx="625" cy="1000" rx="24" ry="7" fill="#16191e" stroke="#cbd5e1" stroke-width="2.2"/>
    <path d="M601,1000 v30 a24,7 0 0 0 48,0 v-30" fill="#16191e" stroke="#cbd5e1" stroke-width="2.2"/>
    <ellipse cx="625" cy="1000" rx="24" ry="7" fill="#16191e" stroke="#cbd5e1" stroke-width="2.2"/>
  </g>
  <text x="625" y="1052" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11">Cache</text>

  <!-- ===================== Search ===================== -->
  <rect x="790" y="828" width="340" height="140" rx="12" fill="#1d1d12" stroke="#ffff99" stroke-width="2"/>
  <text x="828" y="958" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="15" font-weight="bold">Search</text>
  <rect x="822" y="852" width="120" height="50" rx="9" fill="#23230f" stroke="#ffff99" stroke-width="2.2"/>
  <text x="882" y="882" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="13" font-weight="bold">Worker</text>
  <rect x="962" y="852" width="120" height="50" rx="9" fill="#23230f" stroke="#ffff99" stroke-width="2.2"/>
  <text x="1022" y="882" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="13" font-weight="bold">Worker</text>
  <!-- elastic search -->
  <g>
    <ellipse cx="1000" cy="1005" rx="30" ry="8" fill="#16191e" stroke="#cbd5e1" stroke-width="2.2"/>
    <path d="M970,1005 v30 a30,8 0 0 0 60,0 v-30" fill="#16191e" stroke="#cbd5e1" stroke-width="2.2"/>
    <ellipse cx="1000" cy="1005" rx="30" ry="8" fill="#16191e" stroke="#cbd5e1" stroke-width="2.2"/>
  </g>
  <text x="1080" y="1020" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12" font-weight="bold">Elastic Search</text>

  <!-- ============================================================= -->
  <!-- EDGES -->
  <!-- ============================================================= -->

  <!-- creator -> video service (upload request) -->
  <line x1="148" y1="438" x2="356" y2="434" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#s-w)"/>
  <text x="252" y="426" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">upload req</text>

  <!-- creator -> S3 (PUT direct) -->
  <line x1="135" y1="428" x2="155" y2="266" stroke="#ff8bd2" stroke-width="3" marker-end="url(#s-p)"/>
  <text x="80" y="350" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="11">PUT bytes</text>
  <text x="80" y="364" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="11">(direct)</text>

  <!-- video service <-> raw db -->
  <line x1="570" y1="430" x2="656" y2="430" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#s-w)"/>
  <text x="613" y="422" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="10.5">register</text>

  <!-- video service -> channel service (create draft) -->
  <line x1="465" y1="466" x2="465" y2="556" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#s-p)"/>
  <text x="556" y="514" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="11">create draft entry</text>

  <!-- channel service -> channel db -->
  <line x1="590" y1="585" x2="656" y2="582" stroke="#ffff99" stroke-width="2.5" marker-end="url(#s-y)"/>

  <!-- video service -> airflow master (trigger) -->
  <path d="M540,408 C 760,210 900,280 1068,262" fill="none" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#s-p)"/>
  <text x="800" y="250" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="11.5">trigger processing (video_id, dag)</text>

  <!-- airflow workers -> raw db (write meta) -->
  <path d="M1028,178 C 880,250 760,300 716,400" fill="none" stroke="#ffff99" stroke-width="2.2" marker-end="url(#s-y)"/>
  <text x="1010" y="360" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="10.5">write encoding,</text>
  <text x="1010" y="374" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="10.5">bitrate, thumbnails</text>

  <!-- airflow workers -> channel db (set status) -->
  <path d="M1183,192 C 1150,460 820,540 716,558" fill="none" stroke="#ffff99" stroke-width="2.2" marker-end="url(#s-y)"/>
  <text x="1120" y="560" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="10.5">on publish: set status</text>

  <!-- airflow workers <-> S3 -->
  <path d="M959,192 C 560,240 360,300 248,210" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#s-w)"/>
  <text x="470" y="200" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="10.5">read raw / write renditions</text>

  <!-- channel db -> kafka (CDC, on-publish) -->
  <line x1="690" y1="660" x2="690" y2="740" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#s-p)"/>
  <text x="640" y="700" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="11" font-weight="bold">ON-PUBLISH</text>
  <text x="745" y="700" text-anchor="middle" fill="#ffd27f" font-family="sans-serif" font-size="11">CDC</text>

  <!-- creator -> watchtime (views) -->
  <line x1="128" y1="495" x2="145" y2="614" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#s-b)"/>
  <text x="98" y="560" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="11">views</text>

  <!-- watchtime -> kafka (on-view) -->
  <path d="M245,648 C 300,690 320,720 340,742" fill="none" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#s-b)"/>
  <text x="300" y="712" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="11" font-weight="bold">ON-VIEW</text>

  <!-- S3 -> CDN (serve renditions) -->
  <path d="M150,265 C 40,480 40,800 95,944" fill="none" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#s-g)"/>
  <text x="42" y="640" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="11" transform="rotate(-90 42 640)">serve renditions</text>

  <!-- kafka -> search (on-publish) -->
  <line x1="960" y1="772" x2="960" y2="824" stroke="#ffff99" stroke-width="2.5" marker-end="url(#s-y)"/>
  <text x="960" y="800" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="11" font-weight="bold">ON-PUBLISH</text>

  <!-- kafka -> trending (on-view + on-publish) -->
  <line x1="570" y1="772" x2="570" y2="896" stroke="#ffd27f" stroke-width="2.5" marker-end="url(#s-y)"/>
  <text x="570" y="828" text-anchor="middle" fill="#ffd27f" font-family="sans-serif" font-size="11" font-weight="bold">ON-VIEW</text>

  <!-- kafka -> cdn decider (on-view) -->
  <path d="M430,766 C 380,800 350,820 332,848" fill="none" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#s-b)"/>
  <text x="392" y="812" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="11" font-weight="bold">ON-VIEW</text>

  <!-- search workers -> elastic search -->
  <line x1="882" y1="902" x2="975" y2="990" stroke="#cbd5e1" stroke-width="2" marker-end="url(#s-w)"/>
  <line x1="1022" y1="902" x2="1010" y2="990" stroke="#cbd5e1" stroke-width="2" marker-end="url(#s-w)"/>
  <text x="1090" y="900" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="10.5">index</text>

  <!-- trending -> DB, Cache -->
  <line x1="540" y1="952" x2="525" y2="990" stroke="#cbd5e1" stroke-width="2" marker-end="url(#s-w)"/>
  <line x1="600" y1="952" x2="618" y2="990" stroke="#cbd5e1" stroke-width="2" marker-end="url(#s-w)"/>

  <!-- trending -> cdn decider (ask to cache) -->
  <path d="M470,918 C 430,910 410,900 392,894" fill="none" stroke="#ffd27f" stroke-width="2.5" marker-end="url(#s-y)"/>
  <text x="430" y="946" text-anchor="middle" fill="#ffd27f" font-family="sans-serif" font-size="10.5">&#8220;cache this&#8221;</text>

  <!-- cdn decider -> cdn (cache api) -->
  <line x1="240" y1="908" x2="170" y2="942" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#s-g)"/>
  <text x="170" y="900" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="10.5">cache API</text>

  <!-- LEGEND -->
  <rect x="1148" y="372" width="232" height="172" rx="10" fill="#181b20" stroke="#3a3f47" stroke-width="1.5"/>
  <text x="1164" y="396" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="bold">Legend</text>
  <rect x="1164" y="410" width="15" height="15" rx="3" fill="#ff8bd2"/><text x="1187" y="422" fill="#cbd5e1" font-family="sans-serif" font-size="12">upload / write / event</text>
  <rect x="1164" y="434" width="15" height="15" rx="3" fill="#ffff99"/><text x="1187" y="446" fill="#cbd5e1" font-family="sans-serif" font-size="12">storage / published meta</text>
  <rect x="1164" y="458" width="15" height="15" rx="3" fill="#93c5fd"/><text x="1187" y="470" fill="#cbd5e1" font-family="sans-serif" font-size="12">service / control plane</text>
  <rect x="1164" y="482" width="15" height="15" rx="3" fill="#8aff8a"/><text x="1187" y="494" fill="#cbd5e1" font-family="sans-serif" font-size="12">serve path (CDN)</text>
  <rect x="1164" y="506" width="15" height="15" rx="3" fill="#ffd27f"/><text x="1187" y="518" fill="#cbd5e1" font-family="sans-serif" font-size="12">trending / popularity</text>
</svg>
