<svg width="1120" height="660" viewBox="0 0 1120 660" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="pf-b" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#93c5fd"/>
    </marker>
    <marker id="pf-y" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#ffff99"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="660" fill="#111317"/>

  <text x="560" y="46" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="30" font-weight="bold">Processing: One Upload Fans Out Into Many Jobs</text>
  <text x="560" y="78" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">each job produces a different artifact &#8212; and they are neither independent nor equally urgent</text>

  <!-- raw input -->
  <rect x="40" y="290" width="190" height="90" rx="12" fill="#2a1622" stroke="#ff8bd2" stroke-width="2.5"/>
  <text x="135" y="328" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="18" font-weight="bold">raw video</text>
  <text x="135" y="352" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="14">in S3 (the input)</text>

  <!-- fan-out arrows -->
  <line x1="232" y1="320" x2="356" y2="150" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#pf-b)"/>
  <line x1="232" y1="330" x2="356" y2="262" stroke="#ffff99" stroke-width="2.5" marker-end="url(#pf-y)"/>
  <line x1="232" y1="335" x2="356" y2="357" stroke="#ffff99" stroke-width="2.5" marker-end="url(#pf-y)"/>
  <line x1="232" y1="345" x2="356" y2="452" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#pf-b)"/>
  <line x1="232" y1="355" x2="356" y2="552" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#pf-b)"/>

  <!-- 1. TRANSCODING -->
  <rect x="360" y="116" width="430" height="92" rx="12" fill="#16202e" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="380" y="146" fill="#93c5fd" font-family="sans-serif" font-size="17" font-weight="bold">1 &#183; Transcoding</text>
  <text x="380" y="168" fill="#cbd5e1" font-family="sans-serif" font-size="13">re-encode into a resolution ladder &#8212; each its own encode</text>
  <g font-family="sans-serif" font-size="13" font-weight="bold">
    <rect x="380" y="178" width="78" height="22" rx="6" fill="#0f1a28" stroke="#93c5fd" stroke-width="1.5"/><text x="419" y="194" text-anchor="middle" fill="#93c5fd">360p</text>
    <rect x="466" y="178" width="78" height="22" rx="6" fill="#0f1a28" stroke="#93c5fd" stroke-width="1.5"/><text x="505" y="194" text-anchor="middle" fill="#93c5fd">480p</text>
    <rect x="552" y="178" width="78" height="22" rx="6" fill="#0f1a28" stroke="#93c5fd" stroke-width="1.5"/><text x="591" y="194" text-anchor="middle" fill="#93c5fd">720p</text>
    <rect x="638" y="178" width="90" height="22" rx="6" fill="#0f1a28" stroke="#93c5fd" stroke-width="1.5"/><text x="683" y="194" text-anchor="middle" fill="#93c5fd">1080p+</text>
  </g>

  <!-- 2. COPYRIGHT -->
  <rect x="360" y="226" width="430" height="68" rx="12" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
  <rect x="690" y="234" width="92" height="22" rx="8" fill="#ff8a8a"/>
  <text x="736" y="250" text-anchor="middle" fill="#0b1220" font-family="sans-serif" font-size="12" font-weight="bold">EXPENSIVE</text>
  <text x="380" y="256" fill="#ffff99" font-family="sans-serif" font-size="17" font-weight="bold">2 &#183; Copyright check</text>
  <text x="380" y="280" fill="#cbd5e1" font-family="sans-serif" font-size="13">fingerprint + match a rights DB (Content ID) &#8212; slowest job</text>

  <!-- 3. NUDITY -->
  <rect x="360" y="322" width="430" height="68" rx="12" fill="#1d1d12" stroke="#ffff99" stroke-width="2.5"/>
  <text x="380" y="352" fill="#ffff99" font-family="sans-serif" font-size="17" font-weight="bold">3 &#183; Nudity / safety check</text>
  <text x="380" y="376" fill="#cbd5e1" font-family="sans-serif" font-size="13">ML classifier scans frames for disallowed content</text>

  <!-- 4. CAPTIONING -->
  <rect x="360" y="418" width="430" height="68" rx="12" fill="#16202e" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="380" y="448" fill="#93c5fd" font-family="sans-serif" font-size="17" font-weight="bold">4 &#183; Auto-captioning</text>
  <text x="380" y="472" fill="#cbd5e1" font-family="sans-serif" font-size="13">speech-to-text produces subtitle tracks (nice-to-have)</text>

  <!-- 5. THUMBNAIL -->
  <rect x="360" y="514" width="430" height="68" rx="12" fill="#16202e" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="380" y="544" fill="#93c5fd" font-family="sans-serif" font-size="17" font-weight="bold">5 &#183; Thumbnail</text>
  <text x="380" y="568" fill="#cbd5e1" font-family="sans-serif" font-size="13">extract frames automatically, or accept a custom upload</text>

  <!-- two truths panel -->
  <rect x="824" y="240" width="262" height="200" rx="12" fill="#181b20" stroke="#cbd5e1" stroke-width="2"/>
  <text x="955" y="270" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="16" font-weight="bold">Two truths drive</text>
  <text x="955" y="290" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="16" font-weight="bold">everything next</text>
  <text x="842" y="324" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="bold">1. Not independent.</text>
  <text x="842" y="346" fill="#9aa6b2" font-family="sans-serif" font-size="12">can't check a rendition that</text>
  <text x="842" y="364" fill="#9aa6b2" font-family="sans-serif" font-size="12">doesn't exist yet &#8212; edges.</text>
  <text x="842" y="396" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="bold">2. Not equally urgent.</text>
  <text x="842" y="418" fill="#9aa6b2" font-family="sans-serif" font-size="12">safety gates publish; 4K and</text>
  <text x="842" y="436" fill="#9aa6b2" font-family="sans-serif" font-size="12">captions do not.</text>

  <text x="560" y="624" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="14">One upload &#8594; many artifacts from many jobs. Some gate publishing; some don't. That split is the whole design.</text>
</svg>
