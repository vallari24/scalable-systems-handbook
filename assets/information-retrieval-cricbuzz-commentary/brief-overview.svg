<svg width="1080" height="600" viewBox="0 0 1080 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="bo-p" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ff8bd2"/></marker>
    <marker id="bo-g" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aff8a"/></marker>
    <marker id="bo-n" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8a95a3"/></marker>
  </defs>

  <rect x="0" y="0" width="1080" height="600" fill="#111317"/>

  <!-- ===== TITLE ===== -->
  <text x="540" y="40" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="27" font-weight="bold">Designing Cricbuzz live text commentary &#8212; the system at a glance</text>

  <!-- ===== FOUR-AXIS PILLS ===== -->
  <g font-family="sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">
    <rect x="196" y="58" width="118" height="27" rx="13.5" fill="#1a1f26" stroke="#ffff99" stroke-width="1.5"/>
    <text x="255" y="76" fill="#ffff99">STORAGE</text>
    <rect x="326" y="58" width="138" height="27" rx="13.5" fill="#1a1f26" stroke="#8aff8a" stroke-width="1.5"/>
    <text x="395" y="76" fill="#8aff8a">READ ACCESS</text>
    <rect x="476" y="58" width="142" height="27" rx="13.5" fill="#1a1f26" stroke="#ff8bd2" stroke-width="1.5"/>
    <text x="547" y="76" fill="#ff8bd2">WRITE ACCESS</text>
    <rect x="630" y="58" width="186" height="27" rx="13.5" fill="#1a1f26" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="723" y="76" fill="#93c5fd">COMMUNICATION / REFRESH</text>
    <rect x="828" y="58" width="156" height="27" rx="13.5" fill="#1a1f26" stroke="#ff8a8a" stroke-width="1.5"/>
    <text x="906" y="76" fill="#ff8a8a">COST OPTIMIZATION</text>
  </g>

  <!-- ===== REQUIREMENTS BANNER ===== -->
  <text x="540" y="108" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="14.5">Requirements:  <tspan fill="#8aff8a">live commentary</tspan>  &#183;  <tspan fill="#ffd27f">cost-efficient</tspan>  &#183;  <tspan fill="#93c5fd">good UX</tspan>  &#183;  <tspan fill="#ffff99" font-style="italic">design realistically</tspan></text>

  <!-- ===== VIEWERS (left) ===== -->
  <g stroke="#cbd5e1" stroke-width="2.5" fill="none">
    <circle cx="80" cy="210" r="13"/>
    <line x1="80" y1="223" x2="80" y2="258"/>
    <line x1="58" y1="238" x2="102" y2="238"/>
    <line x1="80" y1="258" x2="65" y2="282"/>
    <line x1="80" y1="258" x2="95" y2="282"/>
    <circle cx="80" cy="300" r="13"/>
    <line x1="80" y1="313" x2="80" y2="348"/>
    <line x1="58" y1="328" x2="102" y2="328"/>
    <line x1="80" y1="348" x2="65" y2="372"/>
    <line x1="80" y1="348" x2="95" y2="372"/>
  </g>
  <text x="80" y="396" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="14">Viewers (millions)</text>

  <!-- viewer read request -->
  <line x1="108" y1="232" x2="368" y2="278" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#bo-g)"/>
  <text x="232" y="246" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="13.5">GET /commentary</text>
  <!-- commentary returned -->
  <line x1="368" y1="312" x2="108" y2="330" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#bo-g)" stroke-dasharray="6 5"/>
  <text x="236" y="338" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13.5">latest balls back</text>

  <!-- ===== API STACK (center) ===== -->
  <rect x="392" y="248" width="170" height="108" rx="11" fill="#14171c" stroke="#3a414b" stroke-width="2"/>
  <rect x="386" y="254" width="170" height="108" rx="11" fill="#161a20" stroke="#4a525d" stroke-width="2"/>
  <rect x="380" y="260" width="170" height="108" rx="11" fill="#1a1f26" stroke="#8a95a3" stroke-width="2.5"/>
  <text x="465" y="308" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="19" font-weight="bold">API servers</text>
  <text x="465" y="334" text-anchor="middle" fill="#9aa6b2" font-family="monospace" font-size="13.5">/commentary/&lt;match-id&gt;</text>

  <!-- ===== COMMENTATOR (lower-left) ===== -->
  <g stroke="#ff8bd2" stroke-width="2.5" fill="none">
    <circle cx="250" cy="470" r="13"/>
    <line x1="250" y1="483" x2="250" y2="518"/>
    <line x1="228" y1="498" x2="272" y2="498"/>
    <line x1="250" y1="518" x2="235" y2="542"/>
    <line x1="250" y1="518" x2="265" y2="542"/>
  </g>
  <text x="250" y="566" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="14" font-weight="bold">Commentator</text>
  <text x="250" y="584" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">Cricbuzz control room</text>

  <!-- typed balls -->
  <g font-family="monospace" font-size="13.5">
    <rect x="300" y="438" width="92" height="24" rx="5" fill="#1a1f26" stroke="#ff8bd2" stroke-width="1.4"/>
    <text x="346" y="455" text-anchor="middle" fill="#ffd2ec">10.1 &#8212;</text>
    <rect x="300" y="468" width="92" height="24" rx="5" fill="#1a1f26" stroke="#ff8bd2" stroke-width="1.4"/>
    <text x="346" y="485" text-anchor="middle" fill="#ffd2ec">10.2 &#8212;</text>
    <rect x="300" y="498" width="92" height="24" rx="5" fill="#1a1f26" stroke="#ff8bd2" stroke-width="1.4"/>
    <text x="346" y="515" text-anchor="middle" fill="#ffd2ec">10.3 &#8212;</text>
  </g>
  <text x="346" y="425" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">each line = one ball</text>
  <!-- commentator write arrow up into API -->
  <line x1="398" y1="478" x2="455" y2="372" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#bo-p)"/>
  <text x="452" y="430" fill="#ff8bd2" font-family="sans-serif" font-size="13">write</text>

  <!-- ===== REDIS CACHE (top-right) ===== -->
  <path d="M760 150 a48 11 0 0 0 96 0 v54 a48 11 0 0 1 -96 0 z" fill="#16191e" stroke="#b79bff" stroke-width="2.5"/>
  <ellipse cx="808" cy="150" rx="48" ry="11" fill="#1b1f25" stroke="#b79bff" stroke-width="2.5"/>
  <text x="808" y="184" text-anchor="middle" fill="#e6dcff" font-family="sans-serif" font-size="15" font-weight="bold">Redis</text>
  <text x="808" y="234" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="bold">Cache</text>
  <text x="808" y="252" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">latest commentary per live match</text>
  <!-- API -> cache (write, pink) -->
  <line x1="552" y1="288" x2="758" y2="200" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#bo-p)"/>
  <text x="648" y="232" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="13">write latest</text>
  <!-- cache -> API (read, green) -->
  <line x1="758" y1="226" x2="552" y2="312" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#bo-g)" stroke-dasharray="6 5"/>
  <text x="650" y="320" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13">read latest</text>

  <!-- ===== MYSQL (right) ===== -->
  <path d="M762 372 a44 10 0 0 0 88 0 v48 a44 10 0 0 1 -88 0 z" fill="#16191e" stroke="#7c8694" stroke-width="2.5"/>
  <ellipse cx="806" cy="372" rx="44" ry="10" fill="#1b1f25" stroke="#7c8694" stroke-width="2.5"/>
  <text x="806" y="404" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="14" font-weight="bold">MySQL</text>
  <text x="806" y="448" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">Relational DB &#183; durable record</text>
  <!-- API -> MySQL (neutral) -->
  <line x1="552" y1="330" x2="760" y2="392" stroke="#8a95a3" stroke-width="2.5" marker-end="url(#bo-n)"/>
  <text x="650" y="372" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13">persist</text>

  <!-- ===== CAPACITY + RATE NOTES ===== -->
  <rect x="888" y="372" width="180" height="92" rx="10" fill="#101418" stroke="#3a414b" stroke-width="1.6"/>
  <text x="978" y="396" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="12.5" font-weight="bold">capacity</text>
  <text x="978" y="416" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="11.5">600 &#215; 1KB &#215; 100k</text>
  <text x="978" y="434" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="11.5">&#8776; 30GB</text>
  <text x="978" y="454" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="11.5">fits ONE node</text>

  <rect x="888" y="150" width="180" height="56" rx="10" fill="#1a1216" stroke="#ff8a8a" stroke-width="1.6"/>
  <text x="978" y="174" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="12.5" font-weight="bold">rate</text>
  <text x="978" y="194" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">1 ball / minute</text>
</svg>
