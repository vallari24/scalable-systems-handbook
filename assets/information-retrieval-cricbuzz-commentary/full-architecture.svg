<svg width="1180" height="760" viewBox="0 0 1180 760" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="fa-p" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ff8bd2"/></marker>
    <marker id="fa-g" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aff8a"/></marker>
    <marker id="fa-o" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ffd27f"/></marker>
    <marker id="fa-n" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9aa6b2"/></marker>
  </defs>

  <rect x="0" y="0" width="1180" height="760" fill="#111317"/>

  <text x="590" y="42" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="27" font-weight="bold">The full architecture &#8212; one ball, keyboard to a million phones</text>
  <text x="590" y="70" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="15">two flows meeting at the cache: a pink write trickle in, a green short-poll read out</text>

  <!-- ===== Text Commentary service (center) ===== -->
  <rect x="452" y="288" width="196" height="108" rx="11" fill="#14171c" stroke="#3a414b" stroke-width="2"/>
  <rect x="446" y="294" width="196" height="108" rx="11" fill="#161a20" stroke="#4a525d" stroke-width="2"/>
  <rect x="440" y="300" width="196" height="108" rx="11" fill="#1a1f26" stroke="#8a95a3" stroke-width="2.5"/>
  <text x="538" y="348" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="bold">Text Commentary</text>
  <text x="538" y="372" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13">service (API)</text>

  <!-- ===== Redis (top-right) ===== -->
  <path d="M912 138 a50 12 0 0 0 100 0 v56 a50 12 0 0 1 -100 0 z" fill="#16191e" stroke="#b79bff" stroke-width="2.5"/>
  <ellipse cx="962" cy="138" rx="50" ry="12" fill="#1b1f25" stroke="#b79bff" stroke-width="2.5"/>
  <text x="962" y="174" text-anchor="middle" fill="#e6dcff" font-family="sans-serif" font-size="15" font-weight="bold">Redis cache</text>
  <text x="962" y="222" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">for each live match,</text>
  <text x="962" y="240" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">latest commentary updated here</text>

  <!-- service -> redis (write, pink) -->
  <line x1="640" y1="312" x2="908" y2="190" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#fa-p)"/>
  <text x="760" y="248" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="12.5">upsert direct (instant freshness)</text>

  <!-- ===== Partitioned MySQL (right) ===== -->
  <path d="M906 372 a36 9 0 0 0 72 0 v42 a36 9 0 0 1 -72 0 z" fill="#16191e" stroke="#7c8694" stroke-width="2.4"/>
  <ellipse cx="942" cy="372" rx="36" ry="9" fill="#1b1f25" stroke="#7c8694" stroke-width="2.4"/>
  <path d="M952 356 a30 8 0 0 0 60 0 v38 a30 8 0 0 1 -60 0 z" fill="#16191e" stroke="#7c8694" stroke-width="2.4"/>
  <ellipse cx="982" cy="356" rx="30" ry="8" fill="#1b1f25" stroke="#7c8694" stroke-width="2.4"/>
  <path d="M958 404 a30 8 0 0 0 60 0 v38 a30 8 0 0 1 -60 0 z" fill="#16191e" stroke="#7c8694" stroke-width="2.4"/>
  <ellipse cx="988" cy="404" rx="30" ry="8" fill="#1b1f25" stroke="#7c8694" stroke-width="2.4"/>
  <text x="958" y="468" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="14" font-weight="bold">MySQL &#183; durable record</text>
  <text x="958" y="486" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">partition by match_id at scale</text>

  <!-- service -> mysql (write, pink) -->
  <line x1="640" y1="360" x2="902" y2="388" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#fa-p)"/>
  <text x="762" y="352" text-anchor="middle" fill="#ff8bd2" font-family="monospace" font-size="12">upsert key = match_id+over.ball</text>

  <!-- retry annotation -->
  <rect x="668" y="398" width="190" height="30" rx="8" fill="#1d1620" stroke="#ff8bd2" stroke-width="1.4"/>
  <text x="763" y="418" text-anchor="middle" fill="#ffd6ef" font-family="sans-serif" font-size="12">retry until BOTH confirm</text>

  <!-- ===== Cold storage (archival, orange) ===== -->
  <path d="M1066 470 a34 9 0 0 0 68 0 v40 a34 9 0 0 1 -68 0 z" fill="#16191e" stroke="#ffd27f" stroke-width="2.4"/>
  <ellipse cx="1100" cy="470" rx="34" ry="9" fill="#1b1f25" stroke="#ffd27f" stroke-width="2.4"/>
  <text x="1100" y="530" text-anchor="middle" fill="#ffd27f" font-family="sans-serif" font-size="12.5">cold storage</text>
  <text x="1100" y="547" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11">finished matches</text>
  <line x1="1012" y1="410" x2="1078" y2="458" stroke="#ffd27f" stroke-width="2.3" marker-end="url(#fa-o)"/>
  <text x="1064" y="430" text-anchor="middle" fill="#ffd27f" font-family="sans-serif" font-size="11.5">archive</text>

  <!-- ===== Viewers (left, read path) ===== -->
  <g stroke="#8aff8a" stroke-width="2.5" fill="none">
    <circle cx="86" cy="262" r="12"/><line x1="86" y1="274" x2="86" y2="308"/><line x1="66" y1="288" x2="106" y2="288"/><line x1="86" y1="308" x2="72" y2="330"/><line x1="86" y1="308" x2="100" y2="330"/>
    <circle cx="86" cy="356" r="12"/><line x1="86" y1="368" x2="86" y2="402"/><line x1="66" y1="382" x2="106" y2="382"/><line x1="86" y1="402" x2="72" y2="424"/><line x1="86" y1="402" x2="100" y2="424"/>
  </g>
  <text x="86" y="448" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13.5">Viewers</text>

  <!-- viewer -> service: get_latest (short poll) -->
  <line x1="110" y1="300" x2="436" y2="324" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#fa-g)"/>
  <text x="270" y="292" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="12.5">get_latest_commentary</text>
  <text x="270" y="310" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11.5">short poll ~10&#8211;30s &#8594; from Redis</text>

  <!-- viewer -> service: get_commentary paginated -->
  <line x1="110" y1="380" x2="436" y2="372" stroke="#9aa6b2" stroke-width="2.2" marker-end="url(#fa-n)"/>
  <text x="272" y="402" text-anchor="middle" fill="#9aa6b2" font-family="monospace" font-size="12">get_commentary (paginated)</text>
  <text x="272" y="419" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11">history &#8594; DB / replicas</text>

  <!-- service -> redis read (green, get_latest served) -->
  <line x1="650" y1="288" x2="912" y2="186" stroke="#8aff8a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#fa-g)"/>
  <text x="800" y="278" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="11.5">serve last ~15 balls</text>

  <!-- ===== Commentator (bottom-center, write path) ===== -->
  <g stroke="#ff8bd2" stroke-width="2.5" fill="none">
    <circle cx="468" cy="556" r="12"/><line x1="468" y1="568" x2="468" y2="602"/><line x1="448" y1="582" x2="488" y2="582"/><line x1="468" y1="602" x2="454" y2="624"/><line x1="468" y1="602" x2="482" y2="624"/>
  </g>
  <text x="468" y="648" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="13.5">Commentator</text>
  <text x="468" y="666" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11.5">Cricbuzz Control Room</text>
  <!-- commentator -> service (write up) -->
  <line x1="478" y1="544" x2="520" y2="412" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#fa-p)"/>

  <!-- ball cards with Save -->
  <g font-family="monospace" font-size="12.5">
    <text x="556" y="520" fill="#cbd5e1">10.5</text>
    <rect x="592" y="506" width="150" height="22" rx="4" fill="#1d1620" stroke="#ff8bd2" stroke-width="1.2"/>
    <rect x="752" y="506" width="52" height="22" rx="5" fill="#241a2a" stroke="#ff8bd2" stroke-width="1.3"/><text x="778" y="521" text-anchor="middle" fill="#ffd6ef" font-size="11">Save</text>
    <text x="556" y="552" fill="#cbd5e1">10.4</text>
    <rect x="592" y="538" width="150" height="22" rx="4" fill="#1d1620" stroke="#ff8bd2" stroke-width="1.2"/>
    <rect x="752" y="538" width="52" height="22" rx="5" fill="#241a2a" stroke="#ff8bd2" stroke-width="1.3"/><text x="778" y="553" text-anchor="middle" fill="#ffd6ef" font-size="11">Save</text>
    <text x="556" y="584" fill="#cbd5e1">10.3</text>
    <rect x="592" y="570" width="150" height="22" rx="4" fill="#1d1620" stroke="#ff8bd2" stroke-width="1.2"/>
    <rect x="752" y="570" width="52" height="22" rx="5" fill="#241a2a" stroke="#ff8bd2" stroke-width="1.3"/><text x="778" y="585" text-anchor="middle" fill="#ffd6ef" font-size="11">Save</text>
  </g>

  <!-- ===== bottom properties panel ===== -->
  <rect x="36" y="676" width="680" height="74" rx="10" fill="#0e1414" stroke="#3a414b" stroke-width="1.4"/>
  <g font-family="sans-serif" font-size="12.5">
    <text x="52" y="700" fill="#ffd27f" font-weight="bold">COST</text><text x="120" y="700" fill="#cbd5e1">short polling + archival</text>
    <text x="392" y="700" fill="#93c5fd" font-weight="bold">DURABILITY</text><text x="492" y="700" fill="#cbd5e1">retry-until-both</text>
    <text x="52" y="724" fill="#8aff8a" font-weight="bold">GOOD UX</text><text x="140" y="724" fill="#cbd5e1">direct Redis update + read latest from Redis</text>
    <text x="52" y="744" fill="#ffff99" font-weight="bold">CONSISTENCY</text><text x="158" y="744" fill="#cbd5e1">Redis updated on every write &#183; ball always upserted if exists</text>
  </g>

  <!-- ===== myths panel ===== -->
  <rect x="730" y="676" width="414" height="74" rx="10" fill="#1a0f10" stroke="#ff8a8a" stroke-width="1.5"/>
  <text x="746" y="699" fill="#ff8a8a" font-family="sans-serif" font-size="12.5" font-weight="bold">myths busted</text>
  <text x="746" y="721" fill="#ffd6d6" font-family="sans-serif" font-size="12">1) not a real-time use case  &#8594;  no WebSockets</text>
  <text x="746" y="741" fill="#ffd6d6" font-family="sans-serif" font-size="12">2) two writes &#8800; distributed txn  &#8594;  idempotent upsert + retry</text>

  <!-- ===== legend ===== -->
  <g font-family="sans-serif" font-size="11.5">
    <line x1="746" y1="652" x2="772" y2="652" stroke="#ff8bd2" stroke-width="3"/><text x="778" y="656" fill="#9aa6b2">write</text>
    <line x1="828" y1="652" x2="854" y2="652" stroke="#8aff8a" stroke-width="3"/><text x="860" y="656" fill="#9aa6b2">read</text>
    <line x1="906" y1="652" x2="932" y2="652" stroke="#ffd27f" stroke-width="3"/><text x="938" y="656" fill="#9aa6b2">archival</text>
    <line x1="1006" y1="652" x2="1032" y2="652" stroke="#9aa6b2" stroke-width="3"/><text x="1038" y="656" fill="#9aa6b2">cold read</text>
  </g>
</svg>
