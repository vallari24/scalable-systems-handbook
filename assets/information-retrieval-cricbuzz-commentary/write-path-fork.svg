<svg width="1080" height="720" viewBox="0 0 1080 720" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="cw-p" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ff8bd2"/></marker>
    <marker id="cw-g" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aff8a"/></marker>
    <marker id="cw-gr" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8a95a3"/></marker>
    <marker id="cw-y" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ffff99"/></marker>
    <marker id="cw-o" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ffd27f"/></marker>
  </defs>

  <rect x="0" y="0" width="1080" height="720" fill="#111317"/>

  <text x="540" y="40" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="27" font-weight="bold">Write access &#8212; two heavyweight traps, one simple fit</text>
  <text x="540" y="66" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="15.5">one ball must land in BOTH the cache and the durable DB &#8212; do we need a distributed transaction?</text>

  <!-- =================== TOP BAND: the problem =================== -->
  <rect x="30" y="80" width="1020" height="166" rx="12" fill="#15171c" stroke="#2c333d" stroke-width="1.5"/>

  <!-- commentator -->
  <circle cx="100" cy="128" r="13" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>
  <line x1="100" y1="141" x2="100" y2="172" stroke="#cbd5e1" stroke-width="2.5"/>
  <line x1="82" y1="155" x2="118" y2="155" stroke="#cbd5e1" stroke-width="2.5"/>
  <line x1="100" y1="172" x2="88" y2="192" stroke="#cbd5e1" stroke-width="2.5"/>
  <line x1="100" y1="172" x2="112" y2="192" stroke="#cbd5e1" stroke-width="2.5"/>
  <rect x="128" y="116" width="58" height="24" rx="5" fill="#1c151b" stroke="#ff8bd2" stroke-width="1.8"/>
  <text x="157" y="132" text-anchor="middle" fill="#ff8bd2" font-family="monospace" font-size="12">save 10.3</text>
  <text x="100" y="214" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">Commentator</text>
  <text x="100" y="232" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">control room</text>

  <!-- pink split arrows to two stores -->
  <line x1="190" y1="135" x2="330" y2="150" stroke="#ff8bd2" stroke-width="2.5"/>
  <line x1="330" y1="150" x2="412" y2="104" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#cw-p)"/>
  <line x1="330" y1="150" x2="412" y2="186" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#cw-p)"/>
  <text x="250" y="128" text-anchor="middle" fill="#ffd27f" font-family="monospace" font-size="13">ball 10.3 &#8594; BOTH</text>

  <!-- redis cache -->
  <path d="M417 98 a38 8 0 0 0 76 0 v34 a38 8 0 0 1 -76 0 z" fill="#16191e" stroke="#b79bff" stroke-width="2.5"/>
  <ellipse cx="455" cy="98" rx="38" ry="8" fill="#1b1f25" stroke="#b79bff" stroke-width="2.5"/>
  <text x="505" y="98" fill="#e6dcff" font-family="sans-serif" font-size="14.5" font-weight="bold">Redis cache</text>
  <text x="505" y="117" fill="#9aa6b2" font-family="sans-serif" font-size="12">viewers read this</text>

  <!-- mysql -->
  <path d="M417 180 a38 8 0 0 0 76 0 v34 a38 8 0 0 1 -76 0 z" fill="#16191e" stroke="#7c8694" stroke-width="2.5"/>
  <ellipse cx="455" cy="180" rx="38" ry="8" fill="#1b1f25" stroke="#7c8694" stroke-width="2.5"/>
  <text x="505" y="180" fill="#cbd5e1" font-family="sans-serif" font-size="14.5" font-weight="bold">MySQL</text>
  <text x="505" y="199" fill="#9aa6b2" font-family="sans-serif" font-size="12">durable record</text>

  <!-- red questions -->
  <rect x="648" y="92" width="388" height="142" rx="10" fill="#1c1416" stroke="#ff8a8a" stroke-width="1.8"/>
  <text x="666" y="116" fill="#ff8a8a" font-family="sans-serif" font-size="14.5" font-weight="bold">the trap of two writes:</text>
  <text x="666" y="142" fill="#f0c9c9" font-family="sans-serif" font-size="13.5">&#183; which store do you write first?</text>
  <text x="666" y="166" fill="#f0c9c9" font-family="sans-serif" font-size="13.5">&#183; one succeeds, the other fails &#8212; now what?</text>
  <text x="666" y="190" fill="#f0c9c9" font-family="sans-serif" font-size="13.5">&#183; retry how many times? what backoff?</text>
  <text x="666" y="214" fill="#f0c9c9" font-family="sans-serif" font-size="13.5">&#183; how does the commentator even know it half-failed?</text>

  <!-- =================== MIDDLE BAND: two rejected options =================== -->
  <line x1="540" y1="266" x2="540" y2="476" stroke="#2c333d" stroke-width="1.5"/>

  <!-- Option A: queue (grey, dimmed) -->
  <text x="60" y="290" fill="#9aa6b2" font-family="sans-serif" font-size="16" font-weight="bold">Option A &#183; one queue, both stores consume</text>
  <!-- grey X -->
  <line x1="486" y1="280" x2="508" y2="302" stroke="#8a95a3" stroke-width="3"/>
  <line x1="508" y1="280" x2="486" y2="302" stroke="#8a95a3" stroke-width="3"/>

  <rect x="64" y="306" width="86" height="36" rx="7" fill="#191c21" stroke="#6b7280" stroke-width="2"/>
  <text x="107" y="329" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">service</text>
  <rect x="196" y="306" width="104" height="36" rx="7" fill="#191c21" stroke="#6b7280" stroke-width="2"/>
  <line x1="224" y1="306" x2="224" y2="342" stroke="#3a414b" stroke-width="1.2"/>
  <line x1="252" y1="306" x2="252" y2="342" stroke="#3a414b" stroke-width="1.2"/>
  <line x1="272" y1="306" x2="272" y2="342" stroke="#3a414b" stroke-width="1.2"/>
  <text x="248" y="362" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">durable queue</text>
  <line x1="150" y1="324" x2="194" y2="324" stroke="#8a95a3" stroke-width="2.2" marker-end="url(#cw-gr)"/>

  <line x1="300" y1="318" x2="384" y2="306" stroke="#8a95a3" stroke-width="2.2" marker-end="url(#cw-gr)"/>
  <line x1="300" y1="330" x2="384" y2="344" stroke="#8a95a3" stroke-width="2.2" marker-end="url(#cw-gr)"/>
  <text x="400" y="312" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">&#8594; cache</text>
  <text x="400" y="349" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">&#8594; DB</text>

  <text x="64" y="392" fill="#c7cdd6" font-family="sans-serif" font-size="13.5">A legit pattern &#8212; but it adds a whole queue plus</text>
  <text x="64" y="412" fill="#c7cdd6" font-family="sans-serif" font-size="13.5">an async lag, just to fan out <tspan fill="#ffd27f" font-weight="bold">2 writes a minute</tspan>.</text>
  <text x="64" y="432" fill="#c7cdd6" font-family="sans-serif" font-size="13.5">Machinery in search of a problem here.</text>

  <!-- Option B: 2PC (red X) -->
  <text x="565" y="290" fill="#ffff99" font-family="sans-serif" font-size="16" font-weight="bold">Option B &#183; distributed transaction (2PC)</text>
  <!-- red X -->
  <line x1="996" y1="280" x2="1020" y2="304" stroke="#ff8a8a" stroke-width="3.5"/>
  <line x1="1020" y1="280" x2="996" y2="304" stroke="#ff8a8a" stroke-width="3.5"/>

  <rect x="572" y="306" width="128" height="40" rx="7" fill="#1a1c14" stroke="#ffff99" stroke-width="2"/>
  <text x="636" y="331" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="13.5" font-weight="bold">Coordinator</text>
  <!-- participants -->
  <rect x="892" y="300" width="86" height="22" rx="5" fill="#191c21" stroke="#7c8694" stroke-width="1.8"/>
  <text x="935" y="316" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">DB</text>
  <rect x="892" y="332" width="86" height="22" rx="5" fill="#191c21" stroke="#b79bff" stroke-width="1.8"/>
  <text x="935" y="348" text-anchor="middle" fill="#e6dcff" font-family="sans-serif" font-size="11.5">cache</text>
  <!-- phases -->
  <line x1="700" y1="318" x2="888" y2="310" stroke="#ffff99" stroke-width="2" marker-end="url(#cw-y)"/>
  <line x1="700" y1="332" x2="888" y2="342" stroke="#ffff99" stroke-width="2" marker-end="url(#cw-y)"/>
  <text x="724" y="300" fill="#ffff99" font-family="sans-serif" font-size="12"><tspan font-weight="bold">1 PREPARE</tspan> &#8212; can you commit?</text>
  <text x="724" y="372" fill="#ffd27f" font-family="sans-serif" font-size="12"><tspan font-weight="bold">2 COMMIT</tspan> / ABORT &#8212; all-or-nothing</text>

  <text x="565" y="406" fill="#f0c9c9" font-family="sans-serif" font-size="13.5">Atomic across both stores. Use it only when a</text>
  <text x="565" y="426" fill="#f0c9c9" font-family="sans-serif" font-size="13.5">partial write is <tspan fill="#ff8a8a" font-weight="bold">catastrophic</tspan> &#8212; money, inventory.</text>
  <text x="565" y="446" fill="#f0c9c9" font-family="sans-serif" font-size="13.5">Here a &#189;-sec cache&#8596;DB skew is harmless, so the</text>
  <text x="565" y="466" fill="#f0c9c9" font-family="sans-serif" font-size="13.5">coordinator + cross-network locks + blocking are over-engineering.</text>

  <!-- =================== BOTTOM BAND: chosen =================== -->
  <rect x="30" y="492" width="1020" height="158" rx="12" fill="#101a12" stroke="#8aff8a" stroke-width="1.8"/>
  <text x="60" y="518" fill="#8aff8a" font-family="sans-serif" font-size="17" font-weight="bold">&#10003; The fit &#8212; cache-first write, idempotent upsert, retry until both</text>

  <!-- service stacked -->
  <rect x="118" y="546" width="150" height="64" rx="9" fill="#14171c" stroke="#3a414b" stroke-width="2"/>
  <rect x="112" y="552" width="150" height="64" rx="9" fill="#1a1f26" stroke="#8aff8a" stroke-width="2.3"/>
  <text x="187" y="580" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Text-commentary</text>
  <text x="187" y="598" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">service</text>
  <!-- retry loop -->
  <path d="M112 560 q-34 8 -34 28 q0 20 34 28" fill="none" stroke="#ffd27f" stroke-width="2.2" marker-end="url(#cw-o)"/>
  <text x="40" y="592" text-anchor="middle" fill="#ffd27f" font-family="sans-serif" font-size="11">retry</text>

  <!-- redis mini -->
  <path d="M572 540 a34 7 0 0 0 68 0 v28 a34 7 0 0 1 -68 0 z" fill="#16191e" stroke="#b79bff" stroke-width="2.3"/>
  <ellipse cx="606" cy="540" rx="34" ry="7" fill="#1b1f25" stroke="#b79bff" stroke-width="2.3"/>
  <text x="650" y="548" fill="#e6dcff" font-family="sans-serif" font-size="13" font-weight="bold">Redis</text>
  <!-- mysql mini -->
  <path d="M572 596 a34 7 0 0 0 68 0 v28 a34 7 0 0 1 -68 0 z" fill="#16191e" stroke="#7c8694" stroke-width="2.3"/>
  <ellipse cx="606" cy="596" rx="34" ry="7" fill="#1b1f25" stroke="#7c8694" stroke-width="2.3"/>
  <text x="650" y="604" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="bold">MySQL</text>

  <line x1="262" y1="566" x2="568" y2="552" stroke="#8aff8a" stroke-width="2.4" marker-end="url(#cw-g)"/>
  <line x1="262" y1="592" x2="568" y2="608" stroke="#8aff8a" stroke-width="2.4" marker-end="url(#cw-g)"/>
  <text x="300" y="548" fill="#8aff8a" font-family="sans-serif" font-size="12.5">update directly</text>
  <text x="300" y="628" fill="#8aff8a" font-family="sans-serif" font-size="12.5">upsert by ball-id</text>

  <text x="724" y="556" fill="#e8ffe8" font-family="sans-serif" font-size="13.5">Both writes are <tspan fill="#8aff8a" font-weight="bold">idempotent upserts</tspan> keyed by</text>
  <text x="724" y="576" fill="#e8ffe8" font-family="sans-serif" font-size="13.5">ball-id &#8212; always updated if it exists, never</text>
  <text x="724" y="596" fill="#e8ffe8" font-family="sans-serif" font-size="13.5">duplicated &#8212; so retrying is always safe.</text>
  <text x="724" y="624" fill="#ffd27f" font-family="sans-serif" font-size="13.5" font-weight="bold">Save isn't "done" until BOTH confirm.</text>

  <!-- caption -->
  <rect x="30" y="664" width="1020" height="44" rx="11" fill="#101a12" stroke="#8aff8a" stroke-width="1.6"/>
  <text x="540" y="692" text-anchor="middle" fill="#e8ffe8" font-family="sans-serif" font-size="15"><tspan fill="#8aff8a" font-weight="bold">&#9733;</tspan> idempotent upsert + retry replaces the distributed transaction &#8212; single writer, low rate, no shared invariant.</text>
</svg>
