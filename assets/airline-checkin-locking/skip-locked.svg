<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
  <title id="title">Skip locked</title>
  <desc id="desc">Transaction 2 locks free seats 3 and 4, skips seat 6 because it is locked, and returns seats 3 and 4.</desc>
  <defs><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#78f078"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a7a"/></marker><style>.bg{fill:#171717}.rule{stroke:#333;stroke-width:2}.box{fill:#202020;stroke:#f5f5f5;stroke-width:2;rx:8}.locked{fill:#202020;stroke:#ff8a8a;stroke-width:3;rx:8}.title{fill:#fff7a8;font:34px system-ui,sans-serif;font-weight:700}.text{fill:#f5f5f5;font:24px system-ui,sans-serif}.small{fill:#f5f5f5;font:20px system-ui,sans-serif}.green{fill:#8aff8a}.pink{fill:#ff8a8a}.gl{stroke:#78f078;stroke-width:4;fill:none;marker-end:url(#g)}.rl{stroke:#ff7a7a;stroke-width:4;stroke-dasharray:9 7;fill:none;marker-end:url(#r)}</style></defs>
  <rect class="bg" width="1080" height="520"/><g class="rule"><line x1="0" y1="70" x2="1080" y2="70"/><line x1="0" y1="140" x2="1080" y2="140"/><line x1="0" y1="210" x2="1080" y2="210"/><line x1="0" y1="280" x2="1080" y2="280"/><line x1="0" y1="350" x2="1080" y2="350"/><line x1="0" y1="420" x2="1080" y2="420"/><line x1="0" y1="490" x2="1080" y2="490"/></g>
  <text class="title" x="55" y="55">SKIP LOCKED</text><text class="text" x="270" y="115">locked rows are removed from the result set</text>
  <rect class="box" x="85" y="165" width="135" height="60"/><rect class="box" x="85" y="250" width="135" height="60"/><rect class="locked" x="85" y="335" width="135" height="88"/><text class="text" x="152" y="204" text-anchor="middle">3</text><text class="text" x="152" y="289" text-anchor="middle">4</text><text class="text" x="152" y="370" text-anchor="middle">6</text><text class="small pink" x="152" y="400" text-anchor="middle">locked by T1</text>
  <rect class="box" x="440" y="210" width="300" height="110"/><text class="text" x="590" y="252" text-anchor="middle">Transaction 2</text><text class="small green" x="590" y="288" text-anchor="middle">FOR UPDATE SKIP LOCKED</text>
  <rect class="box" x="850" y="215" width="165" height="100"/><text class="text" x="932" y="254" text-anchor="middle">result set</text><text class="text" x="932" y="288" text-anchor="middle">3, 4</text>
  <rect class="box" x="440" y="365" width="300" height="62"/><text class="text pink" x="590" y="405" text-anchor="middle">seat 6 skipped</text>
  <path class="gl" d="M220 195 C310 195, 365 245, 440 248"/><path class="gl" d="M220 280 C315 280, 365 278, 440 278"/><path class="gl" d="M740 266 H850"/><path class="rl" d="M220 378 C320 378, 365 396, 440 396"/>
</svg>
