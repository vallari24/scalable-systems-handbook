<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="560" viewBox="0 0 1160 560" role="img" aria-labelledby="title desc">
  <title id="title">Lost update without locking</title>
  <desc id="desc">Two transactions both read one available seat and both write reserved, causing a double booking.</desc>
  <defs><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a7a"/></marker><style>.bg{fill:#171717}.rule{stroke:#333;stroke-width:2}.box{fill:#202020;stroke:#f5f5f5;stroke-width:2;rx:10}.bad{fill:#2a1818;stroke:#ff8a8a;stroke-width:3;rx:10}.title{fill:#fff7a8;font:34px system-ui,sans-serif;font-weight:700}.text{fill:#f5f5f5;font:24px system-ui,sans-serif}.small{fill:#cfcfcf;font:20px system-ui,sans-serif}.pink{fill:#ff8a8a}.green{fill:#8aff8a}.arrow{stroke:#ff7a7a;stroke-width:4;fill:none;marker-end:url(#r)}</style></defs>
  <rect class="bg" width="1160" height="560"/>
  <g class="rule"><line x1="0" y1="80" x2="1160" y2="80"/><line x1="0" y1="160" x2="1160" y2="160"/><line x1="0" y1="240" x2="1160" y2="240"/><line x1="0" y1="320" x2="1160" y2="320"/><line x1="0" y1="400" x2="1160" y2="400"/><line x1="0" y1="480" x2="1160" y2="480"/></g>
  <text class="title" x="55" y="55">Without a lock: both transactions see the same old state</text>
  <rect class="box" x="455" y="105" width="250" height="90"/><text class="text" x="580" y="142" text-anchor="middle">Seat 6A</text><text class="text green" x="580" y="174" text-anchor="middle">available = 1</text>
  <rect class="box" x="110" y="255" width="300" height="125"/><text class="text" x="260" y="295" text-anchor="middle">Transaction 1</text><text class="small" x="260" y="330" text-anchor="middle">reads 1, writes reserved</text><text class="small pink" x="260" y="358" text-anchor="middle">Passenger A gets 6A</text>
  <rect class="box" x="750" y="255" width="300" height="125"/><text class="text" x="900" y="295" text-anchor="middle">Transaction 2</text><text class="small" x="900" y="330" text-anchor="middle">reads 1, writes reserved</text><text class="small pink" x="900" y="358" text-anchor="middle">Passenger B gets 6A</text>
  <path class="arrow" d="M520 195 C420 230, 350 245, 300 255"/><path class="arrow" d="M640 195 C740 230, 810 245, 860 255"/>
  <rect class="bad" x="375" y="430" width="410" height="80"/><text class="text pink" x="580" y="464" text-anchor="middle">bad result</text><text class="small" x="580" y="494" text-anchor="middle">two passengers believe they own seat 6A</text>
</svg>
