<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="450" viewBox="0 0 1040 450" role="img" aria-labelledby="title desc">
  <title id="title">Nowait</title>
  <desc id="desc">Transaction 2 tries to lock seat 6 with NOWAIT and gets an immediate error because transaction 1 holds the lock.</desc>
  <defs><marker id="w" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#f5f5f5"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ff7a7a"/></marker><style>.bg{fill:#171717}.rule{stroke:#333;stroke-width:2}.box{fill:#202020;stroke:#f5f5f5;stroke-width:2;rx:8}.life{stroke:#f5f5f5;stroke-width:2}.arrow{stroke:#f5f5f5;stroke-width:3;fill:none;marker-end:url(#w)}.err{stroke:#ff7a7a;stroke-width:3;stroke-dasharray:8 6;fill:none;marker-end:url(#r)}.title{fill:#fff7a8;font:34px system-ui,sans-serif;font-weight:700}.text{fill:#f5f5f5;font:24px system-ui,sans-serif}.pink{fill:#ff8a8a}.green{fill:#8aff8a}</style></defs>
  <rect class="bg" width="1040" height="450"/><g class="rule"><line x1="0" y1="70" x2="1040" y2="70"/><line x1="0" y1="140" x2="1040" y2="140"/><line x1="0" y1="210" x2="1040" y2="210"/><line x1="0" y1="280" x2="1040" y2="280"/><line x1="0" y1="350" x2="1040" y2="350"/><line x1="0" y1="420" x2="1040" y2="420"/></g>
  <text class="title" x="55" y="55">NOWAIT</text>
  <rect class="box" x="70" y="100" width="220" height="62"/><rect class="box" x="410" y="100" width="220" height="62"/><rect class="box" x="750" y="100" width="220" height="62"/>
  <text class="text" x="180" y="139" text-anchor="middle">Transaction 1</text><text class="text" x="520" y="139" text-anchor="middle">Seat 6</text><text class="text" x="860" y="139" text-anchor="middle">Transaction 2</text>
  <line class="life" x1="180" y1="162" x2="180" y2="390"/><line class="life" x1="520" y1="162" x2="520" y2="390"/><line class="life" x1="860" y1="162" x2="860" y2="390"/>
  <path class="arrow" d="M180 220 H508"/><text class="text green" x="344" y="207" text-anchor="middle">holds exclusive lock</text>
  <path class="arrow" d="M860 282 H532"/><text class="text" x="696" y="268" text-anchor="middle">FOR UPDATE NOWAIT</text>
  <path class="err" d="M520 345 H848"/><text class="text pink" x="684" y="332" text-anchor="middle">error immediately</text>
</svg>
