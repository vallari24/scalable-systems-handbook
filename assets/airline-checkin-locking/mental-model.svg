<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="430" viewBox="0 0 1160 430" role="img" aria-labelledby="title desc">
  <title id="title">Three mental models</title>
  <desc id="desc">Transaction wraps the operation, index finds the row, and lock protects the row.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#f5f5f5"/></marker><style>.bg{fill:#171717}.rule{stroke:#333;stroke-width:2}.card{fill:#202020;stroke:#f5f5f5;stroke-width:2;rx:12}.title{fill:#fff7a8;font:34px system-ui,sans-serif;font-weight:700}.head{fill:#8aff8a;font:28px system-ui,sans-serif;font-weight:700}.text{fill:#f5f5f5;font:22px system-ui,sans-serif}.muted{fill:#cfcfcf;font:20px system-ui,sans-serif}.pink{fill:#ff8a8a}.blue{fill:#b7b7ff}.arrow{stroke:#f5f5f5;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect class="bg" width="1160" height="430"/>
  <g class="rule"><line x1="0" y1="80" x2="1160" y2="80"/><line x1="0" y1="160" x2="1160" y2="160"/><line x1="0" y1="240" x2="1160" y2="240"/><line x1="0" y1="320" x2="1160" y2="320"/><line x1="0" y1="400" x2="1160" y2="400"/></g>
  <text class="title" x="55" y="55">Seat check-in: three things to remember</text>
  <rect class="card" x="65" y="130" width="285" height="185"/><text class="head" x="208" y="178" text-anchor="middle">Transaction</text><text class="text" x="208" y="222" text-anchor="middle">wraps the work</text><text class="muted" x="208" y="260" text-anchor="middle">reserve seat + update</text><text class="muted" x="208" y="290" text-anchor="middle">booking together</text>
  <rect class="card" x="438" y="130" width="285" height="185"/><text class="head blue" x="580" y="178" text-anchor="middle">Index</text><text class="text" x="580" y="222" text-anchor="middle">finds the row fast</text><text class="muted" x="580" y="260" text-anchor="middle">(flight_id, seat)</text><text class="muted" x="580" y="290" text-anchor="middle">points to 6A</text>
  <rect class="card" x="811" y="130" width="285" height="185"/><text class="head pink" x="954" y="178" text-anchor="middle">Lock</text><text class="text" x="954" y="222" text-anchor="middle">guards the row</text><text class="muted" x="954" y="260" text-anchor="middle">only one writer</text><text class="muted" x="954" y="290" text-anchor="middle">can own 6A</text>
  <path class="arrow" d="M350 222 H430"/><path class="arrow" d="M723 222 H803"/>
</svg>
