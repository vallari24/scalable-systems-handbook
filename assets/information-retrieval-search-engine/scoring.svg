<svg width="1180" height="780" viewBox="0 0 1180 780" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="sc-y" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ffff99"/></marker>
    <marker id="sc-g" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aff8a"/></marker>
    <marker id="sc-b" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#93c5fd"/></marker>
  </defs>
  <rect x="0" y="0" width="1180" height="780" fill="#111317"/>

  <text x="590" y="40" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="26" font-weight="bold">Ranking: turning a match into a score</text>
  <text x="590" y="66" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="15">build up from TF-IDF &#8594; cosine &#8594; Jaccard's limits &#8594; BM25, the production default</text>

  <!-- ===== PANEL 1: TF-IDF ===== -->
  <rect x="36" y="88" width="552" height="300" rx="12" fill="#14171c" stroke="#3a414b" stroke-width="1.8"/>
  <text x="60" y="118" fill="#ffff99" font-family="sans-serif" font-size="18" font-weight="bold">1 &#183; TF-IDF</text>
  <rect x="60" y="132" width="232" height="52" rx="8" fill="#16140f" stroke="#ffd27f" stroke-width="1.5"/>
  <text x="176" y="153" text-anchor="middle" fill="#ffd27f" font-family="sans-serif" font-size="12.5" font-weight="bold">TF: frequent HERE</text>
  <text x="176" y="173" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="13">1 + log&#8321;&#8320; tf</text>
  <rect x="304" y="132" width="262" height="52" rx="8" fill="#101521" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="435" y="153" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="12.5" font-weight="bold">IDF: rare EVERYWHERE</text>
  <text x="435" y="173" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="13">log&#8321;&#8320;(N / df)</text>
  <text x="313" y="172" fill="#ffff99" font-family="sans-serif" font-size="20" font-weight="bold">&#215;</text>

  <text x="60" y="212" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">worked: term "network", N = 4 docs, df = 3 &#8594; idf = 0.1249</text>
  <g font-family="monospace" font-size="13">
    <rect x="60" y="224" width="506" height="30" rx="5" fill="#0f130f" stroke="#3a414b"/>
    <text x="74" y="244" fill="#cbd5e1">d1: tf=3 &#8594; (1+log 3)=1.4771 &#8594; <tspan fill="#8aff8a">tf-idf = 0.1845</tspan></text>
    <rect x="60" y="258" width="506" height="30" rx="5" fill="#0f130f" stroke="#3a414b"/>
    <text x="74" y="278" fill="#cbd5e1">d4: tf=7 &#8594; (1+log 7)=1.8451 &#8594; <tspan fill="#8aff8a">tf-idf = 0.2305</tspan></text>
    <rect x="60" y="292" width="506" height="30" rx="5" fill="#0f130f" stroke="#3a414b"/>
    <text x="74" y="312" fill="#cbd5e1">d3: tf=1 &#8594; (1+log 1)=1.0000 &#8594; <tspan fill="#8aff8a">tf-idf = 0.1249</tspan></text>
  </g>
  <rect x="60" y="332" width="506" height="44" rx="8" fill="#1a1a12" stroke="#ffff99" stroke-width="1.5"/>
  <text x="313" y="360" text-anchor="middle" fill="#e8e8c0" font-family="sans-serif" font-size="13">d4 has <tspan fill="#ffd27f" font-weight="bold">2.3&#215;</tspan> the raw count of d1 but only <tspan fill="#ffd27f" font-weight="bold">~25% more</tspan> weight &#8212; log damping</text>

  <!-- ===== PANEL 2: VECTOR SPACE + COSINE ===== -->
  <rect x="600" y="88" width="544" height="300" rx="12" fill="#14171c" stroke="#3a414b" stroke-width="1.8"/>
  <text x="624" y="118" fill="#ffff99" font-family="sans-serif" font-size="18" font-weight="bold">2 &#183; Vector space + cosine</text>
  <!-- axes -->
  <line x1="650" y1="350" x2="650" y2="150" stroke="#5a6470" stroke-width="1.5"/>
  <line x1="650" y1="350" x2="860" y2="350" stroke="#5a6470" stroke-width="1.5"/>
  <text x="650" y="368" fill="#9aa6b2" font-family="sans-serif" font-size="11">term space</text>
  <!-- query vector -->
  <line x1="650" y1="350" x2="800" y2="200" stroke="#8aff8a" stroke-width="2.6" marker-end="url(#sc-g)"/>
  <text x="806" y="198" fill="#8aff8a" font-family="monospace" font-size="13">q=(1,1,0)</text>
  <!-- doc vector -->
  <line x1="650" y1="350" x2="840" y2="280" stroke="#93c5fd" stroke-width="2.6" marker-end="url(#sc-b)"/>
  <text x="846" y="284" fill="#93c5fd" font-family="monospace" font-size="13">d=(3,0,4)</text>
  <!-- angle -->
  <path d="M712 318 A 70 70 0 0 0 728 290" fill="none" stroke="#ffff99" stroke-width="2"/>
  <text x="726" y="322" fill="#ffff99" font-family="sans-serif" font-size="14" font-weight="bold">&#952;</text>

  <text x="905" y="170" fill="#cbd5e1" font-family="monospace" font-size="13">cos = q&#183;d / (|q||d|)</text>
  <text x="905" y="200" fill="#9aa6b2" font-family="monospace" font-size="12.5">q&#183;d = 3</text>
  <text x="905" y="220" fill="#9aa6b2" font-family="monospace" font-size="12.5">|q| = &#8730;2 = 1.4142</text>
  <text x="905" y="240" fill="#9aa6b2" font-family="monospace" font-size="12.5">|d| = &#8730;25 = 5</text>
  <rect x="905" y="254" width="216" height="34" rx="6" fill="#101a12" stroke="#8aff8a" stroke-width="1.5"/>
  <text x="1013" y="277" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="14" font-weight="bold">cos = 0.4243</text>
  <rect x="624" y="332" width="498" height="44" rx="8" fill="#101a12" stroke="#8aff8a" stroke-width="1.5"/>
  <text x="873" y="360" text-anchor="middle" fill="#e8ffe8" font-family="sans-serif" font-size="12.5">cosine compares <tspan fill="#8aff8a" font-weight="bold">DIRECTION, not size</tspan> = length normalization &#8212; a long doc can't win by length</text>

  <!-- ===== PANEL 3: JACCARD ===== -->
  <rect x="36" y="404" width="552" height="300" rx="12" fill="#14171c" stroke="#3a414b" stroke-width="1.8"/>
  <text x="60" y="434" fill="#ffff99" font-family="sans-serif" font-size="18" font-weight="bold">3 &#183; Jaccard (set overlap)</text>
  <text x="60" y="462" fill="#cbd5e1" font-family="monospace" font-size="14">J(A,B) = |A &#8745; B| / |A &#8746; B|</text>
  <!-- two circles -->
  <circle cx="200" cy="560" r="78" fill="#11240f" fill-opacity="0.45" stroke="#8aff8a" stroke-width="1.8"/>
  <circle cx="300" cy="560" r="78" fill="#101521" fill-opacity="0.45" stroke="#93c5fd" stroke-width="1.8"/>
  <text x="150" y="520" fill="#8aff8a" font-family="sans-serif" font-size="11">query A</text>
  <text x="320" y="520" fill="#93c5fd" font-family="sans-serif" font-size="11">doc B</text>
  <text x="150" y="565" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">fast</text>
  <text x="250" y="552" text-anchor="middle" fill="#e8ffe8" font-family="sans-serif" font-size="11">scalable</text>
  <text x="250" y="572" text-anchor="middle" fill="#e8ffe8" font-family="sans-serif" font-size="11">search</text>
  <text x="350" y="552" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">engine</text>
  <text x="350" y="572" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">index</text>
  <rect x="158" y="630" width="184" height="34" rx="6" fill="#101a12" stroke="#8aff8a" stroke-width="1.5"/>
  <text x="250" y="653" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="14" font-weight="bold">J = 2/5 = 0.4</text>
  <!-- blind spots -->
  <rect x="368" y="470" width="200" height="218" rx="9" fill="#1b1416" stroke="#ff8a8a" stroke-width="1.6"/>
  <text x="468" y="494" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="13.5" font-weight="bold">3 blind spots</text>
  <text x="384" y="524" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">&#10007; ignores term freq</text>
  <text x="384" y="552" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">&#10007; ignores IDF</text>
  <text x="400" y="572" fill="#9aa6b2" font-family="sans-serif" font-size="11">(stop-words inflate it)</text>
  <text x="384" y="600" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">&#10007; length-sensitive</text>
  <text x="384" y="648" fill="#ffd27f" font-family="sans-serif" font-size="12" font-style="italic">great for dedup,</text>
  <text x="384" y="668" fill="#ffd27f" font-family="sans-serif" font-size="12" font-style="italic">weak for ranking</text>

  <!-- ===== PANEL 4: BM25 ===== -->
  <rect x="600" y="404" width="544" height="300" rx="12" fill="#161122" stroke="#b79bff" stroke-width="2"/>
  <text x="624" y="434" fill="#b79bff" font-family="sans-serif" font-size="18" font-weight="bold">4 &#183; BM25</text>
  <text x="1118" y="430" text-anchor="end" fill="#8aff8a" font-family="sans-serif" font-size="12.5" font-weight="bold">the production default</text>
  <rect x="624" y="446" width="498" height="40" rx="7" fill="#0f0d16" stroke="#5a4a78" stroke-width="1.4"/>
  <text x="636" y="471" fill="#cbd5e1" font-family="monospace" font-size="12">&#931; idf &#183; f(k&#8321;+1) / (f + k&#8321;(1 &#8722; b + b&#183;|d|/avgdl))</text>
  <text x="636" y="508" fill="#ffd27f" font-family="sans-serif" font-size="12"><tspan font-weight="bold">k&#8321;</tspan> = TF saturation (ceiling)</text>
  <text x="880" y="508" fill="#93c5fd" font-family="sans-serif" font-size="12"><tspan font-weight="bold">b</tspan> = length normalization</text>
  <!-- saturation table -->
  <text x="624" y="538" fill="#9aa6b2" font-family="sans-serif" font-size="12">tf-factor 2.2f/(f+1.2), k&#8321;=1.2 &#8594; ceiling 2.2:</text>
  <g font-family="monospace" font-size="13">
    <rect x="624" y="548" width="116" height="56" rx="6" fill="#0f0d16" stroke="#5a4a78"/><text x="682" y="572" text-anchor="middle" fill="#cbd5e1">f=1</text><text x="682" y="594" text-anchor="middle" fill="#8aff8a">1.00</text>
    <rect x="748" y="548" width="116" height="56" rx="6" fill="#0f0d16" stroke="#5a4a78"/><text x="806" y="572" text-anchor="middle" fill="#cbd5e1">f=2</text><text x="806" y="594" text-anchor="middle" fill="#8aff8a">1.375</text>
    <rect x="872" y="548" width="116" height="56" rx="6" fill="#0f0d16" stroke="#5a4a78"/><text x="930" y="572" text-anchor="middle" fill="#cbd5e1">f=5</text><text x="930" y="594" text-anchor="middle" fill="#8aff8a">1.774</text>
    <rect x="996" y="548" width="126" height="56" rx="6" fill="#15140f" stroke="#ffff99"/><text x="1059" y="572" text-anchor="middle" fill="#cbd5e1">f=20</text><text x="1059" y="594" text-anchor="middle" fill="#ffff99">2.075&#8599;</text>
  </g>
  <rect x="624" y="618" width="498" height="66" rx="8" fill="#101a12" stroke="#8aff8a" stroke-width="1.5"/>
  <text x="873" y="644" text-anchor="middle" fill="#e8ffe8" font-family="sans-serif" font-size="12.5">1&#8594;2 occurrences adds 0.375; 5&#8594;20 (15 more!) adds only ~0.30</text>
  <text x="873" y="668" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13" font-weight="bold">keeps TF-IDF's instincts, fixes its flaws inside the formula</text>

  <!-- bottom strip -->
  <rect x="36" y="720" width="1108" height="44" rx="11" fill="#1a1a12" stroke="#ffff99" stroke-width="1.6"/>
  <text x="590" y="748" text-anchor="middle" fill="#e8e8c0" font-family="sans-serif" font-size="15"><tspan fill="#ffff99" font-weight="bold">&#9733;</tspan>  reward terms frequent here but rare everywhere, normalize for length, saturate term frequency &#8212; that's modern ranking</text>
</svg>
