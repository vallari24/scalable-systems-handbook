<svg width="1100" height="660" viewBox="0 0 1100 660" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ni-g" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aff8a"/></marker>
    <marker id="ni-r" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ff8a8a"/></marker>
    <marker id="ni-b" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#93c5fd"/></marker>
    <marker id="ni-y" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ffff99"/></marker>
  </defs>
  <rect x="0" y="0" width="1100" height="660" fill="#111317"/>
  <text x="550" y="42" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="26" font-weight="bold">From a naive scan to the inverted index</text>

  <!-- ===== PANEL 1: information need ===== -->
  <rect x="28" y="68" width="332" height="498" rx="12" fill="#14171c" stroke="#3a414b" stroke-width="1.6"/>
  <text x="194" y="98" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="17" font-weight="bold">1 &#183; The information need</text>

  <!-- user -->
  <circle cx="194" cy="138" r="14" fill="none" stroke="#cbd5e1" stroke-width="2.4"/>
  <line x1="194" y1="152" x2="194" y2="190" stroke="#cbd5e1" stroke-width="2.4"/>
  <line x1="172" y1="168" x2="216" y2="168" stroke="#cbd5e1" stroke-width="2.4"/>
  <line x1="194" y1="190" x2="180" y2="214" stroke="#cbd5e1" stroke-width="2.4"/>
  <line x1="194" y1="190" x2="208" y2="214" stroke="#cbd5e1" stroke-width="2.4"/>
  <text x="194" y="234" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">user</text>

  <rect x="52" y="248" width="284" height="34" rx="8" fill="#1a1f26" stroke="#93c5fd" stroke-width="1.6"/>
  <text x="194" y="270" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="15">q = "fast scalable search"</text>

  <line x1="194" y1="286" x2="194" y2="312" stroke="#93c5fd" stroke-width="2.2" marker-end="url(#ni-b)"/>

  <!-- corpus docs -->
  <g>
    <rect x="86" y="320" width="48" height="62" rx="4" fill="#16191e" stroke="#7c8694" stroke-width="1.6"/>
    <line x1="95" y1="334" x2="125" y2="334" stroke="#5b6470" stroke-width="2"/>
    <line x1="95" y1="346" x2="125" y2="346" stroke="#5b6470" stroke-width="2"/>
    <line x1="95" y1="358" x2="118" y2="358" stroke="#5b6470" stroke-width="2"/>
    <rect x="170" y="320" width="48" height="62" rx="4" fill="#16191e" stroke="#7c8694" stroke-width="1.6"/>
    <line x1="179" y1="334" x2="209" y2="334" stroke="#5b6470" stroke-width="2"/>
    <line x1="179" y1="346" x2="209" y2="346" stroke="#5b6470" stroke-width="2"/>
    <line x1="179" y1="358" x2="202" y2="358" stroke="#5b6470" stroke-width="2"/>
    <rect x="254" y="320" width="48" height="62" rx="4" fill="#16191e" stroke="#7c8694" stroke-width="1.6"/>
    <line x1="263" y1="334" x2="293" y2="334" stroke="#5b6470" stroke-width="2"/>
    <line x1="263" y1="346" x2="293" y2="346" stroke="#5b6470" stroke-width="2"/>
    <line x1="263" y1="358" x2="286" y2="358" stroke="#5b6470" stroke-width="2"/>
  </g>
  <text x="194" y="402" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13">corpus &#183; JSON, web pages, text docs</text>

  <rect x="48" y="426" width="292" height="118" rx="10" fill="#101a12" stroke="#8aff8a" stroke-width="1.6"/>
  <text x="194" y="454" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="14" font-weight="bold">Goal</text>
  <text x="194" y="480" text-anchor="middle" fill="#e8ffe8" font-family="sans-serif" font-size="14.5">find the MOST RELEVANT</text>
  <text x="194" y="502" text-anchor="middle" fill="#e8ffe8" font-family="sans-serif" font-size="14.5">documents from the corpus,</text>
  <text x="194" y="524" text-anchor="middle" fill="#e8ffe8" font-family="sans-serif" font-size="14.5">ranked best-first</text>

  <!-- ===== PANEL 2: simplest search (rejected) ===== -->
  <rect x="384" y="68" width="332" height="498" rx="12" fill="#1a1416" stroke="#ff8a8a" stroke-width="1.6"/>
  <text x="540" y="98" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="17" font-weight="bold">2 &#183; Simplest search</text>
  <circle cx="690" cy="92" r="13" fill="none" stroke="#ff8a8a" stroke-width="2.4"/>
  <line x1="682" y1="84" x2="698" y2="100" stroke="#ff8a8a" stroke-width="2.4"/>
  <line x1="698" y1="84" x2="682" y2="100" stroke="#ff8a8a" stroke-width="2.4"/>

  <rect x="408" y="120" width="264" height="32" rx="8" fill="#1a1f26" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="540" y="141" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="14">"search"</text>

  <text x="540" y="176" text-anchor="middle" fill="#e3b7b7" font-family="sans-serif" font-size="14">go through documents one-by-one</text>

  <!-- doc rows being scanned -->
  <g font-family="monospace" font-size="13">
    <rect x="430" y="190" width="220" height="26" rx="5" fill="#16191e" stroke="#5b6470" stroke-width="1.3"/>
    <text x="442" y="208" fill="#cbd5e1">d1  &#8230; does it match?</text>
    <rect x="430" y="222" width="220" height="26" rx="5" fill="#16191e" stroke="#5b6470" stroke-width="1.3"/>
    <text x="442" y="240" fill="#cbd5e1">d2  &#8230; does it match?</text>
    <rect x="430" y="254" width="220" height="26" rx="5" fill="#16191e" stroke="#5b6470" stroke-width="1.3"/>
    <text x="442" y="272" fill="#cbd5e1">d3  &#8230; does it match?</text>
    <text x="540" y="298" text-anchor="middle" fill="#9aa6b2" font-size="13">&#8942;  (every doc, every query)</text>
  </g>
  <text x="540" y="324" text-anchor="middle" fill="#ffd27f" font-family="sans-serif" font-size="13.5">match = substring check</text>

  <rect x="404" y="344" width="272" height="200" rx="10" fill="#241518" stroke="#ff8a8a" stroke-width="1.4"/>
  <text x="540" y="370" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="13.5" font-weight="bold">why it fails</text>
  <text x="420" y="396" fill="#e3b7b7" font-family="sans-serif" font-size="13.5">&#8226; O(n) in the corpus &#8212; re-scans</text>
  <text x="432" y="414" fill="#e3b7b7" font-family="sans-serif" font-size="13.5">every doc per query, not scalable</text>
  <text x="420" y="442" fill="#e3b7b7" font-family="sans-serif" font-size="13.5">&#8226; substring finds "re<tspan fill="#ff8a8a" font-weight="bold">search</tspan>"</text>
  <text x="432" y="460" fill="#e3b7b7" font-family="sans-serif" font-size="13.5">when you wanted "search"</text>
  <text x="420" y="488" fill="#e3b7b7" font-family="sans-serif" font-size="13.5">&#8226; no notion of which match</text>
  <text x="432" y="506" fill="#e3b7b7" font-family="sans-serif" font-size="13.5">is <tspan font-style="italic">best</tspan> &#8212; can't rank</text>

  <!-- ===== PANEL 3: the fix (chosen) ===== -->
  <rect x="740" y="68" width="332" height="498" rx="12" fill="#101a12" stroke="#8aff8a" stroke-width="1.8"/>
  <text x="884" y="98" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="17" font-weight="bold">3 &#183; The fix: indexing</text>
  <rect x="936" y="110" width="116" height="26" rx="13" fill="#1a2a1a" stroke="#ffff99" stroke-width="1.4"/>
  <text x="994" y="128" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="12.5" font-weight="bold">core &amp; crux</text>

  <text x="884" y="158" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="14">build an <tspan fill="#ffff99" font-weight="bold">inverted index</tspan> on the corpus</text>

  <!-- inverted index entries -->
  <g font-family="monospace" font-size="15">
    <rect x="762" y="178" width="74" height="34" rx="6" fill="#1a1f26" stroke="#b79bff" stroke-width="1.6"/>
    <text x="799" y="200" text-anchor="middle" fill="#e6dcff">w&#8321;</text>
    <line x1="838" y1="195" x2="884" y2="195" stroke="#8aff8a" stroke-width="2.2" marker-end="url(#ni-g)"/>
    <rect x="888" y="178" width="176" height="34" rx="6" fill="#16191e" stroke="#8aff8a" stroke-width="1.4"/>
    <text x="976" y="200" text-anchor="middle" fill="#8aff8a" font-size="14">[ d&#8336;, d&#8337;, d&#8338; &#8230; ]</text>

    <rect x="762" y="222" width="74" height="34" rx="6" fill="#1a1f26" stroke="#b79bff" stroke-width="1.6"/>
    <text x="799" y="244" text-anchor="middle" fill="#e6dcff">w&#8322;</text>
    <line x1="838" y1="239" x2="884" y2="239" stroke="#8aff8a" stroke-width="2.2" marker-end="url(#ni-g)"/>
    <rect x="888" y="222" width="176" height="34" rx="6" fill="#16191e" stroke="#8aff8a" stroke-width="1.4"/>
    <text x="976" y="244" text-anchor="middle" fill="#8aff8a" font-size="14">[ d&#8337;, d&#8339; &#8230; ]</text>

    <rect x="762" y="266" width="74" height="34" rx="6" fill="#1a1f26" stroke="#b79bff" stroke-width="1.6"/>
    <text x="799" y="288" text-anchor="middle" fill="#e6dcff">w&#8323;</text>
    <line x1="838" y1="283" x2="884" y2="283" stroke="#8aff8a" stroke-width="2.2" marker-end="url(#ni-g)"/>
    <rect x="888" y="266" width="176" height="34" rx="6" fill="#16191e" stroke="#8aff8a" stroke-width="1.4"/>
    <text x="976" y="288" text-anchor="middle" fill="#8aff8a" font-size="14">[ d&#8336;, d&#8338;, d&#8345; &#8230; ]</text>
  </g>
  <text x="884" y="328" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">term (word)  &#8594;  documents that contain it</text>

  <rect x="760" y="352" width="304" height="192" rx="10" fill="#14211a" stroke="#8aff8a" stroke-width="1.4"/>
  <text x="884" y="380" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13.5" font-weight="bold">why it wins</text>
  <text x="776" y="408" fill="#e8ffe8" font-family="sans-serif" font-size="13.5">&#8226; word &#8594; documents that</text>
  <text x="788" y="426" fill="#e8ffe8" font-family="sans-serif" font-size="13.5">contain the word</text>
  <text x="776" y="454" fill="#e8ffe8" font-family="sans-serif" font-size="13.5">&#8226; built <tspan font-weight="bold">once</tspan>, ahead of time</text>
  <text x="776" y="482" fill="#e8ffe8" font-family="sans-serif" font-size="13.5">&#8226; a search is now a</text>
  <text x="788" y="500" fill="#8aff8a" font-family="sans-serif" font-size="14.5" font-weight="bold">lookup, not a scan</text>
  <text x="788" y="524" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">cost &#8776; vocabulary size, not corpus size</text>

  <!-- ===== BOTTOM BANNER ===== -->
  <rect x="28" y="584" width="1044" height="52" rx="12" fill="#1c1a10" stroke="#ffff99" stroke-width="1.6"/>
  <text x="550" y="616" text-anchor="middle" fill="#fff7d6" font-family="sans-serif" font-size="16"><tspan fill="#ffff99" font-weight="bold">&#9733; the one idea:</tspan>  don't search the documents at query time &#8212; search a structure built from them <tspan fill="#ffff99" font-weight="bold">beforehand</tspan></text>
</svg>
