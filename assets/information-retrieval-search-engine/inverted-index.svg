<svg width="1100" height="668" viewBox="0 0 1100 668" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ii-b" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#93c5fd"/></marker>
    <marker id="ii-g" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aff8a"/></marker>
    <marker id="ii-p" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b79bff"/></marker>
  </defs>
  <rect x="0" y="0" width="1100" height="668" fill="#111317"/>
  <text x="550" y="40" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="26" font-weight="bold">The inverted index &#8212; and the pipeline that builds it</text>

  <!-- ===== TOP: ANALYSIS PIPELINE ===== -->
  <text x="36" y="78" fill="#93c5fd" font-family="sans-serif" font-size="16" font-weight="bold">Analysis pipeline &#183; per document</text>
  <text x="1064" y="78" text-anchor="end" fill="#9aa6b2" font-family="sans-serif" font-size="13" font-style="italic">the query runs the SAME pipeline, so terms line up</text>

  <!-- stage boxes -->
  <g font-family="sans-serif">
    <!-- raw -->
    <rect x="22" y="96" width="126" height="64" rx="8" fill="#1a1f26" stroke="#7c8694" stroke-width="1.5"/>
    <text x="85" y="120" text-anchor="middle" fill="#cbd5e1" font-size="12" font-weight="bold">raw doc</text>
    <text x="85" y="138" text-anchor="middle" fill="#9aa6b2" font-size="10.5">"The Fast,</text>
    <text x="85" y="151" text-anchor="middle" fill="#9aa6b2" font-size="10.5">Scalable Search&#8230;"</text>

    <rect x="176" y="96" width="126" height="64" rx="8" fill="#14171c" stroke="#3a414b" stroke-width="1.5"/>
    <text x="239" y="124" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="bold">Parse</text>
    <text x="239" y="144" text-anchor="middle" fill="#9aa6b2" font-size="11">title / body</text>

    <rect x="330" y="96" width="126" height="64" rx="8" fill="#14171c" stroke="#3a414b" stroke-width="1.5"/>
    <text x="393" y="124" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="bold">Tokenize</text>
    <text x="393" y="144" text-anchor="middle" fill="#9aa6b2" font-size="11">split words</text>

    <rect x="484" y="96" width="126" height="64" rx="8" fill="#14171c" stroke="#3a414b" stroke-width="1.5"/>
    <text x="547" y="124" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="bold">Normalize</text>
    <text x="547" y="144" text-anchor="middle" fill="#9aa6b2" font-size="11">lowercase, accents</text>

    <rect x="638" y="96" width="126" height="64" rx="8" fill="#14171c" stroke="#3a414b" stroke-width="1.5"/>
    <text x="701" y="118" text-anchor="middle" fill="#ffd27f" font-size="12.5" font-weight="bold">Stop words</text>
    <text x="701" y="136" text-anchor="middle" fill="#9aa6b2" font-size="11">drop "the", "a"</text>

    <rect x="792" y="96" width="126" height="64" rx="8" fill="#14171c" stroke="#3a414b" stroke-width="1.5"/>
    <text x="855" y="118" text-anchor="middle" fill="#8aff8a" font-size="12.5" font-weight="bold">Stem / lemma</text>
    <text x="855" y="136" text-anchor="middle" fill="#9aa6b2" font-size="10.5">engines&#8594;engine</text>

    <rect x="946" y="96" width="130" height="64" rx="8" fill="#16191e" stroke="#8aff8a" stroke-width="1.6"/>
    <text x="1011" y="120" text-anchor="middle" fill="#8aff8a" font-size="12.5" font-weight="bold">terms</text>
    <text x="1011" y="140" text-anchor="middle" fill="#cbd5e1" font-size="10.5">fast scalabl search</text>
  </g>
  <!-- arrows -->
  <line x1="150" y1="128" x2="174" y2="128" stroke="#93c5fd" stroke-width="2" marker-end="url(#ii-b)"/>
  <line x1="304" y1="128" x2="328" y2="128" stroke="#93c5fd" stroke-width="2" marker-end="url(#ii-b)"/>
  <line x1="458" y1="128" x2="482" y2="128" stroke="#93c5fd" stroke-width="2" marker-end="url(#ii-b)"/>
  <line x1="612" y1="128" x2="636" y2="128" stroke="#93c5fd" stroke-width="2" marker-end="url(#ii-b)"/>
  <line x1="766" y1="128" x2="790" y2="128" stroke="#93c5fd" stroke-width="2" marker-end="url(#ii-b)"/>
  <line x1="920" y1="128" x2="944" y2="128" stroke="#8aff8a" stroke-width="2" marker-end="url(#ii-g)"/>

  <text x="550" y="190" text-anchor="middle" fill="#8aa0b0" font-family="sans-serif" font-size="12.5"><tspan fill="#8aff8a" font-weight="bold">stemming</tspan> = fast rule-based suffix chop (running&#8594;run) &#160;&#160;&#183;&#160;&#160; <tspan fill="#8aff8a" font-weight="bold">lemmatization</tspan> = dictionary headword (better&#8594;good)</text>

  <line x1="40" y1="212" x2="1060" y2="212" stroke="#2a2f37" stroke-width="1.4"/>

  <!-- ===== BOTTOM: INVERTED INDEX ===== -->
  <text x="36" y="248" fill="#ffff99" font-family="sans-serif" font-size="16" font-weight="bold">The inverted index</text>
  <text x="200" y="248" fill="#9aa6b2" font-family="sans-serif" font-size="13">term dictionary &#8594; posting lists</text>

  <!-- term dictionary -->
  <text x="120" y="280" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="12.5" font-weight="bold">term dictionary</text>
  <g font-family="monospace" font-size="14">
    <rect x="48" y="292" width="144" height="34" rx="6" fill="#1a1f26" stroke="#b79bff" stroke-width="1.5"/>
    <text x="120" y="314" text-anchor="middle" fill="#e6dcff">fast</text>
    <rect x="48" y="334" width="144" height="34" rx="6" fill="#1a1f26" stroke="#b79bff" stroke-width="1.5"/>
    <text x="120" y="356" text-anchor="middle" fill="#e6dcff">scalable</text>
    <rect x="48" y="376" width="144" height="44" rx="6" fill="#231a33" stroke="#ffff99" stroke-width="2"/>
    <text x="120" y="403" text-anchor="middle" fill="#ffff99" font-weight="bold">search</text>
    <rect x="48" y="428" width="144" height="34" rx="6" fill="#1a1f26" stroke="#b79bff" stroke-width="1.5"/>
    <text x="120" y="450" text-anchor="middle" fill="#e6dcff">engine</text>
  </g>

  <!-- simple posting lists -->
  <line x1="194" y1="309" x2="252" y2="309" stroke="#8aff8a" stroke-width="2" marker-end="url(#ii-g)"/>
  <rect x="256" y="293" width="210" height="32" rx="6" fill="#16191e" stroke="#8aff8a" stroke-width="1.3"/>
  <text x="361" y="314" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="13">[ d1, d5, d8 &#8230; ]</text>

  <line x1="194" y1="351" x2="252" y2="351" stroke="#8aff8a" stroke-width="2" marker-end="url(#ii-g)"/>
  <rect x="256" y="335" width="210" height="32" rx="6" fill="#16191e" stroke="#8aff8a" stroke-width="1.3"/>
  <text x="361" y="356" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="13">[ d1, d2, d4 &#8230; ]</text>

  <line x1="194" y1="445" x2="252" y2="445" stroke="#8aff8a" stroke-width="2" marker-end="url(#ii-g)"/>
  <rect x="256" y="429" width="210" height="32" rx="6" fill="#16191e" stroke="#8aff8a" stroke-width="1.3"/>
  <text x="361" y="450" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="13">[ d1, d7 &#8230; ]</text>

  <!-- search expanded postings -->
  <line x1="194" y1="398" x2="252" y2="398" stroke="#ffff99" stroke-width="2.2" marker-end="url(#ii-p)"/>
  <text x="660" y="284" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="12.5">posting list for "search" &#8212; each element is a <tspan font-weight="bold">posting</tspan></text>

  <g font-family="monospace">
    <rect x="256" y="378" width="178" height="44" rx="7" fill="#1c2433" stroke="#93c5fd" stroke-width="1.6"/>
    <text x="345" y="396" text-anchor="middle" fill="#cbd5e1" font-size="13">docID d1</text>
    <text x="345" y="414" text-anchor="middle" fill="#8aff8a" font-size="12">tf 2 &#183; pos [3,9]</text>

    <rect x="448" y="378" width="178" height="44" rx="7" fill="#1c2433" stroke="#93c5fd" stroke-width="1.6"/>
    <text x="537" y="396" text-anchor="middle" fill="#cbd5e1" font-size="13">docID d4</text>
    <text x="537" y="414" text-anchor="middle" fill="#8aff8a" font-size="12">tf 1 &#183; pos [7]</text>

    <rect x="640" y="378" width="178" height="44" rx="7" fill="#1c2433" stroke="#93c5fd" stroke-width="1.6"/>
    <text x="729" y="396" text-anchor="middle" fill="#cbd5e1" font-size="13">docID d7</text>
    <text x="729" y="414" text-anchor="middle" fill="#8aff8a" font-size="12">tf 5 &#183; pos [1,4,8&#8230;]</text>

    <text x="846" y="404" fill="#9aa6b2" font-size="20">&#8230;</text>
  </g>

  <!-- right info panel -->
  <rect x="884" y="292" width="192" height="170" rx="10" fill="#14171c" stroke="#3a414b" stroke-width="1.4"/>
  <text x="980" y="316" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="12.5" font-weight="bold">a posting stores</text>
  <text x="900" y="340" fill="#cbd5e1" font-family="sans-serif" font-size="12">&#8226; docID</text>
  <text x="900" y="360" fill="#cbd5e1" font-family="sans-serif" font-size="12">&#8226; term frequency (tf)</text>
  <text x="900" y="380" fill="#cbd5e1" font-family="sans-serif" font-size="12">&#8226; positions &#8594; phrases</text>
  <text x="900" y="400" fill="#cbd5e1" font-family="sans-serif" font-size="12">&#8226; field (title / body)</text>
  <text x="980" y="430" text-anchor="middle" fill="#ffd27f" font-family="sans-serif" font-size="11.5" font-weight="bold">kept SORTED by docID</text>
  <text x="980" y="448" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="10.5">&#8594; fast query-time merge</text>

  <!-- bottom strip -->
  <rect x="28" y="486" width="1048" height="52" rx="12" fill="#101a12" stroke="#8aff8a" stroke-width="1.6"/>
  <text x="552" y="518" text-anchor="middle" fill="#e8ffe8" font-family="sans-serif" font-size="15.5"><tspan fill="#8aff8a" font-weight="bold">&#9733; the inversion:</tspan>  flip "document &#8594; its words" into <tspan fill="#ffff99" font-weight="bold">"word &#8594; sorted list of docs"</tspan> &#8212; lookup cost depends on vocabulary size, not corpus size</text>

  <text x="552" y="586" text-anchor="middle" fill="#7c8694" font-family="sans-serif" font-size="12.5" font-style="italic">build once at index time so the query path stays a couple of dictionary lookups plus a merge of sorted lists</text>
</svg>
