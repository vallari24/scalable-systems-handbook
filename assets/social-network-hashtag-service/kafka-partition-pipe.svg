<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc">
  <title id="title">Kafka Topic As Partitioned Pipes</title>
  <desc id="desc">A Kafka topic drawn as three horizontal append-only partition pipes. Events with the same key go to the same partition, preserving order only inside that partition.</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#93c5fd"/>
    </marker>
    <marker id="arrowYellow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#ffff99"/>
    </marker>
    <style>
      .bg{fill:#171717}
      .rule{stroke:#303030;stroke-width:2}
      .title{fill:#ffff99;font:34px system-ui,sans-serif;font-weight:850}
      .sub{fill:#d8d8d8;font:18px system-ui,sans-serif}
      .label{fill:#f8f8f8;font:20px system-ui,sans-serif;font-weight:800}
      .small{fill:#d8d8d8;font:16px system-ui,sans-serif}
      .tiny{fill:#bdbdbd;font:14px system-ui,sans-serif}
      .code{fill:#f8f8f8;font:15px ui-monospace,SFMono-Regular,Menlo,monospace}
      .pipe{fill:#222222;stroke:#f8f8f8;stroke-width:3}
      .slice{stroke:#f8f8f8;stroke-width:2.2}
      .eventBlue{fill:#1d2738;stroke:#93c5fd;stroke-width:2.4;rx:8}
      .eventPink{fill:#281f2d;stroke:#ff8bd2;stroke-width:2.4;rx:8}
      .eventGreen{fill:#202820;stroke:#8aff8a;stroke-width:2.4;rx:8}
      .eventOrange{fill:#2a2418;stroke:#ffd37a;stroke-width:2.4;rx:8}
      .box{fill:#202020;stroke:#5f5f5f;stroke-width:2;rx:8}
      .blue{fill:#93c5fd}
      .pink{fill:#ff8bd2}
      .green{fill:#8aff8a}
      .orange{fill:#ffd37a}
      .yellow{fill:#ffff99}
      .arrowBlue{stroke:#93c5fd;stroke-width:2.6;fill:none;marker-end:url(#arrowBlue)}
      .arrowYellow{stroke:#ffff99;stroke-width:2.6;fill:none;marker-end:url(#arrowYellow)}
    </style>
  </defs>

  <rect class="bg" width="1180" height="720"/>
  <g opacity=".9">
    <line class="rule" x1="0" y1="90" x2="1180" y2="90"/>
    <line class="rule" x1="0" y1="180" x2="1180" y2="180"/>
    <line class="rule" x1="0" y1="270" x2="1180" y2="270"/>
    <line class="rule" x1="0" y1="360" x2="1180" y2="360"/>
    <line class="rule" x1="0" y1="450" x2="1180" y2="450"/>
    <line class="rule" x1="0" y1="540" x2="1180" y2="540"/>
    <line class="rule" x1="0" y1="630" x2="1180" y2="630"/>
  </g>

  <text class="title" x="60" y="58">Kafka Topic = Append-Only Pipe Split Into Partitions</text>
  <text class="sub" x="60" y="92">The key chooses one partition. Ordering is preserved inside that partition, not across the whole topic.</text>

  <rect class="box" x="60" y="125" width="270" height="155"/>
  <text class="label yellow" x="90" y="165">Producer</text>
  <text class="small" x="90" y="200">event: post_created</text>
  <text class="code" x="90" y="230">key = author_user_id</text>
  <text class="code" x="90" y="255">partition = hash(key) % 3</text>

  <path class="arrowYellow" d="M335 205 C390 205, 410 205, 455 205"/>
  <text class="small yellow" x="360" y="190">append</text>

  <text class="label blue" x="490" y="150">topic: post_created</text>

  <g transform="translate(455 175)">
    <text class="small" x="0" y="-8">partition 0</text>
    <rect class="pipe" x="0" y="0" width="610" height="82" rx="41"/>
    <line class="slice" x1="122" y1="0" x2="122" y2="82"/>
    <line class="slice" x1="244" y1="0" x2="244" y2="82"/>
    <line class="slice" x1="366" y1="0" x2="366" y2="82"/>
    <line class="slice" x1="488" y1="0" x2="488" y2="82"/>
    <rect class="eventBlue" x="18" y="18" width="88" height="46"/>
    <text class="code blue" x="31" y="47">A:m1</text>
    <rect class="eventBlue" x="140" y="18" width="88" height="46"/>
    <text class="code blue" x="153" y="47">A:m2</text>
    <rect class="eventBlue" x="262" y="18" width="88" height="46"/>
    <text class="code blue" x="275" y="47">A:m3</text>
  </g>

  <g transform="translate(455 310)">
    <text class="small" x="0" y="-8">partition 1</text>
    <rect class="pipe" x="0" y="0" width="610" height="82" rx="41"/>
    <line class="slice" x1="122" y1="0" x2="122" y2="82"/>
    <line class="slice" x1="244" y1="0" x2="244" y2="82"/>
    <line class="slice" x1="366" y1="0" x2="366" y2="82"/>
    <line class="slice" x1="488" y1="0" x2="488" y2="82"/>
    <rect class="eventPink" x="18" y="18" width="88" height="46"/>
    <text class="code pink" x="31" y="47">B:m1</text>
    <rect class="eventPink" x="140" y="18" width="88" height="46"/>
    <text class="code pink" x="153" y="47">B:m2</text>
  </g>

  <g transform="translate(455 445)">
    <text class="small" x="0" y="-8">partition 2</text>
    <rect class="pipe" x="0" y="0" width="610" height="82" rx="41"/>
    <line class="slice" x1="122" y1="0" x2="122" y2="82"/>
    <line class="slice" x1="244" y1="0" x2="244" y2="82"/>
    <line class="slice" x1="366" y1="0" x2="366" y2="82"/>
    <line class="slice" x1="488" y1="0" x2="488" y2="82"/>
    <rect class="eventGreen" x="18" y="18" width="88" height="46"/>
    <text class="code green" x="31" y="47">C:m1</text>
    <rect class="eventGreen" x="140" y="18" width="88" height="46"/>
    <text class="code green" x="153" y="47">C:m2</text>
    <rect class="eventGreen" x="262" y="18" width="88" height="46"/>
    <text class="code green" x="275" y="47">C:m3</text>
    <rect class="eventGreen" x="384" y="18" width="88" height="46"/>
    <text class="code green" x="397" y="47">C:m4</text>
  </g>

  <path class="arrowBlue" d="M755 270 C755 288, 755 292, 755 305"/>
  <path class="arrowBlue" d="M755 405 C755 423, 755 427, 755 440"/>
  <text class="small blue" x="785" y="286">Different partitions can move independently.</text>
  <text class="small blue" x="785" y="312">Do not infer global order across A, B, C.</text>

  <rect class="box" x="60" y="325" width="300" height="180"/>
  <text class="label orange" x="90" y="365">Ordering Rule</text>
  <text class="small" x="90" y="400">Same key -> same pipe.</text>
  <text class="small" x="90" y="430">Same pipe -> ordered offsets.</text>
  <text class="small" x="90" y="460">Different pipes -> no global order.</text>

  <rect class="box" x="60" y="560" width="1005" height="98"/>
  <text class="label green" x="90" y="598">Memory Hook</text>
  <text class="small" x="90" y="630">Kafka is fast here because producers append records to the end of partition logs. Consumers remember offsets and can replay retained records.</text>
</svg>
