<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="800" viewBox="0 0 1180 800" role="img" aria-labelledby="title desc">
  <title id="title">High Volume Hashtag Counting</title>
  <desc id="desc">Posts Service writes events to Kafka, hashtag workers batch counter updates into a partitioned database, and Hashtag API serves reads without doing counting work.</desc>
  <defs>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#8aff8a"/>
    </marker>
    <marker id="arrowCyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#87eaff"/>
    </marker>
    <marker id="arrowYellow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#ffff99"/>
    </marker>
    <marker id="arrowPink" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#ff8bd2"/>
    </marker>
    <style>
      .bg{fill:#171717}
      .rule{stroke:#303030;stroke-width:2}
      .title{fill:#b5b3ff;font:34px system-ui,sans-serif;font-weight:850}
      .sub{fill:#d8d8d8;font:18px system-ui,sans-serif}
      .label{fill:#f8f8f8;font:20px system-ui,sans-serif;font-weight:800}
      .small{fill:#d8d8d8;font:16px system-ui,sans-serif}
      .tiny{fill:#bdbdbd;font:14px system-ui,sans-serif}
      .code{fill:#f8f8f8;font:15px ui-monospace,SFMono-Regular,Menlo,monospace}
      .box{fill:#202020;stroke:#f8f8f8;stroke-width:3;rx:10}
      .boxCyan{fill:#17282c;stroke:#87eaff;stroke-width:3;rx:10}
      .boxPink{fill:#281f2d;stroke:#ff8bd2;stroke-width:3;rx:10}
      .boxGreen{fill:#1d2b1d;stroke:#8aff8a;stroke-width:3;rx:10}
      .pipe{fill:#222222;stroke:#ffff99;stroke-width:4}
      .db{fill:#222222;stroke:#f8f8f8;stroke-width:3}
      .green{fill:#8aff8a}
      .cyan{fill:#87eaff}
      .pink{fill:#ff8bd2}
      .yellow{fill:#ffff99}
      .purple{fill:#b5b3ff}
      .arrowGreen{stroke:#8aff8a;stroke-width:3;fill:none;marker-end:url(#arrowGreen)}
      .arrowCyan{stroke:#87eaff;stroke-width:3;fill:none;marker-end:url(#arrowCyan)}
      .arrowYellow{stroke:#ffff99;stroke-width:3;fill:none;marker-end:url(#arrowYellow)}
      .arrowPink{stroke:#ff8bd2;stroke-width:3;fill:none;marker-end:url(#arrowPink)}
    </style>
  </defs>

  <rect class="bg" width="1180" height="800"/>
  <g opacity=".9">
    <line class="rule" x1="0" y1="90" x2="1180" y2="90"/>
    <line class="rule" x1="0" y1="180" x2="1180" y2="180"/>
    <line class="rule" x1="0" y1="270" x2="1180" y2="270"/>
    <line class="rule" x1="0" y1="360" x2="1180" y2="360"/>
    <line class="rule" x1="0" y1="450" x2="1180" y2="450"/>
    <line class="rule" x1="0" y1="540" x2="1180" y2="540"/>
    <line class="rule" x1="0" y1="630" x2="1180" y2="630"/>
    <line class="rule" x1="0" y1="720" x2="1180" y2="720"/>
  </g>

  <text class="title" x="60" y="58">High Volume Counting: Batch Writes, Keep Reads Simple</text>
  <text class="sub" x="60" y="92">Main Hashtag API servers should not count on demand. Worker nodes batch and update storage.</text>

  <text class="label green" x="70" y="145">Write path</text>
  <rect class="box" x="70" y="178" width="210" height="72"/>
  <text class="label" x="105" y="218">Posts Service</text>
  <text class="tiny" x="105" y="239">publishes post event</text>

  <g transform="translate(390 188)">
    <rect class="pipe" x="0" y="0" width="260" height="54" rx="27"/>
    <line x1="36" y1="10" x2="224" y2="10" stroke="#ffff99" stroke-width="2"/>
    <line x1="36" y1="27" x2="224" y2="27" stroke="#ffff99" stroke-width="2"/>
    <line x1="36" y1="44" x2="224" y2="44" stroke="#ffff99" stroke-width="2"/>
  </g>
  <text class="label yellow" x="475" y="175">Kafka</text>
  <text class="tiny" x="415" y="266">topic: post_published</text>

  <path class="arrowGreen" d="M285 214 L385 214"/>
  <text class="tiny green" x="305" y="195">key=user_id</text>

  <rect class="boxPink" x="760" y="160" width="250" height="104"/>
  <text class="label pink" x="797" y="198">Hashtag Workers</text>
  <text class="tiny" x="797" y="224">extract hashtags</text>
  <text class="tiny" x="797" y="246">batch count deltas</text>
  <path class="arrowYellow" d="M655 214 L755 214"/>

  <g transform="translate(910 330)">
    <ellipse class="db" cx="64" cy="20" rx="64" ry="20"/>
    <rect class="db" x="0" y="20" width="128" height="86"/>
    <ellipse class="db" cx="64" cy="106" rx="64" ry="20"/>
  </g>
  <text class="label" x="874" y="485">Partitioned DB</text>
  <text class="tiny" x="858" y="510">Cassandra / DynamoDB / MongoDB</text>
  <path class="arrowPink" d="M885 270 L955 326"/>
  <text class="tiny pink" x="905" y="300">flush deltas</text>

  <rect class="box" x="86" y="325" width="245" height="130"/>
  <text class="small yellow" x="112" y="356">Batch example</text>
  <text class="code" x="112" y="388">post1: #sun #sunset</text>
  <text class="code" x="112" y="416">post2: #sunset #moon</text>
  <text class="code green" x="112" y="446">flush: sun +1, sunset +2, moon +1</text>

  <text class="label cyan" x="70" y="545">Read path</text>
  <rect class="boxCyan" x="85" y="580" width="190" height="72"/>
  <text class="label cyan" x="130" y="620">Client</text>
  <text class="tiny" x="118" y="641">GET /hashtag/sunset</text>

  <rect class="boxCyan" x="390" y="580" width="245" height="72"/>
  <text class="label cyan" x="438" y="620">Hashtag API</text>
  <text class="tiny" x="424" y="641">reads precomputed data</text>

  <path class="arrowCyan" d="M280 616 L385 616"/>
  <path class="arrowCyan" d="M640 616 L900 510"/>

  <rect class="boxGreen" x="760" y="585" width="320" height="86"/>
  <text class="label green" x="800" y="622">Read Optimization</text>
  <text class="tiny" x="800" y="647">centralized cache + partitioned DB</text>
  <path class="arrowCyan" d="M760 630 L640 630"/>

  <rect class="box" x="70" y="700" width="1040" height="62"/>
  <text class="small yellow" x="95" y="728">Legend</text>
  <text class="tiny green" x="180" y="728">green = write path</text>
  <text class="tiny cyan" x="340" y="728">cyan = read path</text>
  <text class="tiny pink" x="495" y="728">pink = workers / batched updates</text>
  <text class="tiny yellow" x="745" y="728">yellow = event stream</text>
  <text class="tiny" x="95" y="750">Principle: identify read path and write path, then optimize them independently.</text>
</svg>
