<svg width="1200" height="510" viewBox="0 0 1200 510" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowWhite" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ffffff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8aff8a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="510" fill="#111317"/>

  <text x="600" y="56" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="34" font-weight="bold">How Images Are Served</text>
  <text x="600" y="92" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="19">the browser requests a URL; the server reads a file from disk and returns the bytes</text>

  <g transform="translate(0,-75)">
  <!-- User / browser -->
  <circle cx="130" cy="285" r="22" fill="none" stroke="#ffffff" stroke-width="3"/>
  <line x1="130" y1="307" x2="130" y2="355" stroke="#ffffff" stroke-width="3"/>
  <line x1="105" y1="325" x2="155" y2="325" stroke="#ffffff" stroke-width="3"/>
  <line x1="130" y1="355" x2="110" y2="385" stroke="#ffffff" stroke-width="3"/>
  <line x1="130" y1="355" x2="150" y2="385" stroke="#ffffff" stroke-width="3"/>
  <text x="130" y="415" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="18">browser</text>

  <!-- Server -->
  <rect x="420" y="290" width="210" height="100" rx="6" fill="none" stroke="#ffffff" stroke-width="3"/>
  <text x="525" y="347" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold">Server</text>

  <!-- Disk (cylinder, durable store) -->
  <g stroke="#ffff99" stroke-width="3" fill="none">
    <ellipse cx="965" cy="300" rx="80" ry="20"/>
    <line x1="885" y1="300" x2="885" y2="385"/>
    <line x1="1045" y1="300" x2="1045" y2="385"/>
    <path d="M885,385 A80,20 0 0 0 1045,385"/>
  </g>
  <text x="965" y="350" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="20" font-weight="bold">disk</text>

  <!-- Request: browser -> server -->
  <line x1="175" y1="320" x2="412" y2="320" stroke="#ffffff" stroke-width="3" marker-end="url(#arrowWhite)"/>
  <text x="293" y="302" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="13">HTTP GET /static/img/logo.jpg</text>

  <!-- Server -> disk -->
  <line x1="638" y1="320" x2="878" y2="320" stroke="#ffffff" stroke-width="3" marker-end="url(#arrowWhite)"/>
  <text x="758" y="305" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="16">read file at mapped path</text>

  <!-- Response: server -> browser (bytes) -->
  <path d="M420,372 C320,372 250,430 175,455 L150,470" fill="none" stroke="#8aff8a" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="300" y="455" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="16">image bytes (response body)</text>

  <text x="130" y="510" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="17">rendered as an image</text>

  <!-- Steps box -->
  <text x="600" y="555" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="17">read the URL  →  read the file at the mapped path  →  send the bytes</text>
  </g>
</svg>
