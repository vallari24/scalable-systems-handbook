<svg width="1180" height="1024" viewBox="0 0 1180 1024" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1180" height="1024" fill="#111317"/>
  <defs>
    <marker id="arrBlue" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#93c5fd"/></marker>
    <marker id="arrPink" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#ff8bd2"/></marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#8aff8a"/></marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#ff8a8a"/></marker>
  </defs>

  <!-- Title -->
  <text x="590" y="46" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="29" font-weight="bold">Moving a Logical Shard Live &#8212; Copy, Cut Over, Redirect</text>
  <text x="590" y="74" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">Two levels of indirection: key&#8594;shard never changes; only shard&#8594;node moves</text>

  <!-- ================= PANEL 1 ================= -->
  <rect x="44" y="96" width="1092" height="470" rx="12" fill="#16191e" stroke="#9aa6b2" stroke-width="2"/>
  <text x="64" y="126" fill="#ffff99" font-family="sans-serif" font-size="19" font-weight="bold">&#9312; A live shard move &#8212; data lives on the node (e.g. Elasticsearch)</text>

  <!-- control plane -->
  <rect x="460" y="148" width="260" height="56" rx="8" fill="#10243a" stroke="#93c5fd" stroke-width="2"/>
  <text x="590" y="174" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="14" font-weight="bold">Control plane / master</text>
  <text x="590" y="194" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">owns the shard&#8594;node map</text>

  <!-- flip arrow from control plane to Node B -->
  <line x1="662" y1="204" x2="884" y2="250" stroke="#93c5fd" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="800" y="226" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="12" font-weight="bold">&#9318; flip map: S&#8594;B</text>

  <!-- Node A -->
  <rect x="84" y="250" width="300" height="170" rx="12" fill="#16191e" stroke="#9aa6b2" stroke-width="2.5"/>
  <text x="234" y="280" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Node A &#8212; current owner</text>
  <rect x="124" y="296" width="220" height="60" rx="8" fill="#1a1a10" stroke="#ffff99" stroke-width="2"/>
  <text x="234" y="322" text-anchor="middle" fill="#ffff99" font-family="monospace" font-size="15">shard S</text>
  <text x="234" y="342" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">LIVE: serves reads + writes</text>
  <rect x="124" y="366" width="220" height="38" rx="6" fill="#2a1414" stroke="#ff8a8a" stroke-width="1.5"/>
  <text x="234" y="390" text-anchor="middle" fill="#ffb3b3" font-family="sans-serif" font-size="11">changelog: writes during copy</text>

  <!-- Node B -->
  <rect x="796" y="250" width="300" height="170" rx="12" fill="#16191e" stroke="#9aa6b2" stroke-width="2.5"/>
  <text x="946" y="280" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Node B &#8212; target (quieter)</text>
  <rect x="836" y="296" width="220" height="60" rx="8" fill="#0f2417" stroke="#8aff8a" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="946" y="322" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="14">shard S (filling&#8230;)</text>
  <text x="946" y="342" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">becomes owner at cutover</text>

  <!-- copy snapshot arrow -->
  <line x1="384" y1="316" x2="796" y2="316" stroke="#93c5fd" stroke-width="3" stroke-dasharray="9,6" marker-end="url(#arrBlue)"/>
  <text x="590" y="308" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="13" font-weight="bold">&#9313; copy snapshot (background) &#8212; A keeps serving</text>

  <!-- replay delta arrow -->
  <line x1="384" y1="386" x2="796" y2="372" stroke="#ff8bd2" stroke-width="2.5" stroke-dasharray="9,6" marker-end="url(#arrPink)"/>
  <text x="590" y="404" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="13" font-weight="bold">&#9315; replay delta (writes made during copy)</text>

  <!-- sequence ribbon -->
  <text x="64" y="444" fill="#9aa6b2" font-family="sans-serif" font-size="13" font-style="italic">the full sequence, left to right:</text>
  <!-- 6 step boxes -->
  <!-- step 1 -->
  <rect x="60" y="454" width="172" height="98" rx="8" fill="#1b1f26" stroke="#9aa6b2" stroke-width="1.2"/>
  <circle cx="82" cy="476" r="11" fill="#93c5fd"/><text x="82" y="481" text-anchor="middle" fill="#111317" font-family="sans-serif" font-size="13" font-weight="bold">1</text>
  <text x="102" y="481" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Decide</text>
  <text x="72" y="504" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">Coordinator picks</text>
  <text x="72" y="520" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">shard S to move</text>
  <text x="72" y="536" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">A &#8594; B</text>
  <!-- step 2 -->
  <rect x="240" y="454" width="172" height="98" rx="8" fill="#1b1f26" stroke="#9aa6b2" stroke-width="1.2"/>
  <circle cx="262" cy="476" r="11" fill="#93c5fd"/><text x="262" y="481" text-anchor="middle" fill="#111317" font-family="sans-serif" font-size="13" font-weight="bold">2</text>
  <text x="282" y="481" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Copy</text>
  <text x="252" y="504" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">B copies snapshot</text>
  <text x="252" y="520" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">from A &#8212; A still</text>
  <text x="252" y="536" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">serving</text>
  <!-- step 3 -->
  <rect x="420" y="454" width="172" height="98" rx="8" fill="#1b1f26" stroke="#9aa6b2" stroke-width="1.2"/>
  <circle cx="442" cy="476" r="11" fill="#93c5fd"/><text x="442" y="481" text-anchor="middle" fill="#111317" font-family="sans-serif" font-size="13" font-weight="bold">3</text>
  <text x="462" y="481" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Log delta</text>
  <text x="432" y="504" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">Writes during copy</text>
  <text x="432" y="520" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">recorded as a</text>
  <text x="432" y="536" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">changelog</text>
  <!-- step 4 -->
  <rect x="600" y="454" width="172" height="98" rx="8" fill="#1b1f26" stroke="#9aa6b2" stroke-width="1.2"/>
  <circle cx="622" cy="476" r="11" fill="#93c5fd"/><text x="622" y="481" text-anchor="middle" fill="#111317" font-family="sans-serif" font-size="13" font-weight="bold">4</text>
  <text x="642" y="481" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Catch up</text>
  <text x="612" y="504" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">B replays the delta</text>
  <text x="612" y="520" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">until nearly current</text>
  <text x="612" y="536" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">with A</text>
  <!-- step 5 -->
  <rect x="780" y="454" width="172" height="98" rx="8" fill="#241a10" stroke="#ffd27f" stroke-width="1.8"/>
  <circle cx="802" cy="476" r="11" fill="#ffd27f"/><text x="802" y="481" text-anchor="middle" fill="#111317" font-family="sans-serif" font-size="13" font-weight="bold">5</text>
  <text x="822" y="481" fill="#ffd27f" font-family="sans-serif" font-size="12" font-weight="bold">Cutover</text>
  <text x="792" y="504" fill="#ffe9c2" font-family="sans-serif" font-size="11.5">A freezes S, ships</text>
  <text x="792" y="520" fill="#ffe9c2" font-family="sans-serif" font-size="11.5">final delta, hands</text>
  <text x="792" y="536" fill="#ffe9c2" font-family="sans-serif" font-size="11.5">off (ms&#8211;s window)</text>
  <!-- step 6 -->
  <rect x="960" y="454" width="160" height="98" rx="8" fill="#0f2417" stroke="#8aff8a" stroke-width="1.8"/>
  <circle cx="982" cy="476" r="11" fill="#8aff8a"/><text x="982" y="481" text-anchor="middle" fill="#111317" font-family="sans-serif" font-size="13" font-weight="bold">6</text>
  <text x="1002" y="481" fill="#8aff8a" font-family="sans-serif" font-size="12" font-weight="bold">Flip map</text>
  <text x="972" y="504" fill="#d6ffd6" font-family="sans-serif" font-size="11.5">Map flips S&#8594;B;</text>
  <text x="972" y="520" fill="#d6ffd6" font-family="sans-serif" font-size="11.5">A drops its copy.</text>
  <text x="972" y="536" fill="#9aa6b2" font-family="sans-serif" font-size="11.5">Keys never change.</text>

  <!-- ================= PANEL 2 ================= -->
  <rect x="44" y="586" width="1092" height="362" rx="12" fill="#16191e" stroke="#9aa6b2" stroke-width="2"/>
  <text x="64" y="616" fill="#ffff99" font-family="sans-serif" font-size="19" font-weight="bold">&#9313; How a stale request finds out the shard moved</text>

  <!-- Router -->
  <rect x="90" y="688" width="240" height="124" rx="10" fill="#16191e" stroke="#9aa6b2" stroke-width="2.5"/>
  <text x="210" y="720" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Router</text>
  <text x="210" y="744" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">cached map (STALE):</text>
  <rect x="150" y="756" width="120" height="34" rx="6" fill="#2a1414" stroke="#ff8a8a" stroke-width="1.5"/>
  <text x="210" y="779" text-anchor="middle" fill="#ff8a8a" font-family="monospace" font-size="15" font-weight="bold">S &#8594; A</text>

  <!-- Node A former -->
  <rect x="470" y="636" width="220" height="92" rx="10" fill="#16191e" stroke="#9aa6b2" stroke-width="2.5"/>
  <text x="580" y="670" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">Node A</text>
  <text x="580" y="694" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">former owner of S</text>

  <!-- Node B new -->
  <rect x="470" y="804" width="220" height="92" rx="10" fill="#0f2417" stroke="#8aff8a" stroke-width="2"/>
  <text x="580" y="838" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">Node B</text>
  <text x="580" y="862" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="12">new owner of S</text>

  <!-- Control plane -->
  <rect x="830" y="688" width="240" height="116" rx="10" fill="#10243a" stroke="#93c5fd" stroke-width="2"/>
  <text x="950" y="720" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="15" font-weight="bold">Control plane</text>
  <text x="950" y="744" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">source of truth:</text>
  <rect x="890" y="756" width="120" height="34" rx="6" fill="#0f2417" stroke="#8aff8a" stroke-width="1.5"/>
  <text x="950" y="779" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="15" font-weight="bold">S &#8594; B</text>

  <!-- 1 request to A (stale) -->
  <line x1="330" y1="702" x2="470" y2="682" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="398" y="662" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="12" font-weight="bold">&#9312; request (stale route)</text>

  <!-- 2 redirect back -->
  <line x1="470" y1="712" x2="332" y2="742" stroke="#ff8a8a" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrRed)"/>
  <text x="402" y="790" text-anchor="middle" fill="#ffb3b3" font-family="sans-serif" font-size="12" font-weight="bold">&#9313; &#8220;not my shard / moved&#8221;</text>
  <text x="402" y="807" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11">RegionMovedException &#183; stale-version</text>

  <!-- 3 refresh from control plane -->
  <line x1="330" y1="766" x2="830" y2="766" stroke="#93c5fd" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrBlue)"/>
  <text x="580" y="758" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="12" font-weight="bold">&#9314; refresh map from source of truth</text>

  <!-- 4 retry to B -->
  <line x1="240" y1="812" x2="470" y2="850" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#arrGreen)"/>
  <text x="332" y="888" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="12" font-weight="bold">&#9315; retry &#8594; B serves</text>

  <!-- self-correct note -->
  <rect x="730" y="828" width="386" height="64" rx="8" fill="#1b1f26" stroke="#9aa6b2" stroke-width="1.2"/>
  <text x="923" y="852" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">Self-correcting: routers cache the map and learn</text>
  <text x="923" y="872" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">of moves lazily via redirects &#8212; no synchronous</text>
  <text x="923" y="888" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11.5">push to every router is needed.</text>

  <!-- ================= TAKEAWAY ================= -->
  <rect x="44" y="962" width="1092" height="54" rx="10" fill="#0f2417" stroke="#8aff8a" stroke-width="3"/>
  <text x="64" y="987" fill="#8aff8a" font-family="sans-serif" font-size="14" font-weight="bold">TAKEAWAY</text>
  <text x="64" y="1007" fill="#ffffff" font-family="sans-serif" font-size="14.5">Keys are pinned to shards forever; only the shard&#8594;node map moves. Copy-then-cutover when data lives on the node &#8212; just flip ownership when storage is shared (S3).</text>
</svg>
