<svg width="1180" height="900" viewBox="0 0 1180 900" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1180" height="900" fill="#111317"/>

  <defs>
    <marker id="arrYellow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ffff99"/>
    </marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#93c5fd"/>
    </marker>
    <marker id="arrPink" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ff8bd2"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="590" y="50" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="29" font-weight="bold">Partition Servers: Logical Ownership</text>
  <text x="590" y="80" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">a server owns a logical partition; the disk underneath is just bytes</text>

  <!-- ===================== TOP HALF ===================== -->

  <!-- Partition Manager (left) -->
  <rect x="80" y="150" width="200" height="110" rx="6" fill="#10243a" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="180" y="196" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="17" font-weight="bold">Partition</text>
  <text x="180" y="220" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="17" font-weight="bold">Manager</text>

  <!-- three partition servers (each owns a small partition rectangle) -->
  <text x="560" y="138" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="15">three Partition Servers — each is the single logical owner of a partition</text>

  <!-- PS1 -->
  <rect x="420" y="150" width="280" height="78" rx="6" fill="#2a1320" stroke="#ff8bd2" stroke-width="2.5"/>
  <text x="470" y="185" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="15" font-weight="bold">Partition</text>
  <text x="470" y="205" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="15" font-weight="bold">Server 1</text>
  <rect x="560" y="168" width="120" height="42" rx="4" fill="#1a1a10" stroke="#ffff99" stroke-width="2"/>
  <text x="620" y="194" text-anchor="middle" fill="#ffff99" font-family="monospace" font-size="15">[a,b]</text>

  <!-- PS2 -->
  <rect x="420" y="248" width="280" height="78" rx="6" fill="#2a1320" stroke="#ff8bd2" stroke-width="2.5"/>
  <text x="470" y="283" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="15" font-weight="bold">Partition</text>
  <text x="470" y="303" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="15" font-weight="bold">Server 2</text>
  <rect x="560" y="266" width="120" height="42" rx="4" fill="#1a1a10" stroke="#ffff99" stroke-width="2"/>
  <text x="620" y="292" text-anchor="middle" fill="#ffff99" font-family="monospace" font-size="15">[c,f]</text>

  <!-- PS3 -->
  <rect x="420" y="346" width="280" height="78" rx="6" fill="#2a1320" stroke="#ff8bd2" stroke-width="2.5"/>
  <text x="470" y="381" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="15" font-weight="bold">Partition</text>
  <text x="470" y="401" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="15" font-weight="bold">Server 3</text>
  <rect x="560" y="364" width="120" height="42" rx="4" fill="#1a1a10" stroke="#ffff99" stroke-width="2"/>
  <text x="620" y="390" text-anchor="middle" fill="#ffff99" font-family="monospace" font-size="15">[g,z]</text>

  <!-- manager -> servers -->
  <line x1="280" y1="185" x2="416" y2="189" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <line x1="280" y1="205" x2="416" y2="287" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <line x1="280" y1="225" x2="416" y2="385" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#arrBlue)"/>

  <!-- actual storage rack (right) -->
  <text x="950" y="138" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="15">actual storage (physical disks)</text>
  <rect x="780" y="150" width="340" height="274" rx="6" fill="#16191e" stroke="#3a4150" stroke-width="2"/>
  <g font-family="sans-serif" font-size="13" fill="#9aa6b2" text-anchor="middle">
    <rect x="805" y="172" width="44" height="230" rx="3" fill="#1a1a10" stroke="#ffff99" stroke-width="2"/>
    <text x="827" y="416" fill="#ffff99" font-weight="bold">Node 1</text>
    <rect x="865" y="172" width="44" height="230" rx="3" fill="#10243a" stroke="#3a4150" stroke-width="1.5"/>
    <text x="887" y="416">...</text>
    <rect x="925" y="172" width="44" height="230" rx="3" fill="#1a1a10" stroke="#ffff99" stroke-width="2"/>
    <text x="947" y="416" fill="#ffff99" font-weight="bold">Node 7</text>
    <rect x="985" y="172" width="44" height="230" rx="3" fill="#1a1a10" stroke="#ffff99" stroke-width="2"/>
    <text x="1007" y="416" fill="#ffff99" font-weight="bold">Node 8</text>
    <rect x="1045" y="172" width="44" height="230" rx="3" fill="#10243a" stroke="#3a4150" stroke-width="1.5"/>
    <text x="1067" y="416">...</text>
  </g>

  <!-- servers -> storage (yellow data path) -->
  <line x1="700" y1="189" x2="801" y2="240" stroke="#ffff99" stroke-width="2.5" marker-end="url(#arrYellow)"/>
  <line x1="700" y1="287" x2="921" y2="287" stroke="#ffff99" stroke-width="2.5" marker-end="url(#arrYellow)"/>
  <line x1="700" y1="385" x2="981" y2="330" stroke="#ffff99" stroke-width="2.5" marker-end="url(#arrYellow)"/>
  <text x="745" y="260" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="13">reads/writes bytes</text>

  <!-- caption: logical ownership / compute isolation -->
  <rect x="80" y="290" width="300" height="134" rx="6" fill="#2a1320" stroke="#ff8bd2" stroke-width="1.5"/>
  <text x="100" y="316" fill="#ff8bd2" font-family="sans-serif" font-size="15" font-weight="bold">Logical ownership</text>
  <g font-family="sans-serif" font-size="14" fill="#cbd5e1">
    <text x="100" y="342">Key benefit: compute load is</text>
    <text x="100" y="362">isolated. Each partition's request-</text>
    <text x="100" y="382">handling CPU lives on its owning</text>
    <text x="100" y="402">server — a busy partition burns its</text>
    <text x="100" y="420">own server's CPU, not a shared disk's.</text>
  </g>

  <!-- PMT cylinder beneath manager -->
  <line x1="180" y1="260" x2="180" y2="446" stroke="#93c5fd" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrBlue)"/>
  <text x="270" y="350" fill="#9aa6b2" font-family="sans-serif" font-size="13" text-anchor="middle">owns</text>
  <g>
    <ellipse cx="180" cy="462" rx="95" ry="20" fill="#1a1a10" stroke="#ffff99" stroke-width="2.5"/>
    <path d="M85,462 L85,520 A95,20 0 0 0 275,520 L275,462" fill="#1a1a10" stroke="#ffff99" stroke-width="2.5"/>
    <ellipse cx="180" cy="462" rx="95" ry="20" fill="#1a1a10" stroke="#ffff99" stroke-width="2.5"/>
    <text x="180" y="502" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="18" font-weight="bold">P.M.T.</text>
  </g>

  <!-- PMT now maps 3 things -->
  <text x="700" y="468" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="16" font-weight="bold">The PMT now maps owner → range → node</text>
  <rect x="330" y="484" width="740" height="120" rx="6" fill="#1a1a10" stroke="#ffff99" stroke-width="2"/>
  <g font-family="monospace" font-size="16" fill="#cbd5e1" text-anchor="middle">
    <text x="700" y="514">Partition Server 1  owns  [a,b]  on  Node 1</text>
    <text x="700" y="544">Partition Server 2  owns  [c,f]  on  Node 7</text>
    <text x="700" y="574">Partition Server 3  owns  [g,z]  on  Node 8</text>
  </g>
  <text x="700" y="596" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13">the node / disk / rack layer can be abstracted away</text>

  <!-- starred rule -->
  <rect x="80" y="540" width="240" height="64" rx="6" fill="#1a1a10" stroke="#ffff99" stroke-width="2"/>
  <text x="200" y="565" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="14" font-weight="bold">★ one partition → exactly</text>
  <text x="200" y="585" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">one server (single writer);</text>
  <text x="200" y="600" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">one server → many partitions</text>

  <!-- ===================== BOTTOM HALF ===================== -->
  <line x1="40" y1="632" x2="1140" y2="632" stroke="#3a4150" stroke-width="1.5" stroke-dasharray="4 6"/>
  <text x="590" y="664" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="20" font-weight="bold">Making the Partition Manager no SPOF</text>

  <!-- replicated manager STACK -->
  <text x="200" y="694" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="14">replicated stack (leader election)</text>
  <rect x="130" y="730" width="190" height="80" rx="6" fill="#10243a" stroke="#93c5fd" stroke-width="2.5"/>
  <rect x="115" y="715" width="190" height="80" rx="6" fill="#10243a" stroke="#93c5fd" stroke-width="2.5"/>
  <rect x="100" y="700" width="190" height="80" rx="6" fill="#10243a" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="195" y="734" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="15" font-weight="bold">Partition Manager</text>
  <text x="195" y="756" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">leader + followers</text>
  <text x="195" y="774" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="13">Raft / Paxos</text>

  <!-- election note -->
  <rect x="360" y="700" width="300" height="110" rx="6" fill="#10243a" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="510" y="728" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="15" font-weight="bold">Leader election via Raft / Paxos</text>
  <g font-family="sans-serif" font-size="14" fill="#cbd5e1" text-anchor="middle">
    <text x="510" y="756">If the leader dies, another instance</text>
    <text x="510" y="778">takes over — no single point of failure.</text>
    <text x="510" y="800">All replicas connect to the same servers + storage.</text>
  </g>

  <!-- replicated managers connect to same servers/storage -->
  <line x1="660" y1="745" x2="770" y2="745" stroke="#93c5fd" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrBlue)"/>
  <rect x="780" y="708" width="340" height="94" rx="6" fill="#16191e" stroke="#3a4150" stroke-width="2"/>
  <text x="950" y="738" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="15">same Partition Servers</text>
  <text x="950" y="762" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="15">+ same shared storage</text>
  <text x="950" y="788" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13">(from the top half)</text>

  <!-- Takeaway -->
  <rect x="80" y="836" width="1020" height="48" rx="6" fill="#1a1a10" stroke="#ffff99" stroke-width="1.5"/>
  <text x="590" y="866" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="15" font-weight="bold">Takeaway: the partition server is the single logical owner isolating per-partition compute; the disk is just bytes; the manager is HA via replication + leader election.</text>
</svg>
