<svg width="1180" height="800" viewBox="0 0 1180 800" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1180" height="800" fill="#111317"/>

  <defs>
    <marker id="llYellow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ffff99"/>
    </marker>
    <marker id="llBlue" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#93c5fd"/>
    </marker>
    <marker id="llPink" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ff8bd2"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="590" y="44" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="29" font-weight="bold">Scaling Storage: A Rack Is a Linked List of HDDs</text>
  <text x="590" y="72" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">writes always hit the active HDD; when it fills, link on a new one — O(1), no data moves</text>

  <!-- Partition server feeding writes -->
  <rect x="705" y="92" width="200" height="48" rx="6" fill="#2a1320" stroke="#ff8bd2" stroke-width="2.5"/>
  <text x="805" y="121" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="15" font-weight="bold">Partition Server</text>
  <!-- write arrow into active HDD -->
  <line x1="805" y1="140" x2="805" y2="178" stroke="#ff8bd2" stroke-width="3" marker-end="url(#llPink)"/>
  <text x="690" y="166" text-anchor="end" fill="#ff8bd2" font-family="sans-serif" font-size="13" font-weight="bold">append to log head &#8594;</text>

  <!-- ===== Linked list of HDD nodes ===== -->
  <!-- helper layout: box w=150 h=104 at y=180; centers 145/365/585/805/1025 -->

  <!-- N1 frozen -->
  <rect x="70" y="180" width="150" height="104" rx="6" fill="#1a1a10" stroke="#ffff99" stroke-width="2.2"/>
  <rect x="86" y="198" width="118" height="14" rx="2" fill="#2a2a18" stroke="#ffff99" stroke-width="0.8"/>
  <rect x="86" y="222" width="118" height="14" rx="2" fill="#2a2a18" stroke="#ffff99" stroke-width="0.8"/>
  <rect x="86" y="246" width="118" height="14" rx="2" fill="#2a2a18" stroke="#ffff99" stroke-width="0.8"/>
  <text x="145" y="306" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="15" font-weight="bold">HDD 1</text>
  <text x="145" y="326" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">frozen &#183; read-only</text>

  <!-- N2 frozen -->
  <rect x="290" y="180" width="150" height="104" rx="6" fill="#1a1a10" stroke="#ffff99" stroke-width="2.2"/>
  <rect x="306" y="198" width="118" height="14" rx="2" fill="#2a2a18" stroke="#ffff99" stroke-width="0.8"/>
  <rect x="306" y="222" width="118" height="14" rx="2" fill="#2a2a18" stroke="#ffff99" stroke-width="0.8"/>
  <rect x="306" y="246" width="118" height="14" rx="2" fill="#2a2a18" stroke="#ffff99" stroke-width="0.8"/>
  <text x="365" y="306" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="15" font-weight="bold">HDD 2</text>
  <text x="365" y="326" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">frozen &#183; read-only</text>

  <!-- N3 frozen -->
  <rect x="510" y="180" width="150" height="104" rx="6" fill="#1a1a10" stroke="#ffff99" stroke-width="2.2"/>
  <rect x="526" y="198" width="118" height="14" rx="2" fill="#2a2a18" stroke="#ffff99" stroke-width="0.8"/>
  <rect x="526" y="222" width="118" height="14" rx="2" fill="#2a2a18" stroke="#ffff99" stroke-width="0.8"/>
  <rect x="526" y="246" width="118" height="14" rx="2" fill="#2a2a18" stroke="#ffff99" stroke-width="0.8"/>
  <text x="585" y="306" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="15" font-weight="bold">HDD 3</text>
  <text x="585" y="326" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">frozen &#183; read-only</text>

  <!-- ACTIVE -->
  <rect x="730" y="180" width="150" height="104" rx="6" fill="#2a1320" stroke="#ff8bd2" stroke-width="3"/>
  <rect x="746" y="198" width="118" height="14" rx="2" fill="#3a1a28" stroke="#ff8bd2" stroke-width="0.9"/>
  <rect x="746" y="222" width="118" height="14" rx="2" fill="#3a1a28" stroke="#ff8bd2" stroke-width="0.9"/>
  <rect x="746" y="246" width="60" height="14" rx="2" fill="#3a1a28" stroke="#ff8bd2" stroke-width="0.9"/>
  <text x="805" y="306" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="15" font-weight="bold">active HDD</text>
  <text x="805" y="326" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="12.5">writes land here</text>

  <!-- NEW (dashed, appended when full) -->
  <rect x="950" y="180" width="150" height="104" rx="6" fill="#10243a" stroke="#93c5fd" stroke-width="2.2" stroke-dasharray="7 5"/>
  <text x="1025" y="238" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="22" font-weight="bold">+</text>
  <text x="1025" y="306" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="15" font-weight="bold">new HDD</text>
  <text x="1025" y="326" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">linked when full</text>

  <!-- next pointers -->
  <line x1="220" y1="232" x2="286" y2="232" stroke="#ffff99" stroke-width="2.5" marker-end="url(#llYellow)"/>
  <text x="253" y="222" text-anchor="middle" fill="#9aa6b2" font-family="monospace" font-size="12">next</text>
  <line x1="440" y1="232" x2="506" y2="232" stroke="#ffff99" stroke-width="2.5" marker-end="url(#llYellow)"/>
  <text x="473" y="222" text-anchor="middle" fill="#9aa6b2" font-family="monospace" font-size="12">next</text>
  <line x1="660" y1="232" x2="726" y2="232" stroke="#ffff99" stroke-width="2.5" marker-end="url(#llYellow)"/>
  <text x="693" y="222" text-anchor="middle" fill="#9aa6b2" font-family="monospace" font-size="12">next</text>
  <line x1="880" y1="232" x2="946" y2="232" stroke="#93c5fd" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#llBlue)"/>
  <text x="913" y="222" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="12">link</text>

  <!-- ===== Callout: dynamic scaling rule ===== -->
  <rect x="70" y="372" width="1030" height="104" rx="8" fill="#10243a" stroke="#93c5fd" stroke-width="2"/>
  <text x="92" y="400" fill="#93c5fd" font-family="sans-serif" font-size="17" font-weight="bold">Dynamic scaling = appending to a linked list</text>
  <text x="92" y="428" fill="#cbd5e1" font-family="sans-serif" font-size="15">&#8226; When the active HDD hits ~70%, freeze it (read-only) and link a NEW HDD at the tail &#8212; an O(1) append: no data moves, no rebalancing.</text>
  <text x="92" y="454" fill="#cbd5e1" font-family="sans-serif" font-size="15">&#8226; Writes are never blocked &#8212; there is always an active HDD at the tail to accept them. (This is the log head from the next diagram.)</text>

  <!-- ===== Many racks ===== -->
  <text x="70" y="528" fill="#ffff99" font-family="sans-serif" font-size="18" font-weight="bold">Many racks &#8212; each rack is its own linked list</text>

  <!-- mini rack helper: 3 boxes w=68 h=44 at y=556, last one pink -->
  <!-- Rack 1 -->
  <text x="92" y="552" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="bold">Rack 1</text>
  <rect x="92" y="560" width="68" height="44" rx="4" fill="#1a1a10" stroke="#ffff99" stroke-width="2"/>
  <rect x="178" y="560" width="68" height="44" rx="4" fill="#1a1a10" stroke="#ffff99" stroke-width="2"/>
  <rect x="264" y="560" width="68" height="44" rx="4" fill="#2a1320" stroke="#ff8bd2" stroke-width="2.4"/>
  <line x1="160" y1="582" x2="176" y2="582" stroke="#ffff99" stroke-width="2" marker-end="url(#llYellow)"/>
  <line x1="246" y1="582" x2="262" y2="582" stroke="#ffff99" stroke-width="2" marker-end="url(#llYellow)"/>
  <text x="298" y="586" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="11">active</text>

  <!-- Rack 2 -->
  <text x="442" y="552" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="bold">Rack 2</text>
  <rect x="442" y="560" width="68" height="44" rx="4" fill="#1a1a10" stroke="#ffff99" stroke-width="2"/>
  <rect x="528" y="560" width="68" height="44" rx="4" fill="#1a1a10" stroke="#ffff99" stroke-width="2"/>
  <rect x="614" y="560" width="68" height="44" rx="4" fill="#2a1320" stroke="#ff8bd2" stroke-width="2.4"/>
  <line x1="510" y1="582" x2="526" y2="582" stroke="#ffff99" stroke-width="2" marker-end="url(#llYellow)"/>
  <line x1="596" y1="582" x2="612" y2="582" stroke="#ffff99" stroke-width="2" marker-end="url(#llYellow)"/>
  <text x="648" y="586" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="11">active</text>

  <!-- Rack 3 -->
  <text x="792" y="552" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="bold">Rack 3</text>
  <rect x="792" y="560" width="68" height="44" rx="4" fill="#1a1a10" stroke="#ffff99" stroke-width="2"/>
  <rect x="878" y="560" width="68" height="44" rx="4" fill="#1a1a10" stroke="#ffff99" stroke-width="2"/>
  <rect x="964" y="560" width="68" height="44" rx="4" fill="#2a1320" stroke="#ff8bd2" stroke-width="2.4"/>
  <line x1="860" y1="582" x2="876" y2="582" stroke="#ffff99" stroke-width="2" marker-end="url(#llYellow)"/>
  <line x1="946" y1="582" x2="962" y2="582" stroke="#ffff99" stroke-width="2" marker-end="url(#llYellow)"/>
  <text x="998" y="586" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="11">active</text>

  <text x="70" y="640" fill="#9aa6b2" font-family="sans-serif" font-size="14">The proxy routes each key to a rack by range; within a rack, every write appends to that rack's active HDD. Add capacity by adding HDDs or whole racks.</text>

  <!-- ===== Read tradeoff ===== -->
  <rect x="70" y="666" width="1030" height="60" rx="8" fill="#0f2417" stroke="#8aff8a" stroke-width="2"/>
  <text x="92" y="692" fill="#8aff8a" font-family="sans-serif" font-size="15" font-weight="bold">Read tradeoff</text>
  <text x="92" y="714" fill="#cbd5e1" font-family="sans-serif" font-size="14.5">A read follows the index to whichever HDD holds the bytes — frozen or active — so reads may touch older disks. Writes stay O(1) at the head; reads pay a little more.</text>

  <!-- Takeaway -->
  <rect x="70" y="744" width="1030" height="40" rx="6" fill="#1a1a10" stroke="#ffff99" stroke-width="1.5"/>
  <text x="585" y="769" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="14.5" font-weight="bold">Takeaway: a rack is a logical linked list of HDDs with an active tail — scaling out is just linking on another disk, so writes are always accepted.</text>
</svg>
