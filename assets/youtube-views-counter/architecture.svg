<svg width="1440" height="880" viewBox="0 0 1440 880" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="m-w" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#cbd5e1"/></marker>
    <marker id="m-p" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ff8bd2"/></marker>
    <marker id="m-r" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ff8a8a"/></marker>
    <marker id="m-b" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#93c5fd"/></marker>
    <marker id="m-g" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aff8a"/></marker>
    <marker id="m-y" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ffff99"/></marker>
  </defs>
  <rect x="0" y="0" width="1440" height="880" fill="#111317"/>

  <text x="720" y="46" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="32" font-weight="bold">The Whole View-Counter Pipeline</text>
  <text x="720" y="78" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">absorb the firehose &#8594; filter once &#8594; fan out &#8594; batch-and-count in a video-partitioned fleet</text>

  <!-- viewers -->
  <g stroke="#ff8bd2" stroke-width="2.5" fill="none">
    <circle cx="62" cy="200" r="12"/><line x1="62" y1="212" x2="62" y2="242"/><line x1="62" y1="221" x2="48" y2="234"/><line x1="62" y1="221" x2="76" y2="234"/><line x1="62" y1="242" x2="49" y2="264"/><line x1="62" y1="242" x2="75" y2="264"/>
    <circle cx="62" cy="290" r="12"/><line x1="62" y1="302" x2="62" y2="332"/><line x1="62" y1="311" x2="48" y2="324"/><line x1="62" y1="311" x2="76" y2="324"/><line x1="62" y1="332" x2="49" y2="354"/><line x1="62" y1="332" x2="75" y2="354"/>
  </g>
  <text x="62" y="386" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13">viewers</text>
  <text x="62" y="404" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="11.5">heartbeat / few s</text>

  <line x1="92" y1="245" x2="142" y2="255" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#m-p)"/>
  <line x1="92" y1="290" x2="142" y2="280" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#m-p)"/>

  <!-- Watchtime API fleet -->
  <rect x="156" y="222" width="120" height="64" rx="10" fill="#241019" stroke="#ff8bd2" stroke-width="2"/>
  <rect x="150" y="228" width="120" height="64" rx="10" fill="#2a1622" stroke="#ff8bd2" stroke-width="2.5"/>
  <text x="210" y="254" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="13.5" font-weight="bold">Watchtime</text>
  <text x="210" y="273" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="13.5" font-weight="bold">API (producer)</text>
  <text x="210" y="312" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11.5">append &amp; return; no DB</text>

  <text x="318" y="244" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="12" font-weight="bold">1 INGEST</text>
  <line x1="270" y1="260" x2="338" y2="260" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#m-p)"/>

  <!-- Kafka #1 -->
  <rect x="342" y="242" width="250" height="36" rx="18" fill="#16202e" stroke="#93c5fd" stroke-width="2.5"/>
  <line x1="360" y1="251" x2="574" y2="251" stroke="#ffff99" stroke-width="1" opacity="0.5"/>
  <line x1="360" y1="260" x2="574" y2="260" stroke="#ffff99" stroke-width="1" opacity="0.5"/>
  <line x1="360" y1="269" x2="574" y2="269" stroke="#ffff99" stroke-width="1" opacity="0.5"/>
  <circle cx="360" cy="260" r="10" fill="#16202e" stroke="#93c5fd" stroke-width="2.5"/>
  <circle cx="574" cy="260" r="10" fill="#16202e" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="467" y="306" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="13" font-weight="bold">Kafka #1 (raw firehose)</text>
  <text x="467" y="324" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11.5">log, ~1M+/sec &#183; partition by video_id</text>

  <text x="618" y="244" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="12" font-weight="bold">2 FILTER</text>
  <line x1="592" y1="260" x2="650" y2="260" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#m-b)"/>

  <!-- Rules DB -->
  <path d="M628,110 L628,160 A38,11 0 0 0 704,160 L704,110" fill="#20200f" stroke="#ffff99" stroke-width="2.5"/>
  <ellipse cx="666" cy="110" rx="38" ry="11" fill="#20200f" stroke="#ffff99" stroke-width="2.5"/>
  <text x="666" y="142" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="13" font-weight="bold">Rules DB</text>
  <line x1="666" y1="171" x2="666" y2="222" stroke="#ffff99" stroke-width="2" marker-end="url(#m-y)"/>
  <text x="730" y="196" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11">consult rules</text>

  <!-- Rule Engine fleet -->
  <rect x="660" y="232" width="120" height="64" rx="10" fill="#1a1a10" stroke="#ffff99" stroke-width="2"/>
  <rect x="654" y="238" width="120" height="64" rx="10" fill="#20200f" stroke="#ffff99" stroke-width="2.5"/>
  <text x="714" y="264" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="13.5" font-weight="bold">Rule Engine</text>
  <text x="714" y="284" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">drop non-views</text>

  <text x="822" y="244" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="12" font-weight="bold">3 FAN OUT</text>
  <line x1="774" y1="270" x2="838" y2="270" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#m-b)"/>
  <text x="806" y="290" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="11">clean stream</text>

  <!-- Kafka #2 -->
  <rect x="842" y="252" width="250" height="36" rx="18" fill="#16202e" stroke="#93c5fd" stroke-width="2.5"/>
  <line x1="860" y1="261" x2="1074" y2="261" stroke="#ffff99" stroke-width="1" opacity="0.5"/>
  <line x1="860" y1="270" x2="1074" y2="270" stroke="#ffff99" stroke-width="1" opacity="0.5"/>
  <line x1="860" y1="279" x2="1074" y2="279" stroke="#ffff99" stroke-width="1" opacity="0.5"/>
  <circle cx="860" cy="270" r="10" fill="#16202e" stroke="#93c5fd" stroke-width="2.5"/>
  <circle cx="1074" cy="270" r="10" fill="#16202e" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="967" y="232" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="13" font-weight="bold">Kafka #2 (filtered-views)</text>
  <text x="967" y="320" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11.5">single source of clean truth</text>

  <text x="1118" y="240" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="12" font-weight="bold">4 COUNT</text>
  <line x1="1092" y1="262" x2="1150" y2="262" stroke="#ffff99" stroke-width="2.5" marker-end="url(#m-y)"/>

  <!-- Views Counter fleet -->
  <rect x="1160" y="224" width="130" height="68" rx="10" fill="#1a1a10" stroke="#ffff99" stroke-width="2"/>
  <rect x="1154" y="230" width="130" height="68" rx="10" fill="#20200f" stroke="#ffff99" stroke-width="2.5"/>
  <text x="1219" y="256" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="13.5" font-weight="bold">Views Counter</text>
  <text x="1219" y="276" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">batch, partition</text>
  <text x="1219" y="292" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">by video, += n</text>

  <line x1="1219" y1="298" x2="1219" y2="346" stroke="#ffff99" stroke-width="2.5" marker-end="url(#m-y)"/>
  <text x="1300" y="326" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11">batched writes</text>

  <!-- Count DB -->
  <path d="M1181,350 L1181,408 A38,11 0 0 0 1257,408 L1257,350" fill="#20200f" stroke="#ffff99" stroke-width="2.5"/>
  <ellipse cx="1219" cy="350" rx="38" ry="11" fill="#20200f" stroke="#ffff99" stroke-width="2.5"/>
  <text x="1219" y="384" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="13" font-weight="bold">Count DB</text>
  <text x="1118" y="400" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11">count + offset</text>

  <!-- downstream consumers from Kafka #2 -->
  <line x1="940" y1="288" x2="900" y2="470" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#m-b)"/>
  <line x1="1000" y1="288" x2="1060" y2="470" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#m-b)"/>

  <rect x="820" y="474" width="150" height="60" rx="10" fill="#16202e" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="895" y="500" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="13.5" font-weight="bold">Monetization</text>
  <text x="895" y="520" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">payouts &amp; ad revenue</text>

  <rect x="998" y="474" width="150" height="60" rx="10" fill="#16202e" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="1073" y="500" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="13.5" font-weight="bold">Recommendations</text>
  <text x="1073" y="520" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">same clean events</text>

  <text x="983" y="566" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">independent consumer groups &#8212; filter once, fan out many</text>

  <!-- READ PATH -->
  <text x="1297" y="460" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="12" font-weight="bold">5 READ</text>
  <path d="M1257,379 A60,60 0 0 1 1320,440 L1320,478" fill="none" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#m-g)"/>
  <path d="M1283,490 L1338,490 A36,11 0 0 0 1338,538 L1283,538 A36,11 0 0 0 1283,490" fill="#0f2417" stroke="#8aff8a" stroke-width="2.5"/>
  <ellipse cx="1283" cy="514" rx="36" ry="11" fill="#0f2417" stroke="#8aff8a" stroke-width="2.5"/>
  <text x="1310" y="518" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="12.5" font-weight="bold">Cache</text>
  <g stroke="#8aff8a" stroke-width="2.5" fill="none">
    <circle cx="1240" cy="610" r="12"/><line x1="1240" y1="622" x2="1240" y2="652"/><line x1="1240" y1="631" x2="1226" y2="644"/><line x1="1240" y1="631" x2="1254" y2="644"/><line x1="1240" y1="652" x2="1227" y2="674"/><line x1="1240" y1="652" x2="1253" y2="674"/>
  </g>
  <line x1="1268" y1="620" x2="1300" y2="544" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#m-g)"/>
  <text x="1200" y="700" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="11.5">video page: cached point read</text>
  <text x="1200" y="718" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11">of the pre-aggregated row</text>

  <!-- anti-pattern callouts -->
  <path d="M210,300 C320,625 820,648 1130,620 C1175,610 1219,556 1219,416" fill="none" stroke="#ff8a8a" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#m-r)"/>
  <text x="560" y="690" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="14" font-weight="bold">&#10007; never write a raw view straight to the DB</text>
  <text x="560" y="712" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">(Section 1: the hot-row melt)</text>

  <text x="714" y="356" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="13" font-weight="bold">&#10007; not three rule engines &#8212; one</text>
  <text x="714" y="376" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11.5">(Section 4: filter once, reuse the clean stream)</text>

  <!-- legend -->
  <rect x="60" y="772" width="1320" height="76" rx="12" fill="#16191e" stroke="#3a3f47" stroke-width="1.5"/>
  <text x="80" y="800" fill="#cbd5e1" font-family="sans-serif" font-size="14" font-weight="bold">Legend</text>
  <rect x="160" y="790" width="20" height="14" rx="3" fill="#2a1622" stroke="#ff8bd2" stroke-width="2"/><text x="188" y="802" fill="#cbd5e1" font-family="sans-serif" font-size="13">view / write path</text>
  <rect x="340" y="790" width="20" height="14" rx="3" fill="#16202e" stroke="#93c5fd" stroke-width="2"/><text x="368" y="802" fill="#cbd5e1" font-family="sans-serif" font-size="13">Kafka / async transport &amp; consumers</text>
  <rect x="700" y="790" width="20" height="14" rx="3" fill="#20200f" stroke="#ffff99" stroke-width="2"/><text x="728" y="802" fill="#cbd5e1" font-family="sans-serif" font-size="13">durable storage / rules / count</text>
  <rect x="1000" y="790" width="20" height="14" rx="3" fill="#0f2417" stroke="#8aff8a" stroke-width="2"/><text x="1028" y="802" fill="#cbd5e1" font-family="sans-serif" font-size="13">read / serve path</text>
  <rect x="1180" y="790" width="20" height="14" rx="3" fill="#2a1414" stroke="#ff8a8a" stroke-width="2"/><text x="1208" y="802" fill="#cbd5e1" font-family="sans-serif" font-size="13">the failure we avoid</text>
  <text x="80" y="832" fill="#9aa6b2" font-family="sans-serif" font-size="13">Each layer answers one failure; the database only ever sees a trickle of pre-aggregated writes.</text>
</svg>
