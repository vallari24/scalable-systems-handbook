<svg width="1000" height="820" viewBox="0 0 1000 820" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="m-w" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#cbd5e1"/></marker>
    <marker id="m-r" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ff8a8a"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="820" fill="#111317"/>

  <text x="500" y="46" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="30" font-weight="bold">The Brief: A View Counter</text>
  <text x="500" y="76" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">it&#8217;s a write-throughput problem, not a counting problem</text>

  <!-- thumbnail + number -->
  <rect x="400" y="104" width="200" height="112" rx="10" fill="#16191e" stroke="#cbd5e1" stroke-width="2.5"/>
  <polygon points="478,138 478,182 516,160" fill="#ff8a8a"/>
  <text x="500" y="246" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="26" font-weight="bold">1,402,318 views</text>
  <text x="500" y="270" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="14">the easy part: an integer</text>

  <!-- three requirements -->
  <text x="500" y="312" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="16" font-weight="bold">Three requirements &#8212; each forces a layer later in the post</text>

  <rect x="40" y="332" width="296" height="150" rx="12" fill="#2a1622" stroke="#ff8bd2" stroke-width="2.5"/>
  <text x="188" y="360" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="16" font-weight="bold">1 &#183; Count views</text>
  <text x="188" y="386" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">every watch is an event;</text>
  <text x="188" y="406" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">millions per second</text>
  <text x="188" y="438" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="13" font-weight="bold">&#8594; the hard part is</text>
  <text x="188" y="458" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="13" font-weight="bold">INGESTION, not storage</text>

  <rect x="352" y="332" width="296" height="150" rx="12" fill="#20200f" stroke="#ffff99" stroke-width="2.5"/>
  <text x="500" y="360" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="16" font-weight="bold">2 &#183; Filter views</text>
  <text x="500" y="386" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">own-views, bots, replays,</text>
  <text x="500" y="406" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">2-second mis-taps</text>
  <text x="500" y="438" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="13" font-weight="bold">&#8594; a RULE ENGINE drops</text>
  <text x="500" y="458" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="13" font-weight="bold">what doesn&#8217;t count</text>

  <rect x="664" y="332" width="296" height="150" rx="12" fill="#0f2417" stroke="#8aff8a" stroke-width="2.5"/>
  <text x="812" y="360" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="16" font-weight="bold">3 &#183; Eventually consistent</text>
  <text x="812" y="386" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">off by a few for a few</text>
  <text x="812" y="406" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">seconds harms no one</text>
  <text x="812" y="438" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13" font-weight="bold">&#8594; trade real-time exactness</text>
  <text x="812" y="458" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13" font-weight="bold">for THROUGHPUT</text>

  <!-- three hard problems -->
  <text x="500" y="528" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="16" font-weight="bold">The three hard problems, attacked in order</text>
  <rect x="60" y="548" width="270" height="92" rx="10" fill="#2a1414" stroke="#ff8a8a" stroke-width="2"/>
  <text x="195" y="582" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="15" font-weight="bold">INGESTION</text>
  <text x="195" y="608" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">absorb millions of writes/sec</text>
  <text x="195" y="626" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">nowhere near a database</text>

  <rect x="365" y="548" width="270" height="92" rx="10" fill="#16202e" stroke="#93c5fd" stroke-width="2"/>
  <text x="500" y="582" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="15" font-weight="bold">FILTERING</text>
  <text x="500" y="608" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">run the rule engine cheaply,</text>
  <text x="500" y="626" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">once, and reuse the result</text>

  <rect x="670" y="548" width="270" height="92" rx="10" fill="#20200f" stroke="#ffff99" stroke-width="2"/>
  <text x="805" y="582" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="15" font-weight="bold">AGGREGATION</text>
  <text x="805" y="608" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">collapse a billion +1&#8217;s</text>
  <text x="805" y="626" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">into a handful of writes</text>

  <!-- the unlock banner -->
  <rect x="60" y="676" width="880" height="104" rx="12" fill="#1c1320" stroke="#ff8bd2" stroke-width="2.5"/>
  <text x="500" y="708" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="16" font-weight="bold">THE UNLOCK</text>
  <text x="500" y="736" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="15">You are never allowed to write a raw view straight to the database.</text>
  <text x="500" y="762" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="14">Every layer below exists to keep that load away from storage until it&#8217;s filtered and batched.</text>
</svg>
