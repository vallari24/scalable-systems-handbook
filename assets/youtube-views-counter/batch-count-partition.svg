<svg width="1180" height="720" viewBox="0 0 1180 720" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="m-p" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ff8bd2"/></marker>
    <marker id="m-r" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ff8a8a"/></marker>
    <marker id="m-b" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#93c5fd"/></marker>
    <marker id="m-g" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aff8a"/></marker>
    <marker id="m-w" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#cbd5e1"/></marker>
    <marker id="m-y" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ffff99"/></marker>
  </defs>
  <rect x="0" y="0" width="1180" height="720" fill="#111317"/>

  <text x="590" y="44" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="30" font-weight="bold">Counting: Partition by Video, Then Batch</text>
  <text x="590" y="74" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">a million +1 increments become a handful of writes</text>

  <!-- clean event stream -->
  <text x="60" y="120" fill="#9aa6b2" font-family="sans-serif" font-size="13">clean events arriving (key = video id):</text>
  <text x="60" y="146" fill="#cbd5e1" font-family="monospace" font-size="16" font-weight="bold">A A A B C A D B A B A A D C B A</text>
  <line x1="255" y1="156" x2="255" y2="180" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#m-w)"/>
  <text x="372" y="172" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">same video id &#8594; same partition</text>

  <!-- kafka tube with partitions -->
  <rect x="140" y="184" width="232" height="160" rx="14" fill="#16202e" stroke="#93c5fd" stroke-width="2.5"/>
  <ellipse cx="372" cy="264" rx="11" ry="80" fill="#16202e" stroke="#93c5fd" stroke-width="2.5"/>
  <line x1="151" y1="224" x2="361" y2="224" stroke="#93c5fd" stroke-width="1.3" stroke-dasharray="4 4"/>
  <line x1="151" y1="264" x2="361" y2="264" stroke="#93c5fd" stroke-width="1.3" stroke-dasharray="4 4"/>
  <line x1="151" y1="304" x2="361" y2="304" stroke="#93c5fd" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="210" y="210" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="15" font-weight="bold">P0 : A</text>
  <text x="210" y="250" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="15" font-weight="bold">P1 : B</text>
  <text x="210" y="290" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="15" font-weight="bold">P2 : C</text>
  <text x="210" y="330" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="15" font-weight="bold">P3 : D</text>
  <text x="246" y="372" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="13" font-weight="bold">Kafka #2 &#8212; partition = hash(video_id)</text>

  <!-- counter consumers -->
  <rect x="452" y="184" width="172" height="48" rx="10" fill="#0f2417" stroke="#8aff8a" stroke-width="2.5"/>
  <text x="538" y="205" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13" font-weight="bold">Counter (P0)</text>
  <text x="538" y="223" text-anchor="middle" fill="#ffff99" font-family="monospace" font-size="13" font-weight="bold">tally  A: +7</text>

  <rect x="452" y="242" width="172" height="34" rx="9" fill="#16191e" stroke="#cbd5e1" stroke-width="2"/>
  <text x="538" y="264" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="bold">Counter (P1)</text>
  <rect x="452" y="286" width="172" height="34" rx="9" fill="#16191e" stroke="#cbd5e1" stroke-width="2"/>
  <text x="538" y="308" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="bold">Counter (P2)</text>
  <rect x="452" y="330" width="172" height="34" rx="9" fill="#16191e" stroke="#cbd5e1" stroke-width="2"/>
  <text x="538" y="352" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="bold">Counter (P3)</text>

  <line x1="383" y1="206" x2="448" y2="206" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#m-g)"/>
  <line x1="383" y1="248" x2="448" y2="257" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#m-w)"/>
  <line x1="383" y1="282" x2="448" y2="301" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#m-w)"/>
  <line x1="383" y1="318" x2="448" y2="345" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#m-w)"/>

  <text x="538" y="382" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">BATCHING: tally in memory for a window, flush the SUM once</text>

  <!-- batched write SQL -->
  <rect x="690" y="196" width="378" height="78" rx="10" fill="#16191e" stroke="#ffff99" stroke-width="2.5"/>
  <text x="706" y="220" fill="#ffff99" font-family="sans-serif" font-size="13" font-weight="bold">batched write (one per video / window)</text>
  <text x="706" y="244" fill="#cbd5e1" font-family="monospace" font-size="12.5">UPDATE counts SET views=views+7 WHERE id='A'</text>
  <text x="706" y="264" fill="#9aa6b2" font-family="sans-serif" font-size="11.5">one write per video per window, not one per event</text>

  <line x1="624" y1="216" x2="686" y2="226" stroke="#ffff99" stroke-width="2.5" marker-end="url(#m-y)"/>
  <text x="654" y="206" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="11" font-weight="bold">flush</text>

  <!-- count db -->
  <path d="M1078,212 L1078,252 A30,9 0 0 0 1138,252 L1138,212" fill="#20200f" stroke="#ffff99" stroke-width="2.5"/>
  <ellipse cx="1108" cy="212" rx="30" ry="9" fill="#20200f" stroke="#ffff99" stroke-width="2.5"/>
  <text x="1108" y="284" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="13" font-weight="bold">Count DB</text>
  <line x1="1068" y1="234" x2="1095" y2="234" stroke="#ffff99" stroke-width="2.5" marker-end="url(#m-y)"/>

  <!-- before / after -->
  <rect x="60" y="410" width="498" height="60" rx="10" fill="#2a1414" stroke="#ff8a8a" stroke-width="2.5"/>
  <text x="80" y="434" fill="#ff8a8a" font-family="sans-serif" font-size="14" font-weight="bold">BEFORE batching</text>
  <text x="80" y="457" fill="#cbd5e1" font-family="sans-serif" font-size="14">1,000,000 events &#8594; 1,000,000 writes &#160;&#160;(DB melts)</text>

  <rect x="622" y="410" width="498" height="60" rx="10" fill="#0f2417" stroke="#8aff8a" stroke-width="2.5"/>
  <text x="642" y="434" fill="#8aff8a" font-family="sans-serif" font-size="14" font-weight="bold">AFTER batching</text>
  <text x="642" y="457" fill="#cbd5e1" font-family="sans-serif" font-size="14">1,000,000 events &#8594; a few thousand writes &#160;&#160;(survives)</text>

  <line x1="558" y1="440" x2="618" y2="440" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#m-g)"/>

  <!-- reasons key must be video_id -->
  <text x="590" y="506" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="15" font-weight="bold">Why the partition key MUST be video_id</text>

  <rect x="60" y="520" width="510" height="66" rx="10" fill="#20200f" stroke="#ffff99" stroke-width="2"/>
  <text x="80" y="544" fill="#ffff99" font-family="sans-serif" font-size="14" font-weight="bold">(1) CORRECTNESS</text>
  <text x="80" y="566" fill="#cbd5e1" font-family="sans-serif" font-size="13">all of a video's events land on one consumer; it alone owns the</text>
  <text x="80" y="582" fill="#cbd5e1" font-family="sans-serif" font-size="13">count and batches with no lock or cross-machine coordination</text>

  <rect x="610" y="520" width="510" height="66" rx="10" fill="#20200f" stroke="#ffff99" stroke-width="2"/>
  <text x="630" y="544" fill="#ffff99" font-family="sans-serif" font-size="14" font-weight="bold">(2) NO CONTENTION</text>
  <text x="630" y="566" fill="#cbd5e1" font-family="sans-serif" font-size="13">different videos are counted on different machines in</text>
  <text x="630" y="582" fill="#cbd5e1" font-family="sans-serif" font-size="13">parallel &#8212; there is no single hot row</text>

  <!-- warning -->
  <rect x="60" y="604" width="1060" height="54" rx="10" fill="#2a1414" stroke="#ff8a8a" stroke-width="2.5"/>
  <text x="590" y="628" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="13.5" font-weight="bold">Partition by user_id or randomly, and one video's events scatter across every consumer &#8212;</text>
  <text x="590" y="648" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">they all fight over the same row again, re-creating the Section&#160;1 hot row.</text>

  <text x="590" y="694" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13.5">Partition by video so each video has one owner; batch increments so a million events become a handful of writes.</text>
</svg>
