<svg width="1180" height="660" viewBox="0 0 1180 660" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="m-w" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#cbd5e1"/></marker>
    <marker id="m-p" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ff8bd2"/></marker>
    <marker id="m-r" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ff8a8a"/></marker>
  </defs>
  <rect x="0" y="0" width="1180" height="660" fill="#111317"/>

  <text x="590" y="44" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="30" font-weight="bold">Day Zero: The View, Written Straight to the Database</text>
  <text x="590" y="74" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">logically perfect, operationally fatal</text>
  <line x1="590" y1="98" x2="590" y2="624" stroke="#3a3f47" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- LEFT: naive design -->
  <text x="295" y="128" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="17" font-weight="bold">The naive design works &#8212; at small scale</text>

  <g stroke="#ff8bd2" stroke-width="2.5" fill="none">
    <circle cx="78" cy="200" r="13"/><line x1="78" y1="213" x2="78" y2="246"/><line x1="78" y1="223" x2="62" y2="237"/><line x1="78" y1="223" x2="94" y2="237"/><line x1="78" y1="246" x2="63" y2="270"/><line x1="78" y1="246" x2="93" y2="270"/>
    <circle cx="78" cy="320" r="13"/><line x1="78" y1="333" x2="78" y2="366"/><line x1="78" y1="343" x2="62" y2="357"/><line x1="78" y1="343" x2="94" y2="357"/><line x1="78" y1="366" x2="63" y2="390"/><line x1="78" y1="366" x2="93" y2="390"/>
  </g>
  <text x="78" y="416" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13">viewers</text>
  <line x1="110" y1="240" x2="178" y2="258" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#m-p)"/>
  <line x1="110" y1="320" x2="178" y2="288" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#m-p)"/>
  <text x="148" y="232" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="12">view event</text>

  <rect x="182" y="244" width="120" height="58" rx="10" fill="#16191e" stroke="#cbd5e1" stroke-width="2.5"/>
  <text x="242" y="270" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="14" font-weight="bold">API</text>
  <text x="242" y="290" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">server</text>

  <line x1="304" y1="273" x2="388" y2="273" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#m-p)"/>
  <text x="346" y="262" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="11.5">views += 1</text>

  <!-- counts DB cylinder -->
  <path d="M392,250 L392,316 A40,12 0 0 0 472,316 L472,250" fill="#20200f" stroke="#ffff99" stroke-width="2.5"/>
  <ellipse cx="432" cy="250" rx="40" ry="12" fill="#20200f" stroke="#ffff99" stroke-width="2.5"/>
  <text x="432" y="290" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="13" font-weight="bold">Counts DB</text>

  <rect x="60" y="452" width="470" height="128" rx="12" fill="#0f2417" stroke="#8aff8a" stroke-width="2"/>
  <text x="295" y="482" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="14" font-weight="bold">UPDATE videos SET views = views + 1 WHERE id = v</text>
  <text x="295" y="514" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">A view happened; we added one; a read returns the</text>
  <text x="295" y="534" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">right number. For a thousand views a day this is</text>
  <text x="295" y="554" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">not just fine &#8212; it&#8217;s correct. Don&#8217;t over-build.</text>

  <!-- RIGHT: why it melts -->
  <text x="885" y="128" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="17" font-weight="bold">&#8230; but millions on ONE video melt it</text>

  <g stroke="#ff8a8a" stroke-width="2" fill="none" opacity="0.9">
    <circle cx="650" cy="190" r="11"/><line x1="650" y1="201" x2="650" y2="228"/><line x1="650" y1="209" x2="637" y2="221"/><line x1="650" y1="209" x2="663" y2="221"/><line x1="650" y1="228" x2="638" y2="248"/><line x1="650" y1="228" x2="662" y2="248"/>
    <circle cx="650" cy="262" r="11"/><line x1="650" y1="273" x2="650" y2="300"/><line x1="650" y1="281" x2="637" y2="293"/><line x1="650" y1="281" x2="663" y2="293"/><line x1="650" y1="300" x2="638" y2="320"/><line x1="650" y1="300" x2="662" y2="320"/>
    <circle cx="650" cy="334" r="11"/><line x1="650" y1="345" x2="650" y2="372"/><line x1="650" y1="353" x2="637" y2="365"/><line x1="650" y1="353" x2="663" y2="365"/><line x1="650" y1="372" x2="638" y2="392"/><line x1="650" y1="372" x2="662" y2="392"/>
  </g>
  <text x="650" y="416" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="12.5">millions, one video</text>

  <line x1="678" y1="262" x2="754" y2="276" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#m-r)"/>
  <line x1="678" y1="320" x2="754" y2="296" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#m-r)"/>

  <!-- the hot row -->
  <rect x="758" y="258" width="120" height="56" rx="10" fill="#2a1414" stroke="#ff8a8a" stroke-width="2.5"/>
  <text x="818" y="282" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="13" font-weight="bold">the HOT ROW</text>
  <text x="818" y="301" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">one row, all +1&#8217;s</text>

  <!-- three failures -->
  <rect x="908" y="170" width="246" height="58" rx="9" fill="#2a1414" stroke="#ff8a8a" stroke-width="2"/>
  <text x="1031" y="194" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="13" font-weight="bold">1 &#183; Row-lock contention</text>
  <text x="1031" y="214" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">writes serialize behind one lock</text>

  <rect x="908" y="238" width="246" height="58" rx="9" fill="#2a1414" stroke="#ff8a8a" stroke-width="2"/>
  <text x="1031" y="262" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="13" font-weight="bold">2 &#183; Write amplification</text>
  <text x="1031" y="282" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">a full WAL flush per +1</text>

  <rect x="908" y="306" width="246" height="58" rx="9" fill="#2a1414" stroke="#ff8a8a" stroke-width="2"/>
  <text x="1031" y="330" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="13" font-weight="bold">3 &#183; IOPS / conn exhaustion</text>
  <text x="1031" y="350" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">past the pool and disk budget</text>

  <line x1="878" y1="276" x2="904" y2="248" stroke="#ff8a8a" stroke-width="2" marker-end="url(#m-r)"/>
  <line x1="878" y1="286" x2="904" y2="288" stroke="#ff8a8a" stroke-width="2" marker-end="url(#m-r)"/>
  <line x1="878" y1="296" x2="904" y2="328" stroke="#ff8a8a" stroke-width="2" marker-end="url(#m-r)"/>

  <rect x="636" y="452" width="498" height="128" rx="12" fill="#2a1414" stroke="#ff8a8a" stroke-width="2.5"/>
  <text x="885" y="484" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="14" font-weight="bold">The database is the bottleneck &#8212;</text>
  <text x="885" y="506" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="14" font-weight="bold">and adding API servers makes it WORSE.</text>
  <text x="885" y="534" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">More servers just hammer the one hot row harder. And the</text>
  <text x="885" y="554" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">heartbeat re-emits every few seconds &#8212; dozens of writes per view.</text>
</svg>
