<svg width="1180" height="780" viewBox="0 0 1180 780" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1180" height="780" fill="#111317"/>
  <defs>
    <marker id="ec" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#cbd5e1"/></marker>
    <marker id="eg" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#8aff8a"/></marker>
  </defs>

  <text x="590" y="44" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="26" font-weight="bold">A worked example: Airbyte EL + dbt transform</text>
  <text x="590" y="72" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="15">extract-load with a connector (raw, untyped) &#8594; transform with SQL (typed, modeled)</text>

  <!-- stage labels -->
  <text x="160" y="120" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="15" font-weight="bold">SOURCE row</text>
  <text x="490" y="120" text-anchor="middle" fill="#ffd27f" font-family="sans-serif" font-size="15" font-weight="bold">AIRBYTE &#8594; RAW landed</text>
  <text x="900" y="120" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="15" font-weight="bold">dbt &#8594; MODELED table</text>

  <!-- source row -->
  <rect x="40" y="140" width="240" height="180" rx="8" fill="#0d1117" stroke="#ff8a8a" stroke-width="1.5"/>
  <text x="56" y="166" fill="#9aa6b2" font-family="monospace" font-size="11.5">postgres.public.orders</text>
  <text x="56" y="192" fill="#cbd5e1" font-family="monospace" font-size="12">id        = 91</text>
  <text x="56" y="214" fill="#cbd5e1" font-family="monospace" font-size="12">total     = 4999</text>
  <text x="56" y="236" fill="#cbd5e1" font-family="monospace" font-size="12">currency  = "INR"</text>
  <text x="56" y="258" fill="#cbd5e1" font-family="monospace" font-size="12">status    = "SHIPPED"</text>
  <text x="56" y="280" fill="#cbd5e1" font-family="monospace" font-size="12">created   = 2023-07-02</text>
  <text x="56" y="306" fill="#9aa6b2" font-family="monospace" font-size="11">cursor: updated_at</text>

  <!-- airbyte raw -->
  <line x1="282" y1="230" x2="354" y2="230" stroke="#ffd27f" stroke-width="2.5" marker-end="url(#ec)"/>
  <rect x="358" y="140" width="280" height="180" rx="8" fill="#0d1117" stroke="#ffd27f" stroke-width="1.5"/>
  <text x="374" y="166" fill="#9aa6b2" font-family="monospace" font-size="11">_airbyte_raw_orders</text>
  <text x="374" y="190" fill="#cbd5e1" font-family="monospace" font-size="11.5"><tspan fill="#93c5fd">_airbyte_ab_id</tspan>: "9f3c.."</text>
  <text x="374" y="212" fill="#cbd5e1" font-family="monospace" font-size="11.5"><tspan fill="#93c5fd">_emitted_at</tspan>: 1718..</text>
  <text x="374" y="234" fill="#cbd5e1" font-family="monospace" font-size="11.5"><tspan fill="#93c5fd">_airbyte_data</tspan>: {</text>
  <text x="374" y="254" fill="#cbd5e1" font-family="monospace" font-size="11.5">   "id":91,"total":4999,</text>
  <text x="374" y="272" fill="#cbd5e1" font-family="monospace" font-size="11.5">   "status":"SHIPPED" }</text>
  <text x="374" y="300" fill="#9aa6b2" font-family="sans-serif" font-size="11.5">whole row as one JSON blob</text>

  <!-- dbt modeled -->
  <line x1="640" y1="230" x2="712" y2="230" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#eg)"/>
  <rect x="716" y="140" width="290" height="180" rx="8" fill="#0d1117" stroke="#8aff8a" stroke-width="1.5"/>
  <text x="732" y="166" fill="#9aa6b2" font-family="monospace" font-size="11">analytics.orders (typed)</text>
  <text x="732" y="190" fill="#cbd5e1" font-family="monospace" font-size="12">order_id    INT    91</text>
  <text x="732" y="212" fill="#cbd5e1" font-family="monospace" font-size="12">total_inr   DECIMAL 49.99</text>
  <text x="732" y="234" fill="#cbd5e1" font-family="monospace" font-size="12">status      ENUM   SHIPPED</text>
  <text x="732" y="256" fill="#cbd5e1" font-family="monospace" font-size="12">order_date  DATE   2023-07-02</text>
  <text x="732" y="278" fill="#cbd5e1" font-family="monospace" font-size="12">items[]     denormalized</text>
  <text x="732" y="304" fill="#8aff8a" font-family="sans-serif" font-size="11.5">cleaned, typed, partitioned</text>

  <!-- config block -->
  <rect x="40" y="350" width="600" height="390" rx="10" fill="#0d1117" stroke="#3a3f47" stroke-width="1.5"/>
  <text x="60" y="380" fill="#ffd27f" font-family="sans-serif" font-size="15" font-weight="bold">Airbyte connection config (the EL step)</text>
  <text x="60" y="410" fill="#cbd5e1" font-family="monospace" font-size="13"><tspan fill="#93c5fd">source</tspan>:</text>
  <text x="60" y="430" fill="#cbd5e1" font-family="monospace" font-size="13">  type: postgres</text>
  <text x="60" y="450" fill="#cbd5e1" font-family="monospace" font-size="13">  host: orders-db.prod   schema: public</text>
  <text x="60" y="470" fill="#cbd5e1" font-family="monospace" font-size="13">  replication: <tspan fill="#8aff8a">CDC (logical decoding)</tspan></text>
  <text x="60" y="494" fill="#cbd5e1" font-family="monospace" font-size="13"><tspan fill="#93c5fd">destination</tspan>:</text>
  <text x="60" y="514" fill="#cbd5e1" font-family="monospace" font-size="13">  type: s3   format: parquet</text>
  <text x="60" y="534" fill="#cbd5e1" font-family="monospace" font-size="13">  bucket: orders-lake/bronze</text>
  <text x="60" y="558" fill="#cbd5e1" font-family="monospace" font-size="13"><tspan fill="#93c5fd">stream</tspan> orders:</text>
  <text x="60" y="578" fill="#cbd5e1" font-family="monospace" font-size="13">  sync_mode: <tspan fill="#8aff8a">incremental | append_dedup</tspan></text>
  <text x="60" y="598" fill="#cbd5e1" font-family="monospace" font-size="13">  cursor_field: updated_at   <tspan fill="#9aa6b2"># watermark</tspan></text>
  <text x="60" y="618" fill="#cbd5e1" font-family="monospace" font-size="13">  primary_key: id            <tspan fill="#9aa6b2"># idempotent upsert</tspan></text>
  <text x="60" y="642" fill="#cbd5e1" font-family="monospace" font-size="13"><tspan fill="#93c5fd">schedule</tspan>: every 1h</text>
  <text x="60" y="676" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">Airbyte handles extract, incremental cursor, schema</text>
  <text x="60" y="696" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">detection, and dedup-on-primary-key automatically.</text>
  <text x="60" y="722" fill="#ffd27f" font-family="sans-serif" font-size="12.5">It does NOT transform &#8212; it lands raw. That's the "EL".</text>

  <!-- dbt block -->
  <rect x="660" y="350" width="480" height="390" rx="10" fill="#0d1117" stroke="#3a3f47" stroke-width="1.5"/>
  <text x="680" y="380" fill="#8aff8a" font-family="sans-serif" font-size="15" font-weight="bold">dbt model (the T step, plain SQL)</text>
  <text x="680" y="408" fill="#cbd5e1" font-family="monospace" font-size="12.5"><tspan fill="#9aa6b2">-- models/orders.sql</tspan></text>
  <text x="680" y="428" fill="#cbd5e1" font-family="monospace" font-size="12.5"><tspan fill="#ff8bd2">SELECT</tspan></text>
  <text x="680" y="448" fill="#cbd5e1" font-family="monospace" font-size="12.5">  (_airbyte_data-&gt;&gt;'id')::int   <tspan fill="#ff8bd2">AS</tspan> order_id,</text>
  <text x="680" y="468" fill="#cbd5e1" font-family="monospace" font-size="12.5">  (_airbyte_data-&gt;&gt;'total')::dec/100 <tspan fill="#ff8bd2">AS</tspan> total_inr,</text>
  <text x="680" y="488" fill="#cbd5e1" font-family="monospace" font-size="12.5">  (_airbyte_data-&gt;&gt;'status')      <tspan fill="#ff8bd2">AS</tspan> status,</text>
  <text x="680" y="508" fill="#cbd5e1" font-family="monospace" font-size="12.5">  (_airbyte_data-&gt;&gt;'created')::date <tspan fill="#ff8bd2">AS</tspan> order_date</text>
  <text x="680" y="528" fill="#cbd5e1" font-family="monospace" font-size="12.5"><tspan fill="#ff8bd2">FROM</tspan> _airbyte_raw_orders</text>
  <text x="680" y="548" fill="#cbd5e1" font-family="monospace" font-size="12.5"><tspan fill="#ff8bd2">WHERE</tspan> _airbyte_data-&gt;&gt;'status' &lt;&gt; 'TEST'</text>
  <text x="680" y="582" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">Transform is just SQL over the raw table:</text>
  <text x="680" y="602" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">&#8226; pluck fields out of the JSON blob</text>
  <text x="680" y="622" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">&#8226; cast types (cents &#8594; decimal)</text>
  <text x="680" y="642" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">&#8226; filter / clean / denormalize</text>
  <text x="680" y="662" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">&#8226; materialize as a partitioned table</text>
  <text x="680" y="696" fill="#8aff8a" font-family="sans-serif" font-size="12.5">Raw stays untouched &#8594; re-run transforms anytime,</text>
  <text x="680" y="716" fill="#8aff8a" font-family="sans-serif" font-size="12.5">backfill, or fix a bug without re-extracting.</text>
</svg>
