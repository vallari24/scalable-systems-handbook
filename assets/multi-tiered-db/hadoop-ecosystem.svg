<svg width="1180" height="780" viewBox="0 0 1180 780" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1180" height="780" fill="#111317"/>
  <defs>
    <marker id="g" markerWidth="12" markerHeight="12" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#9aa6b2"/></marker>
  </defs>

  <text x="590" y="46" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="28" font-weight="bold">The Hadoop ecosystem: who does what</text>
  <text x="590" y="76" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="16">HDFS <tspan fill="#9aa6b2">stores</tspan> &#183; YARN <tspan fill="#9aa6b2">allocates</tspan> &#183; an engine <tspan fill="#9aa6b2">computes</tspan> &#183; SQL <tspan fill="#9aa6b2">queries</tspan></text>

  <!-- SQL layer -->
  <rect x="200" y="102" width="920" height="84" rx="10" fill="#101622" stroke="#93c5fd" stroke-width="2"/>
  <text x="190" y="150" text-anchor="end" fill="#93c5fd" font-family="sans-serif" font-size="15" font-weight="bold">SQL / Query</text>
  <g font-family="sans-serif" font-size="15" text-anchor="middle">
    <rect x="230" y="120" width="180" height="48" rx="6" fill="#16191e" stroke="#cbd5e1" stroke-width="1.5"/><text x="320" y="149" fill="#ffffff">Hive <tspan fill="#9aa6b2" font-size="12">(legacy)</tspan></text>
    <rect x="430" y="120" width="180" height="48" rx="6" fill="#16191e" stroke="#cbd5e1" stroke-width="1.5"/><text x="520" y="149" fill="#ffffff">Spark SQL</text>
    <rect x="630" y="120" width="200" height="48" rx="6" fill="#16191e" stroke="#8aff8a" stroke-width="1.5"/><text x="730" y="149" fill="#8aff8a">Trino / Presto</text>
    <rect x="850" y="120" width="160" height="48" rx="6" fill="#16191e" stroke="#cbd5e1" stroke-width="1.5"/><text x="930" y="149" fill="#ffffff">Impala</text>
  </g>

  <!-- Compute layer -->
  <rect x="200" y="212" width="920" height="84" rx="10" fill="#1c1810" stroke="#ffd27f" stroke-width="2"/>
  <text x="190" y="260" text-anchor="end" fill="#ffd27f" font-family="sans-serif" font-size="15" font-weight="bold">Compute engines</text>
  <g font-family="sans-serif" font-size="15" text-anchor="middle">
    <rect x="230" y="230" width="180" height="48" rx="6" fill="#16191e" stroke="#9aa6b2" stroke-width="1.5"/><text x="320" y="252" fill="#9aa6b2">MapReduce</text><text x="320" y="270" fill="#9aa6b2" font-size="11">slow / legacy</text>
    <rect x="430" y="230" width="180" height="48" rx="6" fill="#16191e" stroke="#cbd5e1" stroke-width="1.5"/><text x="520" y="259" fill="#ffffff">Tez</text>
    <rect x="630" y="230" width="200" height="48" rx="6" fill="#16191e" stroke="#ffd27f" stroke-width="2"/><text x="730" y="252" fill="#ffd27f" font-weight="bold">Spark</text><text x="730" y="270" fill="#9aa6b2" font-size="11">in-memory DAG &#8211; the workhorse</text>
    <rect x="850" y="230" width="160" height="48" rx="6" fill="#16191e" stroke="#cbd5e1" stroke-width="1.5"/><text x="930" y="259" fill="#ffffff">Flink</text>
  </g>

  <!-- Resource layer -->
  <rect x="200" y="322" width="920" height="74" rx="10" fill="#16191e" stroke="#cbd5e1" stroke-width="2"/>
  <text x="190" y="364" text-anchor="end" fill="#cbd5e1" font-family="sans-serif" font-size="15" font-weight="bold">Resource mgmt</text>
  <g font-family="sans-serif" font-size="15" text-anchor="middle">
    <rect x="230" y="338" width="430" height="44" rx="6" fill="#10243a" stroke="#93c5fd" stroke-width="1.5"/><text x="445" y="365" fill="#93c5fd">YARN  (ResourceManager + NodeManagers)</text>
    <rect x="690" y="338" width="320" height="44" rx="6" fill="#10243a" stroke="#93c5fd" stroke-width="1.5"/><text x="850" y="365" fill="#93c5fd">Kubernetes  (cloud-native)</text>
  </g>

  <!-- Storage layer -->
  <rect x="200" y="422" width="920" height="318" rx="10" fill="#1a1a10" stroke="#ffff99" stroke-width="2.5"/>
  <text x="190" y="470" text-anchor="end" fill="#ffff99" font-family="sans-serif" font-size="15" font-weight="bold">Storage</text>

  <!-- NameNode -->
  <rect x="230" y="446" width="250" height="120" rx="8" fill="#2a1320" stroke="#ff8bd2" stroke-width="2"/>
  <text x="355" y="474" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="17" font-weight="bold">NameNode (master)</text>
  <text x="355" y="500" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">metadata in RAM:</text>
  <text x="355" y="520" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">file &#8594; block &#8594; DataNode map</text>
  <text x="355" y="544" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">HA via JournalNodes; no file data</text>

  <!-- DataNodes -->
  <g font-family="sans-serif" font-size="13" text-anchor="middle">
    <rect x="520" y="446" width="150" height="120" rx="8" fill="#16191e" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="595" y="470" fill="#ffffff" font-weight="bold">DataNode 1</text>
    <rect x="535" y="482" width="120" height="20" rx="3" fill="#10243a" stroke="#93c5fd"/><rect x="535" y="508" width="120" height="20" rx="3" fill="#10243a" stroke="#93c5fd"/><rect x="535" y="534" width="120" height="20" rx="3" fill="#10243a" stroke="#93c5fd"/>
    <rect x="690" y="446" width="150" height="120" rx="8" fill="#16191e" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="765" y="470" fill="#ffffff" font-weight="bold">DataNode 2</text>
    <rect x="705" y="482" width="120" height="20" rx="3" fill="#10243a" stroke="#93c5fd"/><rect x="705" y="508" width="120" height="20" rx="3" fill="#10243a" stroke="#93c5fd"/><rect x="705" y="534" width="120" height="20" rx="3" fill="#10243a" stroke="#93c5fd"/>
    <rect x="860" y="446" width="150" height="120" rx="8" fill="#16191e" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="935" y="470" fill="#ffffff" font-weight="bold">DataNode 3</text>
    <rect x="875" y="482" width="120" height="20" rx="3" fill="#10243a" stroke="#93c5fd"/><rect x="875" y="508" width="120" height="20" rx="3" fill="#10243a" stroke="#93c5fd"/><rect x="875" y="534" width="120" height="20" rx="3" fill="#10243a" stroke="#93c5fd"/>
  </g>
  <text x="595" y="556" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11">128MB blocks</text>
  <line x1="480" y1="500" x2="514" y2="500" stroke="#9aa6b2" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="765" y="592" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="13">each block replicated &#215;3, rack-aware</text>

  <!-- S3 alternative -->
  <rect x="230" y="612" width="780" height="106" rx="8" fill="#101622" stroke="#8aff8a" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="620" y="642" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="16" font-weight="bold">2026 default: cloud object store (S3 / GCS / ADLS) replaces HDFS</text>
  <text x="620" y="668" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="14">decouples storage from compute &#183; 11-nines durability &#183; no NameNode to operate</text>
  <text x="620" y="694" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13">HDFS lingers in on-prem / regulated / legacy clusters</text>

  <!-- between-layer arrows -->
  <g stroke="#9aa6b2" stroke-width="2">
    <line x1="150" y1="186" x2="150" y2="212" marker-end="url(#g)"/>
    <line x1="150" y1="296" x2="150" y2="322" marker-end="url(#g)"/>
    <line x1="150" y1="396" x2="150" y2="422" marker-end="url(#g)"/>
  </g>
  <text x="150" y="100" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">query</text>
  <text x="150" y="740" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">bytes</text>
</svg>
