<svg width="1120" height="900" viewBox="0 0 1120 900" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1120" height="900" fill="#111317"/>
  <defs>
    <marker id="aW" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#cbd5e1"/></marker>
    <marker id="aP" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#ff8bd2"/></marker>
    <marker id="aB" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#93c5fd"/></marker>
  </defs>

  <!-- Title -->
  <text x="560" y="46" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="30" font-weight="bold">Multi-tiered Datastore</text>
  <text x="560" y="78" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="16">Transactional System: <tspan fill="#ffff99">Orders</tspan>  &#8594;  all orders that happen on Amazon go here. <tspan fill="#9aa6b2">Scale this solution.</tspan></text>

  <!-- Customer -->
  <g stroke="#8aff8a" stroke-width="2.5" fill="none">
    <circle cx="95" cy="270" r="13"/>
    <line x1="95" y1="283" x2="95" y2="320"/>
    <line x1="95" y1="294" x2="79" y2="308"/>
    <line x1="95" y1="294" x2="111" y2="308"/>
    <line x1="95" y1="320" x2="80" y2="346"/>
    <line x1="95" y1="320" x2="110" y2="346"/>
  </g>
  <text x="95" y="372" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="15">Customer</text>

  <!-- customer -> orders arrows -->
  <line x1="135" y1="290" x2="356" y2="305" stroke="#8aff8a" stroke-width="2.5" marker-end="url(#aW)"/>
  <text x="240" y="270" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="14">place_order</text>
  <text x="240" y="290" text-anchor="middle" fill="#8aff8a" font-family="monospace" font-size="14">order_details</text>

  <!-- Orders Service -->
  <rect x="356" y="290" width="220" height="72" rx="10" fill="#2a1320" stroke="#ff8bd2" stroke-width="2.5"/>
  <text x="466" y="334" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="20" font-weight="bold">Orders Service</text>

  <!-- Customer Support -->
  <rect x="610" y="150" width="220" height="56" rx="8" fill="#16191e" stroke="#cbd5e1" stroke-width="2"/>
  <text x="720" y="185" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="17">Customer Support</text>
  <line x1="700" y1="206" x2="560" y2="290" stroke="#9aa6b2" stroke-width="2"/>

  <!-- Payments -->
  <rect x="296" y="470" width="170" height="56" rx="8" fill="#16191e" stroke="#cbd5e1" stroke-width="2"/>
  <text x="381" y="505" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="17">Payments</text>
  <line x1="430" y1="362" x2="390" y2="470" stroke="#9aa6b2" stroke-width="2"/>
  <text x="350" y="430" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="14">payment status</text>

  <!-- Logistics -->
  <rect x="570" y="470" width="170" height="56" rx="8" fill="#16191e" stroke="#cbd5e1" stroke-width="2"/>
  <text x="655" y="505" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="17">Logistics</text>
  <line x1="510" y1="362" x2="650" y2="470" stroke="#9aa6b2" stroke-width="2"/>
  <text x="640" y="430" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="14">delivery status</text>

  <!-- Transactional DB cylinder -->
  <line x1="576" y1="326" x2="884" y2="326" stroke="#ffff99" stroke-width="2.5" marker-end="url(#aW)"/>
  <g>
    <path d="M900,300 L900,372 A60,18 0 0 0 1020,372 L1020,300" fill="#1a1a10" stroke="#ffff99" stroke-width="2.5"/>
    <ellipse cx="960" cy="300" rx="60" ry="18" fill="#1a1a10" stroke="#ffff99" stroke-width="2.5"/>
  </g>
  <text x="960" y="406" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="15">Transactional DB</text>
  <text x="960" y="428" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="16" font-weight="bold">MySQL</text>

  <!-- divider -->
  <line x1="44" y1="566" x2="1076" y2="566" stroke="#3a3f47" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- degrade text -->
  <text x="560" y="606" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="17">Everything works fine for the first few months, and then&#8230;</text>
  <text x="560" y="638" text-anchor="middle" font-family="sans-serif" font-size="18"><tspan fill="#ff8a8a" font-weight="bold">Database performance degrades</tspan><tspan fill="#cbd5e1">  &#8594;  large number of writes &amp; reads</tspan></text>

  <!-- Scale up -->
  <rect x="120" y="690" width="120" height="34" rx="17" fill="#173a2a" stroke="#8aff8a" stroke-width="1.5"/>
  <text x="180" y="713" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="15" font-weight="bold">Scale up</text>
  <g>
    <path d="M320,700 L320,734 A26,9 0 0 0 372,734 L372,700" fill="#16191e" stroke="#cbd5e1" stroke-width="2"/>
    <ellipse cx="346" cy="700" rx="26" ry="9" fill="#16191e" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <line x1="392" y1="718" x2="452" y2="718" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#aW)"/>
  <g>
    <path d="M470,690 L470,752 A40,13 0 0 0 550,752 L550,690" fill="#16191e" stroke="#cbd5e1" stroke-width="2"/>
    <ellipse cx="510" cy="690" rx="40" ry="13" fill="#16191e" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <text x="510" y="784" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13">vertical scaling (bigger box)</text>

  <!-- Scale reads -->
  <rect x="660" y="690" width="130" height="34" rx="17" fill="#173a2a" stroke="#8aff8a" stroke-width="1.5"/>
  <text x="725" y="713" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="15" font-weight="bold">Scale reads</text>
  <!-- master -->
  <g>
    <path d="M700,750 L700,800 A30,10 0 0 0 760,800 L760,750" fill="#2a1320" stroke="#ff8bd2" stroke-width="2"/>
    <ellipse cx="730" cy="750" rx="30" ry="10" fill="#2a1320" stroke="#ff8bd2" stroke-width="2"/>
  </g>
  <text x="730" y="836" text-anchor="middle" fill="#ff8bd2" font-family="sans-serif" font-size="13">Master</text>
  <!-- replicas -->
  <line x1="762" y1="765" x2="900" y2="745" stroke="#93c5fd" stroke-width="2" marker-end="url(#aB)"/>
  <line x1="762" y1="785" x2="900" y2="815" stroke="#93c5fd" stroke-width="2" marker-end="url(#aB)"/>
  <text x="828" y="744" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="13" font-weight="bold">SYNC</text>
  <g>
    <path d="M905,732 L905,772 A24,8 0 0 0 953,772 L953,732" fill="#10243a" stroke="#93c5fd" stroke-width="2"/>
    <ellipse cx="929" cy="732" rx="24" ry="8" fill="#10243a" stroke="#93c5fd" stroke-width="2"/>
  </g>
  <text x="985" y="756" fill="#93c5fd" font-family="sans-serif" font-size="13">Replica</text>
  <g>
    <path d="M905,800 L905,840 A24,8 0 0 0 953,840 L953,800" fill="#10243a" stroke="#93c5fd" stroke-width="2"/>
    <ellipse cx="929" cy="800" rx="24" ry="8" fill="#10243a" stroke="#93c5fd" stroke-width="2"/>
  </g>
  <text x="985" y="824" fill="#93c5fd" font-family="sans-serif" font-size="13">Replica</text>
</svg>
