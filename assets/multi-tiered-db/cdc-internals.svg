<svg width="1180" height="680" viewBox="0 0 1180 680" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1180" height="680" fill="#111317"/>
  <defs>
    <marker id="bb" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#93c5fd"/></marker>
    <marker id="cc" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#cbd5e1"/></marker>
  </defs>

  <text x="590" y="44" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="26" font-weight="bold">Change Data Capture: tail the log, don't poll the table</text>
  <text x="590" y="72" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="15">the DB already writes every change to a log for its own durability &#8212; CDC just reads that log</text>

  <!-- 1 source DB -->
  <g>
    <path d="M70,150 L70,210 A40,13 0 0 0 150,210 L150,150" fill="#1c1113" stroke="#ff8a8a" stroke-width="2.5"/>
    <ellipse cx="110" cy="150" rx="40" ry="13" fill="#1c1113" stroke="#ff8a8a" stroke-width="2.5"/>
  </g>
  <text x="110" y="188" text-anchor="middle" fill="#ff8a8a" font-family="sans-serif" font-size="15" font-weight="bold">HOT DB</text>
  <text x="110" y="240" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13">commits a write</text>

  <!-- 2 WAL/binlog -->
  <line x1="152" y1="180" x2="216" y2="180" stroke="#cbd5e1" stroke-width="2" marker-end="url(#cc)"/>
  <rect x="220" y="135" width="180" height="90" rx="8" fill="#1a1a10" stroke="#ffff99" stroke-width="2"/>
  <text x="310" y="162" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="15" font-weight="bold">WAL / binlog</text>
  <text x="310" y="184" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">append-only,</text>
  <text x="310" y="202" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">ordered change log</text>

  <!-- 3 connector -->
  <line x1="400" y1="180" x2="464" y2="180" stroke="#ffff99" stroke-width="2" marker-end="url(#cc)"/>
  <rect x="468" y="135" width="200" height="90" rx="8" fill="#16191e" stroke="#8aff8a" stroke-width="2"/>
  <text x="568" y="162" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="15" font-weight="bold">CDC connector</text>
  <text x="568" y="184" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">(Debezium)</text>
  <text x="568" y="204" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">tails log, tracks offset</text>

  <!-- 4 kafka -->
  <line x1="668" y1="180" x2="732" y2="180" stroke="#8aff8a" stroke-width="2" marker-end="url(#cc)"/>
  <rect x="736" y="135" width="180" height="90" rx="8" fill="#101622" stroke="#93c5fd" stroke-width="2"/>
  <text x="826" y="162" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="15" font-weight="bold">Kafka topic</text>
  <text x="826" y="184" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">durable, replayable</text>
  <text x="826" y="204" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">stream of events</text>

  <!-- 5 sink -->
  <line x1="916" y1="180" x2="980" y2="180" stroke="#93c5fd" stroke-width="2" marker-end="url(#bb)"/>
  <rect x="984" y="135" width="170" height="90" rx="8" fill="#1c1810" stroke="#ffd27f" stroke-width="2"/>
  <text x="1069" y="170" text-anchor="middle" fill="#ffd27f" font-family="sans-serif" font-size="15" font-weight="bold">Sink &#8594;</text>
  <text x="1069" y="194" text-anchor="middle" fill="#ffd27f" font-family="sans-serif" font-size="14" font-weight="bold">WARM / lake</text>
  <text x="1069" y="214" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">apply change</text>

  <!-- step numbers -->
  <g font-family="sans-serif" font-size="13" fill="#9aa6b2" text-anchor="middle">
    <text x="110" y="120">1</text><text x="310" y="120">2</text><text x="568" y="120">3</text><text x="826" y="120">4</text><text x="1069" y="120">5</text>
  </g>

  <!-- sample change event -->
  <rect x="120" y="300" width="940" height="300" rx="10" fill="#0d1117" stroke="#3a3f47" stroke-width="1.5"/>
  <text x="140" y="330" fill="#8aff8a" font-family="sans-serif" font-size="15" font-weight="bold">A single change event (UPDATE on orders)</text>
  <text x="140" y="362" fill="#cbd5e1" font-family="monospace" font-size="14">{</text>
  <text x="160" y="386" fill="#cbd5e1" font-family="monospace" font-size="14"><tspan fill="#93c5fd">"op"</tspan>: <tspan fill="#ffd27f">"u"</tspan>,            <tspan fill="#9aa6b2">// c=create  u=update  d=delete</tspan></text>
  <text x="160" y="410" fill="#cbd5e1" font-family="monospace" font-size="14"><tspan fill="#93c5fd">"ts_ms"</tspan>: 1718600000000,</text>
  <text x="160" y="434" fill="#cbd5e1" font-family="monospace" font-size="14"><tspan fill="#93c5fd">"source"</tspan>: { <tspan fill="#93c5fd">"table"</tspan>: <tspan fill="#ffd27f">"orders"</tspan>, <tspan fill="#93c5fd">"lsn"</tspan>: 24117248 },  <tspan fill="#9aa6b2">// log offset</tspan></text>
  <text x="160" y="458" fill="#cbd5e1" font-family="monospace" font-size="14"><tspan fill="#ff8a8a">"before"</tspan>: { <tspan fill="#93c5fd">"id"</tspan>: 91, <tspan fill="#93c5fd">"status"</tspan>: <tspan fill="#ffd27f">"PACKED"</tspan>  },</text>
  <text x="160" y="482" fill="#cbd5e1" font-family="monospace" font-size="14"><tspan fill="#8aff8a">"after"</tspan>:  { <tspan fill="#93c5fd">"id"</tspan>: 91, <tspan fill="#93c5fd">"status"</tspan>: <tspan fill="#ffd27f">"SHIPPED"</tspan> }</text>
  <text x="140" y="506" fill="#cbd5e1" font-family="monospace" font-size="14">}</text>
  <text x="140" y="548" fill="#ffff99" font-family="sans-serif" font-size="14">Why it beats batch dumps: no dual-write (the log is the source of truth), captures</text>
  <text x="140" y="572" fill="#ffff99" font-family="sans-serif" font-size="14"><tspan fill="#cbd5e1">every</tspan> change incl. deletes, near-real-time, and the offset/LSN makes restarts exactly-once.</text>
</svg>
