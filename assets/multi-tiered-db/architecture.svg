<svg width="1180" height="1260" viewBox="0 0 1180 1260" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1180" height="1260" fill="#111317"/>
  <defs>
    <marker id="w" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#ffffff"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#93c5fd"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#ff8bd2"/></marker>
    <marker id="o" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#ffd27f"/></marker>
  </defs>

  <!-- ============ LIVE PATH (top) ============ -->
  <rect x="150" y="56" width="150" height="46" rx="8" fill="#16191e" stroke="#cbd5e1" stroke-width="2"/>
  <text x="225" y="85" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="16">Payments</text>
  <rect x="430" y="56" width="150" height="46" rx="8" fill="#16191e" stroke="#cbd5e1" stroke-width="2"/>
  <text x="505" y="85" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="16">Logistics</text>

  <!-- customer -->
  <g stroke="#8aff8a" stroke-width="2.5" fill="none">
    <circle cx="70" cy="200" r="13"/>
    <line x1="70" y1="213" x2="70" y2="248"/>
    <line x1="70" y1="224" x2="55" y2="238"/>
    <line x1="70" y1="224" x2="85" y2="238"/>
    <line x1="70" y1="248" x2="56" y2="272"/>
    <line x1="70" y1="248" x2="84" y2="272"/>
  </g>
  <text x="70" y="298" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="14">Customer</text>
  <text x="175" y="194" text-anchor="middle" fill="#ffd27f" font-family="monospace" font-size="13">place_order</text>
  <text x="175" y="212" text-anchor="middle" fill="#ffd27f" font-family="monospace" font-size="13">get_order</text>
  <line x1="110" y1="225" x2="236" y2="225" stroke="#ffffff" stroke-width="2.5" marker-end="url(#w)"/>

  <!-- Orders -->
  <rect x="240" y="200" width="170" height="56" rx="8" fill="#16191e" stroke="#cbd5e1" stroke-width="2.5"/>
  <text x="325" y="234" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">Orders</text>
  <line x1="240" y1="102" x2="300" y2="200" stroke="#9aa6b2" stroke-width="2"/>
  <line x1="490" y1="102" x2="360" y2="200" stroke="#9aa6b2" stroke-width="2"/>

  <!-- HOT -->
  <rect x="620" y="170" width="250" height="116" rx="12" fill="#2a1320" stroke="#ff8bd2" stroke-width="2.5"/>
  <g>
    <path d="M666,210 L666,256 A26,9 0 0 0 718,256 L718,210" fill="#1a1a10" stroke="#ffff99" stroke-width="2"/>
    <ellipse cx="692" cy="210" rx="26" ry="9" fill="#1a1a10" stroke="#ffff99" stroke-width="2"/>
  </g>
  <text x="800" y="238" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="24" font-weight="bold">HOT</text>
  <text x="745" y="312" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="15">Transactional</text>
  <text x="745" y="334" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="15">MySQL, PostgreSQL</text>
  <line x1="410" y1="228" x2="606" y2="228" stroke="#ffffff" stroke-width="2.5" marker-end="url(#w)"/>

  <!-- Data Delete policy loop (HOT) -->
  <path d="M905,168 a16,16 0 1 1 -4,-12" fill="none" stroke="#ffd27f" stroke-width="2" marker-end="url(#o)"/>
  <text x="980" y="150" text-anchor="middle" fill="#ffd27f" font-family="sans-serif" font-size="14">Data Delete</text>
  <text x="980" y="168" text-anchor="middle" fill="#ffd27f" font-family="sans-serif" font-size="14">policy</text>

  <!-- CRON spiral -->
  <path d="M745,286 L745,360 L985,360 L985,392" fill="none" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="1015" y="372" fill="#93c5fd" font-family="sans-serif" font-size="16" font-weight="bold">CRON</text>
  <path d="M985,396 m0,-14 a14,14 0 1 1 -10,4 a9,9 0 1 1 7,-2" fill="none" stroke="#93c5fd" stroke-width="2.5"/>
  <line x1="985" y1="410" x2="985" y2="470" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#b)"/>

  <!-- ============ HOT -> WARM ETL (middle right) ============ -->
  <!-- Dumper (stacked) -->
  <rect x="838" y="470" width="200" height="56" rx="6" fill="#1c1810" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="832" y="476" width="200" height="56" rx="6" fill="#1c1810" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="826" y="482" width="200" height="56" rx="6" fill="#1c1810" stroke="#ffd27f" stroke-width="2"/>
  <text x="926" y="516" text-anchor="middle" fill="#ffd27f" font-family="sans-serif" font-size="18" font-weight="bold">Dumper</text>

  <!-- Staging storage -->
  <g>
    <path d="M1080,486 L1080,532 A26,9 0 0 0 1132,532 L1132,486" fill="#16191e" stroke="#cbd5e1" stroke-width="2"/>
    <ellipse cx="1106" cy="486" rx="26" ry="9" fill="#16191e" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <text x="1106" y="560" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13">Staging</text>
  <text x="1106" y="578" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13">storage</text>
  <line x1="1026" y1="500" x2="1078" y2="500" stroke="#cbd5e1" stroke-width="2" marker-end="url(#w)"/>

  <!-- Loader (stacked) -->
  <rect x="838" y="650" width="200" height="56" rx="6" fill="#1c1810" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="832" y="656" width="200" height="56" rx="6" fill="#1c1810" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="826" y="662" width="200" height="56" rx="6" fill="#1c1810" stroke="#ffd27f" stroke-width="2"/>
  <text x="926" y="696" text-anchor="middle" fill="#ffd27f" font-family="sans-serif" font-size="18" font-weight="bold">Loader</text>
  <text x="926" y="742" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="15">Loading &amp; transformations</text>
  <line x1="1106" y1="540" x2="1010" y2="658" stroke="#93c5fd" stroke-width="2" marker-end="url(#b)"/>

  <!-- WARM -->
  <rect x="60" y="500" width="400" height="120" rx="12" fill="#2a1320" stroke="#ff8bd2" stroke-width="2.5"/>
  <g fill="#16191e" stroke="#ffff99" stroke-width="2">
    <path d="M100,532 L100,578 A22,8 0 0 0 144,578 L144,532"/><ellipse cx="122" cy="532" rx="22" ry="8"/>
    <path d="M170,532 L170,578 A22,8 0 0 0 214,578 L214,532"/><ellipse cx="192" cy="532" rx="22" ry="8"/>
    <path d="M240,532 L240,578 A22,8 0 0 0 284,578 L284,532"/><ellipse cx="262" cy="532" rx="22" ry="8"/>
  </g>
  <text x="390" y="560" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="24" font-weight="bold">WARM</text>
  <text x="60" y="652" fill="#cbd5e1" font-family="sans-serif" font-size="16">Distributed Database, Horizontally Scalable</text>
  <text x="60" y="676" fill="#93c5fd" font-family="sans-serif" font-size="16">MongoDB, ElasticSearch, TiDB, DynamoDB, HDFS</text>

  <!-- Data Delete Policy loop (WARM) -->
  <path d="M495,498 a16,16 0 1 1 -4,-12" fill="none" stroke="#ffd27f" stroke-width="2" marker-end="url(#o)"/>
  <text x="572" y="480" text-anchor="middle" fill="#ffd27f" font-family="sans-serif" font-size="14">Data Delete</text>
  <text x="572" y="498" text-anchor="middle" fill="#ffd27f" font-family="sans-serif" font-size="14">Policy</text>

  <!-- Loader -> WARM -->
  <line x1="826" y1="690" x2="466" y2="600" stroke="#93c5fd" stroke-width="2" marker-end="url(#b)"/>

  <!-- historical orders: WARM <-> Orders -->
  <line x1="320" y1="500" x2="320" y2="260" stroke="#ff8bd2" stroke-width="2.5" marker-end="url(#p)" marker-start="url(#p)"/>
  <text x="250" y="400" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="15">historical</text>
  <text x="250" y="420" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="15">orders</text>

  <line x1="44" y1="772" x2="1136" y2="772" stroke="#3a3f47" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- ============ WARM -> COLD (bottom) ============ -->
  <!-- Dump & load (stacked) -->
  <rect x="452" y="836" width="200" height="56" rx="6" fill="#1c1810" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="446" y="842" width="200" height="56" rx="6" fill="#1c1810" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="440" y="848" width="200" height="56" rx="6" fill="#1c1810" stroke="#ffd27f" stroke-width="2"/>
  <text x="540" y="882" text-anchor="middle" fill="#ffd27f" font-family="sans-serif" font-size="17" font-weight="bold">Dump &amp; load</text>
  <line x1="240" y1="620" x2="500" y2="844" stroke="#ffd27f" stroke-width="2" marker-end="url(#o)"/>

  <!-- S3 cloud -->
  <path d="M830,950 C790,950 790,900 830,895 C820,850 890,840 910,870 C930,830 1010,835 1010,880 C1070,875 1070,950 1030,950 Z" fill="#10243a" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="940" y="912" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="26" font-weight="bold">S3</text>
  <text x="1075" y="858" fill="#ffff99" font-family="sans-serif" font-size="18" font-weight="bold">COLD</text>
  <text x="940" y="982" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="15">Extremely cheap storage</text>
  <line x1="640" y1="876" x2="800" y2="905" stroke="#ffd27f" stroke-width="2.5" marker-end="url(#o)"/>

  <!-- PrestoDB -->
  <rect x="380" y="1006" width="190" height="52" rx="8" fill="#16191e" stroke="#cbd5e1" stroke-width="2"/>
  <text x="475" y="1039" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">PrestoDB</text>
  <text x="475" y="1082" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="14">Slow response</text>
  <line x1="828" y1="940" x2="574" y2="1020" stroke="#93c5fd" stroke-width="2" marker-end="url(#b)"/>

  <!-- Internal teams -->
  <g stroke="#8aff8a" stroke-width="2.5" fill="none">
    <circle cx="90" cy="1010" r="13"/>
    <line x1="90" y1="1023" x2="90" y2="1058"/>
    <line x1="90" y1="1034" x2="75" y2="1048"/>
    <line x1="90" y1="1034" x2="105" y2="1048"/>
    <line x1="90" y1="1058" x2="76" y2="1082"/>
    <line x1="90" y1="1058" x2="104" y2="1082"/>
  </g>
  <text x="120" y="1118" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="15">Internal Teams</text>
  <text x="120" y="1138" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="14">Analytics, legal, etc</text>
  <line x1="378" y1="1032" x2="130" y2="1032" stroke="#cbd5e1" stroke-width="2" marker-end="url(#w)"/>

  <!-- Loader (bottom) -->
  <rect x="852" y="1110" width="190" height="54" rx="6" fill="#1c1810" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="846" y="1116" width="190" height="54" rx="6" fill="#1c1810" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="840" y="1122" width="190" height="54" rx="6" fill="#1c1810" stroke="#ffd27f" stroke-width="2"/>
  <text x="935" y="1156" text-anchor="middle" fill="#ffd27f" font-family="sans-serif" font-size="18" font-weight="bold">Loader</text>
  <line x1="940" y1="958" x2="940" y2="1118" stroke="#93c5fd" stroke-width="2" marker-end="url(#b)"/>

  <!-- Temp queryable DB -->
  <g>
    <path d="M560,1110 L560,1158 A30,10 0 0 0 620,1158 L620,1110" fill="#16191e" stroke="#cbd5e1" stroke-width="2"/>
    <ellipse cx="590" cy="1110" rx="30" ry="10" fill="#16191e" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <text x="590" y="1196" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="15">Temp Queryable DB</text>
  <line x1="838" y1="1148" x2="624" y2="1140" stroke="#cbd5e1" stroke-width="2" marker-end="url(#w)"/>
  <line x1="560" y1="1120" x2="135" y2="1058" stroke="#cbd5e1" stroke-width="2" marker-end="url(#w)"/>
</svg>
