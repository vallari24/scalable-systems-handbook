<svg width="1180" height="700" viewBox="0 0 1180 700" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="hy-g" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aff8a"/></marker>
    <marker id="hy-p" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b79bff"/></marker>
    <marker id="hy-y" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ffff99"/></marker>
    <marker id="hy-c" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#cbd5e1"/></marker>
  </defs>

  <rect x="0" y="0" width="1180" height="700" fill="#111317"/>

  <text x="590" y="40" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="26" font-weight="bold">Hybrid Search &#8212; fuse the lexical and the semantic</text>
  <text x="590" y="68" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="15.5">two retrievers that fail in opposite cases, run in parallel and fused, then re-ranked</text>

  <!-- query -->
  <circle cx="62" cy="316" r="13" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>
  <line x1="62" y1="329" x2="62" y2="360" stroke="#cbd5e1" stroke-width="2.5"/>
  <line x1="42" y1="343" x2="82" y2="343" stroke="#cbd5e1" stroke-width="2.5"/>
  <line x1="62" y1="360" x2="48" y2="382" stroke="#cbd5e1" stroke-width="2.5"/>
  <line x1="62" y1="360" x2="76" y2="382" stroke="#cbd5e1" stroke-width="2.5"/>
  <rect x="20" y="396" width="96" height="34" rx="8" fill="#1a1f26" stroke="#6f7a86" stroke-width="1.4"/>
  <text x="68" y="418" text-anchor="middle" fill="#e8edf2" font-family="sans-serif" font-size="14">query</text>

  <!-- split arrows -->
  <path d="M104 320 Q150 320 176 198" fill="none" stroke="#8aff8a" stroke-width="2.2" marker-end="url(#hy-g)"/>
  <path d="M104 408 Q150 408 176 480" fill="none" stroke="#b79bff" stroke-width="2.2" marker-end="url(#hy-p)"/>

  <!-- ===== TOP LANE: LEXICAL (green) ===== -->
  <text x="176" y="128" fill="#8aff8a" font-family="sans-serif" font-size="15" font-weight="bold">LEXICAL</text>
  <text x="262" y="128" fill="#9aa6b2" font-family="sans-serif" font-size="13.5">wins on exact / rare tokens: IDs, names, codes, exact phrases</text>

  <rect x="176" y="162" width="136" height="56" rx="9" fill="#15211a" stroke="#8aff8a" stroke-width="1.8"/>
  <text x="244" y="186" text-anchor="middle" fill="#cbeecb" font-family="sans-serif" font-size="13.5" font-weight="bold">query analysis</text>
  <text x="244" y="204" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">normalize &#183; stem</text>

  <path d="M362 168 a44 10 0 0 0 88 0 v44 a44 10 0 0 1 -88 0 z" fill="#15211a" stroke="#8aff8a" stroke-width="2"/>
  <ellipse cx="406" cy="168" rx="44" ry="10" fill="#1b2620" stroke="#8aff8a" stroke-width="2"/>
  <text x="406" y="196" text-anchor="middle" fill="#cbeecb" font-family="sans-serif" font-size="12" font-weight="bold">inverted</text>
  <text x="406" y="210" text-anchor="middle" fill="#cbeecb" font-family="sans-serif" font-size="12" font-weight="bold">index</text>

  <rect x="490" y="162" width="92" height="56" rx="9" fill="#15211a" stroke="#8aff8a" stroke-width="1.8"/>
  <text x="536" y="194" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="14" font-weight="bold">BM25</text>

  <rect x="606" y="152" width="120" height="76" rx="9" fill="#101a12" stroke="#8aff8a" stroke-width="1.8"/>
  <text x="666" y="176" text-anchor="middle" fill="#cbeecb" font-family="sans-serif" font-size="13" font-weight="bold">lexical</text>
  <text x="666" y="194" text-anchor="middle" fill="#cbeecb" font-family="sans-serif" font-size="13" font-weight="bold">candidates</text>
  <text x="666" y="214" text-anchor="middle" fill="#9aa6b2" font-family="monospace" font-size="11">ranked list</text>

  <line x1="312" y1="190" x2="360" y2="190" stroke="#8aff8a" stroke-width="2" marker-end="url(#hy-g)"/>
  <line x1="450" y1="190" x2="488" y2="190" stroke="#8aff8a" stroke-width="2" marker-end="url(#hy-g)"/>
  <line x1="582" y1="190" x2="604" y2="190" stroke="#8aff8a" stroke-width="2" marker-end="url(#hy-g)"/>

  <!-- ===== BOTTOM LANE: DENSE (purple) ===== -->
  <rect x="176" y="442" width="136" height="56" rx="9" fill="#1c1729" stroke="#b79bff" stroke-width="1.8"/>
  <text x="244" y="466" text-anchor="middle" fill="#e6dcff" font-family="sans-serif" font-size="13.5" font-weight="bold">bi-encoder</text>
  <text x="244" y="484" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">query &#8594; vector</text>

  <path d="M362 448 a44 10 0 0 0 88 0 v44 a44 10 0 0 1 -88 0 z" fill="#1c1729" stroke="#b79bff" stroke-width="2"/>
  <ellipse cx="406" cy="448" rx="44" ry="10" fill="#221b31" stroke="#b79bff" stroke-width="2"/>
  <text x="406" y="474" text-anchor="middle" fill="#e6dcff" font-family="sans-serif" font-size="11.5" font-weight="bold">ANN index</text>
  <text x="406" y="490" text-anchor="middle" fill="#cbb8ff" font-family="sans-serif" font-size="10.5">HNSW / IVF+PQ</text>

  <rect x="606" y="430" width="120" height="76" rx="9" fill="#16131f" stroke="#b79bff" stroke-width="1.8"/>
  <text x="666" y="454" text-anchor="middle" fill="#e6dcff" font-family="sans-serif" font-size="13" font-weight="bold">dense</text>
  <text x="666" y="472" text-anchor="middle" fill="#e6dcff" font-family="sans-serif" font-size="13" font-weight="bold">candidates</text>
  <text x="666" y="492" text-anchor="middle" fill="#9aa6b2" font-family="monospace" font-size="11">ranked list</text>

  <line x1="312" y1="470" x2="360" y2="470" stroke="#b79bff" stroke-width="2" marker-end="url(#hy-p)"/>
  <line x1="450" y1="470" x2="604" y2="470" stroke="#b79bff" stroke-width="2" marker-end="url(#hy-p)"/>
  <text x="527" y="462" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11">vector DB</text>

  <text x="176" y="556" fill="#b79bff" font-family="sans-serif" font-size="15" font-weight="bold">DENSE</text>
  <text x="258" y="556" fill="#9aa6b2" font-family="sans-serif" font-size="13.5">wins on meaning / paraphrase: car = automobile, "big apple" = NYC</text>

  <!-- ===== FUSION ===== -->
  <rect x="752" y="290" width="144" height="100" rx="12" fill="#1d1d12" stroke="#ffff99" stroke-width="2.2"/>
  <text x="824" y="320" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="14" font-weight="bold">Fusion</text>
  <text x="824" y="340" text-anchor="middle" fill="#e8edf2" font-family="sans-serif" font-size="12">Reciprocal Rank</text>
  <text x="824" y="356" text-anchor="middle" fill="#e8edf2" font-family="sans-serif" font-size="12">Fusion (RRF)</text>
  <text x="824" y="376" text-anchor="middle" fill="#9aa6b2" font-family="monospace" font-size="11.5">&#931; 1/(k+rank), k&#8776;60</text>

  <path d="M726 190 Q752 300 786 326" fill="none" stroke="#8aff8a" stroke-width="2" marker-end="url(#hy-g)"/>
  <path d="M726 468 Q752 360 786 354" fill="none" stroke="#b79bff" stroke-width="2" marker-end="url(#hy-p)"/>

  <!-- ===== CROSS-ENCODER ===== -->
  <rect x="918" y="298" width="138" height="84" rx="11" fill="#1c1729" stroke="#b79bff" stroke-width="2.2"/>
  <text x="987" y="332" text-anchor="middle" fill="#e6dcff" font-family="sans-serif" font-size="14" font-weight="bold">Cross-Encoder</text>
  <text x="987" y="352" text-anchor="middle" fill="#cbb8ff" font-family="sans-serif" font-size="12.5">re-rank survivors</text>
  <line x1="896" y1="340" x2="916" y2="340" stroke="#ffff99" stroke-width="2.2" marker-end="url(#hy-y)"/>
  <text x="824" y="408" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="11.5">fused candidates</text>

  <!-- ===== RESULTS ===== -->
  <rect x="1078" y="298" width="84" height="84" rx="10" fill="#101a12" stroke="#8aff8a" stroke-width="2"/>
  <text x="1120" y="332" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13" font-weight="bold">ranked</text>
  <text x="1120" y="350" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="13" font-weight="bold">results</text>
  <line x1="1056" y1="340" x2="1076" y2="340" stroke="#b79bff" stroke-width="2.2" marker-end="url(#hy-p)"/>

  <!-- ===== insight strip ===== -->
  <rect x="36" y="600" width="1108" height="78" rx="12" fill="#15171c" stroke="#ffff99" stroke-width="1.8"/>
  <text x="590" y="630" text-anchor="middle" fill="#ffffe0" font-family="sans-serif" font-size="15"><tspan fill="#ffff99" font-weight="bold">&#9733; key:</tspan>  the two retrievers fail in <tspan fill="#ff8a8a" font-weight="bold">OPPOSITE</tspan> cases &#8212; lexical misses meaning, dense fumbles exact tokens &#8212; so their <tspan fill="#8aff8a" font-weight="bold">union beats either</tspan></text>
  <text x="590" y="660" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">RRF fuses on <tspan fill="#ffff99">ranks only</tspan> (no score calibration between the two systems), then the fused short list goes to the cross-encoder re-ranker</text>
</svg>
