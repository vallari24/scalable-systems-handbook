<svg width="1180" height="720" viewBox="0 0 1180 720" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="l-c" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#cbd5e1"/></marker>
    <marker id="l-y" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ffff99"/></marker>
  </defs>

  <rect x="0" y="0" width="1180" height="720" fill="#111317"/>

  <text x="590" y="42" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="27" font-weight="bold">Learning to rank: a trained model, not a hand-tuned formula</text>
  <text x="590" y="70" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="15.5">learn the ordering from judged/clicked examples over hundreds of features, optimizing NDCG</text>

  <!-- ===== LEFT: training setup ===== -->
  <text x="240" y="112" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="15" font-weight="bold">TRAINING SETUP</text>

  <rect x="50" y="126" width="380" height="44" rx="9" fill="#1a1f26" stroke="#8a95a3" stroke-width="2"/>
  <text x="240" y="153" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14.5">query&#160;&#160;q&#160;&#160;+&#160;&#160;documents&#160;&#160;d1 d2 d3 &#8230;</text>
  <line x1="240" y1="172" x2="240" y2="194" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#l-c)"/>

  <rect x="50" y="196" width="380" height="104" rx="9" fill="#14171c" stroke="#93c5fd" stroke-width="2"/>
  <text x="240" y="218" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="13.5" font-weight="bold">feature vector per (q, d)</text>
  <text x="240" y="240" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="12.5">BM25 score &#183; PageRank &#183; freshness</text>
  <text x="240" y="260" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="12.5">title-match &#183; doc length &#183; query intent</text>
  <text x="240" y="284" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">&#8230; hundreds of features</text>
  <line x1="240" y1="300" x2="240" y2="322" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#l-c)"/>

  <rect x="50" y="324" width="380" height="42" rx="9" fill="#14171c" stroke="#ffd27f" stroke-width="2"/>
  <text x="240" y="350" text-anchor="middle" fill="#ffd27f" font-family="sans-serif" font-size="13">relevance labels: judges (0&#8211;4)&#160;&#160;or&#160;&#160;clicks / dwell</text>
  <line x1="240" y1="366" x2="240" y2="388" stroke="#ffff99" stroke-width="2.5" marker-end="url(#l-y)"/>

  <rect x="50" y="390" width="380" height="42" rx="9" fill="#1d1d12" stroke="#ffff99" stroke-width="2.2"/>
  <text x="240" y="416" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="14.5" font-weight="bold">objective: optimize NDCG</text>

  <text x="240" y="472" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="13">train a model &#8594; three ways to define &#8220;good ranking&#8221;:</text>

  <!-- arrow to panels -->
  <line x1="432" y1="240" x2="468" y2="240" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#l-c)"/>

  <!-- ===== RIGHT: three approaches ===== -->
  <!-- Pointwise -->
  <rect x="470" y="108" width="668" height="118" rx="11" fill="#0f1521" stroke="#93c5fd" stroke-width="2"/>
  <text x="490" y="134" fill="#93c5fd" font-family="sans-serif" font-size="17" font-weight="bold">POINTWISE</text>
  <text x="640" y="134" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">&#8212; score each document independently (regression), then sort</text>
  <text x="490" y="162" fill="#cbd5e1" font-family="monospace" font-size="12.5">d1&#8594;0.8&#160;&#160;d2&#8594;0.3&#160;&#160;d3&#8594;0.6&#160;&#160;&#8594; sort by score</text>
  <rect x="490" y="178" width="628" height="34" rx="8" fill="#1c1414" stroke="#ff8a8a" stroke-width="1.4"/>
  <text x="500" y="200" fill="#ff8a8a" font-family="sans-serif" font-size="12.5">blind spot: never compares two docs &#8594; learns nothing about order</text>

  <!-- Pairwise -->
  <rect x="470" y="240" width="668" height="118" rx="11" fill="#1d1d12" stroke="#ffff99" stroke-width="2"/>
  <text x="490" y="266" fill="#ffff99" font-family="sans-serif" font-size="17" font-weight="bold">PAIRWISE</text>
  <text x="612" y="266" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">&#8212; RankNet: learn which of a pair ranks higher</text>
  <text x="490" y="294" fill="#cbd5e1" font-family="monospace" font-size="12.5">P(di &gt; dj) = &#963;(si &#8722; sj),&#160;&#160;cross-entropy loss</text>
  <rect x="490" y="310" width="628" height="34" rx="8" fill="#1c1414" stroke="#ff8a8a" stroke-width="1.4"/>
  <text x="500" y="332" fill="#ff8a8a" font-family="sans-serif" font-size="12.5">learns relative order &#8212; but weights every swap equally (top swap = bottom swap)</text>

  <!-- Listwise (highlighted) -->
  <rect x="470" y="372" width="668" height="150" rx="11" fill="#101a12" stroke="#8aff8a" stroke-width="3"/>
  <text x="490" y="400" fill="#8aff8a" font-family="sans-serif" font-size="17" font-weight="bold">LISTWISE &#183; LambdaMART</text>
  <rect x="730" y="384" width="150" height="24" rx="12" fill="#13361b" stroke="#8aff8a" stroke-width="1.4"/>
  <text x="805" y="401" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="12" font-weight="bold">common workhorse</text>
  <text x="490" y="428" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">use metric-aware gradients for the ranked list</text>
  <text x="490" y="452" fill="#cbd5e1" font-family="monospace" font-size="12.5">each gradient (&#955;) scaled by &#916;NDCG of swapping the pair</text>
  <text x="490" y="472" fill="#cbd5e1" font-family="sans-serif" font-size="12.5">&#8230; on gradient-boosted regression trees (MART)</text>
  <rect x="490" y="484" width="628" height="30" rx="8" fill="#13361b" stroke="#8aff8a" stroke-width="1.4"/>
  <text x="500" y="504" fill="#8aff8a" font-family="sans-serif" font-size="12.5">spends effort where it moves the metric: the top. Won the 2010 Yahoo LTR Challenge.</text>

  <!-- ===== PROGRESSION STRIP ===== -->
  <rect x="50" y="556" width="1088" height="48" rx="12" fill="#101a12" stroke="#8aff8a" stroke-width="1.8"/>
  <text x="594" y="586" text-anchor="middle" fill="#e8ffe8" font-family="sans-serif" font-size="15"><tspan fill="#93c5fd" font-weight="bold">pointwise</tspan> ignores order  &#8594;  <tspan fill="#ffff99" font-weight="bold">pairwise</tspan> learns relative order  &#8594;  <tspan fill="#8aff8a" font-weight="bold">metric-aware</tspan> targets the actual metric &#8212; each fixes the prior blind spot</text>
</svg>
