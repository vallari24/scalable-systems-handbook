<svg width="1100" height="720" viewBox="0 0 1100 720" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="f-g" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8aff8a"/></marker>
    <marker id="f-p" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b79bff"/></marker>
    <marker id="f-y" markerWidth="11" markerHeight="11" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ffff99"/></marker>
  </defs>

  <rect x="0" y="0" width="1100" height="720" fill="#111317"/>

  <text x="550" y="44" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="27" font-weight="bold">The retrieve-then-rerank funnel</text>
  <text x="550" y="72" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="15.5">you can&#8217;t run a heavy model on a billion docs per query &#8212; narrow cheaply, then re-score precisely</text>

  <!-- ===== FUNNEL ===== -->
  <!-- Stage 1 region: top halfwidth 300 @ y120, halfwidth 180 @ y340 -->
  <polygon points="200,120 800,120 680,340 320,340" fill="#101a12" stroke="#8aff8a" stroke-width="2.5"/>
  <!-- Stage 2 region: halfwidth 180 @ y340, halfwidth 60 @ y560 -->
  <polygon points="320,340 680,340 560,560 440,560" fill="#16111f" stroke="#b79bff" stroke-width="2.5"/>

  <!-- top entry label -->
  <text x="500" y="108" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="16" font-weight="bold">Billions of documents</text>

  <!-- Stage 1 -->
  <circle cx="232" cy="150" r="13" fill="#8aff8a"/>
  <text x="232" y="155" text-anchor="middle" fill="#111317" font-family="sans-serif" font-size="14" font-weight="bold">1</text>
  <text x="500" y="170" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="19" font-weight="bold">STAGE 1 &#183; RETRIEVAL</text>
  <text x="500" y="194" text-anchor="middle" fill="#8aff8a" font-family="sans-serif" font-size="14">cheap &#183; high recall</text>
  <text x="500" y="232" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">BM25 over the inverted index</text>
  <text x="500" y="252" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">&#8212; or &#8212; dense retriever (bi-encoder + ANN)</text>
  <text x="500" y="288" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">uses an index; avoids a full scan</text>
  <text x="500" y="306" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">job: don&#8217;t miss the good ones</text>

  <!-- divider label: few hundred candidates -->
  <text x="500" y="333" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="13.5" font-weight="bold">&#8595; a few hundred candidates &#8595;</text>

  <!-- Stage 2 -->
  <circle cx="352" cy="372" r="13" fill="#b79bff"/>
  <text x="352" y="377" text-anchor="middle" fill="#111317" font-family="sans-serif" font-size="14" font-weight="bold">2</text>
  <text x="500" y="392" text-anchor="middle" fill="#b79bff" font-family="sans-serif" font-size="19" font-weight="bold">STAGE 2 &#183; RE-RANKING</text>
  <text x="500" y="416" text-anchor="middle" fill="#b79bff" font-family="sans-serif" font-size="14">expensive &#183; high precision</text>
  <text x="500" y="452" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">learning-to-rank (LambdaMART)</text>
  <text x="500" y="472" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13.5">neural cross-encoder (BERT)</text>
  <text x="500" y="508" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">runs only on the survivors</text>
  <text x="500" y="526" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12.5">job: make the top order accurate</text>

  <!-- bottom output -->
  <line x1="500" y1="560" x2="500" y2="598" stroke="#ffff99" stroke-width="2.5" marker-end="url(#f-y)"/>
  <rect x="412" y="600" width="176" height="34" rx="9" fill="#1a1f26" stroke="#ffff99" stroke-width="2"/>
  <text x="500" y="622" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="14" font-weight="bold">ranked top-10 &#8594; user</text>

  <!-- ===== DIAL on the right ===== -->
  <rect x="905" y="150" width="34" height="380" rx="17" fill="#14171c" stroke="#8a95a3" stroke-width="2"/>
  <rect x="905" y="150" width="34" height="150" rx="17" fill="#101a12" stroke="#8aff8a" stroke-width="2"/>
  <circle cx="922" cy="300" r="20" fill="#1a1f26" stroke="#ffff99" stroke-width="2.5"/>
  <text x="922" y="305" text-anchor="middle" fill="#ffff99" font-family="sans-serif" font-size="14" font-weight="bold">N</text>
  <text x="922" y="142" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">small N</text>
  <text x="922" y="548" text-anchor="middle" fill="#9aa6b2" font-family="sans-serif" font-size="12">large N</text>
  <text x="1010" y="300" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12.5" transform="rotate(90 1010 300)">candidate-set size N</text>
  <text x="1042" y="300" text-anchor="middle" fill="#ffd27f" font-family="sans-serif" font-size="12" transform="rotate(90 1042 300)">latency &#8596; quality</text>

  <!-- ===== INSIGHT STRIP ===== -->
  <rect x="80" y="654" width="940" height="48" rx="12" fill="#101a12" stroke="#8aff8a" stroke-width="1.8"/>
  <text x="550" y="684" text-anchor="middle" fill="#e8ffe8" font-family="sans-serif" font-size="15.5"><tspan fill="#8aff8a" font-weight="bold">&#9733; key:</tspan>  narrow cheaply, then re-score precisely &#8212; every ML technique in IR lives at one of these two tiers.</text>
</svg>
