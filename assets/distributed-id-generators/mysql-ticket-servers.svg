<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">MySQL ticket servers for globally unique IDs</title>
  <desc id="desc">A photo service asks two MySQL ticket servers for IDs. One server generates odd IDs and the other generates even IDs. The photo service then writes the photo row to the sharded photos database. If one ticket server crashes, the other continues and the recovered server restarts from a safe higher value.</desc>
  <style>
    .bg{fill:#171717}.rule{stroke:#303030;stroke-width:2}.title{fill:#f8f8f8;font:32px system-ui,sans-serif;font-weight:750}.sub{fill:#d4d4d4;font:18px system-ui,sans-serif}.label{fill:#f8f8f8;font:20px system-ui,sans-serif;font-weight:750}.small{fill:#d7d7d7;font:16px system-ui,sans-serif}.tiny{fill:#bdbdbd;font:14px system-ui,sans-serif}.code{fill:#f8f8f8;font:16px ui-monospace,SFMono-Regular,Menlo,monospace}.box{fill:#202020;stroke:#f8f8f8;stroke-width:2;rx:8}.svc{fill:#202020;stroke:#a5f3fc;stroke-width:2;rx:8}.mysql{fill:#281f2d;stroke:#ff8bd2;stroke-width:2;rx:8}.photo{fill:#1d2630;stroke:#72b7ff;stroke-width:2;rx:8}.safe{fill:#163021;stroke:#8aff8a;stroke-width:2;rx:8}.risk{fill:#331b1b;stroke:#ff8a8a;stroke-width:2;rx:8}.yellow{fill:#ffff99}.cyan{fill:#a5f3fc}.pink{fill:#ff8bd2}.blue{fill:#72b7ff}.green{fill:#8aff8a}.red{fill:#ff8a8a}.muted{fill:#a8a8a8}.arrow{stroke:#f8f8f8;stroke-width:1.8;fill:none;marker-end:url(#arrow)}.arrowPink{stroke:#ff8bd2;stroke-width:1.8;fill:none;marker-end:url(#arrowPink)}.arrowBlue{stroke:#72b7ff;stroke-width:1.8;fill:none;marker-end:url(#arrowBlue)}.arrowGreen{stroke:#8aff8a;stroke-width:1.8;fill:none;marker-end:url(#arrowGreen)}.arrowRed{stroke:#ff8a8a;stroke-width:1.8;fill:none;marker-end:url(#arrowRed)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#f8f8f8"/></marker>
    <marker id="arrowPink" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#ff8bd2"/></marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#72b7ff"/></marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#8aff8a"/></marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#ff8a8a"/></marker>
  </defs>

  <rect class="bg" width="1200" height="760"/>
  <g class="rule">
    <line x1="0" y1="96" x2="1200" y2="96"/>
    <line x1="0" y1="198" x2="1200" y2="198"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="402" x2="1200" y2="402"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="0" y1="606" x2="1200" y2="606"/>
    <line x1="0" y1="708" x2="1200" y2="708"/>
  </g>

  <text class="title" x="46" y="58">MySQL ticket servers</text>
  <text class="sub" x="46" y="122">Generate a global photo ID before writing the photo row to a sharded database.</text>

  <rect class="svc" x="78" y="188" width="252" height="94"/>
  <text class="label cyan" x="122" y="226">photo service</text>
  <text class="small" x="108" y="256">needs one global ID</text>

  <rect class="mysql" x="468" y="146" width="250" height="128"/>
  <text class="label pink" x="520" y="184">ticket server 1</text>
  <text class="code" x="500" y="216">increment = 2</text>
  <text class="code" x="500" y="244">offset = 1</text>
  <text class="small yellow" x="526" y="268">1, 3, 5, 7...</text>

  <rect class="mysql" x="468" y="326" width="250" height="128"/>
  <text class="label pink" x="520" y="364">ticket server 2</text>
  <text class="code" x="500" y="396">increment = 2</text>
  <text class="code" x="500" y="424">offset = 2</text>
  <text class="small yellow" x="526" y="448">2, 4, 6, 8...</text>

  <path class="arrowPink" d="M330 228 C384 202 414 194 468 194"/>
  <path class="arrowPink" d="M330 252 C390 322 416 374 468 390"/>
  <text class="tiny pink" x="216" y="160">round-robin ticket requests</text>

  <rect class="photo" x="858" y="238" width="246" height="156"/>
  <text class="label blue" x="928" y="278">photos DB</text>
  <text class="small" x="902" y="312">photo_id is already</text>
  <text class="small" x="908" y="338">globally unique</text>
  <text class="tiny" x="904" y="372">row can land on any shard</text>

  <path class="arrowBlue" d="M718 208 C790 214 824 244 858 284"/>
  <path class="arrowBlue" d="M718 390 C792 386 828 360 858 330"/>
  <text class="tiny blue" x="766" y="224">return ID</text>
  <text class="tiny blue" x="770" y="408">return ID</text>

  <text class="label" x="78" y="540">Ticket table trick</text>
  <rect class="box" x="78" y="568" width="302" height="104"/>
  <text class="code" x="108" y="604">id BIGINT AUTO_INCREMENT</text>
  <text class="code" x="108" y="632">stub CHAR(1) UNIQUE</text>
  <text class="tiny" x="108" y="660">REPLACE stub='a' keeps one row</text>

  <rect class="risk" x="468" y="568" width="126" height="48"/>
  <text class="code red" x="504" y="598">crash</text>
  <path class="arrowRed" d="M594 592 L650 592"/>
  <rect class="safe" x="650" y="568" width="270" height="48"/>
  <text class="code green" x="676" y="598">restart at max + buffer</text>
  <text class="tiny" x="468" y="650">If one server is down, the other keeps serving its half of the ID space.</text>
</svg>
